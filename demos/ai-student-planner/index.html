function li(){return Math.max(0,LANGS.indexOf(state.settings.lang))}function t(k){let a=T[k];return a?a[li()]:k}function locale(){return state.settings.lang==='ar'?'ar':state.settings.lang}function fmt(k){if(!k)return'—';try{return new Intl.DateTimeFormat(locale(),{year:'numeric',month:'short',day:'numeric'}).format(pd(k))}catch(e){return k}}function du(k){let d=pd(k);if(!d)return 9999;return Math.ceil((d-pd(today()))/86400000)}

function sub(id){return state.subjects.find(x=>x.id===id)}function sn(id){return sub(id)?.name||id||'—'}function sc(id){return sub(id)?.color||'#5b5ce2'}function sopts(sel=''){return `<option value="">—</option>`+state.subjects.map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.name)}</option>`).join('')}function prog(v){return `<div class="progress"><span style="width:${clamp(v)}%"></span></div>`}function status(v){return `<span class="pill ${v==='done'?'good':''}">${t(v==='done'?'done':v==='inProgress'?'inProgress':v==='todo'?'todo':'planned')}</span>`}
function last7(){let a=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);a.push(kd(d))}return a}function studyToday(){let k=today();return state.study.filter(x=>x.date===k&&x.status==='done').reduce((a,x)=>a+(+x.minutes||0),0)+state.focusLog.filter(x=>x.date===k).reduce((a,x)=>a+(+x.minutes||0),0)}function totalStudy(){return state.study.filter(x=>x.status==='done').reduce((a,x)=>a+(+x.minutes||0),0)+state.focusLog.reduce((a,x)=>a+(+x.minutes||0),0)}function byDay(){return last7().map(k=>({date:k,minutes:state.study.filter(x=>x.date===k&&x.status==='done').reduce((a,x)=>a+(+x.minutes||0),0)+state.focusLog.filter(x=>x.date===k).reduce((a,x)=>a+(+x.minutes||0),0)}))}function streak(){let set=new Set([...state.study.filter(x=>x.status==='done').map(x=>x.date),...state.focusLog.map(x=>x.date)]),n=0,d=new Date();while(set.has(kd(d))){n++;d.setDate(d.getDate()-1)}return n}function arate(){return state.assignments.length?Math.round(state.assignments.filter(x=>x.status==='done').length/state.assignments.length*100):0}function eready(){return state.exams.length?Math.round(state.exams.reduce((a,x)=>a+clamp(x.prepared),0)/state.exams.length):0}
function reminders(){let r=[];state.assignments.filter(x=>x.status!=='done').forEach(x=>{let d=du(x.due);if(d<0)r.push({bad:1,type:'assignment',text:`${x.title} · ${Math.abs(d)} ${t('days')} late`});else if(d<=3)r.push({bad:d===0,type:'assignment',text:`${x.title} · ${d===0?t('today'):d+' '+t('days')}`})});state.exams.forEach(x=>{let d=du(x.date);if(d>=0&&d<=7)r.push({bad:d<=1,type:'exam',text:`${x.title||sn(x.subject)} · ${d} ${t('days')}`})});state.revision.forEach(x=>{let d=du(x.date);if(d<=0)r.push({bad:d<0,type:'revision',text:`${sn(x.subject)} · ${x.topic}`})});return r.slice(0,12)}
function smart(){let a=state.assignments.filter(x=>x.status!=='done').sort((x,y)=>du(x.due)-du(y.due)).slice(0,2).map(x=>`${x.title} (${sn(x.subject)})`);let e=state.exams.filter(x=>du(x.date)>=0&&clamp(x.prepared)<70).sort((x,y)=>du(x.date)-du(y.date))[0];if(e)a.push(`${e.title||sn(e.subject)} · ${e.prepared}%`);state.revision.filter(x=>du(x.date)<=0).slice(0,1).forEach(x=>a.push(`${t('revision')}: ${sn(x.subject)} · ${x.topic}`));return a}

function calendar(){let y=cal.getFullYear(),m=cal.getMonth(),first=new Date(y,m,1),st=new Date(y,m,1);st.setDate(1-((first.getDay()+6)%7));let cells=[];for(let i=0;i<42;i++){let d=new Date(st);d.setDate(st.getDate()+i);let k=kd(d);cells.push(`<div class="calday ${d.getMonth()!==m?'out':''} ${k===today()?'now':''}"><b>${d.getDate()}</b>${cevents(k).slice(0,4).map(e=>`<div class="ev ${e[0]}">${esc(e[1])}</div>`).join('')}</div>`)}let h=['M','T','W','T','F','S','S'];return `<div class="head"><h2>${t('calendar')}</h2><div class="acts"><button class="btn" data-cal="-1">‹</button><b>${new Intl.DateTimeFormat(locale(),{month:'long',year:'numeric'}).format(cal)}</b><button class="btn" data-cal="1">›</button></div></div><div class="calscroll"><div class="calgrid">${h.map((x,i)=>`<div class="calhead">${dname(i).slice(0,3)}</div>`).join('')}${cells.join('')}</div></div>`}

function exportCSV(){let rows=[['type','date','subject','title_or_topic','status_or_score','details']];state.study.forEach(x=>rows.push(['study',x.date,sn(x.subject),x.topic,x.status,`${x.minutes} min` ]));state.assignments.forEach(x=>rows.push(['assignment',x.due,sn(x.subject),x.title,x.status,`${x.priority} ${x.progress}%`]));state.exams.forEach(x=>rows.push(['exam',x.date,sn(x.subject),x.title,x.prepared+'%',`target ${x.target}%`]));state.grades.forEach(x=>rows.push(['grade','',sn(x.subject),x.title,gp(x)+'%',`${x.score}/${x.max}`]));let csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n'),b=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`NexalyPlanner-Student-Data-${today()}.csv`;a.click();URL.revokeObjectURL(a.href)}

function reminderModal(){let r=reminders();modal(`<h2>${t('reminders')}</h2><div class="list">${r.length?r.map(x=>`<div class="li"><span>${esc(x.text)}</span><span class="pill ${x.bad?'bad':'warn'}">${t(x.type)}</span></div>`).join(''):`<div class="empty">${t('noReminders')}</div>`}</div><div class="acts" style="margin-top:12px"><button class="btn" id="modalCancel">${t('close')}</button></div>`);$('#modalCancel').onclick=closeModal}
function signOut(){sessionStorage.removeItem(SESSION);$('#lock').classList.add('show');$('#lockText').textContent=t('signIn');$('#lockName').value=state.profile.name||'';$('#lockBtn').textContent=t('signIn');$('#lockHint').textContent=t('offlineNote')}
function unlock(){let n=$('#lockName').value.trim();if(!n)return;state.profile.name=n;state.settings.onboarded=true;sessionStorage.setItem(KEY,JSON.stringify(state));sessionStorage.setItem(SESSION,'1');$('#lock').classList.remove('show');render()}
function onboarding(){
 modal(`<h2>NexalyPlanner · ${t('appSub')}</h2><p class="muted">${t('demoExplainer')}</p><form id="onForm" style="display:grid;gap:10px"><div class="field"><label>${t('name')}</label><input class="input" name="name" value="${esc(state.profile.name)}" required></div><div class="field"><label>${t('institution')}</label><input class="input" name="institution" value="${esc(state.profile.institution)}"></div><div class="field"><label>${t('program')}</label><input class="input" name="program" value="${esc(state.profile.program)}"></div><div class="field"><label>${t('language')}</label><select class="select" name="lang">${$('#langSelect').innerHTML}</select></div><div class="field"><label>${t('dailyGoal')}</label><input class="input" name="goal" type="number" min="15" max="600" value="${state.settings.dailyGoal}"></div><div class="acts"><button class="btn primary" type="submit" value="demo">${t('startDemo')}</button><button class="btn" type="submit" value="empty">${t('startEmpty')}</button></div></form>`);
 let f=$('#onForm');f.lang.value=state.settings.lang;
 f.onsubmit=e=>{
  e.preventDefault();
  let d=Object.fromEntries(new FormData(f));
  if(!d.name.trim())return;
  state.profile={name:d.name.trim(),institution:d.institution,program:d.program};
  state.settings.lang=d.lang;state.settings.dailyGoal=Number(d.goal)||90;state.settings.onboarded=true;
  sessionStorage.setItem(SESSION,'1');
  let mode=e.submitter?.value||'demo';
  if(mode==='demo')sample(true);else state.settings.demoMode=false;
  closeModal();save()
 }
}

function render(){apply();$('#nav').innerHTML=nav();$('#pageTitle').textContent=t(route);let r=reminders();$('#reminderCount').textContent=r.length?' '+r.length:'';$('#view').innerHTML=(V[route]||dashboard)();bind()}
