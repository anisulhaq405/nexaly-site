rugverdientijd gebruikt jaar-één-maandgemiddelde, zonder tijdwaarde of latere veranderingen. Break-even omvat kapitaalterugwinning, rente, vaste kosten en andere baten. Restwaarde alleen aan einde levensduur. Geen belasting, afschrijving, NPV of IRR.|L’investissement inclut achat, démarrage et frais moins aides immédiates. ROI = bénéfice net après intérêts / investissement. Retour simple sur moyenne mensuelle de l’an un, sans valeur temps ni changements futurs. Seuil : récupération du capital, intérêts, fixes et autres bénéfices. Résiduel seulement en fin de vie. Aucun impôt, amortissement, VAN ou TRI.

methodNote|Savings = rounded invoice × discount %. Capital cost = early cash × annual rate × days advanced / day basis + fee. Net benefit = savings − cost. Simple annualized return is discount / (1 − discount) × day basis / days. Compounded equivalent assumes repeated identical reinvestment; it is not a forecast.|الوفر = قيمة الفاتورة × الخصم مع التقريب. التكلفة = النقد المبكر × المعدل × الأيام ÷ أساس السنة + الرسوم. المنفعة = الوفر − التكلفة. العائد البسيط = الخصم ÷ (1 − الخصم) × أيام السنة ÷ الأيام. المركب يفترض إعادة استثمار مماثلة وليس توقعاً.|Economia = fatura × desconto arredondado. Custo = caixa antecipado × taxa × dias / base + tarifa. Benefício = economia − custo. Retorno simples = desconto / (1 − desconto) × base / dias. Composto presume reinvestimento idêntico; não é previsão.|Ahorro = factura × descuento redondeado. Costo = efectivo anticipado × tasa × días / base + comisión. Beneficio = ahorro − costo. Retorno simple = descuento / (1 − descuento) × base / días. Compuesto supone reinversión idéntica; no es previsión.|Risparmio = fattura × sconto arrotondato. Costo = anticipo × tasso × giorni / base + commissione. Beneficio = risparmio − costo. Rendimento semplice = sconto / (1 − sconto) × base / giorni. Composto presume reinvestimento identico, non è previsione.|Besparing = factuur × afgeronde korting. Kosten = vroegbetaald × rente × dagen / basis + kosten. Voordeel = besparing − kosten. Jaarrendement = korting / (1 − korting) × basis / dagen. Samengesteld veronderstelt identieke herbelegging, geen prognose.|Économie = facture × remise arrondie. Coût = avance × taux × jours / base + frais. Avantage = économie − coût. Rendement simple = remise / (1 − remise) × base / jours. Composé suppose réinvestissement identique, pas une prévision.
datesNote|Calendar-day addition excludes invoice day. Override the discount and due dates to match the supplier contract; no weekend or holiday adjustment.|تضاف الأيام التقويمية دون يوم الفاتورة. عدل التواريخ حسب العقد دون تعديل للعطلات.|Dias corridos excluem dia da fatura. Ajuste ao contrato; sem ajuste de feriados.|Días naturales excluyen día de factura. Ajuste al contrato; sin ajuste de festivos.|Giorni di calendario escluso giorno fattura. Modifica secondo contratto; nessun adeguamento festivi.|Kalenderdagen exclusief factuurdag. Pas aan contract aan; geen feestdagcorrectie.|Jours calendaires hors jour de facture. Adapter au contrat ; aucun ajustement jours fériés.

return `<div class="onboarding">${top}${recovery}<section class="card setupCard"><div class="eyebrow">${esc(t('step'))} ${setupStep} / 7</div><div class="setupProgress">${Array.from({length:7},(_,n)=>`<span class="${n<setupStep?'active':''}"></span>`).join('')}</div><h2>${esc(t(titles[setupStep]))}</h2><form id="setupForm"><div id="errorAlert" class="formError" hidden></div><div class="formGrid">${body}</div><div class="formActions">${button('setupBack',t('back'))}<button class="primary" type="submit">${esc(t(setupStep===7?'setupFinish':'continue'))}</button></div></form></section></div>`;}
function bucketChart(s=E.summary(db)){let colors=['#987d9e','#74566f','#b98d75','#a46169','#72405c'];return s.total?`<div class="bucketChart" role="img" aria-label="${esc(t('agingTitle'))}">${E.BUCKETS.map((k,n)=>`<span style="width:${s.totals[k]/s.total*100}%;background:${colors[n]}" title="${esc(t(k)+': '+money(s.totals[k]))}"></span>`).join('')}</div><div class="bucketLegend">${E.BUCKETS.map((k,n)=>`<div><span style="display:inline-block;width:9px;height:9px;background:${colors[n]};margin-inline-end:5px"></span>${esc(t(k))}<b>${esc(money(s.totals[k]))}</b></div>`).join('')}</div>`:empty(t('emptyAR'));}
function bars(a,format=money){let max=Math.max(...a.map(x=>Math.abs(x.value)),1);return a.length?a.map(x=>`<div class="barRow"><span>${esc(x.label)}</span><div class="track"><div class="fill" style="width:${Math.abs(x.value)/max*100}%" title="${esc(format(x.value))}"></div></div><strong>${esc(format(x.value))}</strong></div>`).join(''):empty();}
function riskTreemap(){let a=E.customers(db).filter(c=>c.open>0).sort((a,b)=>b.open-a.open),x=0;return a.length?`<svg class="treemap" viewBox="0 0 800 180" role="img" aria-label="${esc(t('concentration'))}">${a.map((c,n)=>{let width=c.share*8,start=x;x+=width;return `<g><rect tabindex="0" role="img" aria-label="${esc(c.name+' · '+num(c.share)+'% · '+money(c.open))}" x="${start}" y="0" width="${width}" height="180" fill="${['#72506c','#9a7189','#b88b72','#746785'][n%4]}"><title>${esc(c.name+' · '+money(c.open)+' · '+num(c.share)+'%')}</title></rect>${width>130?`<text x="${start+10}" y="40">${esc(c.name.slice(0,20))}</text><text x="${start+10}" y="66">${num(c.share)}%</text>`:''}</g>`}).join('')}</svg>`:empty();}
function receiptBars(x=E.expected(db)){let a={};for(let row of x.rows)a[row.date]=(a[row.date]||0)+row.expected;return bars(Object.entries(a).map(([label,value])=>({label:dateText(label),value})));}
function snapshotChart(){let a=active('snapshots').filter(x=>Number.isFinite(x.dso)).sort((a,b)=>a.date.localeCompare(b.date)).slice(-8);if(a.length<2)return empty(t('trendEmpty'));let max=Math.max(...a.map(s=>s.dso||0),1),W=760,H=210,x=n=>45+n/(a.length-1)*(W-90),y=v=>H-35-v/max*(H-65);return `<svg class="chart dsoPlot" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('dso'))}"><polyline class="primaryLine" points="${a.map((s,n)=>`${x(n)},${y(s.dso||0)}`).join(' ')}"/>${a.map((s,n)=>`<circle tabindex="0" role="img" cx="${x(n)}" cy="${y(s.dso||0)}" r="5" aria-label="${esc(s.date+' DSO '+num(s.dso))}"><title>${esc(s.date+' · '+t('dso')+' '+num(s.dso))}</title></circle><text x="${x(n)}" y="${H-12}" text-anchor="middle">${esc(s.date.slice(5))}</text>`).join('')}</svg>`;}
function dashboardPage(){let s=E.summary(db),expected=E.expected(db,30),queue=invoicesForView().slice(0,4),brokenCount=active('promises').filter(p=>E.promise(db,p).status==='broken').length,follow=s.invoices.filter(i=>lastAction(i)?.nextDate&&lastAction(i).nextDate<=db.settings.asOf).length,sections={aging:card(t('agingTitle'),bucketChart(s)+navButton('aging',t('aging'),'small')),queue:card(t('priorityBoard'),queue.map(i=>`<div class="deadlineItem"><div class="dateTile">${num(E.score(db,i).value,0)}</div><div><strong>${esc(i.ref)}</strong><div class="sub">${esc(customer(i.customerId)?.name)} · ${esc(money(E.balance(db,i)))}</div></div>${button('file',t('openFile'),`data-id="${esc(i.id)}"`,'small')}</div>`).join('')||empty()),expected:card(t('timeline'),receiptBars(expected)+navButton('expected',t('expected'),'small')),activity:card(t('recent'),`<ul class="activity">${db.activity.slice(0,6).map(a=>`<li>${esc(dateText(a.date.slice(0,10)))} · ${esc(t(a.key))} ${esc(a.detail)}</li>`).join('')}</ul>`)};return `<div class="noticeStrip">${pill('planNotCash','warn')}<span class="pill">${follow} ${esc(t('dueFollowups'))}</span><span class="pill warn">${brokenCount} ${esc(t('broken'))}</span>${button('resetWidgets',t('resetWidgets'),'','small quiet')}</div><div class="hero"><div><div class="eyebrow">${esc(t('daily'))}</div><h2>${esc(t('welcome'))}</h2><div class="big">${esc(money(s.total))}</div><p class="sub">${esc(t('totalAR'))} · ${s.invoices.length} ${esc(t('invoices'))}</p><div class="row">${navButton('collections',t('collections'))}${navButton('expected',t('expected'))}</div></div><div class="mini"><div class="eyebrow">${esc(t('expected30'))}</div><div style="font-size:34px;font-weight:750;margin:12px 0">${esc(money(expected.total))}</div><p class="sub">${esc(t('forecastBasis'))}</p><p class="sub">${esc(t('atRisk'))}: ${esc(money(s.atRisk))}</p></div></div><div class="spacer"></div><div class="grid four">${metric('totalAR',money(s.total))}${E.BUCKETS.map(k=>metric(k,money(s.totals[k]))).join('')}${metric('overduePct',num(s.overduePct)+'%')}${metric('dso',num(s.dso)+' '+t('days'))}${metric('atRisk',money(s.atRisk))}${metric('expected30',money(expected.total))}</div>${note(t('dashboardNote'))}<div class="grid two">${db.widgets.filter(k=>!db.hiddenWidgets?.includes(k)).map(k=>`<div><div class="widgetHead"><div class="widgetControls">${button('widgetUp','↑',`data-widget="${k}" aria-label="${esc(t('reorder'))}"`,'small')}${button('widgetHide','×',`data-widget="${k}" aria-label="${esc(t('hide'))}"`,'small')}</div></div>${sections[k]||''}</div>`).join('')}</div>`;}
function listControls(entity){return `<div class="toolbar"><input id="search" type="search" value="${esc(query)}" placeholder="${esc(t('search'))}" aria-label="${esc(t('search'))}">${entity==='invoices'?`<select id="filter" aria-label="${esc(t('statusFilter'))}">${['all','open','partial','settled','disputed','cancelled','overdue','high'].map(k=>`<option value="${k}" ${filter===k?'selected':''}>${esc(t(k))}</option>`).join('')}</select><select id="sort" aria-label="${esc(t('sort'))}">${[['priority','sortPriority'],['due','sortDue'],['amount','sortAmount'],['ref','sortRef']].map(([k,l])=>`<option value="${k}" ${sort===k?'selected':''}>${esc(t(l))}</option>`).join('')}</select>`:''}<label><input id="archived" type="checkbox" ${showArchived?'checked':''}>${esc(t('showArchived'))}</label><label><input id="compact" type="checkbox" ${compact?'checked':''}>${esc(t('compact'))}</label>${entity==='invoices'?`<label><input id="optional" type="checkbox" ${optional?'checked':''}>${esc(t('columns'))}</label>${button('saveView',t('saveCurrent'),'','small')}`:''}${button('new',t('add'),`data-entity="${entity}"`,'primary')}</div>`;}
function pagination(xs,fn){return fn(xs.slice(offset,offset+20))+`<div class="pagination"><small>${Math.min(offset+1,xs.length)}–${Math.min(offset+20,xs.length)} / ${xs.length}</small><div class="row">${button('previous',t('previous'),offset===0?'disabled':'','small')}${button('next',t('next'),offset+20>=xs.length?'disabled':'','small')}</div></div>`;}
function recordActions(k,x){return `<div class="actions">${x.archived?button('restoreRecord',t('restore'),`data-entity="${k}" data-id="${esc(x.id)}"`,'small'):button('edit',t('edit'),`data-entity="${k}" data-id="${esc(x.id)}"`,'small')+button('archive',t('archive'),`data-entity="${k}" data-id="${esc(x.id)}"`,'small quiet')}${k==='invoices'&&!x.archived?button('file',t('openFile'),`data-id="${esc(x.id)}"`,'small')+button('duplicate',t('copy'),`data-id="${esc(x.id)}"`,'small quiet'):k==='customers'&&!x.archived?button('customerFile',t('customerDetails'),`data-id="${esc(x.id)}"`,'small'):''}</div>`;}
function customersPage(){let xs=db.customers.filter(c=>(showArchived?c.archived:!c.archived)&&[c.name,c.category,c.contact].join(' ').toLowerCase().includes(query.toLowerCase()));return note(t('customerHoldNote'))+card(t('customers'),listControls('customers')+pagination(xs,a=>table(['name','category','riskLevel','status','termsDays','openAmount','actionButtons'],a.map(c=>`<tr><td><strong>${esc(c.name)}</strong><div class="sub">${esc(c.contact)}</div></td><td>${esc(c.category)}</td><td>${pill(c.risk,c.risk==='high'?'bad':'')}</td><td>${pill(c.status,c.status==='hold'?'warn':'')}</td><td>${c.termsDays}</td><td class="money">${esc(money(E.customers(db).find(x=>x.id===c.id)?.open||0))}</td><td>${recordActions('customers',c)}</td></tr>`).join(''))));}
function filteredInvoices(){let xs=db.invoices.filter(i=>(showArchived?i.archived:!i.archived)&&[i.ref,customer(i.customerId)?.name,i.notes].join(' ').toLowerCase().includes(query.toLowerCase()));if(filter==='overdue')xs=xs.filter(i=>E.days(i.dueDate,db.settings.asOf)>0&&E.balance(db,i)>0&&i.invoiceDate<=db.settings.asOf&&i.status!=='cancelled');else if(filter==='high')xs=xs.filter(i=>E.score(db,i).atRisk&&E.balance(db,i)>0);else if(filter!=='all')xs=xs.filter(i=>E.invoiceStatus(db,i)===filter);return xs.sort((a,b)=>sort==='amount'?E.balance(db,b)-E.balance(db,a):sort==='due'?a.dueDate.localeCompare(b.dueDate):sort==='ref'?a.ref.localeCompare(b.ref):E.score(db,b).value-E.score(db,a).value);}
function invoicesPage(){let xs=filteredInvoices();return note(t('partialHelp'))+card(t('invoices'),listControls('invoices')+`<div class="row" style="margin-bottom:15px">${button('bulkArchive',t('bulkArchive'),'','small')}${button('bulkExport',t('bulkExport'),'','small')}<small id="selectionCount">${selectedRows.size} ${esc(t('selected'))}</small></div>`+pagination(xs,a=>table(['selected','ref','customerId','original','openAmount','status',...(optional?['dueDate','score','expectedDate']:[]),'actionButtons'],a.map(i=>`<tr><td><input data-select="${esc(i.id)}" type="checkbox" aria-label="${esc(t('selected')+' '+i.ref)}" ${selectedRows.has(i.id)?'checked':''}></td><td><strong>${esc(i.ref)}</strong></td><td>${esc(customer(i.customerId)?.name)}</td><td class="money">${esc(money(i.amount))}</td><td class="money">${esc(money(E.balance(db,i)))}</td><td>${pill(E.invoiceStatus(db,i),i.status==='disputed'?'warn':'')}</td>${optional?`<td>${esc(dateText(i.dueDate))}</td><td>${num(E.score(db,i).value,0)}</td><td>${esc(dateText(i.expectedDate))}</td>`:''}<td>${recordActions('invoices',i)}</td></tr>`).join(''))));}
function agingPage(){let s=E.summary(db),rows=E.customers(db).filter(c=>c.open>0).map(c=>{let totals=Object.fromEntries(E.BUCKETS.map(k=>[k,0]));for(let i of s.invoices.filter(i=>i.customerId===c.id))totals[E.bucket(E.days(i.dueDate,db.settings.asOf))]+=E.balance(db,i);return {c,totals};});return note(t('agingNote'))+card(t('agingTitle'),bucketChart(s)+`<p></p><div class="row">${button('exportChart',t('exportChart'),'','small')}${button('snapshot',t('snapshot'),'','primary small')}</div>`)+`<div class="spacer"></div>`+card(t('customers'),table(['customerId',...E.BUCKETS,'totalAR'],rows.map(({c,totals})=>`<tr><td>${esc(c.name)}</td>${E.BUCKETS.map(k=>`<td class="money">${esc(money(totals[k]))}</td>`).join('')}<td class="money"><strong>${esc(money(c.open))}</strong></td></tr>`).join('')))+`<div class="spacer"></div><div class="grid two">${card(t('concentration'),riskTreemap()+note(t('shareNote')))}${card(t('trend'),snapshotChart()+note(t('snapshotNote'))+snapshotTable())}</div>`;}
function collectionsPage(){let xs=invoicesForView(),lanes=[['high',xs.filter(i=>E.score(db,i).value>=65)],['medium',xs.filter(i=>E.score(db,i).value>=35&&E.score(db,i).value<65)],['low',xs.filter(i=>E.score(db,i).value<35)]];return note(t('queueNote'))+`<div class="toolbar"><input id="search" type="search" value="${esc(query)}" placeholder="${esc(t('search'))}" aria-label="${esc(t('search'))}">${navButton('risk',t('rules'),'small')}</div><div class="queueBoard">${lanes.map(([label,items])=>`<section class="queueLane"><h3>${esc(t(label))} <span>${items.length}</span></h3>${items.slice(0,15).map(i=>{let r=E.score(db,i),a=lastAction(i);return `<div class="queueCard"><div class="row between"><strong>${esc(i.ref)}</strong>${pill('score')} <b>${num(r.value,0)}</b></div><div class="sub">${esc(customer(i.customerId)?.name)}</div><div class="amountBig">${esc(money(r.open))}</div><div class="row">${pill(E.invoiceStatus(db,i),i.status==='disputed'?'warn':'')}<span class="pill">${r.overdue} ${esc(t('overdueDays'))}</span>${r.broken?pill('broken','bad'):''}${r.badDebt?pill('candidate','warn'):''}</div><p class="queueNote" style="margin-top:12px">${esc(t('nextDate'))}: ${esc(dateText(a?.nextDate))}</p><div class="actions">${button('file',t('openFile'),`data-id="${esc(i.id)}"`,'small')}${button('newRelated',t('logAction'),`data-entity="actions" data-id="${esc(i.id)}"`,'small')}</div></div>`}).join('')||empty()}</section>`).join('')}</div>${note(t('badDebtNote'))}`;}

function invoiceLocked(i){return ['payments','adjustments','promises'].some(k=>db[k].some(x=>x.invoiceId===i.id));}
function newRecord(entity,id=null,invoiceId=null){let x=id?db[entity].find(x=>x.id===id):{},fields='',i=invoiceId?db.invoices.find(i=>i.id===invoiceId):invoice();if(entity==='invoices'&&!active('customers').length){toast(t('emptyAR'));return;}if(['payments','promises','actions','adjustments'].includes(entity)&&(!i||!E.summary(db).invoices.some(x=>x.id===i.id))){toast(t('emptyAR'));return;}
if(entity==='customers')fields=field('name',x.name||'','text','required maxlength="150"')+field('category',x.category||'','text','maxlength="150"')+field('contact',x.contact||'','text','maxlength="250"')+field('termsDays',x.termsDays??30,'number','required min="0" max="730"')+sel('riskLevel',['low','medium','high'],x.risk||'medium')+sel('status',['active','hold'],x.status||'active')+notesField(x.notes);
else if(entity==='invoices'){let c=active('customers').find(c=>c.id===x.customerId)||active('customers')[0],date=x.invoiceDate||db.settings.asOf,locked=id&&invoiceLocked(x);fields=sel('customerId',active('customers').map(c=>[c.id,c.name]),c.id,locked?'disabled':'')+field('ref',x.ref||'','text',`required maxlength="150" ${locked?'readonly':''}`)+field('invoiceDate',date,'date',`required ${locked?'readonly':''}`)+field('dueDate',x.dueDate||E.addDays(date,c.termsDays),'date',`required ${locked?'readonly':''}`)+mf('amount',x.amount||0,`required ${locked?'readonly':''}`)+field('expectedDate',x.expectedDate||E.addDays(db.settings.asOf,15),'date')+field('probability',x.probability??db.settings.defaultProbability,'number','required min="0" max="100"')+field('priority',x.priority??50,'number','required min="0" max="100"')+sel('status',['open','disputed','cancelled'],x.status||'open')+notesField(x.notes)+(locked?note(t('balanceLocked'),'warn'):note(t('dateNote')));}
else {let invs=E.summary(db).invoices;fields=sel('invoiceId',invs.map(i=>[i.id,i.ref+' · '+customer(i.customerId)?.name]),i.id);if(entity==='payments')fields+=field('date',today(),'date',`required min="${i.invoiceDate}" max="${today()}"`)+mf('amount',E.balance(db,i,today()),'required')+sel('method',['bank','card','cash','other'],'bank')+field('reference','','text','required maxlength="150"')+sel('promiseId',[['',t('none')],...active('promises').filter(p=>p.invoiceId===i.id&&!p.cancelled&&E.promise(db,p,today()).remaining>0).map(p=>[p.id,dateText(p.promisedDate)+' · '+money(E.promise(db,p,today()).remaining)])],'')+notesField('')+note(t('paymentNote'));
if(entity==='promises')fields+=field('createdDate',today(),'date',`required min="${i.invoiceDate}" max="${today()}"`)+field('promisedDate',E.addDays(today(),7),'date','required')+mf('amount',Math.max(0,E.balance(db,i)-active('promises').filter(p=>p.invoiceId===i.id&&!p.cancelled).reduce((s,p)=>s+E.promise(db,p).remaining,0)),'required')+field('probability',85,'number','required min="0" max="100"')+notesField('')+note(t('promiseNote'));
if(entity==='actions')fields+=field('date',today(),'date',`required min="${i.invoiceDate}" max="${today()}"`)+sel('type',['call','email','letter','meeting','other'],'call')+field('outcome','','text','required maxlength="250"')+field('nextDate',E.addDays(today(),3),'date')+field('owner','','text','required maxlength="150"')+notesField('')+note(t('neverSend'));
if(entity==='adjustments')fields+=field('date',today(),'date',`required min="${i.invoiceDate}" max="${today()}"`)+sel('type',['credit','writeoff'],'credit')+mf('amount',0,'required')+notesField('')+note(t('adjustmentNote'));}
openDialog(t(id?'edit':'add')+' · '+t(entity),`<form id="recordForm"><div class="formError" hidden></div><div class="formGrid">${fields}</div>${formActions()}</form>`,{entity,id,invoiceId:i?.id});}
function submitRecord(form){let f=Object.fromEntries(new FormData(form)),next=structuredClone(db),{entity,id}=dialog,x=id?next[entity].find(x=>x.id===id):{id:uid(),createdAt:new Date().toISOString(),notes:''};if(entity==='customers'){for(let k of ['name','category','contact','status','notes'])x[k]=(f[k]||'').trim();x.termsDays=Number(f.termsDays);x.risk=f.riskLevel;}else if(entity==='invoices'){let locked=id&&invoiceLocked(x);if(!locked){for(let k of ['customerId','ref','invoiceDate','dueDate'])x[k]=(f[k]||'').trim();x.amount=E.amount(f.amount,E.digits(db.currency));}for(let k of ['expectedDate','status','notes'])x[k]=(f[k]||'').trim();x.priority=Number(f.priority);x.probability=Number(f.probability);x.currency=db.currency;}else {x.invoiceId=f.invoiceId;for(let k of ['date','type','method','reference','promiseId','notes','outcome','nextDate','owner','createdDate','promisedDate'])if(f[k]!==undefined)x[k]=f[k].trim();if(f.amount!==undefined)x.amount=E.amount(f.amount,E.digits(db.currency));if(entity==='promises'){x.probability=Number(f.probability);x.cancelled=false;let i=db.invoices.find(i=>i.id===x.invoiceId),available=E.balance(db,i)-active('promises').filter(p=>!p.cancelled&&p.invoiceId===i.id).reduce((s,p)=>s+E.promise(db,p).remaining,0);if(x.amount>available){formError(t('amountError'));return;}}if((x.date||x.createdDate)>today()){formError(t('futurePayment'));return;}}
if(!id)next[entity].push(x);x.updatedAt=new Date().toISOString();if(!E.validate(next)){formError(['payments','promises','adjustments'].includes(entity)?t('amountError'):t('invalidData'));return;}if(['payments','adjustments'].includes(entity)&&!confirm(t(entity==='adjustments'?'confirmWriteoff':'confirmFinancial')))return;db=next;if(entity==='invoices')db.selected=x.id;close(true);commit(({payments:'paymentSaved',promises:'promiseSaved',actions:'logSaved',adjustments:'adjustmentSaved'})[entity]||'saved',x.ref||x.name||db.invoices.find(i=>i.id===x.invoiceId)?.ref||'');}
function fileInvoice(id){let i=db.invoices.find(i=>i.id===id);if(!i)return;db.selected=id;let r=E.score(db,i),balance=E.balance(db,i),ps=active('promises').filter(p=>p.invoiceId===id),overpromise=ps.filter(p=>!p.cancelled).reduce((s,p)=>s+E.promise(db,p).remaining,0)>balance;let detail=`<div class="detailsGrid">${[['customerId',customer(i.customerId)?.name],['original',money(i.amount)],['openAmount',money(balance)],['dueDate',dateText(i.dueDate)],['score',num(r.value,0)],['overdueDays',r.overdue]].map(([k,v])=>`<div><strong>${esc(t(k))}</strong><p>${esc(v)}</p></div>`).join('')}</div><p style="margin-top:16px">${pill(E.invoiceStatus(db,i),i.status==='disputed'?'warn':'')} ${r.badDebt?pill('badDebt','warn'):''}</p>${overpromise?note(t('promiseAllocationWarning'),'warn'):''}<div class="row">${balance>0&&i.status!=='cancelled'?['payments','promises','actions','adjustments'].map(k=>button('newRelated',t(({payments:'recordPayment',promises:'recordPromise',actions:'recordAction',adjustments:'recordAdjustment'})[k]),`data-entity="${k}" data-id="${esc(id)}"`,k==='payments'?'primary small':'small')).join(''):''}</div><div class="spacer"></div>${card(t('scoreDetails'),table(['scoreFactor','normalized','weight','contribution'],r.parts.map(x=>`<tr><td>${esc(t(x.key))}</td><td>${num(x.value)}</td><td>${x.weight}</td><td>${num(x.contribution)}</td></tr>`).join(''))+note(t('scoreNote')))}<div class="spacer"></div>${card(t('paymentHistory'),table(['date','amount','method','reference','status','actionButtons'],db.payments.filter(p=>p.invoiceId===id).map(p=>`<tr><td>${esc(dateText(p.date))}</td><td class="money">${esc(money(p.amount))}</td><td>${esc(t(p.method))}</td><td>${esc(p.reference)}</td><td>${pill(p.archived?'void':'received')}</td><td>${!p.archived?button('voidPayment',t('reverse'),`data-id="${esc(p.id)}"`,'small danger'):''}</td></tr>`).join('')))}<div class="spacer"></div>${card(t('promises'),table(['promisedDate','amount','remaining','promiseStatus'],ps.map(p=>`<tr><td>${esc(dateText(p.promisedDate))}</td><td class="money">${esc(money(p.amount))}</td><td class="money">${esc(money(E.promise(db,p).remaining))}</td><td>${pill(E.promise(db,p).status)}</td></tr>`).join('')))}<div class="spacer"></div>${card(t('actions'),table(['date','type','outcome','nextDate','owner'],active('actions').filter(a=>a.invoiceId===id).map(a=>`<tr><td>${esc(dateText(a.date))}</td><td>${esc(t(a.type))}</td><td>${esc(a.outcome)}</td><td>${esc(dateText(a.nextDate))}</td><td>${esc(a.owner)}</td></tr>`).join('')))}<div class="spacer"></div>${card(t('adjustments'),table(['date','type','amount','notes','status','actionButtons'],db.adjustments.filter(a=>a.invoiceId===id).map(a=>`<tr><td>${esc(dateText(a.date))}</td><td>${esc(t(a.type))}</td><td class="money">${esc(money(a.amount))}</td><td>${esc(a.notes)}</td><td>${pill(a.archived?'void':'active')}</td><td>${!a.archived?button('voidAdjustment',t('voidAdjustment'),`data-id="${esc(a.id)}"`,'small danger'):''}</td></tr>`).join('')))}${note(i.notes)}`;openDialog(t('openFile')+' · '+i.ref,detail,{type:'file',id});}
function customerFile(id){let c=customer(id),invs=active('invoices').filter(i=>i.customerId===id),pay=active('payments').filter(p=>invs.some(i=>i.id===p.invoiceId));openDialog(c.name,card(t('invoices'),table(['ref','original','openAmount','dueDate','actionButtons'],invs.map(i=>`<tr><td>${esc(i.ref)}</td><td class="money">${esc(money(i.amount))}</td><td class="money">${esc(money(E.balance(db,i)))}</td><td>${esc(dateText(i.dueDate))}</td><td>${button('file',t('openFile'),`data-id="${esc(i.id)}"`,'small')}</td></tr>`).join('')))+`<p></p>`+card(t('customerHistory'),table(['date','ref','amount','reference'],pay.map(p=>`<tr><td>${esc(dateText(p.date))}</td><td>${esc(db.invoices.find(i=>i.id===p.invoiceId)?.ref)}</td><td class="money">${esc(money(p.amount))}</td><td>${esc(p.reference)}</td></tr>`).join('')))+note(c.notes),{type:'customer',id});}
function submitSettings(form){let f=Object.fromEntries(new FormData(form)),next=structuredClone(db);if(f.business!==undefined)next.business=f.business.trim();if(f.lang)next.lang=f.lang;if(f.theme)next.theme=f.theme;if(f.currency){if((db.invoices.length||db.payments.length||db.snapshots.length)&&f.currency!==db.currency){formError(t('currencyLocked'));return false;}let oldUnit=10**E.digits(db.currency),newUnit=10**E.digits(f.currency);next.currency=f.currency;if(f.currency!==db.currency){next.settings.amountThreshold=Math.round(db.settings.amountThreshold/oldUnit*newUnit);}}
for(let k of ['periodDays','horizon','defaultProbability','ageThreshold','brokenThreshold','riskThreshold','badDebtDays','feeRate','feeGrace','dayBasis'])if(f[k]!==undefined)next.settings[k]=Number(f[k]);for(let k of ['creditSales','amountThreshold','feeFlat'])if(f[k]!==undefined)next.settings[k]=E.amount(f[k],E.digits(next.currency));if(f.asOf)next.settings.asOf=f.asOf;if(f.feeEnabled!==undefined)next.settings.feeEnabled=f.feeEnabled==='true';if(form.id==='rulesForm')next.rules.forEach(r=>{r.enabled=Object.hasOwn(f,'enabled-'+r.key);r.weight=Number(f['weight-'+r.key]);});if(!E.validate(next)){formError();return false;}db=next;return true;}
function submitSetup(form){let f=Object.fromEntries(new FormData(form));if(!submitSettings(form))return;if(setupStep===6)db.startMode=f.startMode;if(setupStep===7){if(loadFailed&&!confirm(t('restoreConfirm')))return;if(db.startMode==='demo'){let original=db;db=demo();db.lang=original.lang;db.theme=original.theme;if(original.currency!=='USD'){let scale=10**E.digits(original.currency)/100;db.currency=original.currency;for(let k of ['invoices','payments','promises'])for(let x of db[k]){x.amount=Math.round(x.amount*scale);if(k==='invoices')x.currency=original.currency;}for(let x of db.snapshots){x.total=Math.round(x.total*scale);x.overdue=Math.round(x.overdue*scale);x.creditSales=Math.round(x.creditSales*scale);}for(let k of ['creditSales','amountThreshold','feeFlat'])db.settings[k]=Math.round(db.settings[k]*scale);}}else db.setup=true;delete db.startMode;loadFailed=false;dirty=false;commit('setupFinish');}else {setupStep++;dirty=false;render();}}
function archive(entity,id,restore=false,quiet=false){let next=structuredClone(db),x=next[entity].find(x=>x.id===id);if(!x)return false;if(['payments','adjustments','promises'].includes(entity)&&!restore){toast(t('historyLocked'));return false;}if(entity==='customers'&&!restore&&active('invoices').some(i=>i.customerId===id)){toast(t('archiveBlocked'));return false;}if(entity==='invoices'&&!restore&&(E.balance(db,x)>0||db.promises.some(p=>!p.archived&&!p.cancelled&&p.invoiceId===id&&E.promise(db,p).remaining>0))){toast(t('archiveBlocked'));return false;}if(entity==='invoices'&&restore&&customer(x.customerId)?.archived){toast(t('restoreCustomer'));return false;}x.archived=!restore;if(!E.validate(next)){toast(t('invalidData'));return false;}if(!quiet&&!confirm(t('confirm')))return false;db=next;if(!quiet)commit(restore?'restoreRecord':'archive',x.name||x.ref||'');return true;}
function saveSnapshot(){let s=E.summary(db);if(active('snapshots').some(x=>x.date===db.settings.asOf)){toast(t('invalidData'));return;}let next=structuredClone(db);next.snapshots.push({id:uid(),date:db.settings.asOf,total:s.total,overdue:s.overdue,dso:s.dso,creditSales:db.settings.creditSales,periodDays:db.settings.periodDays,notes:''});if(!E.validate(next)){toast(t('invalidData'));return;}db=next;commit('snapshotSaved');}
function command(){openDialog(t('searchModules'),`<input id="commandSearch" type="search" aria-label="${esc(t('searchModules'))}" placeholder="${esc(t('searchModules'))}" style="width:100%"><div class="commands">${NAV.map(p=>navButton(p)).join('')}</div>`,{type:'command'});}
function tour(){openDialog(t('tour')+' '+(tourStep+1)+' / 4',`<p>${esc(t(['tourStep1','tourStep2','tourStep3','tourStep4'][tourStep]))}</p><div class="formActions">${tourStep?button('tourBack',t('previous')):''}${button(tourStep===3?'close':'tourNext',t(tourStep===3?'tourEnd':'next'),'','primary')}</div>`,{type:'tour'});}
function download(){toast('Downloads are available in the offline planner.');}
function backup(){db.lastBackup=new Date().toISOString();download(JSON.stringify(db,null,2),'NexalyPlanner-AR-'+db.currency+'-'+today()+'.json');persist();render();}
function csvString(rows){return '\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');}
function csvParse(s){s=s.replace(/^\uFEFF/,'');let rows=[],row=[],v='',q=false;for(let n=0;n<s.length;n++){let c=s[n];if(c==='"'){if(q&&s[n+1]==='"'){v+='"';n++;}else q=!q;}else if(c===','&&!q){row.push(v);v='';}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&s[n+1]==='\n')n++;row.push(v);if(row.some(x=>x!==''))rows.push(row);row=[];v='';}else v+=c;}if(q)throw Error('quote');if(v||row.length){row.push(v);rows.push(row);}return rows;}
function workspaceCSV(d){let settings=Object.fromEntries(Object.entries(d).filter(([k])=>!COLLECTIONS.includes(k)&&k!=='activity')),rows=[['nexaly_ar_collections','1',d.currency],['entity','id','data_json'],['settings','',JSON.stringify(settings)]];for(let k of [...COLLECTIONS,'activity'])for(let x of d[k])rows.push([k,x.id,JSON.stringify(x)]);return csvString(rows);}
function restoreCSV(text){let rows=csvParse(text);if(rows[0]?.[0]!=='nexaly_ar_collections'||rows[0][1]!=='1'||rows[1]?.join(',')!=='entity,id,data_json')throw Error('schema');let ss=rows.filter(r=>r[0]==='settings');if(ss.length!==1)throw Error('settings');let d=JSON.parse(ss[0][2]);for(let k of [...COLLECTIONS,'activity'])d[k]=[];for(let row of rows.slice(2)){if(row[0]==='settings')continue;if(![...COLLECTIONS,'activity'].includes(row[0])||row.length!==3)throw Error('entity');let x=JSON.parse(row[2]);if(x.id!==row[1])throw Error('id');d[row[0]].push(x);}if(!E.validate(d))throw Error('validation');return d;}
const CSV_HEADERS=['customer','reference','invoice_date','due_date','original_amount','expected_date','probability','priority','notes'];
function invoiceCSV(xs=active('invoices')){return csvString([CSV_HEADERS,...xs.map(i=>[customer(i.customerId)?.name,i.ref,i.invoiceDate,i.dueDate,mInput(i.amount),i.expectedDate,i.probability,i.priority,i.notes])]);}
function importInvoices(text){let rows=csvParse(text);if(rows[0]?.join('|')!==CSV_HEADERS.join('|')||rows.length<2)throw Error('columns');let next=structuredClone(db);for(let row of rows.slice(1)){if(row.length!==9)throw Error('length');let [name,ref,date,due,amount,expectedDate,prob,priority,notes]=row,c=active('customers').find(c=>c.name===name);if(!c)throw Error('customer');next.invoices.push({id:uid(),customerId:c.id,ref,invoiceDate:date,dueDate:due,amount:E.amount(amount,E.digits(db.currency)),expectedDate,probability:Number(prob),priority:Number(priority),notes,status:'open',currency:db.currency,createdAt:new Date().toISOString()});}if(!E.validate(next))throw Error('invalid');return next;}
function pick(){toast('File imports are available in the offline planner.');}
function navigate(p){if(!close())return;page=p;offset=0;query=p==='invoices'?db.view.query:'';if(p==='invoices'){filter=db.view.filter;sort=db.view.sort;compact=db.view.compact;optional=db.view.optional;}render();window.scrollTo({top:0,behavior:'instant'});}
document.addEventListener('click',ev=>{let el=ev.target.closest('[data-action]');if(!el)return;let a=el.dataset.action,id=el.dataset.id,k=el.dataset.entity;if(a==='nav')navigate(el.dataset.page);else if(a==='close')close();else if(a==='new'||a==='edit')newRecord(k,id);else if(a==='newRelated')newRecord(k,null,id);else if(a==='file')fileInvoice(id);else if(a==='customerFile')customerFile(id);else if(a==='archive'||a==='restoreRecord')archive(k,id,a==='restoreRecord');else if(a==='collapse'){collapsed=!collapsed;render();}else if(a==='theme'){if(!close())return;db.theme=db.theme==='light'?'dark':'light';persist();render();}else if(a==='command')command();else if(a==='backup')backup();else if(a==='demo'){if(db.setup&&!confirm(t('demoReplace')))return;db=demo();loadFailed=false;setupStep=0;dirty=false;commit('loadDemo');}else if(a==='setupStart'){setupStep=1;render();}else if(a==='setupBack'){setupStep=Math.max(0,setupStep-1);dirty=false;render();}else if(a==='reset'){if(!confirm(t('resetConfirm')))return;db=fresh();loadFailed=false;dirty=false;setupStep=0;persist();render();}else if(a==='restore')pick('json');else if(a==='importAll')pick('workspace');else if(a==='importInvoices')pick('invoices');else if(a==='exportAll')download(workspaceCSV(db),'NexalyPlanner-AR-Workspace.csv','text/csv;charset=utf-8');else if(a==='exportInvoices')download(invoiceCSV(),'NexalyPlanner-AR-Invoices.csv','text/csv;charset=utf-8');else if(a==='template')download(csvString([CSV_HEADERS,[active('customers')[0]?.name||'Exact customer name','INV-EXAMPLE',today(),E.addDays(today(),30),'1000',E.addDays(today(),35),'70','50','Replace example before import']]),'AR-Invoice-Template.csv','text/csv;charset=utf-8');else if(a==='scan')toast(t(E.validate(db)?'scanComplete':'invalidData'));else if(a==='raw')download(rawStored||'','AR-Recovery-Raw.json');else if(a==='previous'||a==='next'){offset=Math.max(0,offset+(a==='next'?20:-20));render();}else if(a==='saveView'){db.view={query,filter,sort,compact,optional};persist();toast(t('viewSaved'));}else if(a==='bulkExport')download(invoiceCSV(db.invoices.filter(i=>selectedRows.has(i.id))),'Selected-AR-Invoices.csv','text/csv;charset=utf-8');else if(a==='bulkArchive'){if(!confirm(t('confirm')))return;let n=0;for(let id of selectedRows)if(archive('invoices',id,false,true))n++;selectedRows.clear();commit('archive',String(n));}else if(a==='duplicate'){let i=db.invoices.find(i=>i.id===id),copy={...structuredClone(i),id:uid(),ref:i.ref+'-'+Date.now().toString(36),status:'open',archived:false,createdAt:new Date().toISOString()},next=structuredClone(db);next.invoices.push(copy);if(!E.validate(next)){toast(t('invalidData'));return;}db=next;commit('copy',copy.ref);}else if(a==='voidPayment'||a==='voidAdjustment'){let entity=a==='voidPayment'?'payments':'adjustments';if(!confirm(t('historyLocked')))return;let next=structuredClone(db),x=next[entity].find(x=>x.id===id);x.archived=true;x.voidedAt=new Date().toISOString();if(!E.validate(next)){toast(t('invalidData'));return;}db=next;close(true);commit('void',x.reference||x.notes);fileInvoice(x.invoiceId);}else if(a==='promiseCancel'){if(!confirm(t('confirm')))return;let p=db.promises.find(p=>p.id===id);p.cancelled=!p.cancelled;commit(p.cancelled?'cancelPromise':'restorePromise');}else if(a==='snapshot')saveSnapshot();else if(a==='scenarioSave'){let name=document.getElementById('scenarioName').value.trim();if(!name){toast(t('nameRequired'));return;}let next=structuredClone(db);next.scenarios.push({id:uid(),name,factor:scenario.factor,shift:scenario.shift,horizon:db.settings.horizon,date:db.settings.asOf,total:E.expected(db,db.settings.horizon,scenario).total,currency:db.currency,notes:''});if(!E.validate(next)){toast(t('invalidData'));return;}db=next;commit('saveScenario',name);}else if(a==='scenarioReset'){scenario={factor:100,shift:0,name:''};render();}else if(a==='print'){if(!close())return;if(page!=='reports'){page='reports';render();}toast('Printing is available in the offline planner.');}else if(a==='forecastExport'){let r=E.expected(db);download(csvString([['date','invoice','customer','source','face_'+db.currency,'confidence_pct','expected_'+db.currency],...r.rows.map(x=>[x.date,x.ref,customer(x.customerId)?.name,x.source,mInput(x.amount),x.probability,mInput(x.expected)])]),'AR-Expected-Cash.csv','text/csv;charset=utf-8');}else if(a==='exportChart'){let s=E.summary(db),x=0,svg=`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260"><rect width="900" height="260" fill="white"/><text x="20" y="30" font-family="sans-serif" font-size="20" fill="#332c3a">${esc(t('agingTitle')+' · '+db.currency+' · '+db.settings.asOf)}</text>`;for(let [n,k]of E.BUCKETS.entries()){let w=s.total?s.totals[k]/s.total*860:0;svg+=`<rect x="${20+x}" y="60" width="${w}" height="45" fill="${['#987d9e','#74566f','#b98d75','#a46169','#72405c'][n]}"/><text x="20" y="${135+n*22}" font-family="sans-serif" font-size="14" fill="#332c3a">${esc(t(k)+': '+money(s.totals[k]))}</text>`;x+=w;}download(svg+'</svg>','AR-Aging.svg','image/svg+xml');}else if(a==='widgetHide'){db.hiddenWidgets.push(el.dataset.widget);persist();render();}else if(a==='widgetUp'){let n=db.widgets.indexOf(el.dataset.widget);if(n>0)[db.widgets[n-1],db.widgets[n]]=[db.widgets[n],db.widgets[n-1]];persist();render();}else if(a==='resetWidgets'){db.widgets=['aging','queue','expected','activity'];db.hiddenWidgets=[];persist();render();}else if(a==='tour'){tourStep=0;tour();}else if(a==='tourNext'||a==='tourBack'){tourStep+=a==='tourNext'?1:-1;tour();}});
document.addEventListener('submit',ev=>{ev.preventDefault();let f=ev.target;if(f.id==='recordForm')submitRecord(f);else if(f.id==='settingsForm'||f.id==='rulesForm'){if(submitSettings(f)){dirty=false;commit(f.id==='rulesForm'?'rulesSaved':'settingsSaved');}}else if(f.id==='setupForm')submitSetup(f);else if(f.id==='memoForm'){db.memo=String(new FormData(f).get('reportMemo')||'').slice(0,4000);dirty=false;commit('saveReportNotes');}});
document.addEventListener('change',ev=>{let x=ev.target;if(x.id==='language'){if(!close())return;db.lang=x.value;persist();render();}else if(x.id==='invoiceSelect'){db.selected=x.value;persist();render();}else if(['filter','sort','compact','optional','archived'].includes(x.id)){if(x.id==='filter')filter=x.value;if(x.id==='sort')sort=x.value;if(x.id==='compact')compact=x.checked;if(x.id==='optional')optional=x.checked;if(x.id==='archived')showArchived=x.checked;offset=0;render();}else if(x.dataset.select){x.checked?selectedRows.add(x.dataset.select):selectedRows.delete(x.dataset.select);document.getElementById('selectionCount').textContent=selectedRows.size+' '+t('selected');}else if(x.closest('#recordForm')){let f=x.closest('form');if(dialog.entity==='invoices'&&['customerId','invoiceDate'].includes(x.name)&&!dialog.id){let c=customer(f.elements.customerId.value);f.elements.dueDate.value=E.addDays(f.elements.invoiceDate.value,c.termsDays);}if(x.name==='invoiceId'&&dialog.entity==='payments'){let i=db.invoices.find(i=>i.id===x.value),ps=active('promises').filter(p=>p.invoiceId===i.id&&!p.cancelled&&E.promise(db,p,today()).remaining>0);f.elements.promiseId.innerHTML='<option value="">'+esc(t('none'))+'</option>'+ps.map(p=>`<option value="${esc(p.id)}">${esc(dateText(p.promisedDate)+' · '+money(E.promise(db,p,today()).remaining))}</option>`).join('');f.elements.amount.value=mInput(E.balance(db,i,today()));}dirty=true;}});
document.addEventListener('input',ev=>{let x=ev.target;if(x.setCustomValidity)x.setCustomValidity('');if(x.id==='search'){let pos=x.selectionStart;query=x.value;offset=0;render();let e=document.getElementById('search');e?.focus();e?.setSelectionRange(pos,pos);}else if(x.id==='commandSearch')modal.querySelectorAll('.commands button').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(x.value.toLowerCase()));else if(x.id==='scenarioName')scenario.name=x.value;else if(x.id==='factor'||x.id==='shift'){scenario[x.id]=Number(x.value);document.getElementById(x.id==='factor'?'factorOut':'shiftOut').textContent=x.value+(x.id==='factor'?'%':'');document.getElementById('scenarioValue').innerHTML=metric('expectedTotal',money(E.expected(db,db.settings.horizon,scenario).total));}else if(x.closest('form'))dirty=true;});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')close();if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();command();}if(ev.key==='Tab'&&modal.querySelector('[role=dialog]')){let xs=[...modal.querySelectorAll('input,select,textarea,button,a')].filter(e=>!e.disabled&&!e.hidden&&!e.closest('[hidden]')),a=xs[0],b=xs.at(-1);if(ev.shiftKey&&document.activeElement===a){ev.preventDefault();b?.focus();}else if(!ev.shiftKey&&document.activeElement===b){ev.preventDefault();a?.focus();}}});
window.addEventListener('beforeunload',ev=>{if(dirty||storageFailed){ev.preventDefault();ev.returnValue='';}});render();
</script></body></html>
