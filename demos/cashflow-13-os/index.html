const validate=d=>d&&d.version===1&&Array.isArray(d.items)&&d.items.every(E.validateItem)&&Array.isArray(d.scenarios)&&LANGS[d.language]&&CURRENCIES.includes(d.currency)&&Number.isSafeInteger(d.openingCents)&&Number.isSafeInteger(d.thresholdCents)&&d.thresholdCents>=0&&E.parseDate(d.anchor);

function notice(s){$('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.role='status';el.textContent=s;document.body.append(el);setTimeout(()=>el.remove(),4000)}
function money(c){return new Intl.NumberFormat(({en:'en-US',ar:'ar-SA',es:'es-ES',nl:'nl-NL',fr:'fr-FR',pt:'pt-PT',it:'it-IT'})[db.language],{style:'currency',currency:db.currency,maximumFractionDigits:['JPY','KRW'].includes(db.currency)?0:2}).format(c/100)}
function date(s){return new Intl.DateTimeFormat(({en:'en-US',ar:'ar-SA',es:'es-ES',nl:'nl-NL',fr:'fr-FR',pt:'pt-PT',it:'it-IT'})[db.language],{timeZone:'UTC',month:'short',day:'numeric',year:'numeric'}).format(E.parseDate(s))}
function options(arr,v){return arr.map(([a,b])=>`<option value="${escape(a)}"${a===v?' selected':''}>${escape(b)}</option>`).join('')}
const b=(a,s,c='')=>`<button type="button" class="btn ${c}" data-action="${a}">${s}</button>`,f=(name,key,value,type='text',extra='')=>`<div class="field-wrap"><label for="${key}">${t(name)}</label><input id="${key}" class="field" name="${key}" type="${type}" value="${escape(value)}" ${extra}></div>`;

const weeks=()=>E.forecast(db,db.anchor),minWeek=ws=>ws.reduce((a,c)=>c.closing<a.closing?c:a),risk=w=>t(w.risk),metric=(name,v,sub='',cls='')=>`<div class="card kpi"><div class="label">${t(name)}</div><div class="value ${cls}">${v}</div><div class="note">${sub}</div></div>`;
function chart(ws){let vals=ws.map(x=>x.closing),max=Math.max(0,db.openingCents,db.thresholdCents,...vals),min=Math.min(0,db.openingCents,db.thresholdCents,...vals),range=Math.max(1,max-min),x=i=>48+i*54,y=v=>235-(v-min)/range*188,pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');return `<svg class="chart" viewBox="0 0 760 280" role="img" aria-label="${t('balancePath')}">${[0,1,2,3].map(i=>`<line class="gridline" x1="38" x2="720" y1="${45+i*60}" y2="${45+i*60}"/>`).join('')}<polygon class="area" points="48,240 ${pts} 696,240"/><line class="threshold" x1="38" x2="720" y1="${y(db.thresholdCents)}" y2="${y(db.thresholdCents)}"/><polyline class="line" points="${pts}"/>${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4" data-week="${i}" tabindex="0"><title>${t('week')} ${i+1} · ${money(v)}</title></circle><text x="${x(i)-8}" y="270">${i+1}</text>`).join('')}</svg><div class="legend"><span><i></i>${t('closing')}</span><span><i class="warn"></i>${t('threshold')} ${money(db.thresholdCents)}</span></div>`}
function timeline(ws){return `<div class="timeline">${ws.map((w,i)=>`<button class="week ${w.risk} ${selected===i?'selected':''}" data-week="${i}" aria-label="${t('week')} ${i+1}: ${money(w.closing)}; ${risk(w)}"><strong>W${i+1}</strong><span>${money(w.closing)}</span><small>${risk(w)}</small></button>`).join('')}</div>`}
function detail(w){return `<div class="grid three" style="margin:15px 0">${metric('opening',money(w.opening))}${metric('inShort',money(w.inflow))}${metric('outShort',money(w.outflow))}</div><div class="notice ${w.risk==='critical'?'error':''}">${t('week')} ${w.index} · ${date(w.from)}–${date(w.to)} · ${t('closing')} ${money(w.closing)} · ${t('buffer')} ${money(w.buffer)} · ${risk(w)}</div>${w.rows.length?`<div class="table-scroll"><table class="table"><thead><tr><th>${t('date')}</th><th>${t('title')}</th><th>${t('status')}</th><th class="right">${t('amount')}</th></tr></thead><tbody>${w.rows.map(x=>`<tr><td>${date(x.occurrenceDate)}</td><td>${escape(x.title)}</td><td>${x.actual?t('actual'):t('expected')}</td><td class="right ${x.direction==='in'?'good':'bad'}">${x.direction==='in'?'+':'−'}${money(x.amountCents)}</td></tr>`).join('')}</tbody></table></div>`:''}`}
function overview(){let ws=weeks(),low=minWeek(ws),risks=ws.filter(x=>x.risk!=='healthy'),up=E.instances(db.items,ws[0].from,ws[2].to).filter(x=>x.direction==='out').sort((a,b)=>a.occurrenceDate.localeCompare(b.occurrenceDate)).slice(0,5),burn=Math.max(0,(ws.reduce((s,w)=>s+w.outflow-w.inflow,0))/13);return `${h('hero',t('subtitle'),b('add','＋ '+t('add'),'primary')+b('scenario',t('newScenario')))}<div class="hero-panel"><div class="eyebrow">CASH CONTROL / 13-WEEK VIEW</div><h2>${escape(db.business)}</h2><p>${t('expectedWarning')}</p><div class="row"><span class="pill">${db.currency}</span><span class="pill">${date(ws[0].from)} – ${date(ws[12].to)}</span><span class="pill">${t('runway')}: ${burn?Math.max(0,db.openingCents/burn).toFixed(1)+' '+t('weeks'):t('noBurn')}</span></div></div><div class="grid kpis">${metric('opening',money(db.openingCents),t('openingAsOf'))}${metric('close13',money(ws[12].closing),date(ws[12].to),ws[12].closing<0?'bad':'')}${metric('lowest',money(low.closing),`${t('week')} ${low.index} · ${date(low.from)}`,low.risk==='critical'?'bad':'')}${metric('net13',money(ws[12].closing-db.openingCents),t('threshold')+' '+money(db.thresholdCents))}</div><div class="grid split"><section class="card"><div class="card-head"><h2>${t('balancePath')}</h2></div><div class="card-body">${chart(ws)}</div></section><section class="card"><div class="card-head"><h2>${t('queue')}</h2><small>${risks.length}/13</small></div><div class="card-body"><div class="list">${risks.length?risks.slice(0,4).map(x=>`<div class="listitem"><div><strong>${t('week')} ${x.index} · ${risk(x)}</strong><small>${date(x.from)} · ${t('buffer')} ${money(x.buffer)}</small></div><button class="btn tiny" data-week="${x.index-1}">↗</button></div>`).join(''):`<div class="notice success">${t('noAlerts')}</div>`}<div class="notice">${t('forecastWarning')}</div></div></div></section></div><section class="card" style="margin-top:16px"><div class="card-head"><h2>${t('pulse')}</h2></div><div class="card-body">${timeline(ws)}${detail(ws[selected])}</div></section><div class="grid two" style="margin-top:16px"><section class="card"><div class="card-head"><h2>${t('obligations')}</h2></div><div class="card-body"><div class="list">${up.length?up.map(x=>`<div class="listitem"><div><strong>${escape(x.title)}</strong><small>${date(x.occurrenceDate)}</small></div><b>${money(x.amountCents)}</b></div>`).join(''):empty()}</div></div></section><section class="card"><div class="card-head"><h2>${t('quality')}</h2></div><div class="card-body">${quality()}</div></section></div>`}
function quality(){let stale=db.items.filter(x=>!x.archived&&x.recurrence==='none'&&x.direction==='in'&&x.actualCents==null&&x.date<today()).length,missing=db.items.filter(x=>!x.archived&&!x.category).length;return `<div class="list"><div class="listitem"><strong>${t('overdue')}</strong><b class="${stale?'bad':'good'}">${stale}</b></div><div class="listitem"><strong>${t('qualityHint')}</strong><b class="${missing?'watch':'good'}">${missing}</b></div><div class="notice">${t('storageHint')}</div></div>`}
function forecastPage(){let ws=weeks();return `${h('forecast',t('forecastWarning'),b('add','＋ '+t('add'),'primary')+b('print',t('print')))}<div class="card"><div class="card-head"><h2>${t('balancePath')}</h2><span class="pill">${t('threshold')} ${money(db.thresholdCents)}</span></div><div class="card-body">${chart(ws)}${timeline(ws)}</div></div><div class="grid split" style="margin-top:16px"><section class="card"><div class="card-head"><h2>${t('weeklyDetail')} · ${t('week')} ${selected+1}</h2></div><div class="card-body">${detail(ws[selected])}</div></section><section class="card"><div class="card-head"><h2>${t('pulse')}</h2></div><div class="mini-bars">${ws.map(w=>{let m=Math.max(1,...ws.map(z=>Math.max(z.inflow,z.outflow)));return `<div title="${t('week')} ${w.index}: ${money(w.inflow)} / ${money(w.outflow)}"><span class="bar-in" style="height:${Math.max(2,100*w.inflow/m)}%"></span><span class="bar-out" style="height:${Math.max(2,100*w.outflow/m)}%"></span></div>`}).join('')}</div><div class="legend" style="padding:0 20px 20px"><span><i></i>${t('inShort')}</span><span><i class="warn"></i>${t('outShort')}</span></div></section></div><section class="card" style="margin-top:16px"><div class="card-head"><h2>${t('forecast')}</h2></div><div class="table-scroll"><table class="table"><thead><tr><th>${t('week')}</th><th class="right">${t('opening')}</th><th class="right">${t('inShort')}</th><th class="right">${t('outShort')}</th><th class="right">${t('closing')}</th><th class="right">${t('buffer')}</th><th>${t('status')}</th></tr></thead><tbody>${ws.map(w=>`<tr><td><button class="btn tiny" data-week="${w.index-1}">${w.index} · ${date(w.from)}</button></td><td class="right">${money(w.opening)}</td><td class="right good">${money(w.inflow)}</td><td class="right">${money(w.outflow)}</td><td class="right">${money(w.closing)}</td><td class="right ${w.buffer<0?'bad':''}">${money(w.buffer)}</td><td class="${w.risk==='critical'?'bad':w.risk==='watch'?'watch':'good'}">${risk(w)}</td></tr>`).join('')}</tbody></table></div></section>`}
function empty(){return `<div class="empty"><div class="symbol">◇</div><h3>${search?t('noMatching'):t('empty')}</h3><p>${search?t('trySearch'):t('emptyHint')}</p>${b('add',t('add'),'primary')}</div>`}
function records(kind){let items=db.items.filter(x=>!x.archived).filter(x=>kind==='recurring'?x.recurrence!=='none':kind==='receivables'?x.direction==='in'&&x.actualCents==null&&x.recurrence==='none':kind==='payables'?x.direction==='out'&&x.actualCents==null&&x.recurrence==='none':x.direction===(kind==='cashIn'?'in':'out'));if(filter!=='all')items=items.filter(x=>filter==='actual'?x.actualCents!=null:x.actualCents==null);if(search)items=items.filter(x=>(x.title+x.category+x.counterparty+x.notes).toLocaleLowerCase().includes(search.toLocaleLowerCase()));items.sort((a,c)=>a.date.localeCompare(c.date));return `${h(kind,t('expectedWarning'),b('add','＋ '+t('add'),'primary'))}<div class="card"><div class="card-head"><h2>${t('allRecords')} · ${items.length}</h2></div><div class="card-body"><div class="toolbar"><select class="field" data-change="filter" aria-label="${t('filter')}">${options([['all',t('all')],['planned',t('planned')],['actual',t('actual')]],filter)}</select><span class="spacer"></span>${b('exportCsv',t('exportCsv'),'tiny')}</div>${items.length?`<div class="table-scroll"><table class="table"><thead><tr><th>${t('date')}</th><th>${t('title')}</th><th>${t('category')}</th><th>${t('counterparty')}</th><th>${t('status')}</th><th class="right">${t('amount')}</th><th>${t('actions')}</th></tr></thead><tbody>${items.map(x=>`<tr><td>${date(x.actualDate||x.date)}</td><td class="title-cell">${escape(x.title)}</td><td>${escape(x.category||'—')}</td><td>${escape(x.counterparty||'—')}</td><td><span class="pill">${x.actualCents!=null?t('actual'):t('planned')}${x.recurrence==='none'?'':' · '+t(x.recurrence)}</span></td><td class="right ${x.direction==='in'?'good':'bad'}">${x.direction==='in'?'+':'−'}${money(x.actualCents??x.amountCents)}</td><td><div class="row"><button class="btn tiny" data-edit="${x.id}">${t('edit')}</button><button class="btn tiny" data-archive="${x.id}">${t('archive')}</button></div></td></tr>`).join('')}</tbody></table></div>`:empty()}</div></div>`}
function scenarios(){let ws=E.forecast(db,db.anchor,scenario),base=weeks(),lo=minWeek(ws);return `${h('scenarios',t('scenarioIsolation'),b('saveScenario',t('saveSnapshot'),'primary'))}<div class="card"><div class="card-head"><h2>${t('newScenario')}</h2></div><div class="card-body scenario-controls">${[['inflowPct','inflowChange',-50,50],['outflowPct','outflowChange',-50,50],['delayDays','delayDays',0,35]].map(([key,name,min,max])=>`<div class="field-wrap"><label>${t(name)} · ${scenario[key]}${key==='delayDays'?'':'%'}</label><input type="range" min="${min}" max="${max}" value="${scenario[key]}" data-scenario="${key}"></div>`).join('')}</div></div><div class="compare" style="margin:16px 0"><div class="card card-body"><h3>${t('baseCase')}</h3><h2>${money(base[12].closing)}</h2></div><div class="card card-body"><h3>${t('scenarioCase')}</h3><h2>${money(ws[12].closing)}</h2><p>${t('lowest')}: ${money(lo.closing)} · ${t('week')} ${lo.index}</p></div></div><div class="card"><div class="card-head"><h2>${t('balancePath')}</h2></div><div class="card-body">${chart(ws)}${timeline(ws)}</div></div><div class="card" style="margin-top:16px"><div class="card-head"><h2>${t('savedScenarios')}</h2></div><div class="card-body list">${db.scenarios.length?db.scenarios.map(z=>`<div class="listitem"><div><strong>${escape(z.name)}</strong><small>${date(z.created.slice(0,10))} · ${z.inflowPct}% / ${z.outflowPct}% / ${z.delayDays}d</small></div><div class="row"><button class="btn tiny" data-load-scenario="${z.id}">${t('restore')}</button><button class="btn tiny danger" data-delete-scenario="${z.id}">${t('delete')}</button></div></div>`).join(''):t('scenarioIsolation')}</div></div>`}
function alerts(){let ws=weeks(),risks=ws.filter(w=>w.risk!=='healthy'),overdue=db.items.filter(x=>!x.archived&&x.direction==='in'&&x.actualCents==null&&x.recurrence==='none'&&x.date<today());return `${h('alerts',t('alertHint'),b('scenario',t('newScenario')))}<div class="grid kpis">${metric('critical',ws.filter(x=>x.risk==='critical').length,'13 '+t('weeks'),'bad')}${metric('watch',ws.filter(x=>x.risk==='watch').length,'13 '+t('weeks'),'watch')}${metric('overdue',overdue.length,t('receivables'))}${metric('threshold',money(db.thresholdCents))}</div><div class="card card-body"><div class="risk-grid">${ws.map(w=>`<button class="${w.risk}" data-week="${w.index-1}" title="${risk(w)} · ${money(w.buffer)}">W${w.index}</button>`).join('')}</div><div class="list" style="margin-top:16px">${risks.length?risks.map(w=>`<div class="listitem"><div><strong>${t('week')} ${w.index} · ${risk(w)}</strong><small>${date(w.from)} · ${t('buffer')} ${money(w.buffer)}</small></div><button class="btn tiny" data-week="${w.index-1}">${t('weeklyDetail')}</button></div>`).join(''):`<div class="notice success">${t('noAlerts')}</div>`}${overdue.map(x=>`<div class="listitem"><div><strong>${t('overdue')} · ${escape(x.title)}</strong><small>${date(x.date)} · ${money(x.amountCents)}</small></div><button class="btn tiny" data-edit="${x.id}">${t('edit')}</button></div>`).join('')}</div></div>`}
function reports(){let ws=weeks(),low=minWeek(ws),actual=db.items.filter(x=>!x.archived&&x.actualCents!=null),variance=actual.reduce((s,x)=>s+(x.actualCents-x.amountCents)*(x.direction==='in'?1:-1),0);return `${h('reports',t('forecastWarning'),b('print',t('print'),'primary')+b('exportCsv',t('exportCsv')))}<div class="print-only"><img src="${window.NEXALY_LOGO}" width="110" alt="NexalyPlanner"><h1>CashFlow 13 OS · ${escape(db.business)}</h1><p>${t('generated')}: ${date(today())}</p></div><div class="grid kpis">${metric('opening',money(db.openingCents))}${metric('close13',money(ws[12].closing))}${metric('lowest',money(low.closing),t('week')+' '+low.index)}${metric('variance',money(variance),actual.length+' '+t('actual'))}</div><div class="card"><div class="card-head"><h2>${t('forecast')}</h2></div><div class="table-scroll"><table class="table"><thead><tr><th>${t('week')}</th><th class="right">${t('opening')}</th><th class="right">${t('inShort')}</th><th class="right">${t('outShort')}</th><th class="right">${t('closing')}</th><th>${t('status')}</th></tr></thead><tbody>${ws.map(w=>`<tr><td>${w.index} · ${date(w.from)}</td><td class="right">${money(w.opening)}</td><td class="right">${money(w.inflow)}</td><td class="right">${money(w.outflow)}</td><td class="right">${money(w.closing)}</td><td>${risk(w)}</td></tr>`).join('')}</tbody></table></div></div><div class="notice" style="margin-top:16px">${t('expectedWarning')} ${t('forecastWarning')}</div>`}
function data(){let archived=db.items.filter(x=>x.archived);return `${h('data',t('storageHint'))}<div class="grid three">${[['backup','backupNow','backup'],['importCsv','importCsv','importCsv'],['exportCsv','exportCsv','exportCsv']].map(([title,action,label])=>`<div class="card"><div class="card-head"><h2>${t(title)}</h2></div><div class="card-body"><p>${title==='importCsv'?'CSV: title,direction,date,amount,category,counterparty,recurrence,notes':t('privacyHint')}</p>${b(action,t(label),'primary')}</div></div>`).join('')}</div><div class="grid two" style="margin-top:16px"><div class="card card-body"><h2>${t('restoreBackup')}</h2>${b('restoreBackup',t('restoreBackup'))}</div><div class="card card-body"><h2>${t('quality')}</h2>${quality()}</div></div><div class="card" style="margin-top:16px"><div class="card-head"><h2>${t('restoreArchived')} · ${archived.length}</h2></div><div class="card-body list">${archived.length?archived.map(x=>`<div class="listitem"><div><strong>${escape(x.title)}</strong><small>${date(x.date)} · ${money(x.amountCents)}</small></div><div class="row"><button class="btn tiny" data-restore="${x.id}">${t('restore')}</button><button class="btn tiny danger" data-delete="${x.id}">${t('delete')}</button></div></div>`).join(''):t('noData')}</div></div><div class="row" style="margin-top:18px">${b('demo',t('refreshDemo'))}${b('reset',t('reset'),'danger')}</div>`}
function settings(){return `${h('settings',t('setupHint'))}<form id="settings-form" class="card"><div class="card-head"><h2>${t('business')}</h2></div><div class="card-body"><div class="form-grid">${f('business','business',db.business,'text','required maxlength="90"')}${f('openingAsOf','anchor',db.anchor,'date','required')}${f('opening','opening',(db.openingCents/100).toFixed(2),'number','required step="0.01"')}${f('minimum','threshold',(db.thresholdCents/100).toFixed(2),'number','required min="0" step="0.01"')}<div class="field-wrap"><label>${t('language')}</label><select class="field" name="language">${options(Object.entries(LANGS),db.language)}</select></div><div class="field-wrap"><label>${t('currency')}</label><select class="field" name="currency">${options(CURRENCIES.map(x=>[x,x]),db.currency)}</select></div><div class="field-wrap"><label>${t('appearance')}</label><select class="field" name="theme">${options([['light',t('light')],['dark',t('dark')]],db.theme)}</select></div><div class="wide notice">${t('openingAsOf')}. ${t('expectedWarning')}</div></div><div class="row" style="margin-top:17px"><button type="submit" class="btn primary">${t('apply')}</button>${b('guide',t('guide'))}</div></div></form><div class="card" style="margin-top:16px"><div class="card-head"><h2>${t('about')}</h2></div><div class="card-body row"><img src="${window.NEXALY_LOGO}" width="90" alt="NexalyPlanner"><div><strong>CashFlow 13 OS v1.0</strong><p>${t('privacyHint')} ${t('keyboard')}</p></div></div></div>`}
function page(){return ({overview,forecast:forecastPage,cashIn:()=>records('cashIn'),cashOut:()=>records('cashOut'),receivables:()=>records('receivables'),payables:()=>records('payables'),recurring:()=>records('recurring'),scenarios,alerts,reports,data,settings})[view]()}
function render(){document.documentElement.lang=db.language;document.documentElement.dir=db.language==='ar'?'rtl':'ltr';document.body.dataset.theme=db.theme;$('#app').innerHTML=`<div class="shell"><aside class="rail ${mobile?'open':''}" aria-label="Navigation"><div class="rail-top"><img class="brand-logo" src="${window.NEXALY_LOGO}" alt="NexalyPlanner"><div><div class="brand-title">CashFlow 13</div><div class="brand-sub">NEXALYPLANNER OS</div></div></div><div class="nav-group">WORKSPACE</div><nav class="nav">${menu()}</nav><div class="rail-bottom"><strong>${escape(db.business)}</strong>${t('storageHint')}<br>v1.0 · Offline edition</div></aside><div class="main"><header class="topbar"><button class="btn mobile-menu" data-action="mobile" aria-label="Menu">☰</button><div class="crumb"><b>${t(view)}</b><small>${escape(db.business)} · ${db.currency} · ${t('privacy')}</small></div><input class="field search" type="search" data-search placeholder="${t('search')}" value="${escape(search)}" aria-label="${t('search')}"><button class="btn primary quick" data-action="add">＋ ${t('add')}</button><select class="field" data-change="language" aria-label="${t('language')}">${options(Object.entries(LANGS),db.language)}</select><select class="field" data-change="currency" aria-label="${t('currency')}">${options(CURRENCIES.map(x=>[x,x]),db.currency)}</select><button class="btn" data-action="theme" aria-label="${t('appearance')}">${db.theme==='light'?'◐':'☀'}</button><button class="btn" data-view="data" aria-label="${t('backup')}">⤓</button></header><main class="content">${page()}</main></div></div>${drawer?drawDrawer():''}${modal?drawModal():''}`}
function drawDrawer(){let x=drawer.id?db.items.find(v=>v.id===drawer.id):null;return `<div class="drawer-backdrop" data-action="closeDrawer"><section class="drawer" role="dialog" aria-modal="true" aria-label="${t('cashItem')}"><button class="btn close" data-action="closeDrawer">×</button><div class="eyebrow">CASHFLOW 13 / RECORD</div><h2>${x?t('edit'):t('add')}</h2><p class="tagline">${t('expectedWarning')}</p><form id="item-form" class="form-grid">${f('title','title',x?.title||'','text','required maxlength="120"')}<div class="field-wrap"><label>${t('direction')}</label><select class="field" name="direction">${options([['in',t('cashIn')],['out',t('cashOut')]],x?.direction||'in')}</select></div>${f('expectedDate','date',x?.date||today(),'date','required')}${f('expectedAmount','amount',x?(x.amountCents/100).toFixed(2):'','number','required min="0" step="0.01"')}${f('category','category',x?.category||'','text','maxlength="70"')}${f('counterparty','counterparty',x?.counterparty||'','text','maxlength="90"')}<div class="field-wrap"><label>${t('recurrence')}</label><select class="field" name="recurrence">${options([['none',t('none')],['weekly',t('weekly')],['monthly',t('monthly')]],x?.recurrence||'none')}</select></div>${f('actualDate','actualDate',x?.actualDate||'','date')}${f('actualAmount','actualAmount',x?.actualCents==null?'':(x.actualCents/100).toFixed(2),'number','min="0" step="0.01"')}<div class="field-wrap"><label>${t('notes')}</label><textarea class="field" name="notes" maxlength="1000">${escape(x?.notes||'')}</textarea></div><div class="notice">${t('actualVsExpected')}: ${t('actual')} replaces ${t('expected')} for one-time records; recurring records remain projected.</div><footer><button type="button" class="btn" data-action="closeDrawer">${t('cancel')}</button><button class="btn primary" type="submit">${t('save')}</button></footer></form></section></div>`}
function drawModal(){if(modal.type==='setup')return `<div class="modal"><section class="modal-inner" role="dialog" aria-modal="true"><img src="${window.NEXALY_LOGO}" width="100" alt="NexalyPlanner"><div class="modal-steps">${[0,1,2].map(i=>`<i class="${i<=modal.step?'on':''}"></i>`).join('')}</div>${modal.step===0?`<h2>${t('welcome')}</h2><p>${t('sampleHint')}</p><div class="row">${b('setupNext',t('continue'),'primary')}${b('demo',t('demo'))}</div>`:modal.step===1?`<h2>${t('language')} · ${t('currency')}</h2><div class="form-grid"><select class="field" data-change="language">${options(Object.entries(LANGS),db.language)}</select><select class="field" data-change="currencySetup">${options(CURRENCIES.map(x=>[x,x]),db.currency)}</select></div><div class="row" style="margin-top:16px">${b('setupBack',t('back'))}${b('setupNext',t('continue'),'primary')}</div>`:`<h2>${t('setupHint')}</h2><form id="setup-form" class="form-grid">${f('business','business','My Business','text','required')}${f('opening','opening','0.00','number','step="0.01" required')}${f('minimum','threshold','0.00','number','step="0.01" min="0" required')}<div class="row wide"><button type="button" class="btn" data-action="setupBack">${t('back')}</button><button class="btn primary">${t('blank')}</button>${b('demo',t('demo'))}</div></form>`}</section></div>`;
if(modal.type==='confirm')return `<div class="modal"><section class="modal-inner" role="alertdialog" aria-modal="true"><h2>${t(modal.title)}</h2><p>${escape(modal.message)}</p><div class="row">${b('closeModal',t('cancel'))}${b('doConfirm',t('confirm'),'danger')}</div></section></div>`;
if(modal.type==='import')return `<div class="modal"><section class="modal-inner" role="dialog" aria-modal="true"><h2>${t('importPreview')}</h2><p>${t('ready')}: ${pending.valid.length} · ${t('rejected')}: ${pending.errors.length}</p><div class="table-scroll"><table class="table"><tbody>${pending.valid.slice(0,5).map(x=>`<tr><td>${escape(x.title)}</td><td>${date(x.date)}</td><td>${money(x.amountCents)}</td></tr>`).join('')}</tbody></table></div>${pending.errors.length?`<div class="notice error">${escape(pending.errors.slice(0,7).join(', '))}</div>`:''}<div class="row">${b('closeModal',t('cancel'))}${b('doImport',t('importValid'),'primary')}</div></section></div>`;
return `<div class="modal"><section class="modal-inner" role="dialog" aria-modal="true"><button class="btn close" data-action="closeModal" style="float:right">×</button><h2>${t('guide')}</h2><p>${t('expectedWarning')}</p><div class="list"><div class="listitem"><strong>${t('opening')} + ${t('inShort')} − ${t('outShort')} = ${t('closing')}</strong></div><div class="listitem"><strong>${t('closing')} − ${t('threshold')} = ${t('buffer')}</strong></div><div class="notice">${t('forecastWarning')}</div><div class="notice">${t('scenarioIsolation')}</div><div class="notice">${t('storageHint')}</div></div><p>${t('keyboard')}</p></section></div>`}
function demo(){let anchor=E.monday(today()),d=n=>E.addDays(anchor,n),mk=(title,direction,n,amount,category,recurrence='none',actual=null)=>({id:id(),title,direction,date:d(n),amountCents:E.cents(amount),category,counterparty:'Austin demo',recurrence,actualCents:actual===null?null:E.cents(actual),actualDate:actual===null?'':d(n),notes:'',archived:false});db={...blank(),setup:true,business:'Austin Creative Studio · Demo',language:db.language,currency:db.currency,theme:db.theme,anchor,openingCents:3285000,thresholdCents:1200000,items:[mk('Agency retainers','in',2,'9800','Client payments','weekly'),mk('Ecommerce settlement','in',4,'7400','Sales','weekly'),mk('Client invoice AC-208','in',14,'14300','Receivable'),mk('Project milestone','in',35,'21000','Client payments'),mk('Payroll','out',4,'9900','Payroll','weekly'),mk('Studio rent','out',7,'3900','Rent','monthly'),mk('Software stack','out',10,'1175','Operations','monthly'),mk('Sales tax reserve','out',30,'6800','Tax','monthly'),mk('Equipment purchase','out',45,'12500','Capital'),mk('Contractor invoice','out',18,'8200','Payable'),mk('Collected invoice','in',1,'4500','Receivable','none','4700'),mk('Paid shipping','out',1,'440','Operations','none','420')],scenarios:[],lastBackup:null};modal=null;save();render()}
function saveItem(form){let x=Object.fromEntries(new FormData(form)),amount=E.cents(x.amount),actual=x.actualAmount===''?null:E.cents(x.actualAmount),record={id:drawer.id||id(),title:x.title.trim(),direction:x.direction,date:x.date,amountCents:amount,category:x.category.trim(),counterparty:x.counterparty.trim(),recurrence:x.recurrence,actualCents:actual,actualDate:actual===null?'':x.actualDate||x.date,notes:x.notes.trim(),archived:false};if(!E.validateItem(record)){notice('Please check dates, amounts and recurrence. Actuals apply only to one-time records.');return}let i=db.items.findIndex(v=>v.id===record.id);if(i<0)db.items.push(record);else db.items[i]=record;drawer=null;save();render()}
function download(name,type,text){let url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backup(){db.lastBackup=new Date().toISOString();save();download('NexalyPlanner_CashFlow13_Backup_'+today()+'.json','application/json',JSON.stringify(db,null,2));notice(t('backupSaved'))}
function exportCsv(){let cell=x=>`"${String(x??'').replace(/"/g,'""')}"`,head=['title','direction','date','amount','category','counterparty','recurrence','actual_date','actual_amount','notes','archived'],rows=db.items.map(x=>[x.title,x.direction,x.date,(x.amountCents/100).toFixed(2),x.category,x.counterparty,x.recurrence,x.actualDate,x.actualCents==null?'':(x.actualCents/100).toFixed(2),x.notes,x.archived]);download('CashFlow13_Records_'+today()+'.csv','text/csv;charset=utf-8','\ufeff'+[head,...rows].map(row=>row.map(cell).join(',')).join('\r\n'))}
function parseCsv(text){let rows=[],r=[],s='',quote=false;for(let i=0;i<text.length;i++){let c=text[i];if(quote){if(c==='"'&&text[i+1]==='"'){s+='"';i++}else if(c==='"')quote=false;else s+=c}else if(c==='"')quote=true;else if(c===','){r.push(s);s=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;r.push(s);if(r.some(x=>x.trim()))rows.push(r);r=[];s=''}else s+=c}r.push(s);if(r.some(x=>x.trim()))rows.push(r);return rows}
function importPreview(text){let rows=parseCsv(text.replace(/^\ufeff/,'')),head=(rows.shift()||[]).map(x=>x.trim().toLowerCase()),valid=[],errors=[];rows.forEach((row,i)=>{let o=Object.fromEntries(head.map((h,j)=>[h,row[j]||''])),a=o.actual_amount?.trim()?E.cents(o.actual_amount):null,x={id:id(),title:o.title?.trim()||'',direction:o.direction,date:o.date,amountCents:E.cents(o.amount),category:o.category||'',counterparty:o.counterparty||'',recurrence:o.recurrence||'none',actualCents:a,actualDate:a===null?'':o.actual_date||o.date,notes:o.notes||'',archived:o.archived==='true'};E.validateItem(x)?valid.push(x):errors.push(`Row ${i+2}`)});return{valid,errors}}
function file(accept,fn){let input=document.createElement('input');input.type='file';input.accept=accept;input.onchange=async()=>{let f=input.files?.[0];if(!f)return;if(f.size>5e6)return notice('Maximum file size: 5 MB.');try{fn(await f.text())}catch{notice('Could not read file.')}};input.click()}
function confirmCurrency(code){if(code===db.currency)return true;if(!confirm(`Change from ${db.currency} to ${code}? Existing numbers are NOT converted. Continue only if records are already in ${code}.`))return false;db.currency=code;return true}
document.addEventListener('submit',e=>{let form=e.target;if(form.id==='item-form'){e.preventDefault();saveItem(form)}else if(form.id==='settings-form'){e.preventDefault();let x=Object.fromEntries(new FormData(form)),opening=E.cents(x.opening),threshold=E.cents(x.threshold);if(!E.parseDate(x.anchor)||opening===null||threshold===null||threshold<0)return notice('Check settings values.');if(!confirmCurrency(x.currency))return render();db.business=x.business.trim();db.anchor=E.monday(x.anchor);db.openingCents=opening;db.thresholdCents=threshold;db.language=x.language;db.theme=x.theme;save();render()}else if(form.id==='setup-form'){e.preventDefault();let x=Object.fromEntries(new FormData(form)),opening=E.cents(x.opening),threshold=E.cents(x.threshold);if(opening===null||threshold===null||threshold<0)return notice('Check opening amount and threshold.');db.business=x.business.trim()||'My Business';db.openingCents=opening;db.thresholdCents=threshold;db.setup=true;modal=null;save();render()}});
document.addEventListener('change',e=>{let k=e.target.dataset.change,v=e.target.value;if(k==='language'){db.language=v;save();render()}else if(k==='currency'){if(confirmCurrency(v))save();render()}else if(k==='currencySetup'){db.currency=v;save()}else if(k==='filter'){filter=v;render()}else if(e.target.dataset.scenario){scenario[e.target.dataset.scenario]=Number(v);render()}});
document.addEventListener('input',e=>{if(e.target.dataset.search!==undefined){let pos=e.target.selectionStart;search=e.target.value;render();let el=$('[data-search]');el?.focus();el?.setSelectionRange(pos,pos)}else if(e.target.dataset.scenario){let value=e.target.parentElement?.querySelector('label');if(value)value.lastChild.textContent=' · '+e.target.value+(e.target.dataset.scenario==='delayDays'?'':'%')}});
document.addEventListener('click',e=>{let el=e.target.closest('[data-action],[data-view],[data-week],[data-edit],[data-archive],[data-restore],[data-delete],[data-load-scenario],[data-delete-scenario]');if(!el)return;if(el.classList?.contains('drawer-backdrop')&&e.target!==el)return;let d=el.dataset;if(d.view){view=d.view;mobile=false;search='';render();scrollTo(0,0);return}if(d.week!==undefined){selected=Number(d.week);if(view==='alerts')view='forecast';render();return}if(d.edit){drawer={id:d.edit};render();return}if(d.archive){db.items.find(x=>x.id===d.archive).archived=true;save();render();notice(t('archive'));return}if(d.restore){db.items.find(x=>x.id===d.restore).archived=false;save();render();return}if(d.delete){modal={type:'confirm',title:'delete',message:t('resetWarning'),fn:()=>{db.items=db.items.filter(x=>x.id!==d.delete);save();render()}};render();return}if(d.loadScenario){let x=db.scenarios.find(z=>z.id===d.loadScenario);scenario={inflowPct:x.inflowPct,outflowPct:x.outflowPct,delayDays:x.delayDays};render();return}if(d.deleteScenario){modal={type:'confirm',title:'deleteSnapshot',message:t('resetWarning'),fn:()=>{db.scenarios=db.scenarios.filter(x=>x.id!==d.deleteScenario);save();render()}};render();return}switch(d.action){
case'mobile':mobile=!mobile;render();break;case'add':drawer={id:null};render();break;case'closeDrawer':drawer=null;render();break;case'closeModal':modal=null;pending=null;render();break;case'theme':db.theme=db.theme==='light'?'dark':'light';save();render();break;case'demo':demo();break;case'setupNext':modal.step=Math.min(2,modal.step+1);render();break;case'setupBack':modal.step=Math.max(0,modal.step-1);render();break;case'scenario':view='scenarios';render();break;case'saveScenario':{let name=prompt(t('newScenario'));if(!name?.trim())return;db.scenarios.push({id:id(),name:name.trim().slice(0,90),created:new Date().toISOString(),...scenario});save();render();break}case'backup':backup();break;case'exportCsv':exportCsv();break;
case'importCsv':file('.csv,text/csv',text=>{pending=importPreview(text);modal={type:'import'};render()});break;case'doImport':db.items.push(...pending.valid);pending=null;modal=null;save();render();notice(t('importFinished'));break;
case'restoreBackup':file('.json,application/json',text=>{let obj;try{obj=JSON.parse(text)}catch{return notice('Invalid JSON')}if(!validate(obj))return notice('Invalid or incompatible backup.');modal={type:'confirm',title:'restoreBackup',message:'This replaces the current workspace. Export a backup first.',fn:()=>{db={...blank(),...obj};save();render()}};render()});break;
case'reset':modal={type:'confirm',title:'confirmReset',message:t('resetWarning'),fn:()=>{let keep={language:db.language,currency:db.currency,theme:db.theme};db={...blank(),...keep,setup:true};save();render()}};render();break;case'doConfirm':{let fn=modal.fn;modal=null;fn();break}case'roll':{let next=E.monday(today());if(next===db.anchor)return notice(t('roll'));let raw=prompt(t('rollHint')+' ('+next+' · '+db.currency+')',(db.openingCents/100).toFixed(2));if(raw===null)return;let c=E.cents(raw);if(c===null)return notice(t('expectedAmount'));db.anchor=next;db.openingCents=c;selected=0;save();render();break}case'print':window.print();break;case'guide':modal={type:'guide'};render();break;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(drawer||modal)){drawer=null;modal=null;render()}if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();$('[data-search]')?.focus()}});
if(!db.setup)modal={type:'setup',step:0};render();
})();
</script></body></html>
