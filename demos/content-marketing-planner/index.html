<!DOCTYPE html>
<html lang="en">
<head><meta name="robots" content="noindex,nofollow,noarchive"><link rel="canonical" href="https://nexalyplanner.com/planners/content-marketing-planner/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content & Marketing Planner</title>
<style>
:root{
  /* Notion design language */
  --canvas:#f6f5f4; --surface:#ffffff; --hairline:#e6e6e6;
  --ink:#111111; --ink-2:#31302e; --ink-muted:#615d59; --ink-faint:#a39e98;
  --primary:#0075de; --primary-active:#005bab; --on-primary:#ffffff;
  --night:#213183;
  --sticker-sky:#62aef0; --sticker-purple:#d6b6f6; --sticker-pink:#ff64c8;
  --sticker-orange:#dd5b00; --sticker-teal:#2a9d99; --sticker-green:#1aae39;
  --r-xs:4px; --r-sm:5px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-full:9999px;
  --s-xs:8px; --s-sm:12px; --s-md:16px; --s-lg:24px; --s-xl:32px;
  --sh-1:0 .175px 1px rgba(0,0,0,.01), 0 .8px 2.9px rgba(0,0,0,.02), 0 2px 7.8px rgba(0,0,0,.027), 0 4px 18px rgba(0,0,0,.04);
  --sh-2:0 4px 12px rgba(0,0,0,.06), 0 23px 52px rgba(0,0,0,.05);
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
[data-theme="dark"]{
  --canvas:#161619; --surface:#212127; --hairline:#33333c;
  --ink:#f1f1f4; --ink-2:#cfcfd6; --ink-muted:#9b9ba4; --ink-faint:#6c6c78;
  --sh-1:0 1px 2px rgba(0,0,0,.32), 0 6px 20px rgba(0,0,0,.42);
  --sh-2:0 10px 28px rgba(0,0,0,.5), 0 28px 64px rgba(0,0,0,.55);
}
.icon-btn{width:38px;height:38px;border-radius:var(--r-md);border:1px solid var(--hairline);background:var(--surface);color:var(--ink-2);display:inline-grid;place-items:center;font-size:16px;flex-shrink:0}
.icon-btn:hover{background:var(--canvas)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--canvas);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
[dir="rtl"]{direction:rtl}
h1,h2,h3{font-weight:700;letter-spacing:-.02em}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:15px}
a{color:var(--primary);text-decoration:none}
.hidden{display:none!important}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:500;border-radius:var(--r-full);padding:9px 18px;transition:transform .08s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-active)}
.btn-utility{background:var(--surface);color:var(--ink);border:1px solid var(--hairline);border-radius:var(--r-md);padding:7px 14px}
.btn-utility:hover{background:var(--canvas)}
.btn-ghost{color:var(--ink-muted);border-radius:var(--r-md);padding:7px 12px}
.btn-ghost:hover{background:var(--canvas);color:var(--ink)}
.btn-danger{color:#c0392b;border-radius:var(--r-md);padding:7px 12px}
.btn-danger:hover{background:#fdeceb}
.btn-sm{padding:5px 12px;font-size:14px}

/* Layout */
.shell{display:flex;min-height:100vh}
.sidebar{width:248px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--hairline);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:40}
[dir="rtl"] .sidebar{left:auto;right:0;border-right:none;border-left:1px solid var(--hairline)}
.brand-fixed{display:flex;align-items:center;gap:7px;padding:16px 18px 2px;font-weight:800;font-size:17px;letter-spacing:-.02em;color:var(--ink)}
.brand-dot{width:7px;height:7px;border-radius:50%;background:var(--primary);display:inline-block}
.brand{display:flex;align-items:center;gap:10px;padding:8px 18px 14px}
.brand .logo{width:34px;height:34px;border-radius:var(--r-md);background:var(--canvas);display:grid;place-items:center;font-size:19px;overflow:hidden;flex-shrink:0}
.brand .logo img{width:100%;height:100%;object-fit:cover}
.brand .bname{font-weight:700;font-size:16px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .btag{font-size:12px;color:var(--ink-faint)}
.nav{flex:1;overflow-y:auto;padding:6px 10px}
.nav-label{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:8px 10px;border-radius:var(--r-md);color:var(--ink-2);font-size:15px;font-weight:450}
.nav-item:hover{background:var(--canvas)}
.nav-item.active{background:color-mix(in srgb,var(--primary) 12%,var(--surface));color:var(--primary);font-weight:500}
.nav-item .ic{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.nav-item .soon{margin-inline-start:auto;font-size:10px;color:var(--ink-faint);background:var(--canvas);padding:1px 6px;border-radius:var(--r-full)}
.side-foot{border-top:1px solid var(--hairline);padding:8px 10px}
.main{flex:1;margin-inline-start:248px;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--canvas) 82%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;gap:12px;padding:14px 28px;flex-wrap:wrap}
.topbar h1{font-size:22px}
.topbar .sub{color:var(--ink-muted);font-size:14px}
.topbar .spacer{flex:1}
.menu-btn{display:none}
.content{padding:24px 28px 64px;max-width:1160px;width:100%}

/* Cards */
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:var(--s-lg)}
.card.soft{box-shadow:var(--sh-1)}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.kpi .n{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.kpi .l{font-size:13px;color:var(--ink-muted);margin-top:4px}
.kpi .sub{font-size:12px;color:var(--ink-faint);margin-top:2px}
.section-title{font-size:14px;font-weight:600;color:var(--ink-2);margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--primary);background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-full);padding:3px 10px;display:inline-block}

/* Table */
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);overflow:hidden}
.tbl th{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);text-align:start;padding:11px 14px;border-bottom:1px solid var(--hairline);background:var(--canvas)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--hairline);font-size:14px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:color-mix(in srgb,var(--canvas) 60%,var(--surface))}
.tbl .row-click{cursor:pointer}

/* Pills / badges */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:var(--r-full);background:var(--canvas);color:var(--ink-2);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.pill-list{display:flex;flex-wrap:wrap;gap:5px}

/* Empty */
.empty{text-align:center;padding:48px 24px;color:var(--ink-muted)}
.empty .big{font-size:30px;margin-bottom:8px}
.empty h3{font-weight:600;margin-bottom:6px;color:var(--ink)}

/* Inputs */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:5px}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-xs);padding:8px 10px;color:var(--ink)}
.input:focus,textarea.input:focus,select.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 15%,transparent)}
textarea.input{resize:vertical;min-height:64px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk-wrap{display:flex;flex-wrap:wrap;gap:8px}
.chk-tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hairline);border-radius:var(--r-full);padding:5px 11px;font-size:13px;cursor:pointer;user-select:none}
.chk-tag.on{background:color-mix(in srgb,var(--primary) 12%,var(--surface));border-color:var(--primary);color:var(--primary)}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(15,15,15,.42);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--sh-2);width:100%;max-width:560px;margin:auto}
.modal-head{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--hairline)}
.modal-head h2{font-size:18px}
.modal-head .x{margin-inline-start:auto;font-size:22px;color:var(--ink-faint);line-height:1;padding:2px 6px;border-radius:var(--r-md)}
.modal-head .x:hover{background:var(--canvas);color:var(--ink)}
.modal-body{padding:20px 22px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--hairline)}

/* Feed preview */
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.feed .cell{aspect-ratio:4/5;border-radius:var(--r-md);border:1px solid var(--hairline);background:var(--canvas);padding:8px;font-size:11px;color:var(--ink-2);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;cursor:pointer}
.feed .cell:hover{box-shadow:var(--sh-1)}
.feed .cell .hk{font-weight:600;line-height:1.3;overflow:hidden}

/* checklist */
.chklist{list-style:none}
.chklist li{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px dashed var(--hairline);font-size:14px}
.chklist li:last-child{border-bottom:none}
.chklist input{margin-top:3px}
.chk-phase{font-size:12px;font-weight:600;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.03em;margin:14px 0 4px}
.done-txt{text-decoration:line-through;color:var(--ink-faint)}

/* bars */
.bars{display:flex;align-items:flex-end;gap:12px;height:180px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.bar{width:100%;max-width:52px;background:var(--primary);border-radius:6px 6px 0 0;min-height:3px;transition:height .4s}
.bar-lbl{font-size:11px;color:var(--ink-muted);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.bar-val{font-size:12px;font-weight:600}

/* Login */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(120% 60% at 50% -12%, color-mix(in srgb,var(--primary) 13%,var(--canvas)), var(--canvas) 62%)}
.auth .box{background:var(--surface);border:1px solid var(--hairline);border-top:3px solid var(--primary);border-radius:var(--r-xl);box-shadow:var(--sh-2);width:100%;max-width:400px;padding:36px 30px;text-align:center}
.auth .logo{width:56px;height:56px;border-radius:var(--r-lg);background:var(--canvas);display:grid;place-items:center;font-size:30px;margin:0 auto 16px;overflow:hidden;box-shadow:0 0 0 5px color-mix(in srgb,var(--primary) 10%,transparent)}
.auth .logo img{width:100%;height:100%;object-fit:cover}
.auth h1{font-size:26px;margin-bottom:6px;letter-spacing:-.03em}
.auth p{color:var(--ink-muted);font-size:14px;margin-bottom:20px}
.auth .btn{width:100%;justify-content:center;margin-top:6px}
.auth .skip{margin-top:14px;font-size:13px}
.err{color:#c0392b;font-size:13px;margin-top:8px;min-height:18px}

.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:var(--r-full);border:2px solid transparent;cursor:pointer}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}

.hint{font-size:12px;color:var(--ink-faint);margin-top:4px}
.callout{background:color-mix(in srgb,var(--primary) 7%,var(--surface));border:1px solid color-mix(in srgb,var(--primary) 20%,var(--surface));border-radius:var(--r-lg);padding:14px 16px;font-size:14px;color:var(--ink-2);display:flex;gap:10px;align-items:flex-start;margin-bottom:18px}

.kpi-ic{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--primary) 14%,var(--surface));display:grid;place-items:center;font-size:22px;margin-bottom:14px}
.dash-charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.chart-h{font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:14px}
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut-legend{display:flex;flex-direction:column;gap:9px;font-size:13px;color:var(--ink-2);min-width:150px;flex:1}
.donut-legend .leg{display:flex;align-items:center;gap:8px}
.donut-legend .leg b{margin-inline-start:auto;color:var(--ink)}
.pipeline{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px}
.pipe-seg{min-width:6px}
.pipe-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:11px;font-size:12px;color:var(--ink-muted)}
.pipe-legend span{display:flex;align-items:center;gap:6px}
.bio-prev{display:flex;flex-direction:column;gap:8px}
.bio-link{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-full);padding:10px 14px;text-align:center;font-size:14px;font-weight:500;color:var(--ink)}
.prompt-card{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:10px}
.prompt-txt{font-size:14px;color:var(--ink-2);flex:1;line-height:1.5}
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{margin-bottom:6px}
.cal-dowc{font-size:12px;font-weight:600;color:var(--ink-muted);text-align:center;padding:4px}
.cal-cell{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-md);min-height:100px;padding:6px;overflow:hidden}
.cal-cell.empty{background:transparent;border:none}
.cal-cell.cal-today{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary) inset}
.cal-d{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.cal-ev{font-size:11px;color:#fff;border-radius:4px;padding:2px 6px;margin-bottom:3px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-more{font-size:11px;color:var(--ink-muted)}
.topbar h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.lang-mini{height:38px;border:1px solid var(--hairline);background:var(--surface);color:var(--ink-2);border-radius:var(--r-md);padding:0 10px;font-size:13px;font-weight:600;cursor:pointer;margin-inline-end:8px}
.bcontact{font-size:11px;color:var(--ink-faint);margin-top:3px;line-height:1.35}
@media(max-width:820px){.cal-cell{min-height:64px;padding:3px}.cal-ev{font-size:9px;padding:1px 3px}.cal-dowc{font-size:10px}}

@media(max-width:820px){.dash-charts{grid-template-columns:1fr}}
@media(max-width:820px){
  .sidebar{transform:translateX(-100%);transition:transform .2s;box-shadow:var(--sh-2)}
  [dir="rtl"] .sidebar{transform:translateX(100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-inline-start:0}
  .menu-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:var(--r-md);border:1px solid var(--hairline);background:var(--surface)}
  .content{padding:18px 16px 64px}
  .topbar{padding:12px 16px}
  .row2{grid-template-columns:1fr}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:39}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
#printArea{display:none}
@media print{
  #root{display:none!important}
  #printArea{display:block!important}
  body{background:#fff}
  .p-tbl{width:100%;border-collapse:collapse;margin-bottom:14px}
  .p-tbl th,.p-tbl td{border:1px solid #bbb;padding:5px 8px;font-size:12px;text-align:left}
  .p-tbl th{background:#f0f0f0}
  .p-h1{font-size:22px;margin-bottom:2px}
  .p-sub{color:#555;margin-bottom:14px;font-size:12px}
  .p-sec{font-size:14px;font-weight:700;margin:16px 0 8px;border-bottom:2px solid #000;padding-bottom:3px}
  .p-chk{font-size:12px;margin:2px 0}
}
</style>

/* ---------------- helpers ---------------- */
function applyTheme(){document.documentElement.style.setProperty('--primary',state.settings.accent);
  document.documentElement.setAttribute('data-theme',state.settings.theme==='dark'?'dark':'light');
  const a=state.settings.accent;document.documentElement.style.setProperty('--primary-active',shade(a,-18));
  document.documentElement.dir=RTL.includes(state.settings.lang)?"rtl":"ltr";
  document.documentElement.lang=state.settings.lang;}
function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=(n>>16)+p*2.55,g=((n>>8)&255)+p*2.55,b=(n&255)+p*2.55;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return"#"+((1<<24)+(Math.round(r)<<16)+(Math.round(g)<<8)+Math.round(b)).toString(16).slice(1)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function todayISO(){return new Date().toISOString().slice(0,10)}
function inThisMonth(d){if(!d)return false;const n=new Date();const x=new Date(d);return x.getFullYear()===n.getFullYear()&&x.getMonth()===n.getMonth()}
function inNext7(d){if(!d)return false;const n=new Date();n.setHours(0,0,0,0);const x=new Date(d);const diff=(x-n)/86400000;return diff>=0&&diff<7}
function eng(p){const r=Number(p.reach)||0;if(!r)return null;return ((Number(p.likes||0)+Number(p.comments||0)+Number(p.saves||0)+Number(p.shares||0))/r*100)}
function campaignSales(id){const ps=state.posts.filter(p=>p.campaignId===id).reduce((s,p)=>s+(Number(p.sales)||0),0);const es=(state.emails||[]).filter(e=>e.campaignId===id).reduce((s,e)=>s+(Number(e.sales)||0),0);const ms=(state.sms||[]).filter(e=>e.campaignId===id).reduce((s,e)=>s+(Number(e.sales)||0),0);return ps+es+ms}
function productName(id){const p=state.products.find(x=>x.id===id);return p?p.name:""}
function campaignName(id){const c=state.campaigns.find(x=>x.id===id);return c?c.name:""}

}

/* ---------------- views ---------------- */
function vDashboard(){
  const mPosts=state.posts.filter(p=>inThisMonth(p.date));
  const engVals=state.posts.map(eng).filter(v=>v!=null);
  const avgE=engVals.length?(engVals.reduce((a,b)=>a+b,0)/engVals.length):null;
  const mSales=mPosts.reduce((s,p)=>s+(Number(p.sales)||0),0);
  const week=state.posts.filter(p=>inNext7(p.date)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const up=state.campaigns.filter(c=>c.status!=='Wrapped').sort((a,b)=>(a.start||'').localeCompare(b.start||''));
  let out='';

  if(!state.onboarded){out+=`<div class="card soft" style="margin-bottom:20px;border-color:color-mix(in srgb,var(--primary) 28%,var(--surface))">
    <div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap">
      <div style="font-size:30px;line-height:1">👋</div>

        <h2 style="font-size:20px;margin-bottom:6px">Welcome to your Content &amp; Marketing Planner</h2>
        <p style="color:var(--ink-muted);font-size:14px;margin-bottom:14px">Plan content that sells your products — posts, drops, email and UGC in one place. New here? Load an example to see it in action, or start fresh.</p>
        <div class="chk-wrap" style="margin-bottom:16px">
          <button class="btn btn-primary btn-sm" onclick="loadExample()">✨ Load example data</button>
          <button class="btn btn-utility btn-sm" onclick="dismissOnboard()">Start fresh</button>
        </div>
        <div style="font-size:13px;color:var(--ink-2)"><b>5-minute quick start</b>
          <ol style="margin:8px 0 0;padding-inline-start:20px;line-height:1.9">
            <li>Set your brand, colour &amp; currency in <a href="#" onclick="go('settings');return false">Settings</a></li>
            <li>Add a few <a href="#" onclick="go('products');return false">Products</a></li>
            <li>Grab ideas from the <a href="#" onclick="go('ideas');return false">Idea Bank</a> (60 ready)</li>
            <li>Schedule posts in <a href="#" onclick="go('content');return false">Content Hub</a></li>
            <li>Plan a launch in <a href="#" onclick="go('drops');return false">Drops</a> &amp; log the sales</li>
          </ol>
        </div>
      </div>
    </div>
  </div>`}
  out+=`<div class="grid kpis">
    ${kpi(mPosts.length,t('postsMonth'),week.length+' due in 7 days','📝')}
    ${kpi(avgE==null?'—':avgE.toFixed(1)+'%',t('avgEng'),engVals.length+' posts measured','📈')}
    ${kpi(money(mSales),t('salesMonth'),'logged via drop codes','💰')}
  </div>`;
  if(state.posts.length){
    const pillarData=PILLARS.map(pl=>({label:pl,val:state.posts.filter(x=>x.pillar===pl).length,color:PILLAR_COLOR[pl]})).filter(d=>d.val>0);
    const trend=salesTrend();
    out+=`<div class="dash-charts">
      <div class="card soft"><div class="chart-h">${t('contentMix')}</div><div class="donut-wrap">${donutSVG(pillarData)}<div class="donut-legend">${pillarData.map(d=>`<div class="leg"><span class="dot" style="background:${d.color}"></span>${esc(d.label)}<b>${d.val}</b></div>`).join('')}</div></div></div>
      <div class="card soft"><div class="chart-h">Sales trend · last 6 weeks</div>${barsInner(trend,v=>money(v))}</div>
    </div>`;
    const statusData=STATUSES.map(st=>({label:st,val:state.posts.filter(pp=>(pp.status||'Idea')===st).length,color:STATUS_COLOR[st]})).filter(d=>d.val>0);
    if(statusData.length)out+=`<div class="card soft" style="margin-top:16px"><div class="chart-h">Content pipeline</div><div class="pipeline">${statusData.map(d=>`<div class="pipe-seg" style="flex:${d.val};background:${d.color}"></div>`).join('')}</div><div class="pipe-legend">${statusData.map(d=>`<span><span class="dot" style="background:${d.color}"></span>${esc(d.label)} ${d.val}</span>`).join('')}</div></div>`;
  }
  out+=`<div class="section-title">🗓 ${t('thisWeek')}</div>`;
  out+= week.length?tblPosts(week):emptyCard('🗓',t('empty_posts'),`<button class="btn btn-utility btn-sm" onclick="openPost()">＋ ${t('addPost')}</button>`);

  else out+=emptyCard('🚀',t('empty_drops'),`<button class="btn btn-utility btn-sm" onclick="openDrop()">＋ ${t('addDrop')}</button>`);

function kpi(n,l,sub,icon){return `<div class="card soft kpi">${icon?`<div class="kpi-ic">${icon}</div>`:''}<div class="n">${n}</div><div class="l">${l}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`}
function emptyCard(icon,txt,action){return `<div class="card"><div class="empty"><div class="big">${icon}</div><p>${txt}</p><div style="margin-top:14px">${action||''}</div></div></div>`}

function tblPosts(list){
  return `<table class="tbl"><thead><tr><th>${t('title')}</th><th>${t('pillar')}</th><th>${t('platform')}</th><th>${t('status')}</th><th>${t('date')}</th></tr></thead><tbody>`+
  list.map(p=>`<tr class="row-click" onclick="openPost('${p.id}')">
    <td><b>${esc(p.title||'Untitled')}</b>${p.shoppable?' 🛒':''}</td>
    <td>${p.pillar?`<span class="pill"><span class="dot" style="background:${PILLAR_COLOR[p.pillar]}"></span>${esc(p.pillar)}</span>`:'—'}</td>
    <td class="pill-list">${(p.platform||[]).map(pl=>`<span class="pill">${esc(pl)}</span>`).join('')||'—'}</td>

}

    </div>`;

function vSales(){
  const postSales=state.posts.reduce((s,p)=>s+(Number(p.sales)||0),0);
  const emailSales=(state.emails||[]).reduce((s,e)=>s+(Number(e.sales)||0),0);
  const smsSales=(state.sms||[]).reduce((s,e)=>s+(Number(e.sales)||0),0);
  const total=postSales+emailSales+smsSales;
  if(!total){return emptyCard('💰','Log a sales figure on a post, email or SMS (via its drop code) and it rolls up here.',`<button class="btn btn-utility btn-sm" onclick="go('content')">${t('content')}</button>`)}
  let out=`<div class="grid kpis">${kpi(money(total),t('totalSales'),null,'💰')}${kpi(money(postSales),'From posts',null,'📱')}${kpi(money(emailSales+smsSales),'From email & SMS',null,'✉️')}</div>`;
  const chan=[{label:'Social',val:postSales,color:'var(--sticker-sky)'},{label:'Email',val:emailSales,color:'var(--sticker-purple)'},{label:'SMS',val:smsSales,color:'var(--sticker-teal)'}].filter(d=>d.val>0);
  const byDrop=state.campaigns.map(c=>({label:c.name,val:campaignSales(c.id)})).filter(r=>r.val>0).sort((a,b)=>b.val-a.val).slice(0,7);
  out+=`<div class="dash-charts">
    <div class="card soft"><div class="chart-h">By channel</div><div class="donut-wrap">${donutSVG(chan,money(total),'total')}<div class="donut-legend">${chan.map(d=>`<div class="leg"><span class="dot" style="background:${d.color}"></span>${d.label}<b>${money(d.val)}</b></div>`).join('')}</div></div></div>
    <div class="card soft"><div class="chart-h">${t('bySrc')}</div>${byDrop.length?barsInner(byDrop,v=>money(v)):'<div class="empty" style="padding:20px">Link posts to drops to see this.</div>'}</div>
  </div>`;
  out+=`<div class="card soft" style="margin-top:16px"><div class="chart-h">Sales trend · last 6 weeks</div>${barsInner(salesTrend(),v=>money(v))}</div>`;
  const withSales=state.posts.filter(p=>Number(p.sales)>0).sort((a,b)=>(Number(b.sales)||0)-(Number(a.sales)||0));
  if(withSales.length)out+=`<div class="section-title">Posts by revenue</div><table class="tbl"><thead><tr><th>${t('title')}</th><th>${t('drops')}</th><th>${t('attributed')}</th></tr></thead><tbody>`+
    withSales.map(p=>`<tr class="row-click" onclick="openPost('${p.id}')"><td><b>${esc(p.title||'Untitled')}</b></td><td>${esc(campaignName(p.campaignId)||'—')}</td><td><b>${money(p.sales)}</b></td></tr>`).join('')+`</tbody></table>`;
  return out;
}

/* ---------------- modal + toast ---------------- */
function modal(title,body,onSave,onDelete){
  const el=document.createElement('div');el.className='overlay';el.id='overlay';
  el.onclick=(e)=>{if(e.target===el)closeModal()};
  el.innerHTML=`<div class="modal"><div class="modal-head"><h2>${esc(title)}</h2><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot">${onDelete?`<button class="btn btn-danger" style="margin-inline-end:auto" onclick="${onDelete}">${t('delete')}</button>`:''}
      <button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>
      <button class="btn btn-primary" onclick="${onSave}">${t('save')}</button></div></div>`;
  document.body.appendChild(el);
}
window.closeModal=function(){const o=document.getElementById('overlay');if(o)o.remove()};
function toast(msg){const el=document.createElement('div');el.textContent=msg;el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2b2b30;color:#fff;padding:10px 18px;border-radius:var(--r-full);font-size:14px;z-index:80;box-shadow:var(--sh-2)';document.body.appendChild(el);setTimeout(()=>el.remove(),1800)}

/* ---------------- Analytics ---------------- */
function barsInner(data,fmt){if(!data.length)return `<div class="empty" style="padding:20px">No data yet.</div>`;const max=Math.max(...data.map(d=>d.val),1);return `<div class="bars">`+data.map(d=>`<div class="bar-col"><div class="bar-val">${fmt?fmt(d.val):d.val}</div><div class="bar" style="height:${Math.max(3,d.val/max*140)}px;background:${d.color||'var(--primary)'}"></div><div class="bar-lbl">${esc(d.label)}</div></div>`).join('')+`</div>`}
function donutSVG(data,big,small){const total=data.reduce((s,d)=>s+d.val,0)||1;let cum=0;const segs=data.map(d=>{const pct=d.val/total*100;const el=`<circle cx="21" cy="21" r="15.915" fill="none" stroke="${d.color}" stroke-width="5.5" stroke-dasharray="${pct.toFixed(2)} ${(100-pct).toFixed(2)}" stroke-dashoffset="${(25-cum).toFixed(2)}"/>`;cum+=pct;return el}).join('');const B=big!=null?big:total;const S=small!=null?small:'posts';const fs=((''+B).length>4?4.6:7);return `<svg viewBox="0 0 42 42" style="width:158px;height:158px;flex-shrink:0"><circle cx="21" cy="21" r="15.915" fill="none" stroke="var(--hairline)" stroke-width="5.5"/>${segs}<text x="21" y="20.5" text-anchor="middle" font-size="${fs}" font-weight="700" fill="var(--ink)">${B}</text><text x="21" y="26" text-anchor="middle" font-size="3.4" fill="var(--ink-muted)">${S}</text></svg>;`.replace(/;$/,'');}
function salesTrend(){const now=new Date();now.setHours(0,0,0,0);const out=[];for(let i=5;i>=0;i--){const start=new Date(now);start.setDate(start.getDate()-now.getDay()-i*7);const end=new Date(start);end.setDate(end.getDate()+7);const inW=d=>{if(!d)return false;const x=new Date(d);return x>=start&&x<end};let v=state.posts.filter(pp=>inW(pp.date)).reduce((a,pp)=>a+(Number(pp.sales)||0),0);v+=(state.emails||[]).filter(e=>inW(e.sendDate)).reduce((a,e)=>a+(Number(e.sales)||0),0);out.push({label:(start.getMonth()+1)+'/'+start.getDate(),val:v})}return out;}
function barChart(data,fmt){if(!data.length)return `<div class="card"><div class="empty" style="padding:24px">No data yet.</div></div>`;return `<div class="card soft">`+barsInner(data,fmt)+`</div>`}
function vAnalytics(){
  if(!state.posts.length)return emptyCard('📊',t('empty_analytics'),`<button class="btn btn-utility btn-sm" onclick="go('content')">${t('content')}</button>`);
  const engVals=state.posts.map(eng).filter(v=>v!=null);
  const avgE=engVals.length?(engVals.reduce((a,b)=>a+b,0)/engVals.length):0;
  const totalReach=state.posts.reduce((s,p)=>s+(Number(p.reach)||0),0);
  const byPillar=PILLARS.map(p=>({label:p,val:state.posts.filter(x=>x.pillar===p).length,color:PILLAR_COLOR[p]})).filter(d=>d.val>0);
  const engBy=PILLARS.map(p=>{const arr=state.posts.filter(x=>x.pillar===p).map(eng).filter(v=>v!=null);const avg=arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;return {label:p,val:Math.round(avg*10)/10,color:PILLAR_COLOR[p]}}).filter(d=>d.val>0);
  const platCount={};state.posts.forEach(p=>(p.platform||[]).forEach(pl=>platCount[pl]=(platCount[pl]||0)+1));
  const byPlat=Object.keys(platCount).map(k=>({label:k,val:platCount[k]}));
  const top=state.posts.map(p=>({p,e:eng(p)})).filter(x=>x.e!=null).sort((a,b)=>b.e-a.e).slice(0,8);
  let out=`<div class="grid kpis">${kpi(state.posts.length,'Total posts',null,'📝')}${kpi(avgE.toFixed(1)+'%','Avg engagement',null,'📈')}${kpi(totalReach.toLocaleString(),'Total reach',null,'👁️')}</div>`;
  out+=`<div class="dash-charts">
    <div class="card soft"><div class="chart-h">${t('contentMix')}</div><div class="donut-wrap">${donutSVG(byPillar)}<div class="donut-legend">${byPillar.map(d=>`<div class="leg"><span class="dot" style="background:${d.color}"></span>${esc(d.label)}<b>${d.val}</b></div>`).join('')}</div></div></div>
    <div class="card soft"><div class="chart-h">${t('engByPillar')} (%)</div>${barsInner(engBy,v=>v+'%')}</div>
  </div>`;
  out+=`<div class="card soft" style="margin-top:16px"><div class="chart-h">${t('byPlatform')}</div>${barsInner(byPlat)}</div>`;
  if(top.length)out+=`<div class="section-title">⭐ ${t('topPosts')}</div><table class="tbl"><thead><tr><th>${t('title')}</th><th>${t('pillar')}</th><th>Reach</th><th>Engagement</th></tr></thead><tbody>`+top.map(x=>`<tr class="row-click" onclick="openPost('${x.p.id}')"><td><b>${esc(x.p.title||'Untitled')}</b></td><td>${esc(x.p.pillar||'—')}</td><td>${x.p.reach||'—'}</td><td><b>${x.e.toFixed(1)}%</b></td></tr>`).join('')+`</tbody></table>`;
  return out;
}

/* AI caption prompts */
const AI_PROMPTS=[
 {cat:"Captions",items:["Write 3 Instagram captions for a [product] in a [tone] voice, each with a hook and a clear CTA to shop.","Turn these product features into a benefit-led caption for a fashion brand: [features].","Write a short, punchy caption for a new-arrival [product] that creates urgency."]},
 {cat:"Hooks",items:["Give me 10 scroll-stopping first lines for a Reel about styling a [product].","Write 5 hooks for a get-ready-with-me video featuring [collection].","Suggest 5 curiosity-gap hooks for a product-drop teaser."]},
 {cat:"Content ideas",items:["Give me 10 content ideas for a [niche] clothing brand this month, mixing product, styling, BTS and UGC.","Suggest 5 short-video concepts to show 3 ways to style one [product].","Plan a 5-post launch sequence for a new [collection] drop."]},
 {cat:"Hashtags & SEO",items:["Give me 15 relevant hashtags for a [product] targeting [audience], mixing broad and niche.","Suggest 8 searchable keywords my customers might type on TikTok or Instagram to find [product].","Write an SEO-friendly caption for [product] that answers a high-intent question."]}
];
function vPrompts(){
  let out=`<div class="callout"><span>\ud83e\udd16</span><div>Copy a prompt, replace the [brackets], and paste it into your favourite AI tool. Save your own below.</div></div>`;
  AI_PROMPTS.forEach(g=>{out+=`<div class="section-title">${esc(g.cat)}</div>`+g.items.map(pr=>`<div class="prompt-card"><div class="prompt-txt">${esc(pr)}</div><button class="btn btn-utility btn-sm" onclick="copyText(this)">${t('copy')}</button></div>`).join('')});
  out+=`<div class="section-title">${t('myPrompts')}</div>`;
  if(state.prompts.length)out+=state.prompts.map(pr=>`<div class="prompt-card"><div class="prompt-txt">${esc(pr.text)}</div><div style="display:flex;gap:6px"><button class="btn btn-utility btn-sm" onclick="copyText(this)">${t('copy')}</button><button class="btn btn-danger btn-sm" onclick="delPrompt('${pr.id}')">${t('delete')}</button></div></div>`).join('');
  out+=`<button class="btn btn-utility btn-sm" style="margin-top:8px" onclick="openPrompt()">\uff0b ${t('addPrompt')}</button>`;
  return out;
}
window.openPrompt=function(){modal(t('addPrompt'),`<div class="field"><label>Prompt</label><textarea class="input" id="pr-txt" placeholder="Write a caption that..."></textarea></div>`,`savePrompt()`);};
window.savePrompt=function(){const v=document.getElementById('pr-txt').value.trim();if(v){state.prompts.unshift({id:uid(),text:v});persist()}closeModal();render()};
window.delPrompt=function(id){state.prompts=state.prompts.filter(x=>x.id!==id);persist();render()};

/* ---------------- Calendar + custom Ideas/Key Dates ---------------- */
function vCalendar(){
  const y=calDate.getFullYear(),m=calDate.getMonth();
  const first=new Date(y,m,1),startDay=first.getDay(),days=new Date(y,m+1,0).getDate();
  const monthName=first.toLocaleString('en-US',{month:'long',year:'numeric'});
  const dow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];const todayIso=todayISO();
  let cells='';for(let i=0;i<startDay;i++)cells+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=days;d++){const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const posts=state.posts.filter(p=>p.date===iso);
    cells+=`<div class="cal-cell${iso===todayIso?' cal-today':''}"><div class="cal-d">${d}</div>${posts.slice(0,3).map(p=>`<div class="cal-ev" style="background:${PILLAR_COLOR[p.pillar]||'var(--primary)'}" onclick="openPost('${p.id}')" title="${esc(p.title||'')}">${esc((p.title||'Post').slice(0,20))}</div>`).join('')}${posts.length>3?`<div class="cal-more">+${posts.length-3} more</div>`:''}</div>`;}
  return `<div class="cal-head"><button class="icon-btn" onclick="calNav(-1)">‹</button><b style="font-size:18px;min-width:170px;text-align:center">${monthName}</b><button class="icon-btn" onclick="calNav(1)">›</button><button class="btn btn-utility btn-sm" onclick="calToday()">Today</button><button class="btn btn-primary btn-sm" style="margin-inline-start:auto" onclick="openPost()">＋ ${t('addPost')}</button></div>
  <div class="cal-grid cal-dow">${dow.map(d=>`<div class="cal-dowc">${d}</div>`).join('')}</div>
  <div class="cal-grid">${cells}</div>`;
}
window.calNav=function(d){calDate=new Date(calDate.getFullYear(),calDate.getMonth()+d,1);render()};
window.calToday=function(){calDate=new Date();render()};
