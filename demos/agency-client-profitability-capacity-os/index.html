</script><script>(()=>{'use strict';
const E=window.AgencyEngine,KEY='nexaly_agency_portfolio_v1',LANGS={en:'English',ar:'العربية',es:'Español',nl:'Nederlands',fr:'Français',pt:'Português',it:'Italiano'},LOCALE={en:'en-US',ar:'ar-SA',es:'es-ES',nl:'nl-NL',fr:'fr-FR',pt:'pt-PT',it:'it-IT'},CURRENCIES=['USD','GBP','EUR','CAD','AUD','NZD','CHF','NOK','SEK','DKK','PLN','AED','SAR','QAR','JPY','CNY','HKD','SGD','INR','PKR','ZAR','MXN','BRL','TRY','KRW','THB','MYR','IDR','PHP','EGP'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>crypto.randomUUID?.()||Math.random().toString(36).slice(2),today=()=>new Date().toISOString().slice(0,10),monthNow=()=>today().slice(0,7),dateValid=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')&&Number.isFinite(new Date(s+'T00:00:00Z').getTime())&&new Date(s+'T00:00:00Z').toISOString().slice(0,10)===s;
const fresh=()=>({schema:1,setup:false,lang:'en',currency:'USD',theme:'light',business:'My Agency',profile:{billablePct:75,marginThreshold:25},clients:[],team:[],projects:[],time:[],costs:[],services:[],scenarios:[],activity:[],lastBackup:null});
let db;try{let x=JSON.parse(localStorage.getItem(KEY));db=E.valid(x)&&CURRENCIES.includes(x.currency)?{...fresh(),...x}:fresh()}catch{db=fresh()}
let view='overview',modal=db.setup?null:{type:'setup',step:0},drawer=null,month=monthNow(),selected=null,search='',mobile=false,collapsed=false,importData=null,renewPct=12,renewHours=0,forecast={newRevenue:8000,newHours:60,hireHours:0,hireCost:0};
const t=k=>T[db.lang]?.[k]||T.en[k]||k,money=v=>new Intl.NumberFormat(LOCALE[db.lang],{style:'currency',currency:db.currency,maximumFractionDigits:['JPY','KRW'].includes(db.currency)?0:2}).format((v||0)/100),pct=n=>n==null?'—':n.toFixed(1)+'%',date=s=>s?new Intl.DateTimeFormat(LOCALE[db.lang],{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'}).format(new Date(s+'T00:00:00Z')):'—',cash=n=>['JPY','KRW'].includes(db.currency)?(n/100).toFixed(0):(n/100).toFixed(2),cents=v=>{let n=E.cents(v);return n!==null&&['JPY','KRW'].includes(db.currency)&&n%100!==0?null:n};
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{toast(t('warning'))}}
function log(message){db.activity.unshift({at:new Date().toISOString(),message});db.activity=db.activity.slice(0,50);save();render()}
function toast(message){$('.toast')?.remove();let x=document.createElement('div');x.className='toast';x.setAttribute('role','status');x.textContent=message;document.body.append(x);setTimeout(()=>x.remove(),4000)}
const btn=(act,label,style='')=>`<button type="button" class="btn ${style}" data-act="${act}">${label}</button>`,opts=(arr,val)=>arr.map(([v,label])=>`<option value="${esc(v)}"${val===v?' selected':''}>${esc(label)}</option>`).join(''),field=(label,name,value='',type='text',extra='')=>`<div class="inputrow"><label for="f-${name}">${t(label)}</label><input class="field" id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`;
const navs=[['overview','◈'],['clients','◎'],['retainers','◌'],['projects','▤'],['team','▦'],['timeCost','◷'],['services','◇'],['profit','▥'],['forecast','✧'],['renewalLab','↗'],['reports','▧'],['data','◫'],['settings','⚙']];
function nav(){return navs.map(([k,icon])=>`<button class="${view===k?'active':''}" data-view="${k}" aria-current="${view===k?'page':'false'}"><span class="glyph">${icon}</span><span>${t(k)}</span></button>`).join('')}
function head(k,sub=t('intro'),actions=''){return `<div class="heading"><div><div class="eyebrow">NEXALYPLANNER / AGENCY PORTFOLIO OS</div><h1>${t(k)}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`}
function metric(k,v,sub='',tone=''){return `<div class="card kpi"><small>${t(k)}</small><strong class="${tone}">${v}</strong><span>${sub}</span></div>`}
function empty(kind){let m={clients:['noClients','client','newClient'],team:['noTeam','member','newTeam'],projects:['noProjects','project','newProject'],time:['noLogs','time','newTime'],costs:['noRecords','cost','newCost'],services:['noServices','service','newService']}[kind]||['noRecords','client','newClient'];return `<div class="empty"><h3>${t(m[0])}</h3><p>${t('emptyHelp')}</p>${btn(m[1],t(m[2]),'primary')}</div>`}
const currentClients=()=>db.clients.filter(c=>!c.archived),currentTeam=()=>db.team.filter(m=>!m.archived),currentServices=()=>db.services.filter(s=>!s.archived),currentProjects=()=>db.projects.filter(p=>!p.archived);
function table(keys,rows){return `<div class="tablebox"><table class="table"><thead><tr>${keys.map(k=>`<th>${t(k)}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${keys.length}">${t('noRecords')}</td></tr>`}</tbody></table></div>`}
function clientSelect(val='all'){return `<select class="field" style="width:auto;max-width:260px" data-change="selected" aria-label="${t('client')}">${opts([['all',t('all')],...currentClients().map(c=>[c.id,c.name])],val||'all')}</select>`}
function clientName(id){return db.clients.find(x=>x.id===id)?.name||'—'}
function projectName(id){return db.projects.find(x=>x.id===id)?.name||'—'}
function memberName(id){return db.team.find(x=>x.id===id)?.name||'—'}
function matrix(){let clients=currentClients(),metrics=clients.map(c=>({c,m:E.client(db,c,month)})),max=Math.max(1,...metrics.map(x=>x.m.revenue)),totalHours=Math.max(1,E.portfolio(db,month).hours||metrics.reduce((n,x)=>n+x.m.hours,0));return `<div class="matrix" role="img" aria-label="${t('portfolioNote')}"><small class="axis y">↑ ${t('capacity')}</small><small class="axis x">${t('margin')} →</small>${metrics.map(({c,m},i)=>{let margin=m.margin===null?0:m.margin,x=Math.min(89,Math.max(12,12+(margin+40)/140*76)),y=Math.min(86,Math.max(14,14+(m.hours/totalHours)*66)),diam=34+Math.sqrt(m.revenue/max)*50,risk=m.overService||m.margin!==null&&m.margin<db.profile.marginThreshold;return `<button class="bubble ${risk?'risk':''}" data-act="inspect:${c.id}" style="left:${x}%;bottom:${y}%;width:${diam}px;height:${diam}px" title="${esc(c.name)} · ${money(m.revenue)} · ${pct(m.margin)} · ${m.hours}h" aria-label="${esc(c.name)}: ${money(m.revenue)}, ${pct(m.margin)}, ${m.hours}h">${esc(c.name.split(' ')[0].slice(0,9))}</button>`}).join('')}</div>`}
function overview(){let p=E.portfolio(db,month),clients=currentClients(),atRisk=clients.filter(c=>{let m=E.client(db,c,month);return m.overService||m.margin!==null&&m.margin<db.profile.marginThreshold});return `${head('overview',t('intro'),btn('client','＋ '+t('newClient'),'primary')+btn('backup',t('backup')))}<div class="hero"><div class="eyebrow">${esc(db.business)} / ${month}</div><h2>${t('clientHealth')}</h2><p>${t('portfolioNote')}</p><div class="row"><span class="pill">${p.active} ${t('activeClients')}</span><span class="pill">${db.currency}</span><span class="pill">${t('offline')}</span></div></div><div class="grid kpis">${metric('mrr',money(clients.filter(c=>c.status==='active').reduce((n,c)=>n+c.retainerCents,0)),t('retainerRevenue'))}${metric('grossProfit',money(p.profit),t('monthlyView'),p.profit<0?'bad':'good')}${metric('avgMargin',pct(p.margin),t('targetMargin')+' '+db.profile.marginThreshold+'%')}${metric('utilization',pct(p.utilization),t('availableHours')+' '+p.available+'h')}</div><div class="grid split"><section class="card"><div class="cardhead"><h2>${t('portfolioMap')}</h2><small>${clients.length} ${t('clients')}</small></div><div class="body">${clients.length?matrix():empty('clients')}<div class="notice" style="margin-top:12px">${t('bubbleHelp')}</div></div></section><section class="card"><div class="cardhead"><h2>${t('riskQueue')}</h2><small>${atRisk.length}</small></div><div class="body list">${atRisk.length?atRisk.map(c=>{let m=E.client(db,c,month);return `<div class="listitem"><div><strong>${esc(c.name)}</strong><small>${m.overService?t('overServiced')+' · '+m.retainerHours+' / '+c.plannedHours+'h':t('lowMargin')+' · '+pct(m.margin)}</small></div>${btn('inspect:'+c.id,'↗','small')}</div>`}).join(''):`<div class="notice good">${t('healthy')}</div>`}<div class="notice">${t('reportNote')}</div></div></section></div><div class="grid kpis">${metric('effectiveRevenue',p.effective===null?'—':money(p.effective),t('actualHours')+' '+p.hours+'h')}${metric('overServiced',p.overServiced)}${metric('remainingCapacity',p.remaining.toFixed(1)+'h',t('targetBillable')+' '+p.target+'h',p.remaining<0?'bad':'')}${metric('renewalValue',money(p.renewalValue),t('monthlyView'))}</div>`}
function clientPage(retainer=false){let visible=currentClients().filter(c=>(selected===null||selected==='all'||c.id===selected)&&(!search||(c.name+' '+c.segment).toLowerCase().includes(search.toLowerCase())));return `${head(retainer?'retainers':'clients',t('intro'),btn('client','＋ '+t('newClient'),'primary'))}<div class="row" style="margin-bottom:14px">${clientSelect(selected||'all')}<input class="field" style="max-width:240px" data-search placeholder="${t('search')}" value="${esc(search)}"></div><div class="grid kpis">${metric('activeClients',visible.filter(c=>c.status==='active').length)}${metric('mrr',money(visible.filter(c=>c.status==='active').reduce((n,c)=>n+c.retainerCents,0)))}${metric('overServiced',visible.filter(c=>E.client(db,c,month).overService).length)}${metric('renewalValue',money(E.portfolio(db,month).renewalValue))}</div><section class="card">${visible.length?table(['client','serviceLine','status','retainer','plannedHours','actualHours','clientProfit','margin','action'],visible.map(c=>{let m=E.client(db,c,month);return `<tr><td><b>${esc(c.name)}</b><br><small>${esc(c.segment||'')}</small></td><td>${esc(db.services.find(s=>s.id===c.serviceId)?.name||'—')}</td><td>${t(c.status)}</td><td>${money(c.retainerCents)}</td><td>${c.plannedHours}h</td><td>${m.hours.toFixed(1)}h ${m.overService?'<b class="bad">!</b>':''}</td><td>${money(m.profit)}</td><td class="${m.margin!==null&&m.margin<db.profile.marginThreshold?'bad':'good'}">${pct(m.margin)}</td><td>${btn('edit:client:'+c.id,t('edit'),'small')} ${btn('archive:client:'+c.id,t('archive'),'small danger')}</td></tr>`})):empty('clients')}</section>`}
function projectsPage(){let rows=currentProjects().filter(p=>selected===null||selected==='all'||p.clientId===selected);return `${head('projects',t('recognizedNote'),btn('project','＋ '+t('newProject'),'primary'))}<div class="row" style="margin-bottom:14px">${clientSelect(selected||'all')}</div><div class="card">${rows.length?table(['project','client','projectStatus','fee','plannedHours','actualHours','clientProfit','dueDate','action'],rows.map(p=>{let m=E.project(db,p);return `<tr><td><b>${esc(p.name)}</b></td><td>${esc(clientName(p.clientId))}</td><td>${t(p.status)}</td><td>${money(p.feeCents)}</td><td>${p.plannedHours}h</td><td>${m.hours}h</td><td>${money(m.profit)}</td><td>${date(p.dueDate)}</td><td>${btn('edit:project:'+p.id,t('edit'),'small')} ${btn('archive:project:'+p.id,t('archive'),'small danger')}</td></tr>`})):empty('projects')}</div><div class="notice" style="margin-top:15px">${t('lifetime')} · ${t('recognizedNote')}</div>`}
function teamPage(){let cap=E.capacity(db,month),members=currentTeam();return `${head('team',t('capacityHelp'),btn('member','＋ '+t('newTeam'),'primary'))}<div class="grid kpis">${metric('availableHours',cap.available+'h')}${metric('targetBillable',cap.target+'h')}${metric('actualHours',cap.used+'h')}${metric('planGap',cap.gap.toFixed(1)+'h','',cap.gap<0?'bad':'good')}</div><div class="grid split"><section class="card"><div class="cardhead"><h2>${t('heatmap')}</h2></div><div class="body"><div class="heat">${members.map(m=>{let hours=db.time.filter(x=>x.memberId===m.id&&x.date.slice(0,7)===month).reduce((n,x)=>n+x.hours,0),ratio=m.availableHours?hours/m.availableHours:0;return `<div class="${ratio>1?'hot':ratio<.5?'cool':''}" title="${esc(m.name)} ${hours}/${m.availableHours}h">${esc(m.name.split(' ')[0])}<small>${hours} / ${m.availableHours}h</small></div>`}).join('')||empty('team')}</div><div class="notice" style="margin-top:15px">${t('capacityHelp')}</div></div></section><section class="card"><div class="cardhead"><h2>${t('utilization')}</h2></div><div class="body"><div class="ring" style="--angle:${Math.min(100,Math.max(0,cap.utilization||0))}%"><div><strong>${pct(cap.utilization)}</strong><small>${t('actualHours')}</small></div></div><div class="listitem"><b>${t('remainingCapacity')}</b><strong>${cap.remaining.toFixed(1)}h</strong></div></div></section></div><div class="card" style="margin-top:15px">${members.length?table(['teamMember','loadedRate','availableHours','actualHours','utilization','action'],members.map(m=>{let h=db.time.filter(x=>x.memberId===m.id&&x.date.slice(0,7)===month).reduce((n,x)=>n+x.hours,0);return `<tr><td>${esc(m.name)}</td><td>${money(m.loadedCents)}</td><td>${m.availableHours}h</td><td>${h}h</td><td>${m.availableHours?pct(100*h/m.availableHours):'—'}</td><td>${btn('edit:member:'+m.id,t('edit'),'small')} ${btn('archive:member:'+m.id,t('archive'),'small danger')}</td></tr>`})):empty('team')}</div>`}
function timePage(){let logs=db.time.filter(x=>x.date.slice(0,7)===month&&(selected===null||selected==='all'||x.clientId===selected)).slice().sort((a,b)=>b.date.localeCompare(a.date)),costs=db.costs.filter(x=>x.date.slice(0,7)===month&&(selected===null||selected==='all'||x.clientId===selected)).slice().sort((a,b)=>b.date.localeCompare(a.date));return `${head('timeCost',t('intro'),btn('time','＋ '+t('newTime'),'primary')+btn('cost','＋ '+t('newCost')))}<div class="row" style="margin-bottom:14px">${clientSelect(selected||'all')}</div><div class="grid kpis">${metric('actualHours',logs.reduce((n,x)=>n+x.hours,0).toFixed(1)+'h')}${metric('scopeCreep',logs.filter(x=>x.scope==='creep').reduce((n,x)=>n+x.hours,0).toFixed(1)+'h')}${metric('teamCost',money(logs.reduce((n,x)=>n+Math.round(x.hours*(db.team.find(m=>m.id===x.memberId)?.loadedCents||0)),0)))}${metric('directCost',money(costs.reduce((n,x)=>n+x.amountCents,0)))}</div><section class="card"><div class="cardhead"><h2>${t('time')}</h2></div>${logs.length?table(['date','client','project','teamMember','hours','scope','action'],logs.map(x=>`<tr><td>${date(x.date)}</td><td>${esc(clientName(x.clientId))}</td><td>${esc(projectName(x.projectId))}</td><td>${esc(memberName(x.memberId))}</td><td>${x.hours}h</td><td>${t(x.scope==='creep'?'scopeCreep':'baseScope')}</td><td>${btn('edit:time:'+x.id,t('edit'),'small')} ${btn('delete:time:'+x.id,t('delete'),'small danger')}</td></tr>`)):empty('time')}</section><section class="card" style="margin-top:15px"><div class="cardhead"><h2>${t('costs')}</h2></div>${costs.length?table(['date','client','project','title','costCategory','amount','action'],costs.map(x=>`<tr><td>${date(x.date)}</td><td>${esc(clientName(x.clientId))}</td><td>${esc(projectName(x.projectId))}</td><td>${esc(x.title)}</td><td>${esc(x.category)}</td><td>${money(x.amountCents)}</td><td>${btn('edit:cost:'+x.id,t('edit'),'small')} ${btn('delete:cost:'+x.id,t('delete'),'small danger')}</td></tr>`)):empty('costs')}</section>`}
function servicesPage(){let lines=currentServices();return `${head('services',t('intro'),btn('service','＋ '+t('newService'),'primary'))}<div class="card">${lines.length?table(['serviceLine','activeClients','revenue','teamCost','clientProfit','serviceMargin','action'],lines.map(s=>{let clients=currentClients().filter(c=>c.serviceId===s.id),m=clients.map(c=>E.client(db,c,month)),revenue=m.reduce((n,x)=>n+x.revenue,0),profit=m.reduce((n,x)=>n+x.profit,0);return `<tr><td><b>${esc(s.name)}</b></td><td>${clients.length}</td><td>${money(revenue)}</td><td>${money(m.reduce((n,x)=>n+x.teamCost,0))}</td><td>${money(profit)}</td><td>${revenue?pct(100*profit/revenue):'—'}</td><td>${btn('edit:service:'+s.id,t('edit'),'small')} ${btn('archive:service:'+s.id,t('archive'),'small danger')}</td></tr>`})):empty('services')}</div>`}
function profitPage(){let clients=currentClients().map(c=>({c,m:E.client(db,c,month)})),p=E.portfolio(db,month),max=Math.max(1,...clients.map(x=>Math.abs(x.m.profit)));return `${head('profit',t('intro'),btn('print',t('print')))}<div class="grid kpis">${metric('revenue',money(p.revenue))}${metric('grossProfit',money(p.profit),'',p.profit<0?'bad':'good')}${metric('avgMargin',pct(p.margin))}${metric('clientShare',pct(p.topShare))}</div><div class="grid split"><section class="card"><div class="cardhead"><h2>${t('clientMix')}</h2></div><div class="body">${clients.length?clients.map(({c,m})=>`<div class="barline"><span title="${esc(c.name)}">${esc(c.name)}</span><div class="track"><i style="width:${Math.min(100,100*Math.abs(m.profit)/max)}%;background:${m.profit<0?'var(--red)':'var(--violet)'}"></i></div><b>${pct(m.margin)}</b></div>`).join(''):empty('clients')}<div class="notice">${t('reportNote')}</div></div></section><section class="card"><div class="cardhead"><h2>${t('clientCost')}</h2></div><div class="body list">${[['retainerRevenue',clients.reduce((n,x)=>n+x.m.retainerRevenue,0)],['projectRevenue',clients.reduce((n,x)=>n+x.m.projectRevenue,0)],['teamCost',clients.reduce((n,x)=>n+x.m.teamCost,0)],['directCost',clients.reduce((n,x)=>n+x.m.direct+x.m.allocated,0)],['grossProfit',p.profit]].map(([k,v])=>`<div class="listitem"><b>${t(k)}</b><strong>${money(v)}</strong></div>`).join('')}</div></section></div><div class="card" style="margin-top:15px">${table(['client','revenue','actualHours','teamCost','directCost','clientProfit','margin'],clients.map(({c,m})=>`<tr><td>${esc(c.name)}</td><td>${money(m.revenue)}</td><td>${m.hours}h</td><td>${money(m.teamCost)}</td><td>${money(m.direct+m.allocated)}</td><td>${money(m.profit)}</td><td>${pct(m.margin)}</td></tr>`))}</div>`}
function forecastPage(){let p=E.portfolio(db,month),newRevenue=forecast.newRevenue*100,newHours=forecast.newHours,hireHours=forecast.hireHours,hireCost=forecast.hireCost*100,rate=p.hours?Math.round((p.revenue-p.profit)/p.hours):Math.round(currentTeam().reduce((n,m)=>n+m.loadedCents,0)/Math.max(1,currentTeam().length)),nextRevenue=p.revenue+newRevenue,nextProfit=p.profit+newRevenue-Math.round(newHours*rate)-hireCost,nextGap=p.gap+hireHours*db.profile.billablePct/100-newHours;return `${head('forecast',t('forecastNote'),btn('saveForecast',t('saveScenario'),'primary'))}<div class="grid two"><div class="card body"><h2>${t('planning')}</h2><div class="formgrid">${[['newClientRevenue',forecast.newRevenue,0,50000,500,'newRevenue'],['newClientHours',newHours,0,300,5,'newHours'],['hireHours',hireHours,0,300,5,'hireHours'],['hireCost',forecast.hireCost,0,30000,250,'hireCost']].map(([key,v,min,max,step,name])=>`<div class="inputrow"><label>${t(key)}: <b>${name.includes('Revenue')||name.includes('Cost')?money(v*100):v+'h'}</b></label><input type="range" min="${min}" max="${max}" step="${step}" value="${v}" data-forecast="${name}"></div>`).join('')}</div><div class="notice">${t('forecastNote')}</div></div><div class="card body"><h2>${t('projection')}</h2><div class="list">${[['revenue',p.revenue,nextRevenue],['grossProfit',p.profit,nextProfit]].map(([k,a,b])=>`<div class="listitem"><b>${t(k)}</b><span>${money(a)} → <strong>${money(b)}</strong></span></div>`).join('')}<div class="listitem"><b>${t('planGap')}</b><span>${p.gap.toFixed(1)}h → <strong class="${nextGap<0?'bad':'good'}">${nextGap.toFixed(1)}h</strong></span></div></div><div class="notice" style="margin-top:14px">${t('benchmark')}: ${money(rate)} / h</div></div></div><div class="card" style="margin-top:15px"><div class="cardhead"><h2>${t('savedSnapshots')}</h2></div><div class="body list">${db.scenarios.filter(x=>x.type==='forecast').map(x=>`<div class="listitem"><b>${esc(x.name)}</b><span>${date(x.date)} · ${money(x.revenueCents)} · ${x.gap.toFixed(1)}h</span></div>`).join('')||t('noRecords')}</div></div>`}
function renewalPage(){let c=currentClients().find(c=>c.id===selected)||currentClients()[0];if(!c)return `${head('renewalLab',t('renewalNote'))}${empty('clients')}`;let m=E.renewal(db,c,month,renewPct,renewHours);return `${head('renewalLab',t('renewalNote'),btn('saveRenewal',t('saveScenario'),'primary'))}<div class="row" style="margin-bottom:14px"><select class="field" style="max-width:280px" data-change="renewClient">${opts(currentClients().map(x=>[x.id,x.name]),c.id)}</select></div><div class="grid two"><div class="card body"><h2>${t('renewal')}</h2><div class="inputrow"><label>${t('increase')}: <b>${renewPct}%</b></label><input type="range" min="-25" max="100" value="${renewPct}" data-renew="pct"></div><div class="inputrow" style="margin-top:15px"><label>${t('extraHours')}: <b>${renewHours}h</b></label><input type="range" min="-40" max="100" value="${renewHours}" data-renew="hours"></div><div class="notice" style="margin-top:17px">${t('renewalNote')}</div></div><div class="card body"><h2>${t('before')} → ${t('after')}</h2><div class="list"><div class="listitem"><b>${t('retainer')}</b><span>${money(c.retainerCents)} → <strong>${money(m.newRetainer)}</strong></span></div><div class="listitem"><b>${t('clientProfit')}</b><span>${money(m.base.profit)} → <strong>${money(m.profit)}</strong></span></div><div class="listitem"><b>${t('margin')}</b><span>${pct(m.base.margin)} → <strong class="${m.margin!==null&&m.margin<db.profile.marginThreshold?'bad':'good'}">${pct(m.margin)}</strong></span></div><div class="listitem"><b>${t('actualHours')}</b><span>${m.base.hours}h → ${m.newHours}h</span></div></div></div></div><div class="card" style="margin-top:15px"><div class="cardhead"><h2>${t('savedSnapshots')}</h2></div><div class="body list">${db.scenarios.filter(x=>x.type==='renewal').map(x=>`<div class="listitem"><b>${esc(x.name)}</b><span>${date(x.date)} · ${money(x.newRetainerCents)} · ${pct(x.margin)}</span></div>`).join('')||t('noRecords')}</div></div>`}
function reportsPage(){let p=E.portfolio(db,month),prior=E.portfolio(db,previousMonth(month)),clients=currentClients();return `${head('reports',t('reportTitle'),btn('print',t('print'),'primary')+btn('csv',t('exportCsv')))}<div class="printhead"><img src="${window.NEXALY_LOGO}" alt="NexalyPlanner" width="105"><h1>${t('reportTitle')} · ${esc(db.business)}</h1><p>${month} · ${db.currency}</p></div><div class="grid kpis">${metric('mrr',money(clients.filter(c=>c.status==='active').reduce((n,c)=>n+c.retainerCents,0)))}${metric('grossProfit',money(p.profit))}${metric('avgMargin',pct(p.margin))}${metric('utilization',pct(p.utilization))}</div><div class="grid two"><div class="card body"><h2>${t('period')}</h2><div class="list"><div class="listitem"><b>${t('currentMonth')}</b><span>${money(p.revenue)} · ${money(p.profit)}</span></div><div class="listitem"><b>${t('priorMonth')}</b><span>${money(prior.revenue)} · ${money(prior.profit)}</span></div></div><div class="notice" style="margin-top:13px">${t('reportNote')}</div></div><div class="card body"><h2>${t('concentration')}</h2><div class="ring" style="--angle:${Math.min(100,Math.max(0,p.topShare||0))}%"><div><strong>${pct(p.topShare)}</strong><small>${t('clientShare')}</small></div></div><div class="notice">${t('portfolioNote')}</div></div></div><div class="card" style="margin-top:15px">${table(['client','revenue','actualHours','clientCost','clientProfit','margin'],clients.map(c=>{let m=E.client(db,c,month);return `<tr><td>${esc(c.name)}</td><td>${money(m.revenue)}</td><td>${m.hours}h</td><td>${money(m.totalCost)}</td><td>${money(m.profit)}</td><td>${pct(m.margin)}</td></tr>`}))}</div>`}
function dataPage(){let archived=db.clients.filter(c=>c.archived),bad=currentClients().filter(c=>!c.plannedHours||!c.retainerCents).length;return `${head('data',t('offline'))}<div class="grid three">${[['backup','backup'],['restoreBackup','restoreBackup'],['exportCsv','csv']].map(([k,a])=>`<div class="card body"><h2>${t(k)}</h2><p class="muted">${t('offline')}</p>${btn(a,t(k),'primary')}</div>`).join('')}</div><div class="grid two" style="margin-top:15px"><div class="card body"><h2>${t('importCsv')}</h2><p class="muted">CSV: client,member,date,hours,project,scope</p>${btn('importCsv',t('importCsv'))}</div><div class="card body"><h2>${t('dataQuality')}</h2><div class="list"><div class="listitem"><b>${t('clients')}</b><strong>${db.clients.length}</strong></div><div class="listitem"><b>${t('risk')}</b><strong>${bad}</strong></div><div class="listitem"><b>${t('lastBackup')}</b><strong>${db.lastBackup?date(db.lastBackup.slice(0,10)):'—'}</strong></div></div></div></div><div class="card" style="margin-top:15px"><div class="cardhead"><h2>${t('archived')} · ${archived.length}</h2></div><div class="body list">${archived.map(c=>`<div class="listitem"><b>${esc(c.name)}</b><div class="row">${btn('restore:client:'+c.id,t('restore'),'small')}${btn('delete:client:'+c.id,t('delete'),'small danger')}</div></div>`).join('')||t('noRecords')}</div></div><div class="row" style="margin-top:16px">${btn('demo',t('loadDemo'))}${btn('reset',t('reset'),'danger')}</div>`}
function settingsPage(){return `${head('settings',t('settingsHelp'))}<form id="settings-form" class="card body"><div class="formgrid">${field('business','business',db.business,'text','required maxlength="90"')}${field('billableTarget','billablePct',db.profile.billablePct,'number','required min="1" max="100" step="0.1"')}${field('targetMargin','marginThreshold',db.profile.marginThreshold,'number','required min="-100" max="100" step="0.1"')}<div class="inputrow"><label>${t('language')}</label><select class="field" name="lang">${opts(Object.entries(LANGS),db.lang)}</select></div><div class="inputrow"><label>${t('currency')}</label><select class="field" name="currency">${opts(CURRENCIES.map(c=>[c,c]),db.currency)}</select></div><div class="inputrow"><label>${t('theme')}</label><select class="field" name="theme">${opts([['light',t('light')],['dark',t('dark')]],db.theme)}</select></div><div class="notice wide">${t('changeCurrency')}</div><div class="row wide"><button class="btn primary">${t('save')}</button>${btn('help',t('formula'))}</div></div></form><div class="card body" style="margin-top:15px"><img src="${window.NEXALY_LOGO}" alt="NexalyPlanner" width="100"><h2>${t('about')} · Agency Portfolio OS v1.0</h2><p>${t('offline')} · ${t('reportNote')}</p></div>`}
function previousMonth(s){let [y,m]=s.split('-').map(Number);return new Date(Date.UTC(y,m-2,1)).toISOString().slice(0,7)}
function page(){return ({overview,clients:()=>clientPage(),retainers:()=>clientPage(true),projects:projectsPage,team:teamPage,timeCost:timePage,services:servicesPage,profit:profitPage,forecast:forecastPage,renewalLab:renewalPage,reports:reportsPage,data:dataPage,settings:settingsPage})[view]()}
function render(){document.documentElement.lang=db.lang;document.documentElement.dir=db.lang==='ar'?'rtl':'ltr';document.body.dataset.theme=db.theme;$('#app').innerHTML=`<div class="shell ${collapsed?'collapsed':''}"><aside class="sidebar ${mobile?'open':''}"><div class="brand"><img src="${window.NEXALY_LOGO}" alt="NexalyPlanner"><div><strong>AGENCY PORTFOLIO</strong><small>PROFIT & CAPACITY OS</small></div></div><button class="btn collapse" data-act="collapse" aria-label="${t('filter')}">☷</button><div class="navlabel">${t('business')}</div><nav>${nav()}</nav><div class="foot"><b>${esc(db.business)}</b><br>${t('offline')} · v1.0</div></aside><div class="workspace"><header class="top"><button class="btn mobile" data-act="mobile" aria-label="Menu">☰</button><div class="crumb"><b>${t(view)}</b><small>${esc(db.business)} · ${db.currency}</small></div><input class="field search" data-search placeholder="${t('search')}" value="${esc(search)}"><input class="field" data-change="month" type="month" value="${month}" aria-label="${t('month')}"><button class="btn primary quick" data-act="client">＋ ${t('newClient')}</button><select class="field" data-change="lang" aria-label="${t('language')}">${opts(Object.entries(LANGS),db.lang)}</select><select class="field" data-change="currency" aria-label="${t('currency')}">${opts(CURRENCIES.map(c=>[c,c]),db.currency)}</select><button class="btn" data-act="theme" aria-label="${t('theme')}">${db.theme==='light'?'◐':'☀'}</button></header><main class="main">${page()}</main></div></div>${drawer?drawDrawer():''}${modal?drawModal():''}`}
function relation(name,items,value='',allowNone=false){return `<div class="inputrow"><label>${t(name)}</label><select class="field" name="${name}Id" ${allowNone?'':'required'}>${opts([...(allowNone?[['',t('none')]]:[]),...items],value)}</select></div>`}
function drawDrawer(){let {kind,recordId}=drawer,list=({client:db.clients,member:db.team,project:db.projects,time:db.time,cost:db.costs,service:db.services})[kind],old=list?.find(x=>x.id===recordId),content='';
if(kind==='client')content=field('name','name',old?.name||'','text','required maxlength="110"')+field('category','segment',old?.segment||'','text','maxlength="80"')+relation('service',currentServices().map(x=>[x.id,x.name]),old?.serviceId||'',true)+`<div class="inputrow"><label>${t('status')}</label><select class="field" name="status">${opts([['active',t('active')],['paused',t('paused')]],old?.status||'active')}</select></div>`+field('retainer','retainer',cash(old?.retainerCents||0),'number','required min="0" step="0.01"')+field('plannedHours','plannedHours',old?.plannedHours??20,'number','required min="0" max="10000" step="0.25"')+field('tools','tools',cash(old?.toolsCents||0),'number','required min="0" step="0.01"')+field('contractor','contractor',cash(old?.contractorCents||0),'number','required min="0" step="0.01"')+field('renewal','renewal',old?.renewal||'','date')+`<div class="inputrow"><label>${t('notes')}</label><textarea class="field" name="notes" maxlength="1000">${esc(old?.notes||'')}</textarea></div>`;
if(kind==='member')content=field('name','name',old?.name||'','text','required maxlength="110"')+field('loadedRate','loaded',cash(old?.loadedCents||0),'number','required min="0" step="0.01"')+field('availableHours','availableHours',old?.availableHours??120,'number','required min="0" max="10000" step="0.25"')+`<div class="notice">${t('loadedRate')} · ${t('capacityHelp')}</div>`;
if(kind==='service')content=field('name','name',old?.name||'','text','required maxlength="100"')+field('category','category',old?.category||'Creative','text','maxlength="80"')+`<div class="notice">${t('serviceLine')} · ${t('clientMix')}</div>`;
if(kind==='project')content=relation('client',currentClients().map(x=>[x.id,x.name]),old?.clientId)+field('name','name',old?.name||'','text','required maxlength="110"')+relation('service',currentServices().map(x=>[x.id,x.name]),old?.serviceId||'',true)+`<div class="inputrow"><label>${t('projectStatus')}</label><select class="field" name="status">${opts([['planned',t('planned')],['inProgress',t('inProgress')],['complete',t('complete')]],old?.status||'planned')}</select></div>`+field('fee','fee',cash(old?.feeCents||0),'number','required min="0" step="0.01"')+field('plannedHours','plannedHours',old?.plannedHours??20,'number','required min="0" max="10000" step="0.25"')+field('dueDate','dueDate',old?.dueDate||'','date')+field('recognizedMonth','recognizedMonth',old?.recognizedMonth||month,'month')+`<div class="notice">${t('recognizedNote')}</div>`;
if(kind==='time')content=relation('client',currentClients().map(x=>[x.id,x.name]),old?.clientId)+relation('member',currentTeam().map(x=>[x.id,x.name]),old?.memberId)+relation('project',currentProjects().filter(x=>!old?.clientId||x.clientId===old.clientId).map(x=>[x.id,x.name]),old?.projectId||'',true)+field('date','date',old?.date||today(),'date','required')+field('hours','hours',old?.hours??1,'number','required min="0.01" max="100" step="0.01"')+`<div class="inputrow"><label>${t('scope')}</label><select class="field" name="scope">${opts([['base',t('baseScope')],['creep',t('scopeCreep')]],old?.scope||'base')}</select></div>`+`<div class="inputrow"><label>${t('notes')}</label><textarea class="field" name="notes" maxlength="500">${esc(old?.notes||'')}</textarea></div>`;
if(kind==='cost')content=relation('client',currentClients().map(x=>[x.id,x.name]),old?.clientId)+relation('project',currentProjects().filter(x=>!old?.clientId||x.clientId===old.clientId).map(x=>[x.id,x.name]),old?.projectId||'',true)+field('title','title',old?.title||'','text','required maxlength="110"')+field('date','date',old?.date||today(),'date','required')+field('amount','amount',cash(old?.amountCents||0),'number','required min="0" step="0.01"')+field('costCategory','category',old?.category||'Direct','text','maxlength="80"')+`<div class="inputrow"><label>${t('notes')}</label><textarea class="field" name="notes" maxlength="500">${esc(old?.notes||'')}</textarea></div>`;
return `<div class="overlay" data-act="closeDrawer"><section class="drawer" role="dialog" aria-modal="true" aria-label="${t(kind)}"><button class="btn" data-act="closeDrawer" style="float:right">×</button><div class="eyebrow">NEXALYPLANNER / AGENCY PORTFOLIO</div><h2>${t(recordId?'edit':'addEntry')} · ${t(kind==='member'?'teamMember':kind)}</h2><form class="formgrid" id="record-form">${content}<footer><button class="btn" type="button" data-act="closeDrawer">${t('cancel')}</button><button class="btn primary">${t('save')}</button></footer></form></section></div>`}
function drawModal(){if(modal.type==='setup')return `<div class="modal"><section class="modalbox" role="dialog" aria-modal="true"><img src="${window.NEXALY_LOGO}" width="105" alt="NexalyPlanner"><div class="eyebrow">AGENCY PORTFOLIO OS / ${modal.step+1} OF 4</div><h2>${t('overview')}</h2>${modal.step===0?`<p>${t('intro')}</p><div class="notice">${t('portfolioNote')}</div>`:modal.step===1?`<p>${t('language')} · ${t('currency')}</p><div class="formgrid"><div class="inputrow"><label>${t('language')}</label><select class="field" data-change="lang">${opts(Object.entries(LANGS),db.lang)}</select></div><div class="inputrow"><label>${t('currency')}</label><select class="field" data-change="setupCurrency">${opts(CURRENCIES.map(x=>[x,x]),db.currency)}</select></div></div>`:modal.step===2?`${field('business','setupBusiness',db.business,'text','maxlength="90"')}`:`<p>${t('targetMargin')}: ${db.profile.marginThreshold}% · ${t('billableTarget')}: ${db.profile.billablePct}%</p><div class="notice">${t('settingsHelp')}</div>`}<div class="row" style="margin-top:18px">${modal.step?btn('setupBack',t('back')):''}${modal.step<3?btn('setupNext',t('continue'),'primary'):btn('setupBlank',t('startBlank'),'primary')}${modal.step===3?btn('demo',t('loadDemo'),'lime'):''}</div></section></div>`;
if(modal.type==='confirm')return `<div class="modal"><section class="modalbox" role="alertdialog" aria-modal="true"><h2>${t('confirm')}</h2><p>${esc(modal.message)}</p><div class="row">${btn('closeModal',t('cancel'))}${btn('doConfirm',t('confirm'),'danger')}</div></section></div>`;
if(modal.type==='import')return `<div class="modal"><section class="modalbox" role="dialog" aria-modal="true"><h2>${t('importCsv')}</h2><p>${importData.valid.length} ${t('valid')} · ${importData.errors.length} ${t('rejected')}</p><div class="list">${importData.valid.slice(0,7).map(x=>`<div class="listitem"><b>${esc(clientName(x.clientId))}</b><span>${date(x.date)} · ${x.hours}h</span></div>`).join('')}</div>${importData.errors.length?`<div class="notice bad">${esc(importData.errors.slice(0,8).join(', '))}</div>`:''}<div class="row" style="margin-top:16px">${btn('closeModal',t('cancel'))}${btn('doImport',t('importCsv'),'primary')}</div></section></div>`;
return `<div class="modal"><section class="modalbox" role="dialog" aria-modal="true"><button class="btn" data-act="closeModal" style="float:right">×</button><img src="${window.NEXALY_LOGO}" width="90" alt="NexalyPlanner"><h2>${t('formula')}</h2><div class="list"><div class="listitem"><b>${t('clientCost')}</b><span>${t('actualHours')} × ${t('loadedRate')} + ${t('directCost')} + ${t('tools')} + ${t('contractor')}</span></div><div class="listitem"><b>${t('clientProfit')}</b><span>${t('revenue')} − ${t('clientCost')}</span></div><div class="listitem"><b>${t('effectiveRevenue')}</b><span>${t('revenue')} / ${t('actualHours')}</span></div><div class="listitem"><b>${t('utilization')}</b><span>${t('actualHours')} / ${t('availableHours')}</span></div><div class="listitem"><b>${t('planGap')}</b><span>${t('targetBillable')} − ${t('plannedCapacity')}</span></div><div class="notice">${t('reportNote')}</div></div></section></div>`}
function saveRecord(form){let d=Object.fromEntries(new FormData(form).entries()),kind=drawer.kind,list=({client:db.clients,member:db.team,project:db.projects,time:db.time,cost:db.costs,service:db.services})[kind],old=list.find(x=>x.id===drawer.recordId),x={id:old?.id||id()},hrs=v=>{let n=Number(v);return Number.isFinite(n)&&n>=0&&n<=10000?n:null};
if(kind==='service'){if(!d.name?.trim())return toast(t('warning'));Object.assign(x,{name:d.name.trim(),category:(d.category||'').trim(),archived:old?.archived||false})}
if(kind==='member'){let loaded=cents(d.loaded),available=hrs(d.availableHours);if(!d.name?.trim()||loaded===null||available===null)return toast(t('warning'));Object.assign(x,{name:d.name.trim(),loadedCents:loaded,availableHours:available,archived:old?.archived||false})}
if(kind==='client'){let retainer=cents(d.retainer),tools=cents(d.tools),contractor=cents(d.contractor),planned=hrs(d.plannedHours);if(!d.name?.trim()||[retainer,tools,contractor,planned].some(v=>v===null)||d.renewal&&!dateValid(d.renewal))return toast(t('warning'));Object.assign(x,{name:d.name.trim(),segment:(d.segment||'').trim(),serviceId:d.serviceId||'',status:d.status,retainerCents:retainer,toolsCents:tools,contractorCents:contractor,plannedHours:planned,renewal:d.renewal||'',notes:(d.notes||'').trim(),archived:old?.archived||false})}
if(kind==='project'){let fee=cents(d.fee),planned=hrs(d.plannedHours);if(!d.name?.trim()||fee===null||planned===null||!currentClients().some(c=>c.id===d.clientId)||d.dueDate&&!dateValid(d.dueDate)||d.status==='complete'&&!/^\d{4}-\d{2}$/.test(d.recognizedMonth))return toast(t('warning'));Object.assign(x,{name:d.name.trim(),clientId:d.clientId,serviceId:d.serviceId||'',status:d.status,feeCents:fee,plannedHours:planned,dueDate:d.dueDate||'',recognizedMonth:d.status==='complete'?d.recognizedMonth:'',archived:old?.archived||false})}
if(kind==='time'){let hours=hrs(d.hours);if(!dateValid(d.date)||hours===null||hours<=0||hours>100||!currentClients().some(c=>c.id===d.clientId)||!currentTeam().some(m=>m.id===d.memberId)||d.projectId&&!currentProjects().some(p=>p.id===d.projectId&&p.clientId===d.clientId))return toast(t('warning'));Object.assign(x,{clientId:d.clientId,memberId:d.memberId,projectId:d.projectId||'',date:d.date,hours,scope:d.scope,notes:(d.notes||'').trim()})}
if(kind==='cost'){let amount=cents(d.amount);if(!d.title?.trim()||!dateValid(d.date)||amount===null||!currentClients().some(c=>c.id===d.clientId)||d.projectId&&!currentProjects().some(p=>p.id===d.projectId&&p.clientId===d.clientId))return toast(t('warning'));Object.assign(x,{clientId:d.clientId,projectId:d.projectId||'',title:d.title.trim(),date:d.date,amountCents:amount,category:(d.category||'').trim(),notes:(d.notes||'').trim()})}
if(old)Object.assign(old,x);else list.push(x);drawer=null;log(t('saved'))}
function demo(){let d=fresh(),m=monthNow(),day=m+'-12',cid=['c1','c2','c3'],sid=['s1','s2'];Object.assign(d,{setup:true,business:'Northstar Creative Studio',lang:db.lang,currency:db.currency,theme:db.theme,services:[{id:sid[0],name:'Brand & Design',category:'Creative'},{id:sid[1],name:'Growth Marketing',category:'Marketing'}],clients:[{id:cid[0],name:'Harbor & Pine',segment:'Retail',serviceId:sid[0],status:'active',retainerCents:1200000,toolsCents:25000,contractorCents:80000,plannedHours:72,renewal:m+'-28',notes:'Fictional example'},{id:cid[1],name:'Summit Health Co.',segment:'Wellness',serviceId:sid[1],status:'active',retainerCents:850000,toolsCents:40000,contractorCents:0,plannedHours:58,renewal:'',notes:'Fictional example'},{id:cid[2],name:'Mesa Home Goods',segment:'Ecommerce',serviceId:sid[0],status:'active',retainerCents:520000,toolsCents:15000,contractorCents:120000,plannedHours:44,renewal:'',notes:'Fictional example'}],team:[{id:'u1',name:'Maya Chen',loadedCents:8500,availableHours:130},{id:'u2',name:'Jordan Rivera',loadedCents:6800,availableHours:120},{id:'u3',name:'Avery Brooks',loadedCents:6200,availableHours:110}],projects:[{id:'p1',clientId:cid[0],serviceId:sid[0],name:'Fall Campaign Launch',status:'complete',feeCents:420000,plannedHours:34,dueDate:m+'-20',recognizedMonth:m}],time:[['c1','u1','p1',32,'base'],['c1','u2','p1',21,'creep'],['c1','u3','',36,'base'],['c2','u1','',25,'base'],['c2','u2','',40,'base'],['c2','u3','',18,'creep'],['c3','u2','',35,'base'],['c3','u3','',28,'creep']].map((a,i)=>({id:'t'+i,clientId:a[0],memberId:a[1],projectId:a[2],date:day,hours:a[3],scope:a[4],notes:''})),costs:[{id:'x1',clientId:'c1',projectId:'p1',title:'Campaign production',date:day,amountCents:95000,category:'Production',notes:''},{id:'x2',clientId:'c2',projectId:'',title:'Asset licensing',date:day,amountCents:45000,category:'License',notes:''}]});return d}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
const csvCell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
function exportCsv(){let rows=[['client','member','date','hours','project','scope'],...db.time.map(x=>[clientName(x.clientId),memberName(x.memberId),x.date,x.hours,x.projectId?projectName(x.projectId):'',x.scope])];download('agency-time-'+month+'.csv',rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function parseCsv(text){let rows=[],row=[],cell='',quote=false;for(let i=0;i<text.length;i++){let c=text[i];if(quote){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quote=false;else cell+=c}else if(c==='"')quote=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell.replace(/\r$/,''));rows.push(row)}if(quote)throw Error('CSV quote');return rows}
function filePicker(accept,callback){let input=document.createElement('input');input.type='file';input.accept=accept;input.onchange=async()=>{let file=input.files?.[0];if(!file)return;try{await callback(await file.text())}catch(e){toast(t('warning')+': '+e.message)}};input.click()}
function handleCsv(s){let rows=parseCsv(s.replace(/^\uFEFF/,'')),header=rows.shift()?.map(x=>x.trim().toLowerCase());if(!header||['client','member','date','hours','project','scope'].some(x=>!header.includes(x)))throw Error('CSV: client,member,date,hours,project,scope');let valid=[],errors=[];rows.forEach((r,i)=>{if(!r.some(Boolean))return;let v=Object.fromEntries(header.map((h,j)=>[h,(r[j]||'').trim()])),c=currentClients().find(x=>x.name.toLowerCase()===v.client.toLowerCase()),m=currentTeam().find(x=>x.name.toLowerCase()===v.member.toLowerCase()),p=v.project?currentProjects().find(x=>x.name.toLowerCase()===v.project.toLowerCase()&&x.clientId===c?.id):null,h=Number(v.hours);if(!c||!m||!dateValid(v.date)||!Number.isFinite(h)||h<=0||h>100||v.project&&!p||!['base','creep'].includes(v.scope.toLowerCase()))errors.push('Row '+(i+2));else valid.push({id:id(),clientId:c.id,memberId:m.id,projectId:p?.id||'',date:v.date,hours:h,scope:v.scope.toLowerCase(),notes:''})});importData={valid,errors};modal={type:'import'};render()}
function confirmAction(message,fn){modal={type:'confirm',message,fn};render()}
function setCurrency(next){if(next===db.currency)return;confirmAction(t('changeCurrency')+' '+db.currency+' → '+next,()=>{db.currency=next;save();render()})}
function setupNext(){let business=document.querySelector('[name="setupBusiness"]');if(business)db.business=business.value.trim()||'My Agency';modal.step=Math.min(3,modal.step+1);save();render()}
document.addEventListener('submit',e=>{if(e.target.id==='record-form'){e.preventDefault();saveRecord(e.target)}else if(e.target.id==='settings-form'){e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),billable=Number(d.billablePct),margin=Number(d.marginThreshold);if(!d.business.trim()||!Number.isFinite(billable)||billable<=0||billable>100||!Number.isFinite(margin)||margin< -100||margin>100)return toast(t('warning'));let apply=()=>{Object.assign(db,{business:d.business.trim(),lang:d.lang,theme:d.theme,profile:{billablePct:billable,marginThreshold:margin},currency:d.currency});log(t('saved'))};if(d.currency!==db.currency)confirmAction(t('changeCurrency')+' '+db.currency+' → '+d.currency,apply);else apply()}});
document.addEventListener('change',e=>{let el=e.target,k=el.dataset.change;if(k==='lang'){db.lang=el.value;save();render()}if(k==='month'){month=el.value||monthNow();render()}if(k==='selected'||k==='renewClient'){selected=el.value;render()}if(k==='currency')setCurrency(el.value);if(k==='setupCurrency'){db.currency=el.value;save();render()}if(el.dataset.forecast){forecast[el.dataset.forecast]=Number(el.value);render()}if(el.dataset.renew){if(el.dataset.renew==='pct')renewPct=Number(el.value);else renewHours=Number(el.value);render()}if(el.name==='clientId'&&drawer?.kind==='time'||el.name==='clientId'&&drawer?.kind==='cost'){let c=el.value,project=el.closest('form')?.querySelector('[name="projectId"]');if(project){project.innerHTML=opts([['',t('none')],...currentProjects().filter(p=>p.clientId===c).map(p=>[p.id,p.name])],'')}}});
document.addEventListener('input',e=>{if(e.target.matches('[data-search]')){let pos=e.target.selectionStart;search=e.target.value;render();let next=document.querySelector('[data-search]');next?.focus();next?.setSelectionRange(pos,pos)}});
document.addEventListener('click',e=>{let nav=e.target.closest('[data-view]');if(nav){view=nav.dataset.view;mobile=false;render();return}let el=e.target.closest('[data-act]');if(!el)return;let act=el.dataset.act;if(el.classList.contains('overlay')&&e.target!==el)return;
if(['client','member','project','time','cost','service'].includes(act)){if(['project','time','cost'].includes(act)&&!currentClients().length){view='clients';toast(t('noClients'));render();return}if(act==='time'&&!currentTeam().length){view='team';toast(t('noTeam'));render();return}drawer={kind:act};render();return}
if(act.startsWith('edit:')){let [,kind,recordId]=act.split(':');drawer={kind,recordId};render();return}if(act.startsWith('inspect:')){selected=act.split(':')[1];view='clients';render();return}
if(act.startsWith('archive:')||act.startsWith('restore:')||act.startsWith('delete:')){let [verb,kind,recordId]=act.split(':'),list=({client:db.clients,member:db.team,project:db.projects,time:db.time,cost:db.costs,service:db.services})[kind],record=list?.find(x=>x.id===recordId);if(!record)return;if(verb==='delete'&&kind==='client'&&(db.projects.some(x=>x.clientId===recordId)||db.time.some(x=>x.clientId===recordId)||db.costs.some(x=>x.clientId===recordId))){toast(t('warning')+': '+t('archive'));return}confirmAction(t('confirm')+' · '+(record.name||record.title||kind),()=>{if(verb==='delete'){let idx=list.indexOf(record);list.splice(idx,1)}else record.archived=verb==='archive';log(t('saved'))});return}
switch(act){case 'mobile':mobile=!mobile;render();break;case 'collapse':collapsed=!collapsed;render();break;case 'theme':db.theme=db.theme==='light'?'dark':'light';save();render();break;case 'closeDrawer':drawer=null;render();break;case 'closeModal':modal=null;render();break;case 'setupNext':setupNext();break;case 'setupBack':modal.step=Math.max(0,modal.step-1);render();break;case 'setupBlank':db.setup=true;modal=null;save();render();break;case 'demo':confirmAction(t('loadDemo')+'?',()=>{db=demo();modal=null;view='overview';selected=null;save();render()});break;case 'reset':confirmAction(t('reset')+'?',()=>{db=fresh();modal={type:'setup',step:0};view='overview';selected=null;save();render()});break;case 'doConfirm':{let fn=modal.fn;modal=null;fn();render();break}case 'help':modal={type:'help'};render();break;case 'backup':case 'restoreBackup':case 'csv':case 'exportCsv':case 'importCsv':{if(act==='backup'){db.lastBackup=new Date().toISOString();save();download('agency-portfolio-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json');render()}else if(act==='csv'||act==='exportCsv')exportCsv();else if(act==='importCsv')filePicker('.csv,text/csv',async s=>handleCsv(s));else filePicker('.json,application/json',async s=>{let incoming=JSON.parse(s);if(!E.valid(incoming)||!CURRENCIES.includes(incoming.currency))throw Error('Invalid backup');confirmAction(t('restoreBackup')+'?',()=>{db={...fresh(),...incoming};modal=null;save();render()})});break}case 'doImport':db.time.push(...importData.valid);modal=null;log(t('saved'));break;case 'print':window.print();break;case 'saveRenewal':{let c=currentClients().find(c=>c.id===selected)||currentClients()[0],m=E.renewal(db,c,month,renewPct,renewHours);db.scenarios.unshift({id:id(),type:'renewal',name:c.name+' '+month,date:today(),newRetainerCents:m.newRetainer,margin:m.margin});log(t('saved'));break}case 'saveForecast':{let p=E.portfolio(db,month),rate=p.hours?Math.round((p.revenue-p.profit)/p.hours):Math.round(currentTeam().reduce((n,m)=>n+m.loadedCents,0)/Math.max(1,currentTeam().length)),profit=p.profit+forecast.newRevenue*100-Math.round(forecast.newHours*rate)-forecast.hireCost*100;db.scenarios.unshift({id:id(),type:'forecast',name:month+' plan',date:today(),revenueCents:p.revenue+forecast.newRevenue*100,profitCents:profit,gap:p.gap+forecast.hireHours*db.profile.billablePct/100-forecast.newHours});log(t('saved'));break}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){drawer=null;if(modal?.type!=='setup')modal=null;render()}});
render();
})();
</script></body></html>
