<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="canonical" href="https://nexalyplanner.com/planners/renewguard-os/"><title>RenewGuard OS interactive demo | Nexaly Planner</title><meta name="description" content="Explore a session-only RenewGuard OS preview with sample vendor contracts, notice deadlines and renewal decisions."><style>
:root{font:15px/1.5 Inter,system-ui,sans-serif;color:#e8f2f5;background:#0b1726}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{padding:17px 24px;background:#102b43;border-bottom:1px solid #31516a;display:flex;justify-content:space-between;gap:16px;align-items:center}header b{font-size:1.12rem}header small{display:block;color:#a6c1d0}header span{color:#9de7dc;font-size:.8rem}nav{display:flex;gap:7px;padding:15px 22px;overflow:auto;background:#102031}nav button{white-space:nowrap;border:1px solid #31516a;background:transparent;color:#c9dbe5;padding:8px 12px;border-radius:9px}nav button.on{background:#126d82;border-color:#42b6b5;color:white}main{max-width:1180px;margin:auto;padding:25px 22px 60px}h1{font-size:1.8rem;margin:0 0 4px}p{color:#b5cad6}h2{font-size:1.12rem;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:22px 0}.card,.panel{background:#132b3e;border:1px solid #30516b;border-radius:13px;padding:17px}.card b{display:block;font-size:1.55rem;color:#8de0d7}.card small{color:#b6ccda}.panel{margin:16px 0;overflow:auto}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.primary{background:#22a1a5;border:0;border-radius:8px;padding:9px 13px;color:#06232c;font-weight:700}.muted{color:#a8bac5;font-size:.85rem}.warn{color:#ffd181}.danger{color:#ff9b98}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:11px 9px;border-bottom:1px solid #31516a;text-align:left}th{color:#a6c5d3;font-size:.8rem}label{display:grid;gap:5px;color:#c4dce5}input,select{background:#0d2030;border:1px solid #46677d;border-radius:7px;color:white;padding:9px;min-width:0}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form button{grid-column:1/-1}.notice{border:1px solid #4b7183;padding:10px 14px;margin:0;background:#133348;color:#d4eef1}dialog{border:1px solid #568397;border-radius:13px;background:#142b3d;color:white;max-width:480px;width:calc(100% - 25px)}dialog::backdrop{background:#081621cc}dialog h2{margin-top:0}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}header{display:block}}@media print{body{display:none}}
</style></head><body><div class="notice">Interactive preview · fictional records · data lasts only until this tab closes · do not enter confidential information</div><header><div><b>RenewGuard OS</b><small>Vendor contract renewal command center</small></div><span>OFFLINE PREVIEW · NO ACCOUNT</span></header><nav id="nav"></nav><main id="main"></main><dialog id="dialog"><h2 id="formTitle"></h2><form id="form" class="form"></form></dialog><script>
(()=>{'use strict';const tabs=['Dashboard','Vendors','Contracts','Notice Deadlines','Renewal Decisions','Cost Analysis'];let active='Dashboard';const today=new Date();const shift=n=>{let d=new Date(today);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};let vendors=['Atlas Software','Harbor Insurance','Northline Telecom'];let contracts=[{vendor:'Atlas Software',name:'Workspace seats',end:shift(68),notice:45,amount:1280,frequency:'Monthly',owner:'Operations',decision:'Review'},{vendor:'Harbor Insurance',name:'Business policy',end:shift(110),notice:60,amount:17200,frequency:'Annual',owner:'Finance',decision:'Renew'},{vendor:'Northline Telecom',name:'Internet service',end:shift(38),notice:30,amount:620,frequency:'Monthly',owner:'IT',decision:'Renegotiate'}];const $=id=>document.getElementById(id),nav=$('nav'),main=$('main'),form=$('form'),dialog=$('dialog'),formTitle=$('formTitle'),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),date=c=>{let d=new Date(c.end+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-Number(c.notice));return d.toISOString().slice(0,10)},days=s=>Math.ceil((new Date(s+'T12:00:00Z')-today)/86400000),annual=c=>Number(c.amount)*({Monthly:12,Quarterly:4,Weekly:52,Annual:1}[c.frequency]||0),money=n=>'$'+Math.round(n).toLocaleString('en-US'),table=(heads,rows)=>'<table><thead><tr>'+heads.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>',panel=(title,body)=>'<section class="panel"><h2>'+title+'</h2>'+body+'</section>';function render(){nav.innerHTML=tabs.map(t=>'<button type="button" data-tab="'+t+'" class="'+(active===t?'on':'')+'">'+t+'</button>').join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.tab;render()});let h='<h1>'+active+'</h1><p>Explore how recorded contracts, notice dates and costs connect. All changes stay in this tab.</p>';if(active==='Dashboard'){let due=contracts.filter(c=>days(date(c))<=30).length;h+='<div class="grid"><div class="card"><small>Active contracts</small><b>'+contracts.length+'</b></div><div class="card"><small>Annualized spend</small><b>'+money(contracts.reduce((a,c)=>a+annual(c),0))+'</b></div><div class="card"><small>Notice dates within 30 days</small><b>'+due+'</b></div><div class="card"><small>90-day renewal exposure</small><b>'+money(contracts.filter(c=>days(c.end)<=90).reduce((a,c)=>a+annual(c),0))+'</b></div></div>';h+=panel('Upcoming notice deadlines',table(['Contract','Vendor','Notice by','Days left'],contracts.slice().sort((a,b)=>date(a).localeCompare(date(b))).map(c=>[esc(c.name),esc(c.vendor),date(c),days(date(c))])))}else if(active==='Vendors'){h+=panel('Vendor register','<div class="row"><p>'+vendors.length+' fictional and session-only vendors</p><button class="primary" data-add="vendor">Add vendor</button></div>'+table(['Vendor'],vendors.map(v=>[esc(v)])))}else if(active==='Contracts'){h+=panel('Contract register','<div class="row"><p>Enter terms from the original agreement.</p><button class="primary" data-add="contract">Add contract</button></div>'+table(['Contract','Vendor','End date','Notice days','Owner','Annualized'],contracts.map(c=>[esc(c.name),esc(c.vendor),c.end,c.notice,esc(c.owner),money(annual(c))])))}else if(active==='Notice Deadlines'){h+=panel('Calculated notice windows',table(['Contract','Notice by','Days left','Renewal date'],contracts.slice().sort((a,b)=>date(a).localeCompare(date(b))).map(c=>[esc(c.name),date(c),'<span class="'+(days(date(c))<=14?'danger':days(date(c))<=30?'warn':'')+'">'+days(date(c))+'</span>',c.end]))+'<p class="muted">Calculated from entered end date minus notice days. Verify signed terms and delivery method.</p>')}else if(active==='Renewal Decisions'){h+=panel('Owner decisions',table(['Contract','Owner','Decision','Action'],contracts.map((c,i)=>[esc(c.name),esc(c.owner),esc(c.decision),'<select data-decision="'+i+'" aria-label="Decision for '+esc(c.name)+'">'+['Review','Renew','Renegotiate','Cancel'].map(x=>'<option '+(x===c.decision?'selected':'')+'>'+x+'</option>').join('')+'</select>'])))}else{h+=panel('Annualized contract cost',table(['Contract','Billing','Amount','Annualized'],contracts.map(c=>[esc(c.name),esc(c.frequency),money(c.amount),money(annual(c))]))+'<p class="muted">Monthly × 12, quarterly × 4, weekly × 52, annual × 1. These figures use the entered values.</p>')}main.innerHTML=h;main.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>open(b.dataset.add));main.querySelectorAll('[data-decision]').forEach(s=>s.onchange=()=>{contracts[Number(s.dataset.decision)].decision=s.value;render()})}function open(type){form.dataset.type=type;formTitle.textContent=type==='vendor'?'Add vendor':'Add contract';form.innerHTML=type==='vendor'?'<label>Vendor name<input name="name" required maxlength="80"></label>':'<label>Vendor<select name="vendor" required>'+vendors.map(v=>'<option>'+esc(v)+'</option>').join('')+'</select></label><label>Contract name<input name="name" required maxlength="80"></label><label>End date<input name="end" type="date" required></label><label>Notice days<input name="notice" type="number" min="0" max="365" value="30" required></label><label>Billing amount (USD)<input name="amount" type="number" min="0" step="0.01" required></label><label>Billing frequency<select name="frequency"><option>Monthly</option><option>Quarterly</option><option>Annual</option><option>Weekly</option></select></label><label>Owner<input name="owner" required maxlength="60"></label>';form.innerHTML+='<button class="primary" type="submit">Save session record</button><button type="button" id="cancel">Cancel</button>';$('cancel').onclick=()=>dialog.close();dialog.showModal()}form.onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(form));if(form.dataset.type==='vendor'){if(!vendors.includes(x.name))vendors.push(x.name)}else contracts.push({...x,notice:Number(x.notice),amount:Number(x.amount),decision:'Review'});dialog.close();render()};render()})();
</script></body></html>
