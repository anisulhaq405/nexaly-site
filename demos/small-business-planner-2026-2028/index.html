<!DOCTYPE html>
<html lang="en" dir="ltr">
<head><meta name="robots" content="noindex,nofollow,noarchive"><link rel="canonical" href="https://nexalyplanner.com/planners/small-business-planner-2026-2028/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NexalyPlanner — Planner 2026–2028</title>
<meta name="description" content="Offline planner and small-business dashboard.">
<meta name="theme-color" content="#0066cc" id="metaThemeColor">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NexalyPlanner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* ============================================================
   ALMANAC — Warm Editorial design system
   Teal = structure/action.  Terracotta = "now" (today only).
   ============================================================ */
:root{
  --paper:#f5f5f7;
  --surface:#ffffff;
  --surface-2:#f0f0f3;
  --ink:#1d1d1f;
  --ink-soft:#6e6e73;
  --ink-faint:#86868b;
  --line:#d2d2d7;
  --line-soft:#e8e8ed;
  --teal:#0066cc;
  --teal-deep:#004999;
  --teal-bright:#0071e3;
  --teal-wash:#e8f0fb;
  --on-accent:#fff;
  --now:#ff3b30;            /* iOS system red — reserved for TODAY/now */
  --now-wash:#ffedec;
  --sage:#34c759;
  --clay:#ff3b30;
  --gold:#ff9500;
  --slate:#5856d6;
  --plum:#af52de;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 20px rgba(0,0,0,.05);
  --shadow-lg:0 12px 40px rgba(0,0,0,.16);
  --radius:18px;
  --radius-sm:12px;
  --radius-pill:980px;
  --serif:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  --ar:"SF Arabic","Segoe UI","Noto Naskh Arabic",Tahoma,var(--sans);
}
html[data-theme="dark"]{
  --paper:#151517;
  --surface:#1d1d1f;
  --surface-2:#2a2a2c;
  --ink:#f5f5f7;
  --ink-soft:#a1a1a6;
  --ink-faint:#86868b;
  --line:#3a3a3c;
  --line-soft:#2c2c2e;
  --teal:#2997ff;
  --teal-deep:#0066cc;
  --teal-bright:#0a84ff;
  --teal-wash:#0a2843;
  --now:#ff453a;
  --now-wash:#3a1512;
  --sage:#30d158;
  --clay:#ff453a;
  --gold:#ff9f0a;
  --slate:#5e5ce6;
  --plum:#bf5af2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 20px rgba(0,0,0,.4);
  --shadow-lg:0 12px 44px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  font-size:16px;line-height:1.47;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
html[dir="rtl"] body{font-family:var(--ar)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--teal-wash)}
.serif{font-family:var(--serif)}
.hidden{display:none!important}

/* ---------- App frame ---------- */
#app{display:flex;height:100vh;height:100dvh}

/* ---------- Sidebar ---------- */
#sidebar{
  width:248px;flex-shrink:0;background:var(--surface);
  border-inline-end:1px solid var(--line);
  display:flex;flex-direction:column;
  transition:margin .28s cubic-bezier(.4,0,.2,1);
}
.brand{padding:22px 22px 16px;border-bottom:1px solid var(--line-soft)}
.brand-name{font-family:var(--serif);font-size:25px;font-weight:600;letter-spacing:.01em;line-height:1;display:flex;align-items:baseline;gap:7px}
.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--now);display:inline-block;transform:translateY(-2px)}
.brand-sub{font-size:11px;color:var(--ink-faint);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
html[dir="rtl"] .brand-sub{letter-spacing:0}
.nav{flex:1;overflow-y:auto;padding:12px 12px 20px}
.nav-group-label{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);padding:14px 12px 6px;font-weight:600}
html[dir="rtl"] .nav-group-label{letter-spacing:0}
.nav-item{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:9px 12px;border-radius:var(--radius-sm);
  color:var(--ink-soft);font-size:14px;font-weight:500;text-align:start;
  transition:background .12s,color .12s;position:relative;
}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.active{background:var(--teal-wash);color:var(--teal);font-weight:600}
.nav-item.active .nav-ic{color:var(--teal)}
.nav-ic{width:18px;height:18px;flex-shrink:0;color:var(--ink-faint);display:flex;align-items:center;justify-content:center}
.nav-ic svg{width:18px;height:18px;stroke-width:1.7}
.nav-sub{margin-inline-start:8px;border-inline-start:1px solid var(--line);padding-inline-start:6px}
.nav-sub .nav-item{padding-block:7px;font-size:13.5px}
.nav-badge{margin-inline-start:auto;background:var(--now);color:#fff;font-size:11px;font-weight:600;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
html[data-theme="dark"] .nav-badge{color:#fff}

/* ---------- Accent palettes (light + dark) ---------- */
html[data-palette="teal"]{--teal:#0d9488;--teal-deep:#0a6d64;--teal-bright:#14b8a6;--teal-wash:#e0f4f2;--on-accent:#fff}
html[data-theme="dark"][data-palette="teal"]{--teal:#12a394;--teal-deep:#0d9488;--teal-bright:#2dd4bf;--teal-wash:#062e2b}
html[data-palette="emerald"]{--teal:#059669;--teal-deep:#047551;--teal-bright:#10b981;--teal-wash:#e3f6ee;--on-accent:#fff}
html[data-theme="dark"][data-palette="emerald"]{--teal:#0ea371;--teal-deep:#059669;--teal-bright:#34d399;--teal-wash:#07301f}
html[data-palette="indigo"]{--teal:#4f46e5;--teal-deep:#3730b0;--teal-bright:#6366f1;--teal-wash:#ececfb;--on-accent:#fff}
html[data-theme="dark"][data-palette="indigo"]{--teal:#6366f1;--teal-deep:#4f46e5;--teal-bright:#818cf8;--teal-wash:#1e1c3a}
html[data-palette="violet"]{--teal:#9333ea;--teal-deep:#6f21b6;--teal-bright:#a855f7;--teal-wash:#f4e9fc;--on-accent:#fff}
html[data-theme="dark"][data-palette="violet"]{--teal:#a259f0;--teal-deep:#9333ea;--teal-bright:#c084fc;--teal-wash:#2a1338}
html[data-palette="rose"]{--teal:#e11d63;--teal-deep:#b0164c;--teal-bright:#ec4899;--teal-wash:#fce7f0;--on-accent:#fff}
html[data-theme="dark"][data-palette="rose"]{--teal:#f43f6e;--teal-deep:#e11d63;--teal-bright:#fb7ea3;--teal-wash:#3a121f}
html[data-palette="amber"]{--teal:#c2410c;--teal-deep:#9a3412;--teal-bright:#ea580c;--teal-wash:#fdece0;--on-accent:#fff}
html[data-theme="dark"][data-palette="amber"]{--teal:#fb923c;--teal-deep:#f97316;--teal-bright:#fdba74;--teal-wash:#3a1e08;--on-accent:#1d1d1f}
html[data-palette="graphite"]{--teal:#3a3a3c;--teal-deep:#1d1d1f;--teal-bright:#545457;--teal-wash:#ececee;--on-accent:#fff}
html[data-theme="dark"][data-palette="graphite"]{--teal:#d1d1d6;--teal-deep:#a1a1a6;--teal-bright:#e8e8ed;--teal-wash:#2c2c2e;--on-accent:#1d1d1f}

/* ---------- Main ---------- */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{
  height:60px;flex-shrink:0;display:flex;align-items:center;gap:12px;
  padding:0 22px;background:var(--surface);border-bottom:1px solid var(--line);
}
.menu-btn{display:none;width:38px;height:38px;border-radius:10px;align-items:center;justify-content:center;color:var(--ink-soft)}
.menu-btn:hover{background:var(--surface-2)}
.year-switch{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px}
.year-btn{padding:6px 15px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink-soft);font-variant-numeric:tabular-nums;transition:.12s}
.year-btn:hover{color:var(--ink)}
.year-btn.active{background:var(--teal);color:var(--on-accent);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.search-wrap{flex:1;max-width:340px;position:relative;display:flex;align-items:center}
.search-wrap svg{position:absolute;inset-inline-start:12px;width:16px;height:16px;color:var(--ink-faint);pointer-events:none}
#search{
  width:100%;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius-pill);padding:8px 14px 8px 36px;font-size:13.5px;transition:.15s;
}
html[dir="rtl"] #search{padding:8px 36px 8px 12px}
#search:focus{outline:none;border-color:var(--teal);background:var(--surface)}
.top-spacer{flex:1}
.icon-btn{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:.12s;position:relative}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:19px;height:19px;stroke-width:1.7}
#content{flex:1;overflow-y:auto;padding:30px 34px 60px;scroll-behavior:smooth}
.wrap{max-width:1280px;margin:0 auto}

/* ---------- Headings / shared ---------- */
.page-eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--now);font-weight:600;margin-bottom:9px}
html[dir="rtl"] .page-eyebrow{letter-spacing:0}
.page-title{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1.08;letter-spacing:-.01em}
.page-title.big{font-size:44px}
.page-desc{color:var(--ink-soft);margin-top:8px;font-size:14.5px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:30px 0 14px}
.section-head h2{font-family:var(--serif);font-size:19px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:20px}
.muted{color:var(--ink-faint)}
.empty{color:var(--ink-faint);font-size:14px;padding:22px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius);background:var(--surface-2)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 17px;border-radius:var(--radius-pill);font-size:13.5px;font-weight:600;transition:.14s;border:1px solid transparent}
.btn svg{width:16px;height:16px;stroke-width:2}
.btn-primary{background:var(--teal);color:var(--on-accent)}
.btn-primary:hover{background:var(--teal-deep)}
.btn-ghost{background:var(--surface-2);border-color:var(--line);color:var(--ink-soft)}
.btn-ghost:hover{color:var(--ink);border-color:var(--ink-faint)}
.btn-sm{padding:6px 11px;font-size:12.5px}

/* pills / tags */
.tag-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;line-height:1.4}
.tag-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ---------- Dashboard ---------- */
.masthead{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:6px}
.masthead .date-lg{font-family:var(--serif);font-size:46px;font-weight:600;line-height:1;letter-spacing:-.02em}
.masthead .date-sub{font-size:15px;color:var(--ink-soft);margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.now-chip{display:inline-flex;align-items:center;gap:6px;background:var(--now-wash);color:var(--now);padding:4px 11px;border-radius:20px;font-size:12.5px;font-weight:600}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:20px;align-items:start}
.dash-grid .col{display:flex;flex-direction:column;gap:16px}
.mini-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.mini-head h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
html[dir="rtl"] .mini-head h3{letter-spacing:0}
.mini-head .count{font-size:12px;color:var(--ink-faint);font-weight:600}
.capture-box{display:flex;gap:8px}
.capture-box input{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:14px;transition:.15s}
.capture-box input:focus{outline:none;border-color:var(--teal);background:var(--surface)}

/* task rows */
.task-row{display:flex;align-items:flex-start;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line-soft)}
.task-row:last-child{border-bottom:none}
.check{width:20px;height:20px;border-radius:6px;border:2px solid var(--ink-faint);flex-shrink:0;margin-top:1px;transition:.14s;display:flex;align-items:center;justify-content:center;cursor:pointer}
.check:hover{border-color:var(--teal)}
.check.done{background:var(--teal);border-color:var(--teal)}
.check.done svg{width:12px;height:12px;color:var(--on-accent);stroke-width:3}
.task-body{flex:1;min-width:0}
.task-text{font-size:14px;line-height:1.45;word-break:break-word}
.task-row.is-done .task-text{color:var(--ink-faint);text-decoration:line-through}
.task-meta{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.task-date{font-size:11.5px;color:var(--ink-faint);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.task-date.is-today{color:var(--now)}
.task-del{opacity:0;color:var(--ink-faint);width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.12s}
.task-row:hover .task-del{opacity:1}
.task-del:hover{background:var(--now-wash);color:var(--clay)}
.task-del svg{width:15px;height:15px}
.prio{width:6px;align-self:stretch;border-radius:3px;flex-shrink:0}
.prio.high{background:var(--clay)}
.prio.med{background:var(--gold)}
.prio.low{background:var(--sage)}

/* ---------- Calendar: year ---------- */
.year-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:24px}
.mini-cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px;cursor:pointer;transition:.16s}
.mini-cal:hover{border-color:var(--teal);box-shadow:var(--shadow);transform:translateY(-2px)}
.mini-cal h4{font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:11px;text-transform:capitalize}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mini-grid span{font-size:10px;text-align:center;padding:3px 0;color:var(--ink-soft);border-radius:5px;font-variant-numeric:tabular-nums}
.mini-grid .wd{color:var(--ink-faint);font-weight:700;font-size:9px}
.mini-grid .today{background:var(--now);color:#fff;font-weight:700}
.mini-grid .has{position:relative}
.mini-grid .has::after{content:"";position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--teal)}

/* ---------- Calendar: month ---------- */
.cal-toolbar{display:flex;align-items:center;gap:14px;margin:22px 0 16px}
.cal-toolbar .nav-arrows{display:flex;gap:4px}
.nav-arrow{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:.12s}
.nav-arrow:hover{border-color:var(--teal);color:var(--teal)}
.nav-arrow svg{width:16px;height:16px;stroke-width:2}
html[dir="rtl"] .nav-arrow svg{transform:scaleX(-1)}
.cal-title{font-family:var(--serif);font-size:24px;font-weight:600;text-transform:capitalize}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--line)}
.month-grid .wd-head{background:var(--surface-2);padding:9px 0;text-align:center;font-size:11px;font-weight:700;color:var(--ink-faint);letter-spacing:.05em;text-transform:uppercase}
.mcell{background:var(--surface);min-height:104px;padding:8px 9px;cursor:pointer;transition:.1s;display:flex;flex-direction:column;gap:5px}
.mcell:hover{background:var(--surface-2)}
.mcell.dim{background:var(--surface-2);opacity:.55}
.mcell .dnum{font-size:13px;font-weight:600;color:var(--ink-soft);font-variant-numeric:tabular-nums;width:25px;height:25px;display:flex;align-items:center;justify-content:center;border-radius:7px}
.mcell.is-today .dnum{background:var(--now);color:#fff}
.mcell .mtask{font-size:11px;background:var(--teal-wash);color:var(--teal);border-radius:5px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;line-height:1.4}
.mcell .mtask.done{opacity:.5;text-decoration:line-through}
.mcell .more{font-size:10.5px;color:var(--ink-faint);font-weight:600;padding-inline-start:4px}

/* ---------- Week ---------- */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-top:20px}
.wday{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px;min-height:230px;display:flex;flex-direction:column}
.wday.is-today{border-color:var(--now);box-shadow:0 0 0 1px var(--now)}
.wday-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px;padding-bottom:9px;border-bottom:1px solid var(--line-soft)}
.wday-name{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.wday.is-today .wday-name{color:var(--now)}
.wday-num{font-family:var(--serif);font-size:20px;font-weight:600}
.wtask{font-size:12px;padding:6px 8px;border-radius:7px;background:var(--surface-2);margin-bottom:6px;display:flex;gap:6px;align-items:flex-start;line-height:1.4;cursor:pointer}
.wtask:hover{background:var(--teal-wash)}
.wtask.done{opacity:.5;text-decoration:line-through}
.wtask .wdot{width:7px;height:7px;border-radius:50%;background:var(--teal);margin-top:4px;flex-shrink:0}
.wadd{margin-top:auto;font-size:12px;color:var(--ink-faint);font-weight:600;padding:6px;border-radius:7px;text-align:center;border:1px dashed var(--line);transition:.12s}
.wadd:hover{color:var(--teal);border-color:var(--teal)}

/* ---------- Day ---------- */
.day-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.day-cols{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.timeblocks{display:flex;flex-direction:column}
.tblock{display:flex;gap:14px;padding:9px 0;border-bottom:1px solid var(--line-soft);min-height:46px}
.tlabel{width:58px;flex-shrink:0;font-size:12px;color:var(--ink-faint);font-weight:600;padding-top:2px;font-variant-numeric:tabular-nums}
.tcontent{flex:1;border-radius:8px;padding:5px 9px;font-size:13.5px;transition:.1s;cursor:text;min-height:30px}
.tcontent:hover{background:var(--surface-2)}
.tcontent:empty::before{content:"";color:var(--ink-faint)}
.tcontent[contenteditable]:focus{outline:none;background:var(--teal-wash)}
.day-notes{width:100%;min-height:180px;background:transparent;border:none;resize:vertical;font-size:14px;line-height:1.65;color:var(--ink)}
.day-notes:focus{outline:none}

/* ---------- Tag summary ---------- */
.tagsum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:24px}
.tagsum-col .tsc-head{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.tsc-head .tag-dot{width:11px;height:11px}
.tsc-head h3{font-size:14px;font-weight:700}
.tsc-head .tsc-count{margin-inline-start:auto;font-size:12px;color:var(--ink-faint);font-weight:600;background:var(--surface-2);padding:2px 9px;border-radius:12px}

/* ---------- Habits ---------- */
.habit-row{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line-soft)}
.habit-row:last-child{border-bottom:none}
.habit-info{min-width:0}
.habit-name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px}
.habit-streak{font-size:12px;color:var(--ink-faint);margin-top:4px;display:flex;align-items:center;gap:5px}
.habit-streak b{color:var(--now)}
.habit-week{display:flex;gap:6px}
.hbox{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.12s;font-size:9px;color:var(--ink-faint);font-weight:700;gap:1px}
.hbox:hover{border-color:var(--teal)}
.hbox .hd{font-size:12px;font-weight:700;color:var(--ink-soft)}
.hbox.on{background:var(--teal);border-color:var(--teal)}
.hbox.on .hd,.hbox.on{color:var(--on-accent)}
.hbox.is-today{border-color:var(--now)}
.hbox.on.is-today{background:var(--now);border-color:var(--now)}

/* ---------- Notes ---------- */
.note-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.note-card textarea{width:100%;min-height:70px;border:none;background:transparent;resize:vertical;font-size:14px;line-height:1.6}
.note-card textarea:focus{outline:none}
.note-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft)}
.note-time{font-size:11.5px;color:var(--ink-faint)}

/* ---------- Settings ---------- */
.set-block{max-width:640px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 0;border-bottom:1px solid var(--line-soft)}
.set-row:last-child{border-bottom:none}
.set-label{font-size:14.5px;font-weight:600}
.set-hint{font-size:12.5px;color:var(--ink-faint);margin-top:3px;max-width:360px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{padding:7px 14px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink-soft);transition:.12s}
.seg button.active{background:var(--surface);color:var(--teal);box-shadow:var(--shadow)}
.lang-select{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:14px;font-weight:600;min-width:150px}
.lang-select:focus{outline:none;border-color:var(--teal)}

/* ---------- Modal / dropdown ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,24,26,.44);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .18s}
.modal{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);width:100%;max-width:440px;padding:26px;animation:pop .22s cubic-bezier(.34,1.4,.5,1)}
.modal h3{font-family:var(--serif);font-size:22px;font-weight:600;margin-bottom:6px}
.modal p.sub{color:var(--ink-soft);font-size:14px;margin-bottom:20px}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:7px}
html[dir="rtl"] .field label{letter-spacing:0}
.field input,.field select,.field textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14.5px;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal);background:var(--surface)}
.tag-choose{display:flex;flex-wrap:wrap;gap:7px}
.tag-opt{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:20px;border:1.5px solid var(--line);font-size:12.5px;font-weight:600;transition:.12s}
.tag-opt:hover{border-color:var(--ink-faint)}
.tag-opt.sel{border-color:currentColor;background:var(--surface-2)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
.dd{position:absolute;top:52px;inset-inline-end:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:7px;z-index:55;min-width:190px;animation:pop .16s}
.dd-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;font-size:14px;font-weight:500;width:100%;text-align:start;color:var(--ink-soft);transition:.1s}
.dd-item:hover{background:var(--surface-2);color:var(--ink)}
.dd-item.on{color:var(--teal);font-weight:600}
.dd-check{margin-inline-start:auto;color:var(--teal)}
.dd-flag{font-size:17px;width:22px;text-align:center}

/* onboarding */
.ob-langs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:20px 0 6px}
.ob-lang{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:14.5px;font-weight:600;transition:.12s;text-align:start}
.ob-lang:hover{border-color:var(--teal);background:var(--surface-2)}
.ob-lang.sel{border-color:var(--teal);background:var(--teal-wash);color:var(--teal)}
.ob-lang .dd-flag{font-size:20px}

/* toast */
#toast{position:fixed;bottom:26px;inset-inline-start:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);z-index:80;opacity:0;transition:.28s;pointer-events:none}
html[dir="rtl"] #toast{transform:translateX(50%) translateY(20px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
html[dir="rtl"] #toast.show{transform:translateX(50%) translateY(0)}

/* search results */
.search-results{position:absolute;top:46px;inset-inline-start:0;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);max-height:360px;overflow-y:auto;z-index:50;padding:7px}
.sr-item{padding:10px 12px;border-radius:9px;cursor:pointer;transition:.1s}
.sr-item:hover{background:var(--surface-2)}
.sr-kind{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--now);font-weight:700}
.sr-text{font-size:14px;margin-top:2px}

@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}}
.viewfade{animation:viewin .22s ease}

/* scrollbars */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:2px solid var(--surface)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-faint)}

/* ---------- Projects ---------- */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:22px}
.proj-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;transition:.16s;box-shadow:var(--shadow)}
.proj-card:hover{border-color:var(--teal);transform:translateY(-2px)}
.proj-card-top{margin-bottom:11px}
.status-badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.03em}
html[dir="rtl"] .status-badge{letter-spacing:0}
.status-active{background:var(--teal-wash);color:var(--teal)}
.status-onhold{background:var(--now-wash);color:var(--gold)}
.status-done{background:rgba(91,123,90,.16);color:var(--sage)}
.proj-name{font-family:var(--serif);font-size:19px;font-weight:600;margin-bottom:6px;line-height:1.2;word-break:break-word}
.proj-brief{font-size:13px;color:var(--ink-soft);line-height:1.5;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pbar{height:7px;background:var(--line);border-radius:6px;overflow:hidden}
.pbar-fill{height:100%;background:var(--teal);border-radius:6px;transition:width .35s}
.proj-meta{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--ink-faint);font-weight:600;font-variant-numeric:tabular-nums}
.proj-head{display:flex;gap:24px;align-items:flex-start}
.proj-title-input{font-family:var(--serif);font-size:30px;font-weight:600;width:100%;background:transparent;border:none;border-bottom:1px solid transparent;padding:2px 0;letter-spacing:-.01em;color:var(--ink)}
.proj-title-input:focus{outline:none;border-bottom-color:var(--teal)}
.proj-brief-input{width:100%;background:transparent;border:none;resize:vertical;font-size:14px;color:var(--ink-soft);line-height:1.55;margin-top:8px;min-height:24px;font-family:var(--sans)}
.proj-brief-input:focus{outline:none}
.proj-side{width:196px;flex-shrink:0}
.proj-prog-label{font-size:12px;color:var(--ink-faint);font-weight:600;margin-top:7px}
.ptabs{display:flex;gap:4px;margin:24px 0 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ptab{padding:10px 15px;font-size:14px;font-weight:600;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px;transition:.12s}
.ptab:hover{color:var(--ink)}
.ptab.active{color:var(--teal);border-bottom-color:var(--teal)}
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.kcol{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;min-height:130px}
.kcol-head{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);padding:2px 4px 11px}
html[dir="rtl"] .kcol-head{letter-spacing:0}
.kdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.kdot-todo{background:var(--slate)}.kdot-doing{background:var(--teal)}.kdot-done{background:var(--sage)}
.kcount{margin-inline-start:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1px 8px;font-size:11px}
.kcards{display:flex;flex-direction:column;gap:8px;min-height:12px}
.kcard{background:var(--surface);border:1px solid var(--line);border-inline-start:3px solid var(--teal);border-radius:9px;padding:10px 11px;box-shadow:var(--shadow);cursor:grab}
.kcard:active{cursor:grabbing}
.kcard-todo{border-inline-start-color:var(--slate)}
.kcard-doing{border-inline-start-color:var(--teal)}
.kcard-done{border-inline-start-color:var(--sage)}
.kcard-text{font-size:13.5px;line-height:1.42;word-break:break-word}
.kcard-ctl{display:flex;gap:2px;margin-top:8px;opacity:.35;transition:.12s}
.kcard:hover .kcard-ctl{opacity:1}
.kcard-ctl button{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint)}
.kcard-ctl button:hover{background:var(--surface-2);color:var(--ink)}
.kcard-ctl button svg{width:14px;height:14px}
.kcard-ctl .kdel{margin-inline-start:auto}
.kcard-ctl .kdel:hover{background:var(--now-wash);color:var(--clay)}
html[dir="rtl"] .kcard-ctl button.kmove svg{transform:scaleX(-1)}
.kadd{display:flex;gap:6px;margin-top:10px}
.kadd input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.kadd input:focus{outline:none;border-color:var(--teal)}
.kadd button{width:34px;flex-shrink:0;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);font-size:18px;font-weight:600}
.kadd button:hover{border-color:var(--teal);color:var(--teal)}
.inline-add{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.inline-add input:not([type=date]){flex:1;min-width:150px}
.inline-add input{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:14px}
.inline-add input:focus{outline:none;border-color:var(--teal);background:var(--surface)}
.mile-row{display:flex;align-items:flex-start;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line-soft)}
.mile-row:last-child{border-bottom:none}
.mile-row.is-done .task-text{color:var(--ink-faint);text-decoration:line-through}
.meet-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.meet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px}
.meet-card textarea{width:100%;min-height:56px;border:none;background:transparent;resize:vertical;font-size:13.5px;line-height:1.55;color:var(--ink)}
.meet-card textarea:focus{outline:none}
.dec-row{display:flex;align-items:flex-start;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line-soft)}
.dec-row:last-child{border-bottom:none}
.dec-dot{width:9px;height:9px;border-radius:50%;background:var(--plum);margin-top:5px;flex-shrink:0}

/* ---------- Goals ---------- */
.goals-overall{margin-top:20px}
.quarter-sec{margin-top:26px}
.quarter-head{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:13px}
html[dir="rtl"] .quarter-head{letter-spacing:0}
.quarter-head .q-count{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:1px 8px;font-size:11px;letter-spacing:0}
.goal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.goal-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;transition:.16s;box-shadow:var(--shadow)}
.goal-card:hover{border-color:var(--teal);transform:translateY(-2px)}
.goal-card.is-done{opacity:.72}
.goal-title{font-family:var(--serif);font-size:18px;font-weight:600;margin-top:11px;line-height:1.25;word-break:break-word}
.goal-card.is-done .goal-title{text-decoration:line-through;text-decoration-color:var(--ink-faint)}
.goal-selects{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.goal-selects .lang-select{min-width:auto;flex:1;font-weight:500;padding:8px 10px}

/* ---------- Trackers: Finance / Bills ---------- */
.fin-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.fin-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.fin-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
html[dir="rtl"] .fin-label{letter-spacing:0}
.fin-amt{font-family:var(--serif);font-size:23px;font-weight:600;margin-top:8px;font-variant-numeric:tabular-nums;word-break:break-word}
.fin-dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex-shrink:0}
.fin-row-amt{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;align-self:center;white-space:nowrap}
.cur-input{width:60px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;font-weight:600;text-align:center}
.cur-input:focus{outline:none;border-color:var(--teal)}
/* ---------- Trackers: Reading ---------- */
.book-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.book-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.book-title{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.25;word-break:break-word}
.book-author{font-size:13px;color:var(--ink-soft);margin-top:3px}
.stars{display:flex;gap:2px;margin-top:10px}
.star{font-size:18px;color:var(--line);cursor:pointer;transition:.1s;line-height:1}
.star.on{color:var(--gold)}
.star:hover{transform:scale(1.15)}
.book-actions{display:flex;gap:5px;margin-top:12px;flex-wrap:wrap}
.book-st{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:8px;border:1px solid var(--line);color:var(--ink-soft);transition:.12s}
.book-st:hover{border-color:var(--teal);color:var(--teal)}
.book-st.active{background:var(--teal);border-color:var(--teal);color:var(--on-accent)}

/* ---------- Trackers: Health ---------- */
.hm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:16px}
.hm-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.hm-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.hm-input-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hm-input-row input{width:110px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:15px;font-weight:600}
.hm-input-row input:focus{outline:none;border-color:var(--teal);background:var(--surface)}
.hm-recent{display:flex;gap:4px}
.hm-day{flex:1;text-align:center;background:var(--surface-2);border-radius:7px;padding:6px 2px}
.hm-day.is-today{background:var(--teal-wash)}
.hm-d{display:block;font-size:9px;color:var(--ink-faint);font-weight:700}
.hm-v{display:block;font-size:12px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.hm-day.is-today .hm-v{color:var(--teal)}
/* ---------- Trackers: Mood ---------- */
.mood-pick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.mood-opt{display:flex;align-items:center;gap:8px;padding:9px 13px;border:1.5px solid var(--line);border-radius:11px;font-size:13.5px;font-weight:600;transition:.12s}
.mood-opt:hover{border-color:var(--mc)}
.mood-opt.sel{border-color:var(--mc);background:var(--surface-2)}
.mood-face{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.mood-note{width:100%;min-height:60px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;resize:vertical;font-size:14px;line-height:1.5;color:var(--ink)}
.mood-note:focus{outline:none;border-color:var(--teal);background:var(--surface)}
.mood-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mood-wd{text-align:center;font-size:10px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;padding-bottom:2px}
.mood-cell{aspect-ratio:1;min-height:34px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border-radius:8px;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;font-variant-numeric:tabular-nums;transition:.1s}
.mood-cell:hover{transform:scale(1.06)}
.mood-cell.is-today{outline:2px solid var(--now);outline-offset:-2px}

/* ---------- Business: Orders / Inventory / Suppliers ---------- */
.ord-badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;cursor:pointer;transition:.12s}
.ord-badge:hover{filter:brightness(.94)}
.inv-stepper{display:flex;align-items:center;gap:4px;align-self:center}
.inv-stepper button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:16px;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;justify-content:center}
.inv-stepper button:hover{border-color:var(--teal);color:var(--teal)}
.inv-count{min-width:34px;text-align:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.inv-count.low{color:var(--clay)}
.inv-alert{display:inline-block;background:var(--now-wash);color:var(--clay);font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:10px;margin-inline-start:4px;vertical-align:middle}
.sup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:20px}
.sup-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.sup-line{font-size:13px;color:var(--ink-soft);margin-top:5px;word-break:break-word}
.sup-prod{font-size:12.5px;color:var(--teal);background:var(--teal-wash);border-radius:8px;padding:5px 9px;margin-top:10px;display:inline-block}
.sup-notes{font-size:13px;color:var(--ink-soft);margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft);line-height:1.5;white-space:pre-wrap}

/* ---------- Business: Campaigns ---------- */
.roas-badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;background:var(--surface-2)}
.camp-fields{display:flex;gap:10px;margin-top:12px}
.camp-fields label{flex:1;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);display:flex;flex-direction:column;gap:5px}
html[dir="rtl"] .camp-fields label{letter-spacing:0}
.camp-fields input{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;font-weight:600;color:var(--ink)}
.camp-fields input:focus{outline:none;border-color:var(--teal);background:var(--surface)}
/* ---------- Business: P&L ---------- */
.pnl-hero{margin-top:16px;text-align:center;padding:26px}
.pnl-net{font-family:var(--serif);font-size:42px;font-weight:600;margin:8px 0 18px;font-variant-numeric:tabular-nums;word-break:break-word}
.pnl-bar{height:12px;background:var(--clay);border-radius:6px;overflow:hidden}
.pnl-bar-rev{height:100%;background:var(--sage);transition:width .35s}
.pnl-bar-legend{display:flex;justify-content:space-between;margin-top:10px;font-size:12.5px;font-weight:600;flex-wrap:wrap;gap:8px}
.pnl-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}

/* ============================================================
   DATE HELPERS  (local, no UTC parsing bugs)
   ============================================================ */
const pad=n=>String(n).padStart(2,"0");
const ymd=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;      // m is 0-based
const todayKey=()=>{const n=new Date();return ymd(n.getFullYear(),n.getMonth(),n.getDate());};
function parseKey(k){const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d);}
function locale(){return (LANGS.find(l=>l.code===state.settings.lang)||LANGS[0]).locale;}
function monthName(y,m){return new Date(y,m,1).toLocaleDateString(locale(),{month:"long"});}
function weekdayLabels(){ // ordered by weekStart
  const base=[t("sun_s"),t("mon_s"),t("tue_s"),t("wed_s"),t("thu_s"),t("fri_s"),t("sat_s")];
  const ws=state.settings.weekStart; const out=[];
  for(let i=0;i<7;i++)out.push(base[(i+ws)%7]);
  return out;
}
function firstWeekdayOffset(y,m){ // how many blanks before day 1
  const dow=new Date(y,m,1).getDay(); // 0 Sun..6 Sat
  return (dow-state.settings.weekStart+7)%7;
}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate();}
function fmtLongDate(k){return parseKey(k).toLocaleDateString(locale(),{weekday:"long",day:"numeric",month:"long",year:"numeric"});}
function fmtShortDate(k){return parseKey(k).toLocaleDateString(locale(),{day:"numeric",month:"short"});}
function addDays(k,n){const d=parseKey(k);d.setDate(d.getDate()+n);return ymd(d.getFullYear(),d.getMonth(),d.getDate());}
function weekNumber(k){const d=parseKey(k);const s=new Date(d.getFullYear(),0,1);return Math.ceil((((d-s)/86400000)+s.getDay()+1)/7);}
function startOfWeek(k){const d=parseKey(k);const off=(d.getDay()-state.settings.weekStart+7)%7;d.setDate(d.getDate()-off);return ymd(d.getFullYear(),d.getMonth(),d.getDate());}

        </div>
      </div>

}
function dashKpis(){
  const tk=todayKey();
  const todayTasks=state.tasks.filter(x=>x.date===tk);
  const todayDone=todayTasks.filter(x=>x.done).length;
  const openTasks=state.tasks.filter(x=>!x.done).length;
  let wkRev=0;for(let i=0;i<7;i++){const k=addDays(tk,-i);wkRev+=state.orders.filter(o=>o.status!=="cancelled"&&o.date===k).reduce((s,o)=>s+(+o.amount||0),0);}
  const habitsDone=state.habits.filter(hb=>hb.log&&hb.log[tk]).length;
  const kpi=(val,label,color,ic)=>`<div class="dash-kpi" style="--dk:${color}"><div class="dk-ic">${svg(ic,1.9)}</div><div class="dk-val">${val}</div><div class="dk-label">${label}</div></div>`;
  return `<div class="dash-kpis">
    ${kpi(todayDone+"/"+todayTasks.length,t("dk_today"),"var(--teal)",IC.check)}
    ${kpi(curFmt(wkRev),t("dk_week_rev"),"var(--sage)",'<path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>')}
    ${kpi(openTasks,t("dk_open"),"var(--gold)",IC.tasks)}
    ${kpi(habitsDone+"/"+state.habits.length,t("dk_habits"),"var(--plum)",IC.trackers)}
  </div>`;
}
function dashHabit(hb,tk){
  const on=hb.log&&hb.log[tk];
  return `<div class="task-row">
    <div class="check ${on?'done':''}" onclick="toggleHabit('${hb.id}','${tk}')">${on?svg(IC.check,3):""}</div>
    <div class="task-body"><div class="task-text">${esc(hb.name)}</div></div>
  </div>`;
}
function quickCapture(){
  const el=document.getElementById("capInput");const v=el.value.trim();if(!v)return;
  state.tasks.push({id:uid(),text:v,date:todayKey(),tag:null,priority:null,done:false,createdAt:Date.now()});
  save();el.value="";renderNav();render();setTimeout(()=>{const c=document.getElementById("capInput");if(c)c.focus();},30);
}

/* ============================================================
   TASK rendering + logic
   ============================================================ */
function taskSort(a,b){
  if(a.done!==b.done)return a.done?1:-1;
  const p={high:0,med:1,low:2,null:3,undefined:3};
  if((p[a.priority]??3)!==(p[b.priority]??3))return (p[a.priority]??3)-(p[b.priority]??3);
  if(a.date&&b.date)return a.date<b.date?-1:1;
  return (a.createdAt||0)-(b.createdAt||0);
}

/* ============================================================
   VIEW: YEAR
   ============================================================ */
function viewYear(){
  const y=state.year;
  const tk=todayKey();
  let cells="";
  for(let m=0;m<12;m++){
    cells+=miniCal(y,m,tk);
  }
  return `<div class="page-eyebrow">${t("calendar")}</div>
  <h1 class="page-title big">${y}</h1>
  <div class="year-grid">${cells}</div>`;
}
function miniCal(y,m,tk){
  const wd=weekdayLabels();
  let g=wd.map(w=>`<span class="wd">${w[0]}</span>`).join("");
  const off=firstWeekdayOffset(y,m);const dim=daysInMonth(y,m);
  for(let i=0;i<off;i++)g+=`<span></span>`;
  for(let d=1;d<=dim;d++){
    const key=ymd(y,m,d);
    const isT=key===tk;
    const has=state.tasks.some(x=>x.date===key);
    g+=`<span class="${isT?'today':''} ${has&&!isT?'has':''}">${d}</span>`;
  }
  return `<div class="mini-cal" onclick="openMonth(${y},${m})"><h4>${monthName(y,m)}</h4><div class="mini-grid">${g}</div></div>`;
}
function openMonth(y,m){ui.calYear=y;ui.calMonth=m;state.year=y;syncYearSwitch();go("month");}

/* ============================================================
   VIEW: MONTH
   ============================================================ */
function viewMonth(){
  if(ui.calYear!==state.year){ui.calYear=state.year;}
  const y=ui.calYear,m=ui.calMonth,tk=todayKey();
  const wd=weekdayLabels();
  let head=wd.map(w=>`<div class="wd-head">${w}</div>`).join("");
  let cells="";
  const off=firstWeekdayOffset(y,m);const dim=daysInMonth(y,m);
  // leading (prev month)
  const prevDim=daysInMonth(m===0?y-1:y,(m+11)%12);
  for(let i=0;i<off;i++){cells+=`<div class="mcell dim"><div class="dnum">${prevDim-off+1+i}</div></div>`;}
  for(let d=1;d<=dim;d++){
    const key=ymd(y,m,d);const isT=key===tk;
    const dayTasks=state.tasks.filter(x=>x.date===key).sort(taskSort);
    let chips=dayTasks.slice(0,3).map(x=>`<div class="mtask ${x.done?'done':''}">${esc(x.text)}</div>`).join("");
    if(dayTasks.length>3)chips+=`<div class="more">+${dayTasks.length-3}</div>`;
    cells+=`<div class="mcell ${isT?'is-today':''}" onclick="openDay('${key}')"><div class="dnum">${d}</div>${chips}</div>`;
  }
  const rem=(off+dim)%7;if(rem){for(let i=1;i<=7-rem;i++)cells+=`<div class="mcell dim"><div class="dnum">${i}</div></div>`;}
  return `<div class="cal-toolbar">
    <div class="nav-arrows">
      <button class="nav-arrow" onclick="monthNav(-1)">${svg('<path d="m15 18-6-6 6-6"/>',2)}</button>
      <button class="nav-arrow" onclick="monthNav(1)">${svg('<path d="m9 18 6-6-6-6"/>',2)}</button>
    </div>
    <div class="cal-title">${monthName(y,m)} ${y}</div>
    <div style="margin-inline-start:auto"><button class="btn btn-ghost btn-sm" onclick="goToday()">${t("today")}</button></div>
  </div>
  <div class="month-grid">${head}${cells}</div>`;
}
function monthNav(dir){
  let m=ui.calMonth+dir,y=ui.calYear;
  if(m<0){m=11;y--;}if(m>11){m=0;y++;}
  if(y<2026){y=2026;m=0;}if(y>2028){y=2028;m=11;}
  ui.calMonth=m;ui.calYear=y;state.year=y;syncYearSwitch();render();
}
function goToday(){const tk=todayKey();const d=parseKey(tk);ui.calMonth=d.getMonth();ui.calYear=d.getFullYear();if(YEARS.includes(d.getFullYear())){state.year=d.getFullYear();syncYearSwitch();}render();}

   VIEW: HABITS
   ============================================================ */
function viewHabits(){
  const tk=todayKey();const start=startOfWeek(tk);
  const rows=state.habits.map(hb=>{
    const streak=habitStreak(hb);
    let boxes="";
    for(let i=0;i<7;i++){
      const key=addDays(start,i);const d=parseKey(key);const on=hb.log&&hb.log[key];const isT=key===tk;
      boxes+=`<div class="hbox ${on?'on':''} ${isT?'is-today':''}" onclick="toggleHabit('${hb.id}','${key}')">
        <span>${d.toLocaleDateString(locale(),{weekday:"short"}).slice(0,2)}</span><span class="hd">${d.getDate()}</span></div>`;
    }
    return `<div class="habit-row">
      <div class="habit-info">
        <div class="habit-name">${esc(hb.name)}
          <button class="task-del" style="opacity:.6" onclick="delHabit('${hb.id}')">${svg(IC.trash)}</button></div>
        <div class="habit-streak">🔥 <b>${streak}</b> ${t("streak")}</div>
      </div>
      <div class="habit-week">${boxes}</div>
    </div>`;
  }).join("");
  return `<div class="page-eyebrow">${t("trackers")}</div>
  <div class="section-head" style="margin-top:0">
    <h1 class="page-title">${t("habits")}</h1>
    <button class="btn btn-primary" onclick="openHabitModal()">${svg('<path d="M12 5v14M5 12h14"/>',2)} ${t("add_habit")}</button>
  </div>
  <p class="page-desc">${t("this_week")}</p>
  <div class="card pad" style="margin-top:16px">
    ${state.habits.length?rows:`<div class="empty">${t("no_habits_yet")}</div>`}
  </div>`;
}
function habitStreak(hb){
  if(!hb.log)return 0;let s=0;let k=todayKey();
  if(!hb.log[k])k=addDays(k,-1); // allow today not-yet-done
  while(hb.log[k]){s++;k=addDays(k,-1);}
  return s;
}
function toggleHabit(id,key){
  const hb=state.habits.find(h=>h.id===id);if(!hb)return;if(!hb.log)hb.log={};
  if(hb.log[key])delete hb.log[key];else hb.log[key]=true;
  save();render();
}

/* ============================================================
   VIEW: PROJECTS  (list + detail: Kanban / milestones / meetings / decisions)
   ============================================================ */
function projName(id){const p=state.projects.find(x=>x.id===id);return p?p.name:"";}
function currentProject(){return state.projects.find(p=>p.id===ui.openProject);}
function projectProgress(p){
  const k=p.kanban||{todo:[],doing:[],done:[]};
  const total=k.todo.length+k.doing.length+k.done.length;
  if(total>0)return Math.round(k.done.length/total*100);
  const ms=p.milestones||[];
  if(ms.length)return Math.round(ms.filter(m=>m.done).length/ms.length*100);
  return 0;
}
function viewProjects(){
  const p=currentProject();
  if(ui.openProject&&p)return viewProjectDetail(p);
  ui.openProject=null;
  return viewProjectList();
}
function viewProjectList(){
  const ps=state.projects.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

function projCard(p){
  const prog=projectProgress(p);
  const k=p.kanban||{todo:[],doing:[],done:[]};
  const tot=k.todo.length+k.doing.length+k.done.length;
  return `<div class="proj-card" onclick="openProject('${p.id}')">

function projBoard(p){

  return `<div class="kanban">${cols.map(([c,k])=>`

      <div class="kcards">${p.kanban[c].map(card=>kcard(p,c,card)).join("")}</div>
      <div class="kadd"><input id="kadd-${c}" placeholder="${t("card_ph")}" onkeydown="if(event.key==='Enter')addCard('${p.id}','${c}')"><button onclick="addCard('${p.id}','${c}')">+</button></div>
    </div>`).join("")}</div>`;
}
function kcard(p,col,card){
  const idx=["todo","doing","done"].indexOf(col);
  return `<div class="kcard kcard-${col}" draggable="true" ondragstart="dragCard(event,'${p.id}','${card.id}')">
    <div class="kcard-text">${esc(card.text)}</div>
    <div class="kcard-ctl">
      <button class="kmove" onclick="moveCard('${p.id}','${card.id}',-1)" ${idx===0?'style="visibility:hidden"':''}>${svg('<path d="m15 18-6-6 6-6"/>',2)}</button>
      <button class="kmove" onclick="moveCard('${p.id}','${card.id}',1)" ${idx===2?'style="visibility:hidden"':''}>${svg('<path d="m9 18 6-6-6-6"/>',2)}</button>
      <button class="kdel" onclick="delCard('${p.id}','${card.id}')">${svg(IC.trash)}</button>
    </div>
  </div>`;
}
let dragData=null;
function dragCard(e,pid,cid){dragData={pid,cid};if(e.dataTransfer)e.dataTransfer.effectAllowed="move";}
function dropCard(e,pid,col){
  e.preventDefault();if(!dragData||dragData.pid!==pid){dragData=null;return;}
  const p=state.projects.find(x=>x.id===pid);if(!p){dragData=null;return;}
  let card=null;
  ["todo","doing","done"].forEach(c=>{const i=p.kanban[c].findIndex(k=>k.id===dragData.cid);if(i>-1)card=p.kanban[c].splice(i,1)[0];});
  if(card){p.kanban[col].push(card);save();render();}
  dragData=null;
}
function moveCard(pid,cid,dir){
  const p=state.projects.find(x=>x.id===pid);if(!p)return;const cols=["todo","doing","done"];
  for(let i=0;i<3;i++){const arr=p.kanban[cols[i]];const idx=arr.findIndex(k=>k.id===cid);
    if(idx>-1){const ni=i+dir;if(ni<0||ni>2)return;const card=arr.splice(idx,1)[0];p.kanban[cols[ni]].push(card);save();render();return;}}
}
function addCard(pid,col){
  const el=document.getElementById("kadd-"+col);const v=el.value.trim();if(!v)return;
  const p=state.projects.find(x=>x.id===pid);p.kanban[col].push({id:uid(),text:v});save();render();
  setTimeout(()=>{const e=document.getElementById("kadd-"+col);if(e)e.focus();},20);
}
function delCard(pid,cid){const p=state.projects.find(x=>x.id===pid);if(!p)return;

function goalProgress(g){
  const kr=g.keyResults||[];

  return g.status==="done"?100:0;

  let sections="";
  QUARTERS.forEach(([q,k])=>{
    const gs=goals.filter(g=>(g.quarter||"year")===q);

function billMonthly(b){const a=+b.amount||0;return b.cycle==="yearly"?a/12:b.cycle==="weekly"?a*4.333:a;}
function viewBills(){
  const mk=todayKey().slice(0,7);const today=new Date().getDate();
  const monthlyTotal=state.bills.reduce((s,b)=>s+billMonthly(b),0);
  const bills=state.bills.slice().sort((a,b)=>(a.dueDay||99)-(b.dueDay||99));
  return `<div class="page-eyebrow">${t("trackers")}</div>

function billRow(b,mk,today){

    <div class="check ${paid?"done":""}" onclick="toggleBillPaid('${b.id}')">${paid?svg(IC.check,3):""}</div>
    <div class="task-body"><div class="task-text">${esc(b.name)}</div>
      <div class="task-meta"><span class="task-date">${t("cycle_"+b.cycle)}</span>${b.dueDay?`<span class="task-date ${overdue?"is-today":""}">${t("due_day")} ${b.dueDay}</span>`:""}</div></div>
    <div class="fin-row-amt">${curFmt(+b.amount||0)}</div>
    <button class="task-del" onclick="delBill('${b.id}')">${svg(IC.trash)}</button>

}

/* ============================================================
   TRACKER: HEALTH (customizable metrics)
   ============================================================ */
function viewHealth(){
  const H=state.health||(state.health={metrics:[],log:{}});
  if(!H.log)H.log={};
  const tk=todayKey();
  const rows=H.metrics.map(mt=>{
    const log=H.log[mt.id]||{};
    const todayVal=log[tk]!=null?log[tk]:"";
    let recent="";
    for(let i=6;i>=0;i--){const k=addDays(tk,-i);const v=log[k];const dd=parseKey(k);
      recent+=`<div class="hm-day ${k===tk?'is-today':''}"><span class="hm-d">${dd.getDate()}</span><span class="hm-v">${v!=null?v:'·'}</span></div>`;}
    return `<div class="hm-card">
      <div class="hm-head"><div><b>${esc(mt.name)}</b> ${mt.unit?`<span class="muted">· ${esc(mt.unit)}</span>`:""}</div>
        <button class="task-del" onclick="delMetric('${mt.id}')">${svg(IC.trash)}</button></div>
      <div class="hm-input-row">
        <input type="number" inputmode="decimal" id="hm-${mt.id}" value="${todayVal}" placeholder="${t("todays_value")}" onchange="logMetric('${mt.id}',this.value)">
        <span class="muted" style="font-size:12px">${t("today")}</span>
      </div>
      <div class="hm-recent">${recent}</div>
    </div>`;
  }).join("");
  return `<div class="page-eyebrow">${t("trackers")}</div>
  <div class="section-head" style="margin-top:0"><h1 class="page-title">${t("health")}</h1></div>
  <p class="page-desc">${t("health_desc")}</p>
  <div class="card pad" style="margin-top:16px">
    <div class="inline-add" style="margin-bottom:0">
      <input id="hmName" placeholder="${t("metric_name_ph")}" onkeydown="if(event.key==='Enter')addMetric()">
      <input id="hmUnit" placeholder="${t("unit_ph")}" style="max-width:120px">
      <button class="btn btn-primary btn-sm" onclick="addMetric()">${t("add")}</button>
    </div>
  </div>
  ${H.metrics.length?`<div class="hm-grid">${rows}</div>`:`<div class="empty" style="margin-top:16px">${t("no_metrics")}</div>`}`;
}
function addMetric(){const name=document.getElementById("hmName").value.trim();if(!name)return;
  const unit=document.getElementById("hmUnit").value.trim();
  if(!state.health)state.health={metrics:[],log:{}};
  state.health.metrics.push({id:uid(),name,unit});save();render();
  setTimeout(()=>{const e=document.getElementById("hmName");if(e)e.focus();},20);}
function logMetric(id,val){if(!state.health.log[id])state.health.log[id]={};const tk=todayKey();
  const n=parseFloat(val);if(val===""||isNaN(n))delete state.health.log[id][tk];else state.health.log[id][tk]=n;save();render();}
function delMetric(id){state.health.metrics=state.health.metrics.filter(m=>m.id!==id);delete state.health.log[id];save();render();}

/* ============================================================
   TRACKER: MOOD
   ============================================================ */
const MOODS=[
  {level:5,key:"mood_great",color:"var(--sage)"},
  {level:4,key:"mood_good", color:"var(--teal)"},
  {level:3,key:"mood_ok",   color:"var(--gold)"},
  {level:2,key:"mood_low",  color:"var(--slate)"},
  {level:1,key:"mood_bad",  color:"var(--clay)"}
];
const moodByLevel=l=>MOODS.find(m=>m.level===l);
function viewMood(){
  if(!state.mood)state.mood={};
  const tk=todayKey();const md=state.mood[tk];const todayLevel=(md&&md.level)||0;
  const y=state.year,m=ui.moodMonth;
  const wd=weekdayLabels();
  let head=wd.map(w=>`<div class="mood-wd">${w[0]}</div>`).join("");
  let cells="";
  const off=firstWeekdayOffset(y,m);const dim=daysInMonth(y,m);
  for(let i=0;i<off;i++)cells+=`<div></div>`;
  for(let dnum=1;dnum<=dim;dnum++){const k=ymd(y,m,dnum);const dm=state.mood[k];const mo=dm&&dm.level?moodByLevel(dm.level):null;
    cells+=`<div class="mood-cell ${k===tk?'is-today':''}" style="${mo?`background:${mo.color};color:#fff`:''}" onclick="setMoodDay('${k}')">${dnum}</div>`;}
  return `<div class="page-eyebrow">${t("trackers")}</div>
  <div class="section-head" style="margin-top:0"><h1 class="page-title">${t("mood")}</h1></div>
  <div class="card pad" style="margin-top:16px">
    <div class="mini-head"><h3>${t("how_today")}</h3></div>
    <div class="mood-pick">${MOODS.map(mo=>`<button class="mood-opt ${todayLevel===mo.level?'sel':''}" style="--mc:${mo.color}" onclick="pickMood(${mo.level})"><span class="mood-face" style="background:${mo.color}"></span>${t(mo.key)}</button>`).join("")}</div>
    <textarea class="mood-note" placeholder="${t("mood_note_ph")}" onblur="setMoodNote(this.value)">${esc((md&&md.note)||"")}</textarea>
  </div>
  <div class="card pad" style="margin-top:16px">
    <div class="cal-toolbar" style="margin:0 0 14px">
      <div class="nav-arrows"><button class="nav-arrow" onclick="moodNav(-1)">${svg('<path d="m15 18-6-6 6-6"/>',2)}</button><button class="nav-arrow" onclick="moodNav(1)">${svg('<path d="m9 18 6-6-6-6"/>',2)}</button></div>
      <div class="cal-title" style="font-size:18px">${monthName(y,m)} ${y}</div>
    </div>
    <div class="mood-grid">${head}${cells}</div>
  </div>`;
}
function pickMood(level){const tk=todayKey();if(!state.mood[tk])state.mood[tk]={};
  state.mood[tk].level=(state.mood[tk].level===level?0:level);
  if(!state.mood[tk].level&&!state.mood[tk].note)delete state.mood[tk];
  save();render();}
function setMoodDay(k){const cur=(state.mood[k]&&state.mood[k].level)||0;const order=[0,5,4,3,2,1];
  const next=order[(order.indexOf(cur)+1)%order.length];
  if(!state.mood[k])state.mood[k]={};state.mood[k].level=next;
  if(!next&&!state.mood[k].note)delete state.mood[k];
  save();render();}
function setMoodNote(val){const tk=todayKey();if(!state.mood[tk])state.mood[tk]={level:0};
  state.mood[tk].note=val;if(!val&&!state.mood[tk].level)delete state.mood[tk];save();}
function moodNav(dir){let m=ui.moodMonth+dir,y=state.year;if(m<0){m=11;y--;}if(m>11){m=0;y++;}
  if(y<2026){y=2026;m=0;}if(y>2028){y=2028;m=11;}ui.moodMonth=m;if(y!==state.year){state.year=y;buildYearSwitch();}render();}

/* ============================================================
   BUSINESS: P&L SNAPSHOT (computed from orders + finance + returns)
   ============================================================ */
function viewPnl(){
  const y=state.year,m=ui.pnlMonth;const mk=ymd(y,m,1).slice(0,7);
  const sales=state.orders.filter(o=>o.status!=="cancelled"&&o.date&&o.date.slice(0,7)===mk).reduce((s,o)=>s+(+o.amount||0),0);
  const otherIncome=state.finance.filter(e=>e.type==="income"&&e.date&&e.date.slice(0,7)===mk).reduce((s,e)=>s+(+e.amount||0),0);
  const expenses=state.finance.filter(e=>e.type==="expense"&&e.date&&e.date.slice(0,7)===mk).reduce((s,e)=>s+(+e.amount||0),0);
  const refunds=state.returns.filter(r=>r.date&&r.date.slice(0,7)===mk).reduce((s,r)=>s+(+r.amount||0),0);
  const revenue=sales+otherIncome;const costs=expenses+refunds;const net=revenue-costs;
  const revPct=(revenue+costs)>0?Math.round(revenue/(revenue+costs)*100):50;
  return `<div class="page-eyebrow">${t("business")}</div>
  <div class="section-head" style="margin-top:0"><h1 class="page-title">${t("pnl")}</h1></div>

/* ============================================================
   VIEW: INSIGHTS (live statistics from every module)
   ============================================================ */
function viewInsights(){
  const tk=todayKey();const rmk=tk.slice(0,7);
  if(!state.mood)state.mood={};
  const hasData=state.tasks.length||state.habits.length||state.projects.length||state.goals.length||state.orders.length||state.finance.length||Object.keys(state.mood).length;
  if(!hasData) return `<div class="page-eyebrow">${t("nav_system")}</div><h1 class="page-title">${t("insights")}</h1><div class="empty" style="margin-top:24px">${t("ins_empty")}</div>`;

  const monthTasks=state.tasks.filter(x=>x.date&&x.date.slice(0,7)===rmk);
  const monthDone=monthTasks.filter(x=>x.done).length;
  const completion=monthTasks.length?Math.round(monthDone/monthTasks.length*100):0;
  const best=state.habits.reduce((mx,h)=>Math.max(mx,habitStreak(h)),0);
  const activeProj=state.projects.filter(p=>p.status==="active").length;
  const yGoals=state.goals.filter(g=>g.year===state.year);
  const goalsAvg=yGoals.length?Math.round(yGoals.reduce((s,g)=>s+goalProgress(g),0)/yGoals.length):0;
  const moOrdersCount=state.orders.filter(o=>o.date&&o.date.slice(0,7)===rmk).length;
  const moRevenue=state.orders.filter(o=>o.status!=="cancelled"&&o.date&&o.date.slice(0,7)===rmk).reduce((s,o)=>s+(+o.amount||0),0);
  const moIncome=state.finance.filter(e=>e.type==="income"&&e.date&&e.date.slice(0,7)===rmk).reduce((s,e)=>s+(+e.amount||0),0);
  const moExp=state.finance.filter(e=>e.type==="expense"&&e.date&&e.date.slice(0,7)===rmk).reduce((s,e)=>s+(+e.amount||0),0);
  const moRef=state.returns.filter(r=>r.date&&r.date.slice(0,7)===rmk).reduce((s,r)=>s+(+r.amount||0),0);
  const moNet=(moRevenue+moIncome)-(moExp+moRef);
  const lowStock=state.inventory.filter(i=>i.stock<=i.reorderAt).length;
  const openRet=state.returns.filter(r=>!r.resolved).length;

  let activity=[],maxA=1;
  for(let i=13;i>=0;i--){const k=addDays(tk,-i);let c=0;state.habits.forEach(h=>{if(h.log&&h.log[k])c++;});activity.push({k,c});if(c>maxA)maxA=c;}
  const consist=state.habits.map(h=>{let done=0;for(let i=0;i<30;i++){if(h.log&&h.log[addDays(tk,-i)])done++;}return{h,pct:Math.round(done/30*100)};});
  const byTag=allTags().map(tg=>({tg,c:state.tasks.filter(x=>x.tag===tg.id&&!x.done).length})).filter(x=>x.c>0);
  const maxTag=byTag.reduce((mx,x)=>Math.max(mx,x.c),1);
  let moods=[];for(let i=0;i<30;i++){const dm=state.mood[addDays(tk,-i)];if(dm&&dm.level)moods.push(dm.level);}
  const moodAvg=moods.length?moods.reduce((a,b)=>a+b,0)/moods.length:0;
  const moodDist=MOODS.map(mo=>({mo,c:moods.filter(l=>l===mo.level).length}));
  const avgMood=moodAvg?moodByLevel(Math.round(moodAvg)):null;

  const stat=(val,label,color)=>`<div class="ins-stat"><div class="ins-stat-val" ${color?`style="color:${color}"`:""}>${val}</div><div class="ins-stat-label">${label}</div></div>`;

  return `<div class="page-eyebrow">${t("nav_system")}</div>
  <h1 class="page-title">${t("insights")}</h1>
  <p class="page-desc">${t("ins_desc")}</p>
  <div class="ins-grid">
    ${stat(monthDone,t("ins_tasks_done"))}
    ${stat(completion+"%",t("ins_completion"),"var(--teal)")}
    ${stat(best,t("ins_best_streak"),best>0?"var(--now)":"")}
    ${stat(activeProj,t("ins_active_projects"))}
    ${stat(goalsAvg+"%",t("ins_goals_progress"))}
    ${stat(moOrdersCount,t("orders"))}
    ${stat(curFmt(moRevenue),t("ins_month_revenue"),"var(--sage)")}
    ${stat(curFmt(moNet),t("ins_month_net"),moNet>=0?"var(--sage)":"var(--clay)")}
  </div>

  ${insVisual()}

  <div class="ins-panels">
  <div class="ins-tile card pad">
    <div class="mini-head"><h3>${t("ins_habit_activity")}</h3><span class="count">${t("ins_last14")}</span></div>
    ${state.habits.length?`<div class="ins-bars">${activity.map(a=>`<div class="ins-bar-col"><div class="ins-bar ${a.c===0?"empty":""}" style="height:${a.c===0?2:Math.round(a.c/maxA*100)}%"></div><span class="ins-bar-x">${parseKey(a.k).getDate()}</span></div>`).join("")}</div>`:`<div class="empty">${t("ins_no_habits")}</div>`}
  </div>

  ${state.habits.length?`<div class="ins-tile card pad">
    <div class="mini-head"><h3>${t("ins_consistency")}</h3></div>
    ${consist.map(c=>`<div class="ins-row"><span class="ins-row-label">${esc(c.h.name)}</span><div class="ins-track"><div class="ins-fill" style="width:${c.pct}%"></div></div><span class="ins-row-val">${c.pct}%</span></div>`).join("")}
  </div>`:""}

  <div class="ins-tile card pad">
    <div class="mini-head"><h3>${t("ins_by_tag")}</h3></div>
    ${byTag.length?byTag.map(x=>`<div class="ins-row"><span class="ins-row-label" style="color:${x.tg.color}">${tagLabel(x.tg)}</span><div class="ins-track"><div class="ins-fill" style="width:${Math.round(x.c/maxTag*100)}%;background:${x.tg.color}"></div></div><span class="ins-row-val">${x.c}</span></div>`).join(""):`<div class="empty">${t("ins_no_tags")}</div>`}
  </div>

  <div class="ins-tile card pad">
    <div class="mini-head"><h3>${t("ins_mood30")}</h3>${avgMood?`<span class="count" style="color:${avgMood.color}">${t("ins_average")}: ${t(avgMood.key)}</span>`:""}</div>
    ${moods.length?`<div class="ins-mood-dist">${moodDist.map(md=>`<div class="ins-mood-item"><span class="ins-mood-dot" style="background:${md.mo.color}"></span>${t(md.mo.key)} · ${md.c}</div>`).join("")}</div>`:`<div class="empty">${t("ins_no_mood")}</div>`}
  </div>

  ${(state.orders.length||state.inventory.length||state.returns.length)?`<div class="ins-tile card pad">
    <div class="mini-head"><h3>${t("ins_this_month")}</h3></div>
    <div class="ins-row"><span class="ins-row-label" style="width:auto;flex:1">${t("ins_month_net")}</span><b style="color:${moNet>=0?"var(--sage)":"var(--clay)"};font-variant-numeric:tabular-nums">${curFmt(moNet)}</b></div>
    <div class="ins-row"><span class="ins-row-label" style="width:auto;flex:1">${t("ins_low_stock")}</span><b style="color:${lowStock?"var(--clay)":"var(--ink)"}">${lowStock}</b></div>
    <div class="ins-row"><span class="ins-row-label" style="width:auto;flex:1">${t("open_returns")}</span><b style="color:${openRet?"var(--gold)":"var(--ink)"}">${openRet}</b></div>
  </div>`:""}
  </div>`;
}

/* ============================================================
   CUSTOM TRACKERS (user-defined, daily check or count)
   ============================================================ */
function customStreak(tr){if(tr.type!=="check"||!tr.log)return 0;let s=0;let k=todayKey();if(!tr.log[k])k=addDays(k,-1);while(tr.log[k]){s++;k=addDays(k,-1);}return s;}
function viewCustomTrackers(){
  const trs=state.customTrackers||[];
  const tk=todayKey();const start=startOfWeek(tk);
  const cards=trs.map(tr=>{
    if(tr.type==="check"){
      let boxes="";
      for(let i=0;i<7;i++){const k=addDays(start,i);const dd=parseKey(k);const on=tr.log&&tr.log[k];const isT=k===tk;
        boxes+=`<div class="hbox ${on?'on':''} ${isT?'is-today':''}" onclick="toggleCustomCheck('${tr.id}','${k}')"><span>${dd.toLocaleDateString(locale(),{weekday:"short"}).slice(0,2)}</span><span class="hd">${dd.getDate()}</span></div>`;}
      return `<div class="card pad" style="margin-bottom:14px"><div class="habit-row" style="padding:0;border:none">
        <div class="habit-info"><div class="habit-name">${esc(tr.name)}<button class="task-del" style="opacity:.6" onclick="delCustomTracker('${tr.id}')">${svg(IC.trash)}</button></div>
        <div class="habit-streak">🔥 <b>${customStreak(tr)}</b> ${t("streak")}</div></div>
        <div class="habit-week">${boxes}</div></div></div>`;
    }
    const log=tr.log||{};const todayVal=log[tk]!=null?log[tk]:"";
    let recent="";
    for(let i=6;i>=0;i--){const k=addDays(tk,-i);const v=log[k];const dd=parseKey(k);
      recent+=`<div class="hm-day ${k===tk?'is-today':''}"><span class="hm-d">${dd.getDate()}</span><span class="hm-v">${v!=null?v:'·'}</span></div>`;}
    return `<div class="hm-card" style="margin-bottom:14px">
      <div class="hm-head"><div><b>${esc(tr.name)}</b></div><button class="task-del" onclick="delCustomTracker('${tr.id}')">${svg(IC.trash)}</button></div>
      <div class="hm-input-row"><input type="number" inputmode="decimal" value="${todayVal}" placeholder="${t("todays_value")}" onchange="logCustomCount('${tr.id}',this.value)"><span class="muted" style="font-size:12px">${t("today")}</span></div>
      <div class="hm-recent">${recent}</div></div>`;
  }).join("");
  return `<div class="page-eyebrow">${t("trackers")}</div>
  <div class="section-head" style="margin-top:0"><h1 class="page-title">${t("custom")}</h1>
    <button class="btn btn-primary" onclick="addTrackerModal()">${svg('<path d="M12 5v14M5 12h14"/>',2)} ${t("add_tracker")}</button></div>
  <p class="page-desc">${t("ct_desc")}</p>
  ${trs.length?`<div style="margin-top:16px">${cards}</div>`:`<div class="empty" style="margin-top:16px">${t("no_custom_trackers")}</div>`}`;
}

  showModal(`<h3>${t("add_tracker")}</h3>
    <div class="field" style="margin-top:16px"><label>${t("tracker_name_ph")}</label><input id="trName" placeholder="${t("tracker_name_ph")}" onkeydown="if(event.key==='Enter')saveCustomTracker()"></div>
    <div class="field"><label>${t("tracker_type")}</label>
      <div class="seg" id="trType" style="display:inline-flex">
        <button type="button" class="active" data-v="check" onclick="trTypePick('check')">${t("type_check")}</button>
        <button type="button" data-v="count" onclick="trTypePick('count')">${t("type_count")}</button>

/* ============================================================
   CHART HELPERS (inline SVG — offline, no libraries)
   ============================================================ */
function chartBars(items,opt){
  opt=opt||{};const w=opt.w||600,h=opt.h||150,color=opt.color||"var(--teal)";
  const pad=14,base=h-16;
  const max=Math.max(1,...items.map(i=>+i.value||0));
  const bw=(w-pad*2)/Math.max(1,items.length);
  let s="";
  items.forEach((it,i)=>{
    const val=+it.value||0;const bh=Math.round((base-pad)*(val/max));
    const x=pad+i*bw+bw*0.16,bwid=bw*0.68,y=base-bh;
    s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bwid.toFixed(1)}" height="${Math.max(bh,val>0?3:0)}" rx="3" fill="${color}"><title>${esc(String(it.label))}: ${val}</title></rect>`;
    if(it.label!=null)s+=`<text x="${(x+bwid/2).toFixed(1)}" y="${h-3}" text-anchor="middle" font-size="10" fill="var(--ink-faint)">${esc(String(it.label))}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block">${s}</svg>`;
}
function chartLine(values,opt){
  opt=opt||{};const w=opt.w||600,h=opt.h||150,color=opt.color||"var(--teal)",pad=14;
  const max=Math.max(1,...values),min=Math.min(0,...values),n=values.length;
  const dx=(w-pad*2)/Math.max(1,n-1);
  const yy=v=>h-pad-((v-min)/((max-min)||1))*(h-pad*2);
  const pts=values.map((v,i)=>`${(pad+i*dx).toFixed(1)},${yy(v).toFixed(1)}`).join(" ");
  const area=`${pad},${(h-pad).toFixed(1)} ${pts} ${(pad+(n-1)*dx).toFixed(1)},${(h-pad).toFixed(1)}`;
  let dots=values.map((v,i)=>`<circle cx="${(pad+i*dx).toFixed(1)}" cy="${yy(v).toFixed(1)}" r="2.5" fill="${color}"/>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block">
    <polygon points="${area}" fill="${color}" opacity="0.08"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}
function chartDonut(segs,opt){
  opt=opt||{};const size=opt.size||160,r=size/2,inner=r*0.62,cx=r,cy=r;
  const total=segs.reduce((s,x)=>s+(+x.value||0),0);
  const ringW=r-inner;
  let s=`<circle cx="${cx}" cy="${cy}" r="${((r+inner)/2).toFixed(1)}" fill="none" stroke="var(--line)" stroke-width="${ringW.toFixed(1)}"/>`;
  if(total>0){
    let a=-Math.PI/2;
    segs.forEach(sg=>{const v=+sg.value||0;if(v<=0)return;
      const frac=v/total,a2=a+frac*Math.PI*2,large=frac>0.5?1:0;
      const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
      const xi2=cx+inner*Math.cos(a2),yi2=cy+inner*Math.sin(a2),xi1=cx+inner*Math.cos(a),yi1=cy+inner*Math.sin(a);
      s+=`<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} L${xi2.toFixed(1)} ${yi2.toFixed(1)} A${inner.toFixed(1)} ${inner.toFixed(1)} 0 ${large} 0 ${xi1.toFixed(1)} ${yi1.toFixed(1)} Z" fill="${sg.color}"><title>${esc(sg.label||"")}: ${v}</title></path>`;
      a=a2;});
  }
  const top=opt.centerTop!=null?opt.centerTop:total;
  s+=`<text x="${cx}" y="${(cy-1).toFixed(1)}" text-anchor="middle" font-size="${(size*0.21).toFixed(1)}" font-weight="700" fill="var(--ink)">${esc(String(top))}</text>`;
  if(opt.centerSub)s+=`<text x="${cx}" y="${(cy+size*0.15).toFixed(1)}" text-anchor="middle" font-size="${(size*0.09).toFixed(1)}" fill="var(--ink-faint)">${esc(opt.centerSub)}</text>`;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="display:block">${s}</svg>`;
}
function chartLegend(items){
  return `<div class="chart-legend">${items.filter(i=>i.show!==false).map(i=>`<div class="legend-item"><span class="legend-dot" style="background:${i.color}"></span>${esc(i.label)}${i.value!=null?` <b>${esc(String(i.value))}</b>`:""}</div>`).join("")}</div>`;
}

function compactNum(n){n=Math.round(+n||0);const a=Math.abs(n);if(a>=1e6)return(n/1e6).toFixed(1).replace(/\.0$/,"")+"M";if(a>=1e3)return(n/1e3).toFixed(1).replace(/\.0$/,"")+"k";return""+n;}

/* ============================================================
   PRIVACY LOCK (client-side passcode — basic privacy, not encryption)
   ============================================================ */
const AUTHKEY="nexaly_auth_v1";let authMem=null;
function getAuth(){try{let r=sessionStorage.getItem(AUTHKEY);if(r==null)r=sessionStorage.getItem("almanac_auth_v1");return r?JSON.parse(r):null;}catch(e){return authMem;}}
function setAuth(a){authMem=a;try{if(a)sessionStorage.setItem(AUTHKEY,JSON.stringify(a));else sessionStorage.removeItem(AUTHKEY);}catch(e){}}
function hashStr(str,seed){seed=seed>>>0;let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,c;i<str.length;i++){c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36);}
function hashPw(user,pw){return hashStr((user||"")+"\u0001"+pw,42);}
function showLock(){
  const a=getAuth();if(!a||!a.hash)return false;
  const o=document.createElement("div");o.className="overlay lock-overlay";o.id="lockOverlay";
  o.innerHTML=`<div class="lock-box">
    <div class="brand-name" style="justify-content:center;margin-bottom:22px">${esc(getBrandName())}<span class="brand-dot"></span></div>
    <div class="lock-hi">${t("welcome_back")}${a.username?", "+esc(a.username):""}</div>
    <input type="password" id="lockPw" class="lock-input" placeholder="${t("password")}">
    <div class="lock-err" id="lockErr"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="tryUnlock()">${t("unlock")}</button>
  </div>`;
  document.body.appendChild(o);
  setTimeout(()=>{const e=document.getElementById("lockPw");if(e){e.focus();e.onkeydown=ev=>{if(ev.key==="Enter")tryUnlock();};}},60);
  return true;
}
function tryUnlock(){
  const a=getAuth();const pw=document.getElementById("lockPw").value;
  if(hashPw(a.username,pw)===a.hash){const o=document.getElementById("lockOverlay");if(o)o.remove();continueBoot();}
  else{document.getElementById("lockErr").textContent=t("wrong_password");const p=document.getElementById("lockPw");p.value="";p.focus();}
}
function setPasswordModal(){
  const a=getAuth();
  showModal(`<h3>${a?t("change_password"):t("set_password")}</h3>
    <div class="field" style="margin-top:16px"><label>${t("username")} <span class="muted">(${t("optional")})</span></label><input id="auUser" value="${a&&a.username?escAttr(a.username):""}" placeholder="${t("username")}"></div>
    <div class="field"><label>${t("password")}</label><input id="auPw" type="password" placeholder="••••••" onkeydown="if(event.key==='Enter')savePassword()"></div>
    <div class="field"><label>${t("confirm_password")}</label><input id="auPw2" type="password" placeholder="••••••" onkeydown="if(event.key==='Enter')savePassword()"></div>
    <div class="lock-err" id="auErr"></div>
    <div class="modal-note">${t("lock_note")}</div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">${t("cancel")}</button><button class="btn btn-primary" onclick="savePassword()">${t("save")}</button></div>`);
  setTimeout(()=>{const e=document.getElementById("auPw");if(e)e.focus();},40);

function savePassword(){
  const user=document.getElementById("auUser").value.trim();
  const pw=document.getElementById("auPw").value,pw2=document.getElementById("auPw2").value;

function notifyState(){return("Notification" in window)?Notification.permission:"unsupported";}

  if(!("Notification" in window)){toast(t("notif_unsupported"));return;}
  try{Notification.requestPermission().then(p=>{state.settings.notify=(p==="granted");save();render();if(p==="granted")toast(t("notif_on"));});}catch(e){}
}

function dueItems(){
  const tk=todayKey();const mk=tk.slice(0,7);const dd=parseKey(tk).getDate();
  const tasks=state.tasks.filter(x=>!x.done&&x.date===tk);
  const bills=(state.bills||[]).filter(b=>{
    if(b.cycle!=="monthly")return false;
    if(b.paid&&b.paid[mk])return false;
    const day=+b.dueDay||0;return day>=dd&&day<=dd+3;
  });
  return {tasks,bills};
}
function reminderCheck(){
  const {tasks,bills}=dueItems();
  if(!tasks.length&&!bills.length)return;
  showReminderBar(tasks,bills);
  if(state.settings.notify&&"Notification" in window&&Notification.permission==="granted"){
    const parts=[];
    if(tasks.length)parts.push(tasks.length+" "+t("rem_tasks_due"));
    if(bills.length)parts.push(bills.length+" "+t("rem_bills_due"));
    try{new Notification(getBrandName(),{body:parts.join(" · "),icon:"icon-192.png"});}catch(e){}
  }
}

function setBrandField(key,v){
  const max={brandName:40,brandContact:40,brandEmail:60,brandAddress:80}[key]||60;

function handleLogoFile(input){
  const f=input.files&&input.files[0];if(!f)return;
  if(!/^image\//.test(f.type||"")){toast(t("logo_bad"));return;}
  const rd=new FileReader();
  rd.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const max=256;let w=img.width||max,h=img.height||max;
      if(w>=h){if(w>max){h=Math.round(h*max/w);w=max;}}else{if(h>max){w=Math.round(w*max/h);h=max;}}
      let out;
      try{const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);out=c.toDataURL("image/png");}
      catch(_){out=e.target.result;}
      state.settings.brandLogo=out;save();renderBrand();render();toast(t("logo_set"));
    };
    img.onerror=function(){toast(t("logo_bad"));};
    img.src=e.target.result;
  };
  rd.readAsDataURL(f);
}

function backupData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=url;a.download=`almanac-backup-${todayKey()}.json`;a.click();
  URL.revokeObjectURL(url);toast(t("backup_saved"));
}
document.getElementById("fileInput").addEventListener("change",function(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=ev=>{try{const data=JSON.parse(ev.target.result);
    if(!data||typeof data!=="object")throw 0;
    state=Object.assign(defaultState(),data);
    state.settings=Object.assign(defaultState().settings,state.settings||{});
    save();applyTheme();applyLang();buildYearSwitch();renderNav();render();toast(t("restored"));
  }catch(err){toast(t("bad_file"));}};
  r.readAsText(f);e.target.value="";
});
function clearData(){
  if(!confirm(t("clear_confirm")))return;
  const s=state.settings;const keep={lang:s.lang,theme:s.theme,weekStart:s.weekStart,currency:s.currency,palette:s.palette,brandName:s.brandName,brandLogo:s.brandLogo,brandContact:s.brandContact,brandEmail:s.brandEmail,brandAddress:s.brandAddress,notify:s.notify};
  state=defaultState();Object.assign(state.settings,keep);state.settings.onboarded=true;
  save();applyTheme();applyLang();buildYearSwitch();renderNav();render();toast(t("cleared"));
}

function doSearch(q){
  q=q.trim().toLowerCase();const box=document.getElementById("searchResults");
  if(!q){box.innerHTML="";box.classList.remove("search-results");return;}
  const res=[];
  state.tasks.forEach(x=>{if(x.text.toLowerCase().includes(q))res.push({kind:t("kind_task"),text:x.text,go:()=>{if(x.date){openDay(x.date);}else{go("tasks");}}});});
  state.notes.forEach(n=>{if(n.text.toLowerCase().includes(q))res.push({kind:t("kind_note"),text:n.text.slice(0,60),go:()=>go("notes")});});
  state.habits.forEach(h=>{if(h.name.toLowerCase().includes(q))res.push({kind:t("kind_habit"),text:h.name,go:()=>go("habits")});});
  box.classList.add("search-results");
  if(!res.length){box.innerHTML=`<div class="sr-item"><div class="sr-text muted">${t("search_no")}</div></div>`;return;}
  box.innerHTML=res.slice(0,8).map((r,i)=>`<div class="sr-item" data-i="${i}"><div class="sr-kind">${r.kind}</div><div class="sr-text">${esc(r.text)}</div></div>`).join("");
  searchRes=res.slice(0,8);
  box.querySelectorAll(".sr-item").forEach(el=>{el.onclick=()=>{const r=searchRes[+el.dataset.i];clearSearch();document.getElementById("search").value="";r.go();};});
}
let searchRes=[];

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escAttr(s){return esc(s).replace(/"/g,"&quot;");}
