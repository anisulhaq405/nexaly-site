/* ===== v1.3 CROSS-PLATFORM HARDENING ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent;scroll-behavior:smooth}
body{min-height:100vh;min-height:100dvh;overflow-wrap:anywhere}
button,.btn,.input,.select,.textarea{-webkit-appearance:none;appearance:none}
button,.btn{touch-action:manipulation;user-select:none;-webkit-user-select:none}
.input,.select,.textarea{user-select:text;-webkit-user-select:text}
:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
.top{background:var(--panel)}
.hero,.notice,.alert,.bubble.user,.nav button.insight-link,.aiTopBtn{background:var(--panel2)}
@supports (background:color-mix(in srgb,#000 10%,#fff)){
  .top{background:color-mix(in srgb,var(--panel) 94%,transparent)}
  .hero{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 12%,var(--panel)),color-mix(in srgb,var(--brand2) 12%,var(--panel)))}
  .notice{background:color-mix(in srgb,var(--brand2) 8%,var(--panel));border-color:color-mix(in srgb,var(--brand2) 35%,var(--line))}
  .alert{background:color-mix(in srgb,var(--danger) 7%,var(--panel));border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
  .bubble.user{background:color-mix(in srgb,var(--brand) 15%,var(--panel))}
  .nav button.insight-link,.aiTopBtn{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 8%,var(--panel)),color-mix(in srgb,var(--brand2) 10%,var(--panel)))}
}
.mobileDock{display:none}
.compatGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}
.compatItem{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;border:1px solid var(--line);background:var(--panel2);padding:10px;border-radius:12px}
.compatIcon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
.compatItem b{display:block;font-size:12px}.compatItem small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.compatState{font-size:10px;font-weight:800;border:1px solid var(--line);padding:3px 7px;border-radius:999px}.compatState.ok{color:var(--ok)}.compatState.warn{color:var(--warn)}
.platformBanner{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--panel2);padding:11px 13px;border-radius:13px;margin-bottom:13px}.platformBanner strong{display:block;font-size:12px}.platformBanner span{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.backupAge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 7px;font-size:10px;border:1px solid var(--line);background:var(--panel2)}
.deviceGuide{display:grid;gap:8px}.deviceGuide .item{background:var(--panel2)}
.storageWarning{position:sticky;top:78px;z-index:19;margin:10px 22px 0;border:1px solid var(--warn);background:var(--panel);padding:10px 12px;border-radius:12px;font-size:11px;box-shadow:var(--shadow)}
@supports (padding:max(0px)){
  .top{padding-top:max(10px,env(safe-area-inset-top));padding-inline-start:max(22px,env(safe-area-inset-left));padding-inline-end:max(22px,env(safe-area-inset-right))}
  .side{padding-inline-start:max(14px,env(safe-area-inset-left));padding-bottom:max(20px,env(safe-area-inset-bottom))}
  .content{padding-inline-start:max(22px,env(safe-area-inset-left));padding-inline-end:max(22px,env(safe-area-inset-right));padding-bottom:max(22px,env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
@media (hover:none){.btn:hover,.nav button:hover{background:inherit}.btn:active,.nav button:active{transform:scale(.985)}}
@media(max-width:900px){
  body{padding-bottom:72px}.content{padding-bottom:92px!important}.topActions{gap:5px}.topActions .btn,.topActions .select{min-height:40px}
  .mobileDock{position:fixed;display:grid;grid-template-columns:repeat(4,1fr);inset-inline:10px;bottom:8px;z-index:90;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 18px 45px rgba(0,0,0,.2)}
  .mobileDock button{border:0;background:transparent;color:var(--muted);display:grid;place-items:center;gap:2px;min-height:50px;border-radius:11px;font-size:16px}
  .mobileDock button span:last-child{font-size:9px;font-weight:750}.mobileDock button.active{background:var(--panel2);color:var(--brand)}
  .input,.select,.textarea{font-size:16px}.modalBox{max-height:calc(100dvh - 26px)}.printPreviewShell{max-height:calc(100dvh - 20px)}

function baseState(){return {version:'1.4',settings:{lang:'en',theme:'light',fontScale:1,comfort:false,currency:'USD'},profile:{name:'',pin:''},lovedOnes:[],carePlans:[],medications:[],medicationLogs:[],appointments:[],careTeam:[],tasks:[],careLogs:[],healthRecords:[],dailyLiving:[],incidents:[],documents:[],money:[],errands:[],childFamily:[],household:[],myLife:[],handoffs:[],agent:{history:[],actions:[],undo:[]},meta:{demo:false,createdAt:Date.now()}}}
function load(){try{const x=JSON.parse(sessionStorage.getItem(KEY)||'null');return x?Object.assign(baseState(),x):baseState()}catch(e){return baseState()}}let state=load(),route='command';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const tr=k=>(T[state.settings.lang]||T.en)[k]||T.en[k]||k;const navName=i=>(NAV[state.settings.lang]||NAV.en)[i];
function save(msg){sessionStorage.setItem(KEY,JSON.stringify(state));if(msg)toast(msg)}function toast(msg){const e=$('#toast');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1500)}function fmtDate(v){if(!v)return '—';try{return new Intl.DateTimeFormat(state.settings.lang,{year:'numeric',month:'short',day:'numeric'}).format(new Date(v))}catch{return v}}function fmtDT(v){if(!v)return '—';try{return new Intl.DateTimeFormat(state.settings.lang,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}catch{return v}}function todayISO(){const d=new Date();return d.toISOString().slice(0,10)}function lovedName(id){return state.lovedOnes.find(x=>x.id===id)?.name||'—'}function teamName(id){return state.careTeam.find(x=>x.id===id)?.name||id||'—'}
function apply(){document.documentElement.dataset.theme=state.settings.theme;document.documentElement.lang=state.settings.lang;document.documentElement.dir=state.settings.lang==='ar'?'rtl':'ltr';document.body.classList.toggle('rtl',state.settings.lang==='ar');document.documentElement.style.setProperty('--fs',state.settings.fontScale||1);$('#langSelect').value=state.settings.lang;$('#themeBtn').textContent=state.settings.theme==='dark'?'☀':'☾';$('#storageNote').textContent=tr('localData');$('#pageTitle').textContent=navName(moduleIds.indexOf(route));$('#dateLine').textContent=new Intl.DateTimeFormat(state.settings.lang,{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(new Date())}
function renderNav(){let h='';navGroups.forEach(([a,b,g])=>{h+=`<div class="navgroup">${g}</div><nav class="nav">`;for(let i=a;i<b;i++)h+=`<button data-r="${moduleIds[i]}" class="${route===moduleIds[i]?'active':''}"><span>${icons[i]}</span><span>${esc(navName(i))}</span></button>`;h+='</nav>'});$('#navRoot').innerHTML=h;$$('[data-r]').forEach(b=>b.onclick=()=>go(b.dataset.r))}

function fieldInput(f,val=''){const [k,label,type,req,opts]=f;let input='';if(type==='textarea')input=`<textarea class="textarea" name="${k}">${esc(val)}</textarea>`;else if(type==='select')input=`<select class="select" name="${k}"><option value="">${tr('select')}</option>${opts.map(o=>`<option ${String(val)===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;else if(type==='loved')input=`<select class="select" name="${k}"><option value="">${tr('select')}</option>${state.lovedOnes.filter(x=>!x.archived).map(o=>`<option value="${o.id}" ${val===o.id?'selected':''}>${esc(o.name)}</option>`).join('')}</select>`;else if(type==='team')input=`<select class="select" name="${k}"><option value="">${tr('select')}</option>${state.careTeam.map(o=>`<option value="${o.id}" ${val===o.id?'selected':''}>${esc(o.name)}</option>`).join('')}</select>`;else if(type==='checkbox')input=`<input type="checkbox" name="${k}" ${val?'checked':''}>`;else input=`<input class="input" name="${k}" type="${type}" value="${esc(val)}" ${type==='number'?'step="0.01"':''}>`;return `<div class="field ${type==='textarea'?'wide':''}"><label>${esc(label)}${req?' *':''}</label>${input}</div>`}

function recordSummary(mid,r){switch(mid){case'loved':return `${r.relationship||''} · ${r.provider||''} ${r.archived?'· Archived':''}`;case'plans':return `${lovedName(r.lovedId)} · ${r.status||'Active'} · Review ${fmtDate(r.reviewDate)}`;case'meds':return `${lovedName(r.lovedId)} · ${r.strength||''} · ${r.schedule||''}`;case'appointments':return `${lovedName(r.lovedId)} · ${fmtDT(r.dateTime)} · ${r.status||'Planned'}`;case'team':return `${r.role||''} · ${r.responsibility||''}`;case'tasks':return `${r.domain||''} · ${fmtDT(r.dateTime)} · ${teamName(r.assignee)} · ${r.status||'Open'}`;case'carelog':return `${lovedName(r.lovedId)} · ${fmtDT(r.dateTime)} · ${r.overall||''}`;case'health':return `${lovedName(r.lovedId)} · ${r.type||''} · ${fmtDate(r.date)}`;case'living':return `${lovedName(r.lovedId)} · ${r.assistance||''} · ${r.frequency||''}`;case'incidents':return `${lovedName(r.lovedId)} · ${fmtDT(r.dateTime)} · ${r.status||'Open'}`;case'documents':return `${r.category||''} · ${lovedName(r.lovedId)} · Review ${fmtDate(r.expiryDate)}`;case'money':return `${lovedName(r.lovedId)} · ${r.currency||state.settings.currency} ${Number(r.amount||0).toFixed(2)} · ${fmtDate(r.date)}`;case'errands':return `${r.type||''} · ${lovedName(r.lovedId)} · ${fmtDT(r.dateTime)} · ${r.status||''}`;case'children':return `${r.person||''} · ${r.type||''} · ${fmtDT(r.dateTime)}`;case'household':return `${r.type||''} · ${fmtDT(r.dateTime)} · ${r.status||''}`;case'mylife':return `${r.type||''} · ${fmtDT(r.dateTime)} ${r.protected?'· Protected':''}`;default:return''}}
function moduleView(mid){const s=schemas[mid],arr=state[s.collection];return `<div class="head"><div><h3>${esc(navName(s.titleKey))}</h3><p>${moduleHelp(mid)}</p></div><button class="btn primary" id="addRec">＋ ${tr('add')}</button></div><div class="card"><div class="list">${arr.length?arr.map(r=>`<div class="item"><div class="row"><div><h4>${esc(r[s.primary]||navName(s.titleKey))}</h4><div class="meta">${esc(recordSummary(mid,r))}</div></div>${statusBadge(r.status||'')}</div><div class="actions">${mid==='meds'?`<button class="btn sm ok" data-medlog="${r.id}">Log status</button>`:''}<button class="btn sm" data-edit="${r.id}">${tr('edit')}</button><button class="btn sm danger" data-del="${r.id}">${tr('delete')}</button></div></div>`).join(''):`<div class="empty">${tr('noData')}</div>`}</div></div>`}

function openMedicationLog(medId){const m=state.medications.find(x=>x.id===medId);if(!m)return;modal(`<h3>Medication Status Log</h3><div class="notice">${tr('medicalNotice')}</div><div class="form" style="margin-top:12px"><div class="field"><label>Medication</label><input class="input" value="${esc(m.name)}" disabled></div><div class="field"><label>Status</label><select class="select" id="mlStatus"><option>Given</option><option>Reminded</option><option>Skipped</option><option>Refused</option><option>Not applicable</option></select></div><div class="field"><label>Date & time</label><input class="input" type="datetime-local" id="mlTime" value="${new Date().toISOString().slice(0,16)}"></div><div class="field wide"><label>Notes</label><textarea class="textarea" id="mlNotes"></textarea></div></div><div class="modalActions"><button class="btn" id="mCancel">${tr('cancel')}</button><button class="btn primary" id="mSave">${tr('save')}</button></div>`);$('#mCancel').onclick=closeModal;$('#mSave').onclick=()=>{state.medicationLogs.unshift({id:uid(),medId,lovedId:m.lovedId,status:$('#mlStatus').value,dateTime:$('#mlTime').value,notes:$('#mlNotes').value});save(tr('saved'));closeModal();render()}}
function getTodayItems(){const day=todayISO(),items=[];state.tasks.filter(x=>x.status!=='Done'&&String(x.dateTime||'').slice(0,10)===day).forEach(x=>items.push({time:x.dateTime,type:'Task',title:x.title,person:lovedName(x.lovedId),domain:x.domain||'Care'}));state.appointments.filter(x=>['Planned','Rescheduled'].includes(x.status||'Planned')&&String(x.dateTime||'').slice(0,10)===day).forEach(x=>items.push({time:x.dateTime,type:'Appointment',title:x.provider,person:lovedName(x.lovedId),domain:'Care'}));state.errands.filter(x=>x.status!=='Done'&&String(x.dateTime||'').slice(0,10)===day).forEach(x=>items.push({time:x.dateTime,type:'Errand',title:x.title,person:lovedName(x.lovedId),domain:'Care'}));state.childFamily.filter(x=>x.status!=='Done'&&String(x.dateTime||'').slice(0,10)===day).forEach(x=>items.push({time:x.dateTime,type:'Family',title:x.title,person:x.person,domain:'Child'}));state.household.filter(x=>x.status!=='Done'&&String(x.dateTime||'').slice(0,10)===day).forEach(x=>items.push({time:x.dateTime,type:'Household',title:x.title,person:'',domain:'Household'}));state.myLife.filter(x=>x.status!=='Done'&&String(x.dateTime||'').slice(0,10)===day).forEach(x=>items.push({time:x.dateTime,type:'My Life',title:x.title,person:'',domain:'Personal'}));return items.sort((a,b)=>String(a.time).localeCompare(String(b.time)))}
function careMetrics(){const now=new Date(),day=todayISO(),soon=new Date(Date.now()+7*864e5),in14=new Date(Date.now()+14*864e5);const overdue=state.tasks.filter(x=>x.status!=='Done'&&x.dateTime&&new Date(x.dateTime)<now).length;const due=state.tasks.filter(x=>x.status!=='Done'&&String(x.dateTime||'').slice(0,10)===day).length;const appts=state.appointments.filter(x=>['Planned','Rescheduled'].includes(x.status||'Planned')&&x.dateTime&&new Date(x.dateTime)>=now&&new Date(x.dateTime)<=soon).length;const concerns=state.incidents.filter(x=>x.status!=='Closed').length;const medAlerts=state.medications.filter(x=>[x.refillDate,x.reviewDate].some(d=>d&&new Date(d)>=now&&new Date(d)<=in14)).length;const score=overdue*3+due*2+appts*2+concerns*3+medAlerts;const label=score<=4?'Light':score<=10?'Balanced':score<=18?'Heavy':'Overloaded';return{score,label,overdue,due,appts,concerns,medAlerts}}
function allEvents(){const a=[];const add=(arr,kind,getTitle)=>arr.forEach(x=>{const dt=x.dateTime;if(dt)a.push({id:x.id,dt:new Date(dt),kind,title:getTitle(x)})});add(state.tasks,'Care/Task',x=>x.title);add(state.appointments,'Appointment',x=>x.provider);add(state.errands,'Errand',x=>x.title);add(state.childFamily,'Child/Family',x=>x.title);add(state.household,'Household',x=>x.title);add(state.myLife,'My Life',x=>x.title);return a.filter(x=>!isNaN(x.dt))}
function conflicts(){const ev=allEvents(),res=[];for(let i=0;i<ev.length;i++)for(let j=i+1;j<ev.length;j++){const a=ev[i],b=ev[j],diff=Math.abs(a.dt-b.dt)/36e5;if(diff<1&&a.kind!==b.kind)res.push({a,b})}return res.slice(0,20)}
function followupGaps(){const now=new Date();return state.appointments.filter(a=>a.status==='Completed'&&a.followUpDate&&new Date(a.followUpDate)<=now).filter(a=>!state.tasks.some(t=>t.status!=='Done'&&((t.notes||'').includes(a.id)||(t.title||'').toLowerCase().includes((a.provider||'').toLowerCase()))))}

function dashboard(){const m=careMetrics(),items=getTodayItems(),cf=conflicts(),fg=followupGaps(),ed=expiringDocs(),weekStart=Date.now()-7*864e5;const spend=state.money.filter(x=>new Date(x.date||0).getTime()>=weekStart).reduce((s,x)=>s+Number(x.amount||0),0);const completed=state.appointments.filter(x=>x.status==='Completed'&&new Date(x.dateTime||0).getTime()>=weekStart).length;const personal=state.myLife.filter(x=>x.protected&&new Date(x.dateTime||0).getTime()>=weekStart).length;const pct=Math.min(100,m.score/24*100);return `<div class="head"><div><h3>${esc(navName(0))}</h3><p>Care, family, household, work and personal priorities in one offline workspace.</p></div><div class="quick"><button class="btn primary" data-qa="carelog">＋ Care Log</button><button class="btn" data-qa="appointments">＋ Appointment</button><button class="btn" data-qa="tasks">＋ Task</button><button class="btn" data-qa="money">＋ Expense</button></div></div><div class="grid g4"><div class="card kpi"><small>${tr('careLoad')}</small><b>${m.label}</b><div class="bar"><i style="width:${pct}%"></i></div><small>Planning score ${m.score}</small></div><div class="card kpi"><small>${tr('overdue')}</small><b>${m.overdue}</b><small>${m.due} ${tr('dueToday')}</small></div><div class="card kpi"><small>${tr('conflicts')}</small><b>${cf.length}</b><small>Cross-domain collisions</small></div><div class="card kpi"><small>${tr('openConcerns')}</small><b>${m.concerns}</b><small>${fg.length} ${tr('followups')}</small></div></div><div class="grid g2" style="margin-top:13px"><div class="card"><h4 class="sectionTitle">${tr('today')} Timeline</h4><div class="timeline">${items.length?items.map(x=>`<div class="event"><b>${x.time?new Date(x.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'—'}</b><div><strong>${esc(x.title)}</strong><div class="tiny muted">${esc(x.type)} ${x.person?'· '+esc(x.person):''}</div></div></div>`).join(''):`<div class="empty">No scheduled items today.</div>`}</div></div><div class="card"><h4 class="sectionTitle">Priority Center</h4><div class="stack"><div class="row"><span>Upcoming appointments (7d)</span><b>${m.appts}</b></div><div class="row"><span>Medication refill/review alerts</span><b>${m.medAlerts}</b></div><div class="row"><span>Documents expiring/reviewing (60d)</span><b>${ed.length}</b></div><div class="row"><span>Appointment follow-up gaps</span><b>${fg.length}</b></div><div class="row"><span>Conflicts detected</span><b>${cf.length}</b></div></div></div></div><div class="grid g2" style="margin-top:13px"><div class="card"><h4 class="sectionTitle">Loved-One Status</h4><div class="list">${state.lovedOnes.filter(x=>!x.archived).length?state.lovedOnes.filter(x=>!x.archived).map(l=>{const next=state.appointments.filter(a=>a.lovedId===l.id&&['Planned','Rescheduled'].includes(a.status||'Planned')&&new Date(a.dateTime)>new Date()).sort((a,b)=>new Date(a.dateTime)-new Date(b.dateTime))[0];const open=state.tasks.filter(t=>t.lovedId===l.id&&t.status!=='Done').length;const log=state.careLogs.find(c=>c.lovedId===l.id);return`<div class="item"><div class="row"><div><h4>${esc(l.name)}</h4><div class="meta">${esc(l.relationship||'')} · ${open} open tasks</div></div><span class="badge">${next?fmtDate(next.dateTime):'No appointment'}</span></div><div class="tiny muted">Recent: ${esc(log?.overall||'No daily log yet')}</div></div>`}).join(''):`<div class="empty">Add your first loved one.</div>`}</div></div><div class="card"><h4 class="sectionTitle">${tr('weekly')}</h4><div class="stack"><div class="row"><span>Care tasks completed</span><b>${state.tasks.filter(x=>x.status==='Done'&&x.updatedAt>=weekStart).length}</b></div><div class="row"><span>Appointments completed</span><b>${completed}</b></div><div class="row"><span>Care spend</span><b>${esc(state.settings.currency)} ${spend.toFixed(0)}</b></div><div class="row"><span>Protected personal-time blocks</span><b>${personal}</b></div></div></div></div><div class="notice" style="margin-top:13px">${tr('medi function buildHandoff(id,start,end,changed,instructions){const l=state.lovedOnes.find(x=>x.id===id);if(!l)return'';const meds=state.medications.filter(x=>x.lovedId===id);const plans=state.carePlans.filter(x=>x.lovedId===id&&x.status!=='Completed');const ap=state.appointments.filter(x=>x.lovedId===id&&new Date(x.dateTime)>=new Date()).sort((a,b)=>new Date(a.dateTime)-new Date(b.dateTime)).slice(0,5);const tasks=state.tasks.filter(x=>x.lovedId===id&&x.status!=='Done').slice(0,12);const logs=state.careLogs.filter(x=>x.lovedId===id).slice(0,3);return `<div class="reportPage"><h3>Care Handoff · ${esc(l.name)}</h3><div class="tiny muted">${fmtDT(start)} → ${fmtDT(end)}</div><div class="notice" style="margin:10px 0">${tr('medicalNotice')}</div><h4>Key Instructions</h4><p>${esc(l.mobility||'')} ${esc(l.diet||'')}</p><h4>What Changed</h4><p>${esc(changed||'No update entered.')}</p><h4>Care Plans / Routines</h4>${plans.length?plans.map(x=>`<div class="item"><b>${esc(x.title)}</b><div class="tiny">${esc(x.routines||x.instructions||'')}</div></div>`).join(''):'None recorded.'}<h4>Medication List</h4>${meds.length?meds.map(x=>`<div>${esc(x.name)} · ${esc(x.strength||'')} · ${esc(x.schedule||'')}</div>`).join(''):'None recorded.'}<h4>Upcoming Appointments</h4>${ap.length?ap.map(x=>`<div>${fmtDT(x.dateTime)} · ${esc(x.provider)}</div>`).join(''):'None recorded.'}<h4>Open Tasks</h4>${tasks.length?tasks.map(x=>`<div>☐ ${esc(x.title)} · ${fmtDT(x.dateTime)} · ${esc(teamName(x.assignee))}</div>`).join(''):'None recorded.'}<h4>Recent Updates</h4>${logs.length?logs.map(x=>`<div>${fmtDT(x.dateTime)} · ${esc(x.overall||'')} · ${esc(x.handoff||x.caregiverNotes||'')}</div>`).join(''):'No recent logs.'}<h4>Assigned to Relief Caregiver</h4><p>${esc(instructions||'—')}</p><h4>Emergency Contacts</h4><p>${esc(l.emergencyContacts||'—')}</p></div>`}

function printableDocument(content,title){const safeTitle=esc(title||'CareBridge Report');return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${safeTitle}</title><style>body{font-family:Arial,Helvetica,sans-serif;color:#111;background:#fff;margin:0;padding:24px;line-height:1.45}h1,h2,h3,h4{page-break-after:avoid}.card,.item,.notice,.alert{border:1px solid #cfd4dc;border-radius:10px;padding:12px;margin:10px 0;box-shadow:none;background:#fff}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.row{display:flex;justify-content:space-between;gap:10px}.tiny,.muted,.meta{color:#4b5563;font-size:12px}.badge{border:1px solid #cfd4dc;border-radius:999px;padding:4px 7px}.reportPage{page-break-after:auto}.printMeta{font-size:11px;color:#6b7280;border-bottom:1px solid #ddd;padding-bottom:9px;margin-bottom:16px}@media(max-width:700px){.g2{grid-template-columns:1fr}}@media print{body{padding:0}.card,.item,.notice,.alert{break-inside:avoid}.printMeta{display:block}}</style></head><body><div class="printMeta">NexalyPlanner · CareBridge OS · Generated ${new Date().toLocaleString()}</div>${content}</body></html>`}
function downloadPrintable(content,title){const html=printableDocument(content,title),blob=new Blob([html],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(title||'CareBridge_Report').replace(/[^a-z0-9_-]+/gi,'_')+'.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1200);toast('Printable report downloaded. Open it in your browser, then Print / Save as PDF.')}

function tryNativePrint(content,title){const html=printableDocument(content,title);let w=null;try{w=window.open('','_blank')}catch(e){}if(w&&w.document){try{w.document.open();w.document.write(html);w.document.close();setTimeout(()=>{try{w.focus();if(typeof w.print==='function'){w.print()}else{downloadPrintable(content,title)}}catch(e){downloadPrintable(content,title)}},250);return}catch(e){try{w.close()}catch(_){}}}try{const f=document.createElement('iframe');f.style.position='fixed';f.style.right='0';f.style.bottom='0';f.style.width='1px';f.style.height='1px';f.style.opacity='0';f.style.pointerEvents='none';document.body.appendChild(f);const d=f.contentDocument||f.contentWindow.document;d.open();d.write(html);d.close();setTimeout(()=>{try{if(f.contentWindow&&typeof f.contentWindow.print==='function'){f.contentWindow.focus();f.contentWindow.print()}else{downloadPrintable(content,title)}}catch(e){downloadPrintable(content,title)}setTimeout(()=>f.remove(),1500)},300)}catch(e){downloadPrintable(content,title)}}

function loadDemo(){const now=new Date(),addD=(d,h=9)=>{const x=new Date();x.setDate(x.getDate()+d);x.setHours(h,0,0,0);return x.toISOString().slice(0,16)},addDate=d=>addD(d).slice(0,10);const l={id:uid(),name:'Margaret Demo',relationship:'Mother',dob:'1951-04-12',provider:'Dr. Rivera',conditions:'User-entered care history placeholder',allergies:'Demo allergy placeholder',mobility:'Uses a cane outdoors; prefers clear verbal instructions.',diet:'Low-salt preference recorded by family.',emergencyContacts:'Alex Demo · 555-0101',insurance:'INS-DEMO-01',hospital:'Community Hospital / Main Street Pharmacy',preferences:'Morning appointments preferred.',careLevel:'Help with transport, shopping and appointment organization'};const helper={id:uid(),name:'Sam Demo',role:'Sibling helper',help:'Transport and weekend check-ins',availability:'Saturday mornings',responsibility:'Backup',contact:'555-0102'};state.lovedOnes=[l];state.careTeam=[helper];state.carePlans=[{id:uid(),title:'Weekly Support Plan',lovedId:l.id,goals:'Keep routines organized and follow-ups visible.',routines:'Morning check-in; weekly groceries; appointment prep.',instructions:'Use written checklist for appointments.',recurringTasks:'Groceries weekly; call twice weekly',responsible:helper.id,startDate:addDate(-10),reviewDate:addDate(20),status:'Active',notes:'Demo only'}];state.medications=[{id:uid(),name:'Demo Medication A',lovedId:l.id,strength:'User-entered placeholder',schedule:'Morning — record only',purpose:'Demo purpose',prescriber:'Dr. Rivera / Main Street Pharmacy',refillDate:addDate(9),reviewDate:addDate(30),prn:false,notes:'Demo data — not medical advice'}];state.appointments=[{id:uid(),provider:'Dr. Rivera',specialty:'Primary care',lovedId:l.id,dateTime:addD(1,15),location:'Community Clinic',transport:'Sam Demo',prep:'Bring medication list',questions:'Review upcoming care needs',documents:'Insurance card',status:'Planned'},{id:uid(),provider:'Vision Center',specialty:'Optometry',lovedId:l.id,dateTime:addD(-8,10),outcome:'Routine visit completed',followUpDate:addDate(-1),status:'Completed'}];state.tasks=[{id:uid(),title:'Prepare appointment folder',lovedId:l.id,domain:'Care',dateTime:addD(0,18),assignee:helper.id,priority:'High',recurrence:'None',status:'Open'},{id:uid(),title:'Pick up groceries',lovedId:l.id,domain:'Care',dateTime:addD(1,14),assignee:helper.id,priority:'Normal',status:'Open'}];state.careLogs=[{id:uid(),lovedId:l.id,dateTime:addD(-1,19),overall:'Good',mood:'Relaxed',sleep:'Normal',meals:'Meals completed',mobility:'Short walk',caregiverNotes:'Demo daily update',followUp:false,handoff:'No major changes.'}];state.documents=[{id:uid(),name:'Insurance Card',category:'Insurance',lovedId:l.id,issueDate:addDate(-300),expiryDate:addDate(40),location:'Home care binder',reference:'DEMO-INS',notes:'Demo reference'}];state.money=[{id:uid(),date:addDate(-2),category:'Pharmacy',lovedId:l.id,vendor:'Main Street Pharmacy',amount:42,currency:'USD',paidBy:'Caregiver',reimbursable:false,reimbursement:'Not applicable'}];state.childFamily=[{id:uid(),title:'School science night',person:'Jamie Demo',school:'Central School',type:'School event',dateTime:addD(1,15),status:'Planned',notes:'Conflicts with care appointment for demo'}];state.myLife=[{id:uid(),title:'Client meeting',type:'Work/Business',dateTime:addD(2,11),protected:false,status:'Planned'},{id:uid(),title:'Personal rest block',type:'Rest/Respite',dateTime:addD(3,17),protected:true,status:'Planned'}];state.household=[{id:uid(),title:'Weekly household shop',type:'Shopping',dateTime:addD(2,11),status:'Open'}];state.meta.demo=true}
function agentView(){const hist=state.agent.history.length?state.agent.history:[{who:'ai',text:tr('agentIntro')}];return `<div class="head"><div><h3>${esc(navName(21))}</h3><p>Offline system expert + local-data reader + safe command executor.</p></div><button class="btn" id="agentUndo">↶ Undo last agent action</button></div><div class="agentGrid"><div class="card chat"><div class="messages" id="agentMsgs">${hist.map(x=>`<div class="bubble ${x.who==='user'?'user':x.type==='action'?'action':''}">${esc(x.text)}</div>`).join('')}</div><div class="composer"><input class="input" id="agentInput" placeholder="${esc(tr('commandPlaceholder'))}"><button class="btn primary" id="agentSend">Send</button></div></div><div class="card"><h4>Command Examples</h4><div class="stack tiny"><span class="cmd">/status</span><span class="cmd">/today</span><span class="cmd">/open medications</span><span class="cmd">/add task Call pharmacy tomorrow</span><span class="cmd">/log medication Demo Medication A given</span><span class="cmd">/emergency Margaret</span><span class="cmd">/handoff Margaret</span><span class="cmd">/search insurance</span><span class="cmd">/backup</span></div><hr style="border:0;border-top:1px solid var(--line)"><h4>Agent Action Log</h4><div class="list">${state.agent.actions.slice(0,12).map(a=>`<div class="item tiny"><b>${esc(a.command)}</b><div class="meta">${esc(a.result)} · ${new Date(a.at).toLocaleTimeString()}</div></div>`).join('')||'<div class="empty">No actions yet.</div>'}</div><div class="notice" style="margin-top:10px">${tr('medicalNotice')}</div></div></div>`}
function agentSay(text,type='answer'){state.agent.history.push({who:'ai',text,type,at:Date.now()});if(state.agent.history.length>80)state.agent.history=state.agent.history.slice(-80);save()}
function agentSnapshot(){state.agent.undo.unshift(JSON.stringify({...state,agent:{...state.agent,undo:[]}}));state.agent.undo=state.agent.undo.slice(0,5)}function agentLog(cmd,result){state.agent.actions.unshift({command:cmd,result,at:Date.now()});state.agent.actions=state.agent.actions.slice(0,50)}
function safeMedical(q){return /(diagnos|what disease|dose|dosage|increase medication|decrease medication|stop medication|start medication|should i take|medicine advice|prescribe)/i.test(q)}
function parseLoved(q){const low=q.toLowerCase();return state.lovedOnes.find(l=>low.includes((l.name||'').toLowerCase().split(' ')[0]))}
function runAgent(q){const raw=q.trim(),low=raw.toLowerCase();state.agent.history.push({who:'user',text:raw,at:Date.now()});if(safeMedical(raw)){agentSay('I can organize or retrieve the information you entered, but I cannot diagnose, prescribe, recommend a dose, or tell you to start/stop/change medication. For medication or clinical decisions, use a qualified healthcare professional.','answer');render();return}let result='';const m=careMetrics(),lov=parseLoved(raw);if(/^\/status|system status|care status/.test(low)){result=`CareBridge status: ${state.lovedOnes.length} loved-one profile(s), ${state.tasks.filter(x=>x.status!=='Done').length} open task(s), ${state.appointments.filter(x=>['Planned','Rescheduled'].includes(x.status||'Planned')).length} planned appointment(s), ${state.medications.length} medication record(s), ${state.incidents.filter(x=>x.status!=='Closed').length} open concern(s). Care-load indicator: ${m.label} (${m.score}).`}
else if(/^\/today|what.*today|today.*need/.test(low)){const items=getTodayItems();result=items.length?'Today: '+items.map(x=>`${x.type}: ${x.title}${x.person?' ('+x.person+')':''}`).join('; '):'Nothing is scheduled for today in the planner.'}
else if(/^\/open /.test(low)||/^open /.test(low)){const text=low.replace(/^\/open |^open /,'');const idx=NAV.en.findIndex(n=>n.toLowerCase().includes(text));if(idx>=0){go(moduleIds[idx]);result=`Opened ${NAV.en[idx]}.`}else result='I could not match that module. Try /open medications, /open tasks, /open emergency, or /open reports.'}
else if(/^\/search /.test(low)){const term=raw.replace(/^\/search /i,'');const r=globalSearch(term);result=r.length?`Found ${r.length}: `+r.slice(0,8).map(x=>x.title).join(', '):'No matching records found.'}
else if(/^\/add task /.test(low)){agentSnapshot();const title=raw.replace(/^\/add task /i,'').trim();state.tasks.unshift({id:uid(),title,lovedId:lov?.id||'',domain:'Care',dateTime:'',priority:'Normal',status:'Open',createdAt:Date.now()});result=`Added task: ${title}.`;agentLog(raw,result)}
else if(/^\/add expense /.test(low)){const nums=raw.match(/([0-9]+(?:\.[0-9]+)?)/);agentSnapshot();state.money.unshift({id:uid(),date:todayISO(),category:'Care',lovedId:lov?.id||'',vendor:raw.replace(/^\/add expense /i,'').trim(),amount:Number(nums?.[1]||0),currency:state.settings.currency,createdAt:Date.now()});result='Expense record added. You can edit details in Money.';agentLog(raw,result)}
else if(/^\/log medication /.test(low)){const med=state.medications.find(x=>low.includes(x.name.toLowerCase()));if(!med)result='I could not match that medication record.';else{const status=/refused/.test(low)?'Refused':/skip/.test(low)?'Skipped':/remind/.test(low)?'Reminded':/not applicable/.test(low)?'Not applicable':'Given';agentSnapshot();state.medicationLogs.unshift({id:uid(),medId:med.id,lovedId:med.lovedId,status,dateTime:new Date().toISOString().slice(0,16),notes:'Logged by Nexaly Command Agent'});result=`Recorded ${med.name}: ${status}. This is a status record only, not medication advice.`;agentLog(raw,result)}}
else if(/^\/backup|back up|backup now/.test(low)){download('NexalyPlanner_CareBridge_Backup.json',JSON.stringify(state,null,2));result='Backup export started.';agentLog(raw,result)}
else if(/^\/emergency|emergency pack/.test(low)){if(lov){go('emergency');setTimeout(()=>{const s=$('#emLoved');if(s){s.value=lov.id;s.dispatchEvent(new Event('change'))}},0);result=`Opened Emergency / ICE for ${lov.name}.`}else result='Name a loved one, for example: /emergency Margaret.'}
else if(/^\/handoff|handoff for/.test(low)){go('handoff');setTimeout(()=>{if(lov&&$('#hoLoved'))$('#hoLoved').value=lov.id},0);result=lov?`Opened Handoff Center for ${lov.name}.`:'Opened Handoff Center.'}
else if(/conflict/.test(low)){const c=conflicts();result=c.length?`I found ${c.length} cross-domain conflict(s). `+c.slice(0,4).map(x=>`${x.a.title} ↔ ${x.b.title} at ${fmtDT(x.a.dt)}`).join('; '):'No cross-domain time collisions are currently detected.'}
else if(/document.*expir|expir.*document/.test(low)){const d=expiringDocs();result=d.length?d.map(x=>`${x.name} (${fmtDate(x.expiryDate)})`).join('; '):'No document review/expiry dates fall within the next 60 days.'}
else if(/follow.?up/.test(low)){const f=followupGaps();result=f.length?`Possible follow-up planning gaps: `+f.map(x=>`${x.provider} — ${fmtDate(x.followUpDate)}`).join('; '):'No follow-up planning gaps detected by the offline rules.'}
else if(/what.*(mom|mother|dad|father|margaret)|need.*(mom|mother|dad|father)/.test(low)&&lov){const t=state.tasks.filter(x=>x.lovedId===lov.id&&x.status!=='Done');const a=state.appointments.filter(x=>x.lovedId===lov.id&&new Date(x.dateTime)>=new Date()).sort((a,b)=>new Date(a.dateTime)-new Date(b.dateTime))[0];result=`${lov.name}: ${t.length} open task(s). ${a?'Next appointment: '+a.provider+' on '+fmtDT(a.dateTime)+'.':'No upcoming appointment recorded.'}`}
else if(/help|what can you do|commands/.test(low)){result='I can summarize status/today, search records, open modules, add tasks/expenses, log medication status, show conflicts/follow-up gaps/document alerts, open Emergency/Handoff, and export backups. Try /status, /today, /open tasks, /search insurance, /backup.'}
else result='I can help with CareBridge itself and the information stored in this planner. Try asking “What is due today?”, “Show conflicts”, “Which documents expire soon?”, or use /help.';agentSay(result,/^\/add|^\/log|^\/backup/.test(low)?'action':'answer');save();render()}
function bindAgent(){const send=()=>{const q=$('#agentInput').value.trim();if(!q)return;runAgent(q)};$('#agentSend').onclick=send;$('#agentInput').onkeydown=e=>{if(e.key==='Enter')send()};$('#agentUndo').onclick=()=>{const snap=state.agent.undo.shift();if(!snap){toast('No agent action to undo.');return}const keep=state.agent.undo;state=JSON.parse(snap);state.agent.undo=keep;save('Agent action undone.');render()}}
function onboarding(){if(sessionStorage.getItem(ONBOARD))return;let step=0;const show=()=>{const pages=[`<h3>Welcome to NexalyPlanner CareBridge OS</h3><p>Offline care coordination for loved ones, children, household, work and your own life.</p><div class="form"><div class="field"><label>${tr('language')}</label><select id="obLang" class="select">${$('#langSelect').innerHTML}</select></div><div class="field"><label>${tr('theme')}</label><select id="obTheme" class="select"><option value="light">Light</option><option value="dark">Dark</option></select></div></div>`,`<h3>Create your local caregiver profile</h3><div class="field"><label>Profile name</label><input class="input" id="obName" value="${esc(state.profile.name)}"></div><p class="notice" style="margin-top:10px">${tr('localData')}</p>`,`<h3>Start Empty or Explore Demo Data</h3><p>Demo data shows an aging-parent profile, sibling helper, tasks, appointment, medication placeholder, document, expense, school event and work/household conflicts.</p><div class="quick"><button class="btn primary" id="obDemo">Explore Demo Data</button><button class="btn" id="obEmpty">Start Empty</button></div>`];modal(`<div class="onboardSteps"><i class="${step>=0?'on':''}"></i><i class="${step>=1?'on':''}"></i><i class="${step>=2?'on':''}"></i></div>${pages[step]}<div class="modalActions">${step>0?'<button class="btn" id="obBack">Back</button>':''}${step<2?'<button class="btn primary" id="obNext">Next</button>':''}</div>`);if(step===0){$('#obLang').value=state.settings.lang;$('#obTheme').value=state.settings.theme;$('#obNext').onclick=()=>{state.settings.lang=$('#obLang').value;state.settings.theme=$('#obTheme').value;save();apply();step++;show()}}else if(step===1){$('#obBack').onclick=()=>{step--;show()};$('#obNext').onclick=()=>{state.profile.name=$('#obName').value.trim();save();step++;show()}}else{$('#obBack').onclick=()=>{step--;show()};$('#obDemo').onclick=()=>{loadDemo();save();sessionStorage.setItem(ONBOARD,'1');closeModal();render()};$('#obEmpty').onclick=()=>{sessionStorage.setItem(ONBOARD,'1');closeModal();render()}}};show()}

function menuCount(routeId){
  const map={loved:state.lovedOnes.length,plans:state.carePlans.length,meds:state.medications.length,appointments:state.appointments.filter(x=>['Planned','Rescheduled'].includes(x.status||'Planned')).length,team:state.careTeam.length,tasks:state.tasks.filter(x=>x.status!=='Done').length,carelog:state.careLogs.length,incidents:state.incidents.filter(x=>x.status!=='Closed').length,documents:state.documents.length,money:state.money.length,errands:state.errands.filter(x=>x.status!=='Done').length,children:state.childFamily.length,household:state.household.filter(x=>x.status!=='Done').length,mylife:state.myLife.length};
  return map[routeId]??null;
}
renderNav=function(){
  const groups=[
    ['Overview',[['command',0]]],
    ['Care Core',[['loved',1],['plans',2],['meds',3],['appointments',4],['team',5]]],
    ['Daily Care',[['tasks',6],['carelog',7],['health',8],['living',9],['incidents',10]]],
    ['Life & Logistics',[['documents',11],['money',12],['errands',13],['children',14],['household',15],['mylife',16]]],
    ['Safety & Intelligence',[['emergency',17],['handoff',18],['__insights',-1],['analytics',19],['reports',20]]],
    ['System',[['agent',21],['search',22],['settings',23]]]
  ];
  let h='';
  groups.forEach(([label,items])=>{
    h+=`<div class="navgroup">${label}</div><nav class="nav">`;
    items.forEach(([rid,idx])=>{
      if(rid==='__insights') h+=`<button class="insight-link" data-insights-menu="1"><span>✦</span><span>AI Insights</span><span class="navCount">${getAIInsights().filter(x=>x.level!=='positive').length}</span></button>`;
      else {const c=menuCount(rid);h+=`<button data-r="${rid}" class="${route===rid?'active':''}"><span>${icons[idx]}</span><span>${esc(navName(idx))}</span>${c!==null?`<span class="navCount">${c}</span>`:''}</button>`}
    });
    h+='</nav>';
  });
  $('#navRoot').innerHTML=h;
  $$('[data-r]').forEach(b=>b.onclick=()=>{document.body.classList.remove('menu-open');go(b.dataset.r)});
  const ai=$('[data-insights-menu]');if(ai)ai.onclick=()=>{document.body.classList.remove('menu-open');route='command';render();setTimeout(()=>$('#aiInsights')?.scrollIntoView({behavior:'smooth',block:'start'}),60)};
}
function taskAssignmentStats(){const open=state.tasks.filter(x=>x.status!=='Done'), counts={};open.forEach(x=>{const n=teamName(x.assignee);counts[n]=(counts[n]||0)+1});const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]);return {open,counts,entries}}
function handoffReadiness(){const loved=state.lovedOnes.filter(x=>!x.archived);if(!loved.length)return 0;let total=0;loved.forEach(l=>{let s=0;s+=state.carePlans.some(x=>x.lovedId===l.id)?20:0;s+=state.medications.some(x=>x.lovedId===l.id)?20:0;s+=state.tasks.some(x=>x.lovedId===l.id&&x.status!=='Done')?20:0;s+=l.emergencyContacts?20:0;s+=(l.mobility||l.diet||l.preferences)?20:0;total+=s});return Math.round(total/loved.length)}
function getAIInsights(){
  const m=careMetrics(),cf=conflicts(),fg=followupGaps(),ed=expiringDocs(),stats=taskAssignmentStats(),out=[];
  if(m.overdue>0)out.push({level:'high',icon:'!',title:`${m.overdue} overdue care item${m.overdue===1?'':'s'}`,text:'Overdue care work is increasing the planning load. Review the oldest items first and close, reschedule or reassign them.',reason:'Based on open tasks with due dates before today.',route:'tasks',action:'Review overdue tasks'});
  if(cf.length>0)out.push({level:'high',icon:'⇄',title:`${cf.length} schedule conflict${cf.length===1?'':'s'} detected`,text:'Care, child/family, household, work or personal commitments overlap. Resolve the collision before the affected day.',reason:'Cross-domain date/time collision detector.',route:'analytics',action:'Open conflicts'});
  if(fg.length>0)out.push({level:'high',icon:'↻',title:`${fg.length} follow-up gap${fg.length===1?'':'s'}`,text:'A completed appointment still has a follow-up date, referral or next action that needs planning attention.',reason:'Completed appointments checked for unresolved follow-up fields.',route:'appointments',action:'Review follow-ups'});
  if(m.medAlerts>0)out.push({level:'medium',icon:'✚',title:`${m.medAlerts} medication record reminder${m.medAlerts===1?'':'s'}`,text:'One or more user-entered refill or review dates are approaching. Verify the record and plan the next administrative step.',reason:'Recordkeeping reminder only; no medication advice is generated.',route:'meds',action:'Open medications'});
  if(ed.length>0)out.push({level:'medium',icon:'▱',title:`${ed.length} document review${ed.length===1?'':'s'} approaching`,text:'Insurance, medical, legal, identity or other indexed documents have review/expiry dates within the next 60 days.',reason:'Document readiness check from locally entered dates.',route:'documents',action:'Review documents'});
  const top=stats.entries[0],openN=stats.open.length;if(top&&openN>=4&&top[1]/openN>=.65)out.push({level:'medium',icon:'♟',title:'Responsibility looks concentrated',text:`${top[0]} currently carries ${top[1]} of ${openN} assigned open tasks. Consider whether any planning work can be delegated.`,reason:'Responsibility imbalance check; this is a planning suggestion.',route:'team',action:'Open care team'});
  const next7=Date.now()+7*864e5,rest=state.myLife.filter(x=>x.protected&&new Date(x.dateTime||0).getTime()>=Date.now()&&new Date(x.dateTime||0).getTime()<=next7).length;if(['Heavy','Overloaded'].includes(m.label)&&rest===0)out.push({level:'medium',icon:'◎',title:'No protected personal-time block this week',text:'The current care-load indicator is high and no protected rest/respite block is scheduled in the next seven days.',reason:'Care-load + personal-time planning comparison; not a health assessment.',route:'mylife',action:'Plan personal time'});
  const hr=handoffReadiness();if(state.lovedOnes.length&&hr<80)out.push({level:'medium',icon:'⇆',title:`Handoff readiness ${hr}%`,text:'Some handoff essentials are missing, such as current care plan, medication list, open tasks, contacts or routine notes.',reason:'Checks locally stored handoff fields for presence, not clinical completeness.',route:'handoff',action:'Improve handoff pack'});
  if(!out.length)out.push({level:'positive',icon:'✓',title:'No major planning gaps detected',text:'CareBridge did not find overdue tasks, schedule collisions, follow-up gaps or near-term record reminders in the current data.',reason:'This is an organization check, not medical or legal clearance.',route:'command',action:'View today'});
  return out.slice(0,6)
}
function readinessScore(){let s=0,max=6;if(state.lovedOnes.length)s++;if(state.carePlans.length)s++;if(state.medications.length)s++;if(state.careTeam.length)s++;if(state.documents.length)s++;if(state.profile.name)s++;return Math.round(s/max*100)}
function aiInsightCards(){return getAIInsights().slice(0,3).map(x=>`<div class="insightCard ${x.level}"><div class="insightTop"><div class="insightIcon">${x.icon}</div><span class="severity ${x.level}">${x.level==='positive'?'Ready':x.level}</span></div><h5>${esc(x.title)}</h5><p>${esc(x.text)}</p><div class="insightReason">Why: ${esc(x.reason)}</div><button class="btn sm insightAction" data-insight-route="${x.route}">${esc(x.action)} →</button></div>`).join('')}
function briefingText(){const m=careMetrics(),items=getTodayItems(),ins=getAIInsights();const urgent=ins.filter(x=>x.level==='high').length;return `Today: ${items.length} scheduled item(s). Care load is ${m.label}. ${urgent?urgent+' high-priority planning insight(s) need attention.':'No high-priority planning alert is currently detected.'}`}
dashboard=function(){
  const m=careMetrics(),items=getTodayItems(),cf=conflicts(),fg=followupGaps(),ed=expiringDocs(),weekStart=Date.now()-7*864e5,spend=state.money.filter(x=>new Date(x.date||0).getTime()>=weekStart).reduce((s,x)=>s+Number(x.amount||0),0),completed=state.appointments.filter(x=>x.status==='Completed'&&new Date(x.dateTime||0).getTime()>=weekStart).length,personal=state.myLife.filter(x=>x.protected&&new Date(x.dateTime||0).getTime()>=weekStart).length,pct=Math.min(100,Math.max(8,m.score/24*100)),ready=readinessScore(),hr=handoffReadiness();

function agentLang(){return AGENT_CHAT[state.settings.lang]||AGENT_CHAT.en}
function agentName(){const n=(state.profile.name||'').trim().split(/\s+/)[0];return n?' '+n:''}
function agentPhrase(key,vars={}){let x=(agentLang()[key]||AGENT_CHAT.en[key]||key).replaceAll('{name}',agentName());Object.entries(vars).forEach(([k,v])=>x=x.replaceAll('{'+k+'}',String(v)));return x}
function normAgent(s){return String(s||'').trim().toLowerCase().replace(/[!?.,;:،؛¿¡…]+/g,' ').replace(/\s+/g,' ').trim()}
function ensureAgentContext(){state.agent=state.agent||{history:[],actions:[],undo:[]};state.agent.context=state.agent.context||{lastIntent:'',lastLovedId:'',lastRoute:'',lastWhy:'',pendingAction:'',lastQuery:''};return state.agent.context}
function rememberAgent(intent,opts={}){const c=ensureAgentContext();c.lastIntent=intent||c.lastIntent;c.lastLovedId=opts.lovedId||c.lastLovedId;c.lastRoute=opts.route||c.lastRoute;c.lastWhy=opts.why||c.lastWhy;c.pendingAction=opts.pendingAction||'';c.lastQuery=opts.query||c.lastQuery}
function socialIntent(low){
 if(/(how are you|how are u|how r u|how r you|howre you|hru|how is it going|hows it going|how's it going|what s up|whats up|sup|kaise ho|kya haal|como estas|cómo estás|como voce esta|como você está|comment ca va|comment ça va|come stai|hoe gaat het|كيف حالك)/.test(low))return 'how';
 if(/^(hi|hello|hey|hiya|are you there|you there|salam|salaam|assalamualaikum|assalam o alaikum|good morning|good afternoon|good evening|hola|bonjour|salut|ciao|ola|olá|hallo|مرحبا|السلام عليكم)(\s.*)?$/.test(low))return 'hello';
 if(/^(thanks|thank you|thx|ty|shukriya|شكرا|شكرًا|gracias|obrigado|obrigada|merci|dank je|bedankt|grazie)(\s.*)?$/.test(low))return 'thanks';
 if(/^(bye|goodbye|see you|take care|allah hafiz|khuda hafiz|adios|adiós|tchau|au revoir|tot ziens|ciao ciao|مع السلامة)(\s.*)?$/.test(low))return 'bye';
 if(/^(ok|okay|k|got it|alright|theek|thik|fine|done|vale|d accord|d’accord|va bene|prima|goed|حسنا|تمام)$/.test(low))return 'ok';
 if(/^(nice|great|good|perfect|awesome|excellent|wah|zabardast|genial|parfait|ottimo|goed zo|رائع)(\s.*)?$/.test(low))return 'nice';
 if(/(who are you|what are you|your name|who made you|are you ai|tum kon ho|aap kon ho|quien eres|quién eres|quem e voce|quem é você|qui es tu|qui êtes vous|chi sei|wie ben je|من أنت)/.test(low))return 'identity';
 if(/^(help|help me|can you help|madad|ayuda|ajuda|aide|aiuto|hulp|مساعدة)$/.test(low))return 'help';
 if(/(tell me a joke|joke|mazak|chiste|piada|blague|barzelletta|grapje|نكتة)/.test(low))return 'joke';
 if(/^(weather|weather today|mausam|clima|meteo|météo|weer|الطقس)$/.test(low))return 'weather';
 return ''
}
const _v13ParseLoved=parseLoved;
parseLoved=function(q){
 const direct=_v13ParseLoved(q);if(direct)return direct;
 const low=normAgent(q);const rels=[
  [['mom','mum','mother','mama','ammi','ami','madre','mae','mãe','mere','mère','moeder','أمي','والدتي'],['mother','mom','mum','mama','madre','mãe','mère','moeder']],
  [['dad','father','papa','abu','abba','padre','pai','pere','père','vader','أبي','والدي'],['father','dad','papa','padre','pai','père','vader']],
  [['wife','spouse','partner','esposa','esposo','conjoint','coniuge','زوجة','زوج'],['wife','husband','spouse','partner']],
  [['child','son','daughter','beta','beti','hijo','hija','filho','filha','enfant','figlio','figlia','kind','ابن','ابنة'],['son','daughter','child']]
 ];
 for(const [words,rels2] of rels){if(words.some(w=>low.includes(w))){const f=state.lovedOnes.find(l=>rels2.some(r=>String(l.relationship||'').toLowerCase().includes(r)));if(f)return f}}
 return null
}
function personLabel(lov){return lov?.name||((state.lovedOnes.length===1&&state.lovedOnes[0].name)||'this person')}
function futureAppointments(lov){return state.appointments.filter(x=>(!lov||x.lovedId===lov.id)&&['Planned','Rescheduled'].includes(x.status||'Planned')&&new Date(x.dateTime||0)>=new Date()).sort((a,b)=>new Date(a.dateTime)-new Date(b.dateTime))}
function openTasksFor(lov){return state.tasks.filter(x=>(!lov||x.lovedId===lov.id)&&x.status!=='Done').sort((a,b)=>new Date(a.dateTime||'2999-01-01')-new Date(b.dateTime||'2999-01-01'))}
function scheduleForDate(dateISO){const all=[];const add=(arr,type,titleFn,dtKey='dateTime')=>arr.forEach(x=>{const d=String(x[dtKey]||'').slice(0,10);if(d===dateISO)all.push({type,title:titleFn(x),dt:x[dtKey]||dateISO,lovedId:x.lovedId||''})});add(state.tasks.filter(x=>x.status!=='Done'),'Task',x=>x.title);add(state.appointments.filter(x=>['Planned','Rescheduled'].includes(x.status||'Planned')),'Appointment',x=>x.provider);add(state.errands.filter(x=>x.status!=='Done'),'Errand',x=>x.title);add(state.childFamily,'Family',x=>x.title);add(state.household.filter(x=>x.status!=='Done'),'Household',x=>x.title);add(state.myLife,'Personal/Work',x=>x.title);return all.sort((a,b)=>new Date(a.dt)-new Date(b.dt))}
function tomorrowISO(){const d=new Date();d.setDate(d.getDate()+1);return d.toISOString().slice(0,10)}
function conciseTasks(lov){const xs=openTasksFor(lov);if(!xs.length)return agentPhrase('noTasks');const who=lov?` for ${lov.name}`:'';return `${xs.length} open task${xs.length===1?'':'s'}${who}: `+xs.slice(0,5).map(x=>`${x.title}${x.dateTime?' — '+fmtDT(x.dateTime):''}`).join('; ')+(xs.length>5?`; plus ${xs.length-5} more.`:'.')}
function conciseMeds(lov){let xs=state.medications.filter(x=>!lov||x.lovedId===lov.id);if(!lov&&state.lovedOnes.length===1)lov=state.lovedOnes[0],xs=state.medications.filter(x=>x.lovedId===lov.id);if(!xs.length)return agentPhrase('noMeds',{person:personLabel(lov)});return `${personLabel(lov)} — ${xs.length} medication record${xs.length===1?'':'s'}: `+xs.slice(0,6).map(x=>`${x.name}${x.schedule?' · '+x.schedule:''}`).join('; ')+'. These are user-entered records, not medication advice.'}
function conciseAppointments(lov){const xs=futureAppointments(lov);if(!xs.length)return agentPhrase('noAppointments',{person:personLabel(lov)});return `Next appointment${xs.length>1?'s':''}${lov?' for '+lov.name:''}: `+xs.slice(0,4).map(x=>`${x.provider} — ${fmtDT(x.dateTime)}${x.location?' · '+x.location:''}`).join('; ')+'.'}
function concisePerson(lov){if(!lov)return '';const ts=openTasksFor(lov),apps=futureAppointments(lov),meds=state.medications.filter(x=>x.lovedId===lov.id);return `${lov.name} (${lov.relationship||'loved one'}): ${ts.length} open task${ts.length===1?'':'s'}, ${meds.length} medication record${meds.length===1?'':'s'}${apps[0]?`, next appointment ${apps[0].provider} on ${fmtDT(apps[0].dateTime)}`:', no upcoming appointment recorded'}.`}
