formulaNote|Protected cash = buffer + tax reserve + obligations + additional reserve targets + planned payments. Ceiling = max(0, cash − protected cash) × safety factor, rounded down. Suggested draw = min(request, ceiling). Cash after = cash − request. Runway = max(0, cash after) ÷ monthly burn. YTD includes completed payments since fiscal year start.|النقد المحمي = الحد الأدنى + احتياطي الضرائب + الالتزامات + أهداف الاحتياطيات + المدفوعات المخططة. الحد = الحد الأقصى (0، النقد − المحمي) × عامل الأمان، مقربًا للأسفل. المقترح = الحد الأدنى (الطلب، الحد). النقد بعد = النقد − الطلب. مدة التغطية = الحد الأقصى (0، النقد بعد) ÷ المصروفات الشهرية. الإجمالي السنوي يشمل المدفوعات المكتملة منذ بداية السنة المالية.|Caixa protegido = reserva mínima + impostos + obrigações + metas de reservas + pagamentos planejados. Limite = máximo(0, caixa − protegido) × segurança, arredondado para baixo. Sugestão = mínimo(solicitação, limite). Caixa após = caixa − solicitação. Fôlego = máximo(0, caixa após) ÷ despesas mensais. Total anual inclui pagamentos concluídos desde o início fiscal.|Efectivo protegido = colchón + reserva fiscal + obligaciones + objetivos de reservas + pagos planificados. Límite = máximo(0, efectivo − protegido) × seguridad, redondeado hacia abajo. Sugerencia = mínimo(solicitud, límite). Efectivo después = efectivo − solicitud. Cobertura = máximo(0, efectivo después) ÷ gasto mensual. Total anual incluye pagos completados desde el inicio fiscal.|Liquidità protetta = cuscinetto + imposte + obblighi + obiettivi riserve + pagamenti pianificati. Limite = massimo(0, liquidità − protetta) × sicurezza, arrotondato per difetto. Suggerimento = minimo(richiesta, limite). Liquidità dopo = liquidità − richiesta. Autonomia = massimo(0, liquidità dopo) ÷ costi mensili. Totale annuo include pagamenti completati dall’inizio fiscale.|Beschermd geld = buffer + belastingen + verplichtingen + reservedoelen + geplande betalingen. Limiet = max(0, geld − beschermd) × veiligheid, naar beneden af financeNote|ROI subtracts interest, not loan principal. Cash after debt service subtracts full repayments. Loan fees are upfront; loan principal reduces upfront cash, not asset cost.|العائد يخصم الفائدة لا أصل القرض. النقد بعد خدمة الدين يخصم كامل الأقساط. الرسوم مقدمة؛ أصل القرض يقلل النقد المقدم لا تكلفة الأصل.|ROI deduz juros, não principal. Caixa após dívida deduz parcelas completas. Taxas são iniciais; o principal reduz caixa inicial, não custo do ativo.|ROI deduce intereses, no capital. El efectivo tras deuda deduce cuotas completas. Gastos al inicio; el préstamo reduce efectivo inicial, no costo del activo.|ROI sottrae interessi, non capitale. La liquidità dopo debito sottrae le rate. Spese iniziali; il prestito riduce la liquidità iniziale, non il costo.|ROI trekt rente af, geen hoofdsom. Kas na schuldendienst trekt hele termijnen af. Kosten zijn vooraf; lening verlaagt startgeld, geen activakosten.|Le ROI déduit les intérêts, pas le capital. La trésorerie après dette déduit les échéances. Frais initiaux ; l’emprunt réduit la trésorerie initiale, pas le coût de l’actif.

formulaNote|Investment includes purchase, setup and upfront fees less immediate incentives. Year-one ROI = interest-adjusted net benefit / investment. Simple payback uses year-one average monthly net benefit; it ignores time value and later changes. Break-even includes straight-line capital recovery, interest, fixed costs and other benefits. Residual is added only at useful-life end. No taxes, depreciation, NPV or IRR are calculated.|الاستثمار يشمل الشراء والإعداد والرسوم ناقص الحوافز الفورية. العائد = صافي السنة الأولى بعد الفائدة / الاستثمار. الاسترداد البسيط يستخدم المتوسط الشهري للسنة الأولى ويتجاهل قيمة الزمن والتغيرات اللاحقة. التعادل يشمل استرداد رأس المال والفائدة والثابت والفوائد الأخرى. القيمة المتبقية تُضاف بنهاية العمر فقط. لا تُحسب الضرائب أو الإهلاك أو NPV أو IRR.|Investimento inclui compra, implantação e taxas menos incentivos imediatos. ROI = benefício líquido após juros / investimento. Retorno simples usa média mensal do primeiro ano, ignorando tempo e mudanças futuras. Equilíbrio inclui recuperação de capital, juros, custos fixos e outros benefícios. Residual só no fim da vida. Sem impostos, depreciação, VPL ou TIR.|Inversión incluye compra, puesta en marcha y gastos menos incentivos inmediatos. ROI = beneficio neto tras intereses / inversión. Recuperación simple usa media mensual del primer año e ignora tiempo y cambios posteriores. Equilibrio incluye recuperación de capital, intereses, fijos y otros beneficios. Residual solo al final de vida. Sin impuestos, depreciación, VAN o TIR.|Investimento include acquisto, avvio e spese meno incentivi immediati. ROI = beneficio netto dopo interessi / investimento. Recupero semplice usa media mensile del primo anno, ignorando tempo e variazioni future. Pareggio include recupero capitale, interessi, fissi e altri benefici. Residuo solo a fine vita. Nessuna imposta, ammortamento, VAN o TIR.|Investering omvat aankoop, opstart en kosten min directe premies. ROI = netto baten na rente / investering. Eenvoudige terugverdientijd gebruikt jaar-één-maandgemiddelde, zonder tijdwaarde of latere veranderingen. Break-even omvat kapitaalterugwinning, rente, vaste kosten en andere baten. Restwaarde alleen aan einde levensduur. Geen belasting, afschrijving, NPV of IRR.|L’investissement inclut achat, démarrage et frais moins aides immédiates. ROI = bénéfice net après intérêts / investissement. Retour simple sur moyenne mensuelle de l’an un, sans valeur temps ni changements futurs. Seuil : récupération du capital, intérêts, fixes et autres bénéfices. Résiduel seulement en fin de vie. Aucun impôt, amortissement, VAN ou TRI.

function breakChart(a){if(a.ratio===null)return `<p>${t('noPositive')}</p>`;let xmax=Math.max(1,a.revenue*1.3,(a.beRevenue||0)*1.4,(a.targetRevenue||0)*1.1),variable=1-a.ratio/100,ymax=Math.max(xmax,a.fixed+xmax*variable,1),x=v=>70+v/xmax*660,y=v=>285-v/ymax*220;return `<svg id="breakChart" class="diagram" viewBox="0 0 850 350" role="img" aria-label="${t('breakEven')}"><line x1="70" x2="730" y1="285" y2="285" stroke="var(--line)"/><line x1="70" x2="70" y1="60" y2="285" stroke="var(--line)"/><path d="M70,${y(0)} L730,${y(xmax)}" stroke="var(--accent)" stroke-width="4" fill="none"/><path d="M70,${y(a.fixed)} L730,${y(a.fixed+xmax*variable)}" stroke="var(--copper)" stroke-width="4" fill="none"/>${a.beRevenue!==null?`<g tabindex="0"><title>${t('beRevenue')}: ${money(a.beRevenue)}</title><circle cx="${x(a.beRevenue)}" cy="${y(a.beRevenue)}" r="7" fill="var(--bad)"/><line x1="${x(a.beRevenue)}" x2="${x(a.beRevenue)}" y1="${y(a.beRevenue)}" y2="285" stroke="var(--muted)" stroke-dasharray="4 4"/><text x="${x(a.beRevenue)}" y="315" text-anchor="middle" font-size="12">${money(a.beRevenue)}</text></g>`:''}<text x="70" y="30" font-size="12">${t('revenue')} / ${t('fixed')} + ${t('costs')}</text><text x="740" y="${y(xmax)+4}" font-size="12">${t('revenue')}</text><text x="740" y="${y(a.fixed+xmax*variable)+18}" font-size="12">${t('costs')}</text><text x="70" y="335" font-size="12">0 → ${money(xmax)} · ${t('revenue')} · ${t('live')}</text></svg>`}
function matrix(a){let xmax=Math.max(1,...a.rows.map(r=>r.usage)),lo=Math.min(0,...a.rows.map(r=>r.cm)),hi=Math.max(1,...a.rows.map(r=>r.cm)),maxUnits=Math.max(1,...a.rows.map(r=>r.units));return `<svg id="mixChart" class="diagram" viewBox="0 0 850 340" role="img" aria-label="${t('mix')}"><line x1="70" x2="735" y1="280" y2="280" stroke="var(--line)"/><line x1="70" x2="70" y1="50" y2="280" stroke="var(--line)"/>${a.rows.map(r=>{let x=90+r.usage/xmax*590,y=260-(r.cm-lo)/(hi-lo)*185,rad=9+r.units/maxUnits*16;return `<g tabindex="0"><title>${esc(r.name)} · ${t('unitCM')}: ${money(r.cm)} · ${t('usage')}: ${num(r.usage)} · ${t('units')}: ${num(r.units)}</title><circle cx="${x}" cy="${y}" r="${rad}" fill="${r.cm>=0?'var(--accent)':'var(--bad)'}" opacity=".78"/><text x="${x}" y="${y-rad-10}" text-anchor="middle" font-size="13">${esc(r.name.slice(0,20))}</text></g>`}).join('')}<text x="70" y="25" font-size="12">${t('unitCM')} · ${money(lo)} → ${money(hi)}</text><text x="70" y="318" font-size="12">${t('usage')} · 0 → ${num(xmax)} · ${esc(currentData().resource)}</text></svg>`}

function productTable(a,report=false){let rows=report?a.rows:a.rows.filter(r=>JSON.stringify(r).toLowerCase().includes(filter.toLowerCase()));rows=[...rows].sort((x,y)=>sort==='name'?x.name.localeCompare(y.name):sort==='cm'?y.cm-x.cm:sort==='efficiency'?(y.efficiency??-Infinity)-(x.efficiency??-Infinity):y.contribution-x.contribution);let count=rows.length;if(!report)rows=rows.slice(tablePage*20,tablePage*20+20);let fields=compactCols&&!report?['price','cm','ratio','units']:['price','cost','cm','ratio','units','contribution','usage','efficiency'];return `<div class="tablewrap"><table class="${density?'compact':''}"><thead><tr><th>${t('items')}</th>${fields.map(k=>`<th>${t({cm:'unitCM',contribution:'contribution',efficiency:'efficiency'}[k]||k)}</th>`).join('')}${report?'':'<th></th>'}</tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}<br><small>${esc(r.category)} · ${esc(r.unit)}</small></td>${fields.map(k=>`<td class="${['cm','contribution'].includes(k)&&r[k]<0?'negative':''}">${k==='ratio'?pct(r[k]):['units','usage'].includes(k)?num(r[k]):k==='efficiency'&&r.free?t('free'):money(r[k])}</td>`).join('')}${report?'':`<td>${btn('details','detail',`data-id="${r.id}"`)}${btn('edit','edit',`data-entity="items" data-id="${r.id}"`)}</td>`}</tr>`).join('')}</tbody></table></div>${report?'':pagination(count)}`}
function allocation(o,report=false){if(!o.available)return `<div class="strip warning"><h2>${t('unavailable')}</h2><p>${esc(t(o.reason))}</p><p>${t('constraintNote')}</p></div>`;return `<div class="kpis">${kpi('contribution',o.cm)}${kpi('profit',o.profit)}${kpi('used',o.used,'number')}${kpi('unused',o.unused,'number')}</div><div class="tablewrap"><table><thead><tr><th>${t('items')}</th><th>${t('demand')}</th><th>${t('allocated')}</th><th>${t('allocatedCM')}</th><th>${t('used')}</th></tr></thead><tbody>${o.rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${num(r.demand)}</td><td>${num(r.allocated)}</td><td>${money(r.allocatedCM)}</td><td>${num(r.allocatedUsage)}</td></tr>`).join('')}</tbody></table></div><p>${t('gain')}: ${money(o.gain)} · ${t(o.mode)}</p><p>${t('constraintNote')}</p>${report?'':btn('saveOptimized','optimizeSave','',true)}${o.a.overCapacity?`<div class="strip warning">${t('baseline')} · ${t('infeasible')}</div>`:''}`}
function dashboard(a){let o=E.optimize(db);return `<div class="strip ${a.overCapacity?'warning':''}">${t(a.overCapacity?'infeasible':'feasible')} · ${num(a.usage)} / ${num(db.capacity)} ${esc(db.resource)}<p>${t('review')}</p></div><div class="hero"><div><small>${t('headline')}</small><h2>${money(a.cm)}</h2><p>${t('contribution')} · ${esc(db.periodName)} · ${num(db.months)} ${t(db.months===1?'monthSingular':'monthUnit')}</p></div><div><small>${t('profit')}</small><h2>${money(a.profit)}</h2><p>${t('targetProfit')}: ${money(db.targetProfit)}</p></div></div><div class="kpis">${kpi('contribution',a.cm)}${kpi('ratio',a.ratio,'percent')}${kpi('weighted',a.weighted)}${kpi('beUnits',a.beUnits,'number')}${kpi('targetUnits',a.targetUnits,'number')}${kpi('bestEfficiency',a.bestEfficiency)}${kpi('fixed',a.fixed)}${kpi('coverage',a.coverage,'percent')}</div><div class="decisiongrid"><div class="card"><div class="heading"><h2>${t('contribution')}</h2>${btn('chartExport','svg','data-chart="ladderChart"')}</div><div class="chartwrap">${ladder(a)}</div></div><div class="card"><h2>${t('bestEfficiency')}</h2>${efficiency(a)}${btn('constraints','goto','data-id="constraints"',true)}</div></div><div class="grid"><div class="card"><h2>${t('optimized')}</h2>${o.available?`<div class="mini"><div><small>${t('contribution')}</small><strong>${money(o.cm)}</strong></div><div><small>${t('profit')}</small><strong>${money(o.profit)}</strong></div></div><p>${t('gain')}: ${money(o.gain)}</p>`:`<p>${t('unavailable')}</p>`}${btn('mix','goto','data-id="mix"')}</div><div class="card"><h2>${t('history')}</h2>${db.activity.slice(0,4).map(x=>`<p><small>${new Date(x.date).toLocaleString(db.locale)}</small><br>${esc(x.action)}</p>`).join('')||'—'}<div class="actions">${btn('scenarios','goto','data-id="scenarios"')}${btn('reports','goto','data-id="reports"')}</div></div></div>`}
function thresholds(a){return `<div class="kpis">${kpi('beUnits',a.beUnits,'number')}${kpi('beRevenue',a.beRevenue)}${kpi('targetUnits',a.targetUnits,'number')}${kpi('targetRevenue',a.targetRevenue)}</div><div class="grid"><div class="card"><h2>${t('breakEven')}</h2><div class="chartwrap">${breakChart(a)}</div>${btn('chartExport','svg','data-chart="breakChart"')}</div><div class="card"><h2>${t('fixed')}</h2><p>${money(a.fixed)} · ${esc(db.periodName)} · ${num(db.months)} ${t(db.months===1?'monthSingular':'monthUnit')}</p><p>${t('weighted')}: ${money(a.weighted)}</p><p>${t('ratio')}: ${pct(a.ratio)}</p><p>${t('coverage')}: ${pct(a.coverage)}</p><div class="strip">${t('beUnits')}: ${a.beFeasible===null?'—':t(a.beFeasible?'feasible':'infeasible')}<br>${t('targetUnits')}: ${a.targetFeasible===null?'—':t(a.targetFeasible?'feasible':'infeasible')}</div><p>${t('roundingNote')}</p>${btn('fixed','goto','data-id="fixed"')}</div></div><div class="card">${formula()}</div>`}
function assumptionsForm(){return `<form id="assumptionsForm" class="card"><div class="formgrid">${field('resource',db.resource,'text','required maxlength="100"')}${field('capacity',db.capacity,'number','required min="0" max="1000000000000" step="any"')}${field('quantum',db.quantum,'number','required min="0.000001" max="1000000000000" step="any"')}${select('mode',[{id:'whole',name:t('whole')},{id:'divisible',name:t('divisible')}],db.mode)}</div><p>${t('constraintNote')}</p><button class="primary" type="submit">${t('save')}</button><div class="error" id="formError"></div></form>`}
function targetForm(){return `<form id="targetForm" class="card"><div class="formgrid">${field('targetProfit',db.targetProfit,'number','required min="0" max="1000000000000" step="any"')}${field('periodName',db.periodName,'text','required maxlength="100"')}${field('months',db.months,'number','required min="0.01" max="60" step="any"')}</div><p>${t('method')}</p><button class="primary" type="submit">${t('save')}</button><div class="error" id="formError"></div></form>`}
function listTools(cols=true){return `<div class="fieldrow noprint"><label>${t('search')}<input id="filter" value="${esc(filter)}"></label><label>${t('sort')}<select id="sort">${['name','cm','efficiency','contribution'].map(k=>`<option value="${k}" ${sort===k?'selected':''}>${t({cm:'unitCM',efficiency:'efficiency'}[k]||k)}</option>`).join('')}</select></label>${btn('compact','density')}${cols?btn('columns','columns'):''}</div>`}
function pagination(count){let pages=Math.max(1,Math.ceil(count/20));return `<div class="pagination noprint"><span>${tablePage+1} / ${pages} · ${count}</span><div>${btn('back','prev',tablePage===0?'disabled':'')}${btn('next','next',tablePage+1>=pages?'disabled':'')}</div></div>`}
function lists(){let entity=page,rows=db[entity].filter(x=>!x.archived&&JSON.stringify(x).toLowerCase().includes(filter.toLowerCase()));rows.sort((x,y)=>sort==='name'?x.name.localeCompare(y.name):entity==='items'?(E.item(db,y)[sort]||0)-(E.item(db,x)[sort]||0):(y.amount||0)-(x.amount||0));let count=rows.length;rows=rows.slice(tablePage*20,tablePage*20+20);let cols=entity==='items'?['name',...(!compactCols?['category','unit']:[]),'price','baseCost','units','demand','usage']:entity==='costs'?['name','item','type','amount']:['name','amount','frequency'];return `<div class="card">${listTools(entity==='items')}<div class="actions" style="margin:15px 0">${btn('add','add',`data-entity="${entity}"`,true)}${btn('archive','bulk',`data-entity="${entity}"`)}${btn('exportCSV','csv')}</div><div class="tablewrap"><table class="${density?'compact':''}"><thead><tr><th><input type="checkbox" class="check" id="all" aria-label="Select all rows"></th>${cols.map(k=>`<th>${t(k)}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map(x=>`<tr><td><input class="rowcheck check" type="checkbox" value="${x.id}" aria-label="${esc(x.name)}"></td>${cols.map(k=>`<td>${k==='item'?esc(name('items',x.item)):k==='type'?t(x.type==='unit'?'unitCost':'percent'):k==='frequency'?t(x.frequency):['price','baseCost'].includes(k)||k==='amount'&&x.type!=='percent'?money(x[k]):k==='amount'&&x.type==='percent'?pct(x[k]):esc(x[k])}</td>`).join('')}<td>${entity==='items'?btn('details','detail',`data-id="${x.id}"`):''}${btn('edit','edit',`data-entity="${entity}" data-id="${x.id}"`)}${entity==='items'?btn('duplicate','duplicate',`data-id="${x.id}"`):''}${btn('archive','archive',`data-entity="${entity}" data-id="${x.id}"`)}</td></tr>`).join('')}</tbody></table></div>${pagination(count)}<p>${t(entity==='costs'?'costNote':'method')}</p>${count?'':`<p>${t('empty')}</p>`}</div>`}
function scenarios(){let data;try{data=currentScenario()}catch{return `<div class="card">${t('empty')}</div>`}let a=E.analyze(data),o=E.optimize(data),items=db.items.filter(x=>!x.archived);return `<div class="grid"><form id="scenarioForm" class="card itemcard"><h2>${t('scenarios')} · ${t('snapshot')}</h2>${field('name','','text','required maxlength="120"')}<div class="tablewrap scenario-table"><table><thead><tr><th>${t('items')}</th><th>${t('pricePct')}</th><th>${t('costPct')}</th><th>${t('units')}</th></tr></thead><tbody>${items.map(x=>{let c=scenarioDraft.items?.[x.id]||{};return `<tr><td>${esc(x.name)}</td><td><input class="scenarioInput" data-item="${x.id}" data-key="pricePct" type="number" min="0" max="1000" step="any" required value="${c.pricePct??100}" aria-label="${esc(x.name)} ${t('pricePct')}"></td><td><input class="scenarioInput" data-item="${x.id}" data-key="costPct" type="number" min="0" max="1000" step="any" required value="${c.costPct??100}" aria-label="${esc(x.name)} ${t('costPct')}"></td><td><input class="scenarioInput" data-item="${x.id}" data-key="units" type="number" min="0" max="${x.demand}" step="any" required value="${c.units??x.units}" aria-label="${esc(x.name)} ${t('units')}"></td></tr>`}).join('')}</tbody></table></div><div class="formgrid">${field('capacity',scenarioDraft.capacity??db.capacity,'number','required min="0" max="1000000000000" step="any"')}${field('targetProfit',scenarioDraft.targetProfit??db.targetProfit,'number','required min="0" max="1000000000000" step="any"')}<label class="full">${t('notes')}<textarea name="notes"></textarea></label></div><p>${t('costNote')}</p><div class="actions"><button class="primary" type="submit">${t('save')} · ${t('snapshot')}</button>${btn('reset','draftReset')}</div><div id="formError" class="error"></div></form><div id="scenarioPreview">${preview(a,o)}</div></div><div class="card"><h2>${t('compare')}</h2><div class="tablewrap"><table><thead><tr><th>${t('name')}</th><th>${t('contribution')}</th><th>${t('profit')}</th><th>${t('ratio')}</th><th>${t('capacity')}</th><th></th></tr></thead><tbody>${db.scenarios.filter(x=>!x.archived).map(s=>{let x=E.analyze(s.snapshot);return `<tr><td>${esc(s.name)}</td><td>${money(x.cm)}</td><td>${money(x.profit)}</td><td>${pct(x.ratio)}</td><td>${num(s.snapshot.capacity)}</td><td>${btn('reports','snapshot',`data-id="${s.id}"`)}${btn('archive','archive',`data-entity="scenarios" data-id="${s.id}"`)}</td></tr>`}).join('')}</tbody></table></div></div>`}
function preview(a,o){return `<div class="card"><h2>${t('contribution')}: ${money(a.cm)}</h2><div class="kpis">${kpi('profit',a.profit)}${kpi('ratio',a.ratio,'percent')}${kpi('beRevenue',a.beRevenue)}${kpi('targetRevenue',a.targetRevenue)}</div><div class="chartwrap">${ladder(a)}</div><div class="strip">${t(a.overCapacity?'infeasible':'feasible')} · ${num(a.usage)} / ${num(currentScenario().capacity)}</div><h2>${t('optimized')}</h2>${o.available?`<p>${t('contribution')}: ${money(o.cm)} · ${t('profit')}: ${money(o.profit)}</p>`:`<p>${t('unavailable')}</p>`}</div>`}
function report(a){let data=currentData(),o=E.optimize(data);return `<article id="report" class="report"><img class="logo" src="${LOGO}" alt="NexalyPlanner"><p>NexalyPlanner · Contribution Margin & Product Mix Decision OS · v1.0.0 · ${data.currency}</p><h1>${esc(data.business||'NexalyPlanner')}</h1><h2>${t('memo')}</h2><p>${esc(data.periodName)} · ${num(data.months)} ${t(data.months===1?'monthSingular':'monthUnit')} · ${new Date().toLocaleDateString(db.locale)} · ${t(viewSnapshot?'snapshot':'live')}${viewSnapshot?' · '+esc(viewSnapshot.name):''}</p><div class="kpis">${kpi('contribution',a.cm)}${kpi('ratio',a.ratio,'percent')}${kpi('fixed',a.fixed)}${kpi('profit',a.profit)}</div><div class="chartwrap">${ladder(a)}</div>${productTable(a,true)}<p>${t('method')}</p><p>${t('costNote')}</p><p>${t('mixNote')}</p><section class="report-subsection"><h2>${t('breakEven')} / ${t('targetProfit')}</h2><div class="kpis">${kpi('beUnits',a.beUnits,'number')}${kpi('beRevenue',a.beRevenue)}${kpi('targetUnits',a.targetUnits,'number')}${kpi('targetRevenue',a.targetRevenue)}</div><p>${t('targetProfit')}: ${money(data.targetProfit)} · ${t('capacity')}: ${num(data.capacity)} · ${esc(data.resource)}</p><p>${t('roundingNote')}</p><h2>${t('optimized')} · ${t(data.mode)}</h2>${allocation(o,true)}<h2>${t('notes')}</h2><p style="white-space:pre-wrap">${esc(viewSnapshot?.notes||db.notes||'—')}</p></section></article>`}
function dataCenter(){return `<div class="grid"><div class="card"><h2>${t('data')}</h2><div class="actions">${btn('backup','backup','',true)}${btn('exportCSV','csv')}${btn('download','template')}</div><p><label>${t('restore')}<input disabled type="file" id="restoreFile" accept=".json"></label></p><p><label>${t('importCSV')}<input disabled type="file" id="csvFile" accept=".csv"></label></p><p>${t('currencyLock')}</p><div class="actions">${btn('validation','scan')}${btn('demo','demo')}${btn('reset','reset')}</div></div><div class="card"><h2>${t('summary')}</h2><p>${t('items')}: ${db.items.length} · ${t('costs')}: ${db.costs.length} · ${t('fixed')}: ${db.fixed.length}</p><p>Schema 1 · Version 1.0.0 · ${db.currency} · ${num(new Blob([JSON.stringify(db)]).size/1024)} KB</p><p>${t('backup')}: ${esc(db.lastBackup||t('noBackup'))}</p></div></div><div class="card"><h2>${t('archiveBrowser')}</h2>${['items','costs','fixed','scenarios'].flatMap(entity=>db[entity].filter(x=>x.archived).map(x=>`<p>${t(entity)} · ${esc(x.name)} ${btn('restore','unarchive',`data-entity="${entity}" data-id="${x.id}"`)}</p>`)).join('')||'—'}</div>`}
function settings(){return `<form id="settingsForm" class="card"><div class="formgrid">${field('businessName',db.business,'text','required maxlength="120"')}${field('locale',db.locale,'text','required')}<label>${t('currency')}<select name="currency" ${db.items.length||db.costs.length||db.fixed.length||db.scenarios.length?'disabled':''}>${E.currencies.map(c=>`<option ${db.currency===c?'selected':''}>${c}</option>`).join('')}</select></label>${field('periodName',db.periodName,'text','required maxlength="100"')}${field('months',db.months,'number','required min="0.01" max="60" step="any"')}<label>${t('notes')}<textarea name="notes">${esc(db.notes)}</textarea></label></div><p>${t('currencyLock')}</p><button class="primary" type="submit">${t('save')}</button><div id="formError" class="error"></div><p>NexalyPlanner · Contribution Margin & Product Mix Decision OS · v1.0.0 · Schema 1</p></form>`}
function onboarding(){let steps=['welcome','language','currency','businessName','months','demo','dashboard'],body=wizard===0?`<p>${t('headline')}</p><p>${t('method')}</p>`:wizard===1?`<label>${t('language')}<select id="setupLang">${Object.entries(LANGS).map(([k,v])=>`<option value="${k}" ${db.lang===k?'selected':''}>${v}</option>`).join('')}</select></label>`:wizard===2?`<div class="formgrid"><label>${t('currency')}<select name="currency">${E.currencies.map(c=>`<option ${setupDraft.currency===c?'selected':''}>${c}</option>`).join('')}</select></label>${field('locale',setupDraft.locale,'text','required')}</div>`:wizard===3?field('businessName',setupDraft.businessName,'text','required maxlength="120"'):wizard===4?`<div class="formgrid">${field('periodName',setupDraft.periodName,'text','required maxlength="100"')}${field('months',setupDraft.months,'number','required min="0.01" max="60" step="any"')}</div><p>${t('constraintNote')}</p>`:wizard===5?`<label>${t('demo')}<select name="mode"><option value="demo" ${setupDraft.mode==='demo'?'selected':''}>${t('demo')}</option><option value="blank" ${setupDraft.mode==='blank'?'selected':''}>${t('empty')}</option><option value="import" ${setupDraft.mode==='import'?'selected':''}>${t('importCSV')}</option></select></label>`:`<h2>${esc(setupDraft.businessName)}</h2><p>${setupDraft.currency} · ${esc(setupDraft.locale)} · ${LANGS[db.lang]}</p><p>${esc(setupDraft.periodName)} · ${num(setupDraft.months)} ${t(Number(setupDraft.months)===1?'monthSingular':'monthUnit')}</p>`;return `<div class="hero"><div><h2>${t('headline')}</h2><p>${t(steps[wizard])}</p></div><strong>${wizard+1} / 7</strong></div><form id="setupForm" class="card">${body}<div id="formError" class="error"></div><div class="actions">${wizard?btn('back','wizardBack'):''}${btn(wizard===6?'start':'next','wizardNext','',true)}</div></form>`}
function help(){return `<div class="card"><h2>${t('guide')}</h2><p>${t('method')}</p>${formula()}<div class="steps">${['items','costs','fixed','contribution','breakEven','constraints','mix','scenarios','reports','data'].map((k,i)=>`<span>${i+1}. ${t(k)}</span>`).join('')}</div><p><a href="User_Guide.html">${t('guide')}</a></p>${btn('tour','tour')}<p>${t('currencyLock')}</p></div>`}
function content(){if(['items','costs','fixed'].includes(page))return lists();if(page==='data')return dataCenter();if(page==='settings')return settings();if(page==='help')return help();let a=E.analyze(currentData());if(!a.ready)return empty();let strip=`<div class="periodSummary">${esc(currentData().periodName)} · ${num(currentData().months)} ${t(currentData().months===1?'monthSingular':'monthUnit')} · ${t(viewSnapshot?'snapshot':'live')}${viewSnapshot?' '+btn('close','live'):''}</div>`;if(page==='dashboard')return strip+dashboard(a);if(page==='contribution')return strip+`<div class="card">${listTools()}${productTable(a)}${formula()}</div><div class="unitgrid">${a.rows.map(r=>`<section class="card itemcard"><small>${esc(r.category)}</small><h2>${esc(r.name)}</h2><div class="mini"><div><small>${t('unitCM')}</small><strong>${money(r.cm)}</strong></div><div><small>${t('ratio')}</small><strong>${pct(r.ratio)}</strong></div></div>${btn('details','detail',`data-id="${r.id}"`)}</section>`).join('')}</div>`;if(page==='breakEven')return strip+thresholds(a);if(page==='targetProfit')return strip+targetForm()+thresholds(a);if(page==='constraints')return strip+assumptionsForm()+`<div class="grid"><div class="card"><h2>${t('bestEfficiency')}</h2>${efficiency(a)}</div><div class="card"><h2>${t('optimized')}</h2>${allocation(E.optimize(db))}</div></div>`;if(page==='mix')return strip+`<div class="grid"><div class="card"><h2>${t('mix')}</h2><div class="chartwrap">${matrix(a)}</div>${btn('chartExport','svg','data-chart="mixChart"')}</div><div class="card"><h2>${t('baseline')}</h2><p>${t('weighted')}: ${money(a.weighted)}</p><p>${t('ratio')}: ${pct(a.ratio)}</p><p>${t('mixNote')}</p>${efficiency(a)}</div></div><div class="card"><h2>${t('optimized')} · ${t(db.mode)}</h2>${allocation(E.optimize(db))}</div>`;if(page==='scenarios')return strip+scenarios();if(page==='reports')return strip+report(a);return strip}
function render(){document.documentElement.lang=db.lang;document.documentElement.dir=db.lang==='ar'?'rtl':'ltr';document.body.classList.toggle('dark',db.theme==='dark');document.getElementById('app').innerHTML=`<div class="shell"><aside class="rail"><img src="${LOGO}" class="logo" alt="NexalyPlanner"><div class="brand">CONTRIBUTION DECISION OS</div><nav>${navs.map((n,i)=>`<button type="button" data-page="${n}" class="${page===n?'active':''}" title="${esc(t(n))}">${String(i+1).padStart(2,'0')} &nbsp; ${t(n)}</button>`).join('')}</nav><p class="badge">● Offline · 1.0.0<br>${t('backup')}: ${db.lastBackup?new Date(db.lastBackup).toLocaleDateString(db.locale):t('noBackup')}</p></aside><div><header><div class="toolbar">${btn('menu','menu')}<span class="muted">NexalyPlanner / ${t(page)}</span></div><div class="toolbar"><button type="button" data-action="command" aria-label="${t('search')}">⌕</button><select id="lang" aria-label="Language">${Object.entries(LANGS).map(([k,v])=>`<option value="${k}" ${db.lang===k?'selected':''}>${v}</option>`).join('')}</select>${btn(db.theme==='light'?'dark':'light','theme')}${btn('add','add',`data-entity="${['items','costs','fixed'].includes(page)?page:'items'}"`,true)}</div></header><main><div class="heading"><div><h1>${t(page)}</h1><small>${esc(db.business||'NexalyPlanner')} · ${db.currency}</small></div>${page==='reports'?btn('print','print'):''}</div>${recoveryRaw?`<div class="strip warning">${t('recoveryNote')} ${btn('download','recover')}</div>`:''}${db.setup?content():onboarding()}<footer>NexalyPlanner · Contribution Decision OS · v1.0.0 · ${t('method')}</footer></main></div></div>`}
function form(entity,id){let x=db[entity].find(x=>x.id===id)||{},fields=entity==='items'?field('name',x.name||'','text','required maxlength="120"')+field('category',x.category||'')+field('unit',x.unit||'units','text','required maxlength="40"')+['price','baseCost','units','demand','usage'].map(k=>field(k,x[k]??0,'number','required min="0" max="1000000000000" step="any"')).join(''):entity==='costs'?field('name',x.name||'','text','required maxlength="120"')+select('item',db.items.filter(x=>!x.archived),x.item)+select('type',[{id:'unit',name:t('unitCost')},{id:'percent',name:t('percent')}],x.type||'unit')+field('amount',x.amount??0,'number','required min="0" max="1000000000000" step="any"'):field('name',x.name||'','text','required maxlength="120"')+field('amount',x.amount??0,'number','required min="0" max="1000000000000" step="any"')+select('frequency',['monthly','quarterly','yearly','period'].map(k=>({id:k,name:t(k)})),x.frequency||'monthly');modal(`<form id="recordForm" data-entity="${entity}" data-id="${id||''}"><h2>${t(id?'edit':'add')} · ${t(entity)}</h2><div class="formgrid">${fields}</div><p>${t(entity==='costs'?'costNote':'method')}</p><div class="error" id="formError" role="alert"></div><div class="actions"><button class="primary" type="submit">${t('save')}</button>${btn('cancel','close')}</div></form>`)}
function detail(id){let x=db.items.find(x=>x.id===id),r=E.item(db,x),discount=E.discount(db,id,10);modal(`<h2>${esc(x.name)}</h2><p>${esc(x.category)} · ${esc(x.unit)}</p><div class="kpis">${kpi('price',r.price)}${kpi('cost',r.cost)}${kpi('unitCM',r.cm)}${kpi('ratio',r.ratio,'percent')}</div><p>${t('baseCost')}: ${money(x.baseCost)} · ${t('costs')}: ${money(r.perUnit)} · ${t('percent')}: ${pct(r.fee*100)}</p><p>${t('demand')}: ${num(x.demand)} · ${t('usage')}: ${num(x.usage)} · ${t('efficiency')}: ${x.usage>0?money(r.efficiency):t('free')}</p><p>${t('beUnits')}: ${num(E.need(E.fixedTotal(db),r.cm))} · ${t('targetUnits')}: ${num(E.need(E.fixedTotal(db)+db.targetProfit,r.cm))}</p><label>${t('discount')}<input id="discountPct" type="number" min="0" max="100" step="any" value="10" data-id="${id}"></label><div id="discountPreview">${discountHTML(discount)}</div>${formula()}<div class="actions">${btn('edit','edit',`data-entity="items" data-id="${id}"`)}${btn('close','close')}</div>`)}
function discountHTML(x){return `<p>${t('afterDiscount')}: ${money(x.after.cm)} · ${t('requiredUnits')}: ${num(x.required)} · ${t('extraUnits')}: ${num(x.extra)}</p>`}
function archive(entity,ids,restore=false){let next=clone(db);for(let x of next[entity].filter(x=>ids.includes(x.id))){if(entity==='costs'&&restore&&next.items.find(i=>i.id===x.item).archived)throw Error('Restore the item first');x.archived=!restore;x.updated=E.now();if(entity==='items')for(let c of next.costs.filter(c=>c.item===x.id)){if(!restore&&!c.archived){c.archived=true;c.archivedBy=x.id}else if(restore&&c.archivedBy===x.id){c.archived=false;delete c.archivedBy}}}E.validate(next);db=next;scenarioDraft={items:{}};tablePage=0;log(t(restore?'restore':'archive'));render()}
function navigate(n){filters[page]=filter;page=n;filter=filters[n]||'';tablePage=0;viewSnapshot=null;document.body.classList.remove('menu');render()}
function readDraft(){let f=document.getElementById('scenarioForm'),next={items:{},capacity:Number(f.querySelector('[name=capacity]').value),targetProfit:Number(f.querySelector('[name=targetProfit]').value)};for(let x of f.querySelectorAll('.scenarioInput')){if(!x.validity.valid)throw Error('Invalid scenario input');(next.items[x.dataset.item]||={})[x.dataset.key]=Number(x.value)}E.apply(db,next);scenarioDraft=next;return next}
document.addEventListener('click',e=>{let n=e.target.closest('[data-page]');if(n){navigate(n.dataset.page);return}let b=e.target.closest('[data-action]');if(!b)return;let{action:a,entity,id}=b.dataset;try{if(a==='menu'){if(innerWidth<700)document.body.classList.toggle('menu');else document.body.classList.toggle('collapsed')}else if(a==='theme'){db.theme=db.theme==='light'?'dark':'light';save();render()}else if(a==='close')document.getElementById('modal').close();else if(a==='add'||a==='edit')form(entity,id);else if(a==='detail')detail(id);else if(a==='optimizeSave'){let o=E.optimize(db);if(!o.available)throw Error(t('unavailable'));modal(`<form id="optimizedForm"><h2>${t('saveOptimized')}</h2>${field('name',db.periodName+' · '+t('optimized'),'text','required maxlength="120"')}<label>${t('notes')}<textarea name="notes"></textarea></label><p>${t('constraintNote')}</p><div class="error" id="formError"></div><button class="primary" type="submit">${t('save')}</button>${btn('cancel','close')}</form>`)}else if(a==='formula')modal(`<h2>${t('contribution')}</h2>${formula()}${btn('close','close')}`);else if(a==='wizardBack'){wizard=Math.max(0,wizard-1);render()}else if(a==='wizardNext'){let f=document.getElementById('setupForm');if(!f.reportValidity())return;Object.assign(setupDraft,Object.fromEntries(new FormData(f)));new Intl.NumberFormat(setupDraft.locale);if(wizard<6){wizard++;render()}else{let lang=db.lang,theme=db.theme;db=setupDraft.mode==='demo'?E.demo():E.fresh();Object.assign(db,{setup:true,lang,theme,business:setupDraft.businessName,locale:setupDraft.locale,currency:setupDraft.currency,months:Number(setupDraft.months),periodName:setupDraft.periodName});E.validate(db);save();if(setupDraft.mode==='import')page='data';render()}}else if(a==='archive'||a==='bulk'){let ids=a==='bulk'?[...document.querySelectorAll('.rowcheck:checked')].map(x=>x.value):[id];if(ids.length&&confirm(t('confirm')))archive(entity,ids)}else if(a==='unarchive'){if(confirm(t('confirm')))archive(entity,[id],true)}else if(a==='duplicate'){let next=clone(db),x=next.items.find(i=>i.id===id),newId=E.id();next.items.push({...x,id:newId,name:x.name+' (copy)',units:0,created:E.now(),updated:E.now()});for(let c of next.costs.filter(c=>!c.archived&&c.item===id))next.costs.push({...c,id:E.id(),item:newId,created:E.now(),updated:E.now()});E.validate(next);db=next;log(t('duplicate'));render()}else if(a==='density'){density=!density;render()}else if(a==='columns'){compactCols=!compactCols;render()}else if(a==='prev'||a==='next'){tablePage=Math.max(0,tablePage+(a==='prev'?-1:1));render()}else if(a==='goto')navigate(id);else if(a==='demo'||a==='reset'){if(confirm(t('confirm'))){let lang=db.lang,theme=db.theme;db=a==='demo'?E.demo():E.fresh();db.lang=lang;db.theme=theme;recoveryRaw='';viewSnapshot=null;scenarioDraft={items:{}};tablePage=0;wizard=0;save();render()}}else if(a==='backup'){db.lastBackup=E.now();save();download('NexalyPlanner-ContributionMix-'+db.currency+'-'+E.now().slice(0,10)+'.json',JSON.stringify(db,null,2));render()}else if(a==='recover')download('ContributionMix-raw-recovery.txt',recoveryRaw,'text/plain');else if(a==='csv')download('NexalyPlanner-ContributionMix-'+db.currency+'.csv',E.csv(db),'text/csv');else if(a==='template')download('ContributionMix-template-'+db.currency+'.csv',E.headers.join(',')+'\nitem,Product,,Category,units,0,0,0,0,0,,,,'+db.currency,'text/csv');else if(a==='scan'){E.validate(db);toast(t('scanOK'))}else if(a==='snapshot'){viewSnapshot=db.scenarios.find(s=>s.id===id);page='reports';render()}else if(a==='live'){viewSnapshot=null;render()}else if(a==='print')toast('Printing is available in the offline planner.');else if(a==='draftReset'){scenarioDraft={items:{}};let f=document.getElementById('scenarioForm');for(let x of f.querySelectorAll('.scenarioInput'))x.value=x.dataset.key==='units'?db.items.find(i=>i.id===x.dataset.item).units:100;f.querySelector('[name=capacity]').value=db.capacity;f.querySelector('[name=targetProfit]').value=db.targetProfit;document.getElementById('scenarioPreview').innerHTML=preview(E.analyze(db),E.optimize(db))}else if(a==='svg'){let svg=document.getElementById(b.dataset.chart);if(svg){let el=svg.cloneNode(true),cs=getComputedStyle(document.body);el.setAttribute('xmlns','http://www.w3.org/2000/svg');for(let x of el.querySelectorAll('*'))for(let attr of ['fill','stroke']){let v=x.getAttribute(attr);if(v?.startsWith('var('))x.setAttribute(attr,cs.getPropertyValue(v.slice(4,-1)).trim())}el.querySelectorAll('text').forEach(x=>x.setAttribute('fill',cs.getPropertyValue('--ink').trim()));let vb=el.viewBox.baseVal,w=vb.width||850,h=vb.height||340,inner=el.innerHTML;el.setAttribute('viewBox',`0 0 ${w} ${h+60}`);el.innerHTML=`<rect width="${w}" height="${h+60}" fill="${cs.getPropertyValue('--panel').trim()}"/><image href="${LOGO}" x="10" y="4" width="105" height="42"/><text x="130" y="29" fill="${cs.getPropertyValue('--ink').trim()}" font-size="15">NexalyPlanner Contribution Decision OS · ${db.currency}</text><g transform="translate(0,60)">${inner}</g>`;download('NexalyPlanner-ContributionMix.svg',el.outerHTML,'image/svg+xml')}}else if(a==='command'){modal(`<h2>${t('search')}</h2><input id="commandSearch" aria-label="${t('search')}"><div id="commandResults">${navs.map(n=>`<p>${btn(n,'commandGo',`data-id="${n}"`)}</p>`).join('')}</div>${btn('close','close')}`)}else if(a==='commandGo'){document.getElementById('modal').close();navigate(id)}else if(a==='tour')modal(`<h2>${t('guide')}</h2><ol>${['items','costs','fixed','contribution','breakEven','constraints','mix','scenarios','reports','data'].map(k=>`<li>${t(k)}</li>`).join('')}</ol>${formula()}${btn('close','close')}`)}catch(err){let f=document.querySelector('dialog[open] #formError')||document.querySelector('#formError');if(f)f.textContent=err.message;else toast(err.message)}});
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target,x=Object.fromEntries(new FormData(f));try{if(f.id==='recordForm'){let entity=f.dataset.entity,id=f.dataset.id,next=clone(db),old=next[entity].find(x=>x.id===id),r={...old,...x,id:id||E.id(),created:old?.created||E.now(),updated:E.now()};r.name=r.name.trim();for(let k of entity==='items'?['price','baseCost','units','demand','usage']:['amount'])r[k]=Number(r[k]);if(old)next[entity][next[entity].findIndex(x=>x.id===id)]=r;else next[entity].push(r);E.validate(next);db=next;scenarioDraft={items:{}};log(t('save')+' · '+r.name);document.getElementById('modal').close();render()}else if(['assumptionsForm','targetForm','settingsForm'].includes(f.id)){let next=clone(db);if(f.id==='assumptionsForm')Object.assign(next,{resource:x.resource,capacity:Number(x.capacity),quantum:Number(x.quantum),mode:x.mode});else if(f.id==='targetForm')Object.assign(next,{targetProfit:Number(x.targetProfit),periodName:x.periodName,months:Number(x.months)});else{Object.assign(next,{business:x.businessName,locale:x.locale,periodName:x.periodName,months:Number(x.months),notes:x.notes});if(!db.items.length&&!db.costs.length&&!db.fixed.length&&!db.scenarios.length)next.currency=x.currency}E.validate(next);db=next;scenarioDraft={items:{}};log(t('save'));render()}else if(f.id==='scenarioForm'){readDraft();let snapshot=currentScenario(),next=clone(db);next.scenarios.push({id:E.id(),name:x.name.trim(),notes:x.notes,snapshot,created:E.now(),updated:E.now()});E.validate(next);db=next;log(t('snapshot')+' · '+x.name);render()}else if(f.id==='optimizedForm'){let o=E.optimize(db);if(!o.available)throw Error(t('unavailable'));let snapshot=E.apply(db,{items:Object.fromEntries(o.rows.map(r=>[r.id,{units:r.allocated}]))}),next=clone(db);next.scenarios.push({id:E.id(),name:x.name.trim(),notes:x.notes,snapshot,created:E.now(),updated:E.now()});E.validate(next);db=next;log(t('snapshot')+' · '+x.name);document.getElementById('modal').close();render()}else if(f.id==='mappingForm'){let map=Object.fromEntries(Object.entries(x).map(([k,v])=>[k,Number(v)])),r=E.importCSV(db,pendingCSV,map);db=r.db;db.setup=true;scenarioDraft={items:{}};log(t('importCSV')+' · '+r.added);document.getElementById('modal').close();render()}}catch(err){f.querySelector('#formError').textContent=err.message}});
document.addEventListener('input',e=>{try{if(e.target.id==='filter'){filter=e.target.value;filters[page]=filter;tablePage=0;let pos=e.target.selectionStart;render();let f=document.getElementById('filter');f.focus();f.setSelectionRange(pos,pos)}else if(e.target.id==='commandSearch'){let q=e.target.value.toLowerCase();document.getElementById('commandResults').innerHTML=navs.filter(n=>t(n).toLowerCase().includes(q)).map(n=>`<p>${btn(n,'commandGo',`data-id="${n}"`)}</p>`).join('')}else if(e.target.id==='discountPct'){if(e.target.validity.valid)document.getElementById('discountPreview').innerHTML=discountHTML(E.discount(db,e.target.dataset.id,Number(e.target.value)))}else if(e.target.closest('#scenarioForm')&&(e.target.classList.contains('scenarioInput')||['capacity','targetProfit'].includes(e.target.id))){if(!e.target.validity.valid)return;readDraft();let d=currentScenario();document.getElementById('scenarioPreview').innerHTML=preview(E.analyze(d),E.optimize(d));document.querySelector('#scenarioForm #formError').textContent=''}}catch(err){document.querySelector('#scenarioForm #formError').textContent=err.message}});
document.addEventListener('change',async e=>{try{if(e.target.id==='lang'||e.target.id==='setupLang'){db.lang=e.target.value;save();render()}else if(e.target.id==='sort'){sort=e.target.value;render()}else if(e.target.id==='all')document.querySelectorAll('.rowcheck').forEach(x=>x.checked=e.target.checked);else if(e.target.id==='restoreFile'){let f=e.target.files[0];if(!f)return;let next=E.validate(JSON.parse(await f.text()));if(confirm(t('confirm'))){db=next;recoveryRaw='';viewSnapshot=null;scenarioDraft={items:{}};save();render()}}else if(e.target.id==='csvFile'){let f=e.target.files[0];if(!f)return;pendingCSV=E.parseCSV(await f.text());if(pendingCSV.length<2)throw Error('CSV has no data');modal(`<form id="mappingForm"><h2>${t('mapFields')}</h2><div class="formgrid">${E.headers.map(k=>`<label>${t(k)}<select name="${k}"><option value="-1">—</option>${pendingCSV[0].map((v,i)=>`<option value="${i}" ${v.trim().replace(/^\uFEFF/,'').toLowerCase()===k?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`).join('')}</div><p>${db.currency} · ${pendingCSV.length-1}</p><div class="error" id="formError"></div><button class="primary" type="submit">${t('importCSV')}</button>${btn('cancel','close')}</form>`)}}catch(err){toast(err.message);e.target.value=''}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();document.querySelector('[data-action=command]').click()}});window.addEventListener('beforeunload',e=>{if(document.querySelector('dialog[open] #recordForm')){e.preventDefault();e.returnValue=''}});render();
</script></body></html>
