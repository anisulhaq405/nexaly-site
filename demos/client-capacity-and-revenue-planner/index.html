function heat(){let w=E.weekly(db,db.month);if(!w.rows.length)return empty('noTeam','add:team','addTeam');let heads=`<div></div>${Array.from({length:5},(_,i)=>`<div class="heat-head">${t('week')} ${i+1}</div>`).join('')}`,cells=w.rows.filter(x=>x.week===1).map(first=>{let row=w.rows.filter(x=>x.teamId===first.teamId);return `<div class="heat-name" title="${esc(first.name)}">${esc(first.name)}</div>`+Array.from({length:5},(_,i)=>{let q=row[i];if(!q)return `<div class="heat-cell">—</div>`;let ratio=q.billable?100*q.load/q.billable:0,cls=q.remaining<0?'over':ratio>75?'busy':'free';return `<div class="heat-cell ${cls}" tabindex="0" title="${esc(first.name)} · ${t('week')} ${i+1}: ${fmt(q.load)} / ${fmt(q.billable)} h"><strong>${fmt(q.remaining)} h</strong>${fmt(q.load)} / ${fmt(q.billable)} h</div>`}).join('')}).join('');return `<div class="heat-scroll"><div class="heat">${heads}${cells}</div></div><p class="sub">${t('heatmapHelp')}</p>`}

function wizard(){let body=wizardStep===0?`<h1>${t('setup')}</h1><p class="sub">${t('welcome')}</p>`:wizardStep===1?`<h1>${t('chooseLanguage')}</h1><select id="wizardLang">${Object.entries(langs).map(([k,v])=>`<option value="${k}" ${k===db.lang?'selected':''}>${v}</option>`).join('')}</select>`:wizardStep===2?`<h1>${t('chooseCurrency')}</h1><select id="wizardCurrency">${currencyCodes.map(c=>`<option ${c===db.currency?'selected':''}>${c}</option>`).join('')}</select><p class="note">${t('currencyNote')}</p>`:wizardStep===3?`<h1>${t('businessProfile')}</h1><div class="field"><label>${t('businessName')}</label><input id="wizardBusiness" value="${esc(db.business)}" maxlength="80"></div>`:wizardStep===4?`<h1>${t('capacitySetup')}</h1><div class="field"><label>${t('targetBillable')}</label><input id="wizardTarget" type="number" min="0" max="100" value="${db.targetPct}"></div><p class="sub">${t('ratioNote')}</p>`:`<h1>${t('loadSample')}</h1><p class="sub">${t('offlineNote')}</p>`;return `<div class="wizard"><div class="wizard-card"><img class="wizard-logo" src="${LOGO}" alt="NexalyPlanner"><div class="steps">${Array.from({length:6},(_,i)=>`<i class="${i<=wizardStep?'on':''}"></i>`).join('')}</div>${body}<div class="row" style="justify-content:flex-end;margin-top:28px">${wizardStep===5?`${btn('wizardEmpty','startEmpty')}${btn('wizardDemo','loadDemo','primary')}`:btn('wizardNext','next','primary')}</div></div></div>`}
function drawerHTML(){if(!drawer)return '';let type=types[drawer.kind],x=drawer.id?db[drawer.kind].find(y=>y.id===drawer.id):{};return `<div class="drawer-wrap" id="drawerOverlay"><div class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"><div class="card-header"><h2 id="drawerTitle">${t(drawer.id?'edit':type.add)}</h2>${btn('close','close','quiet')}</div><form id="recordForm" data-kind="${drawer.kind}" data-id="${drawer.id||''}"><div class="form-grid">${type.fields(x||{})}</div><div class="drawer-actions"><button class="btn primary" type="submit">${t('save')}</button>${btn('close','close')}</div></form></div></div>`}
function render(){if(!selectedService)selectedService=db.services.find(x=>x.active&&!x.archived&&x.frequency!=='oneTime')?.id||'';document.documentElement.dataset.theme=db.theme;document.body.dir=db.lang==='ar'?'rtl':'ltr';document.documentElement.lang=db.lang;document.title='Client Capacity & Revenue Planner · NexalyPlanner';if(!db.setup){$('#app').innerHTML=wizard();return}let body=screen==='capacityHome'?home():['team','services','clients','commitments','leave'].includes(screen)?records(screen):screen==='workload'?records('commitments'):screen==='availability'?records('leave'):screen==='revenueCapacity'?revenue():screen==='waitlist'?waitlist():screen==='scenarioLab'?scenario():screen==='calendarView'?calendar():screen==='reports'?reports():screen==='dataCenter'?dataCenter():screen==='settings'?settings():help();$('#app').innerHTML=`<div class="shell ${collapsed?'collapsed':''}"><aside class="sidebar ${sidebarOpen?'open':''}"><div class="brand"><img src="${LOGO}" alt="NexalyPlanner"><div class="brand-text"><b>NEXALY<br>PLANNER</b><br><small>CAPACITY OS</small></div></div><nav class="nav" aria-label="Main navigation">${nav.map((n,i)=>`<button data-action="nav:${n}" class="${screen===n?'selected':''}" title="${esc(t(n))}"><span class="icon">${icons[i]}</span><span class="nav-label">${esc(t(n))}</span></button>`).join('')}</nav><div class="sidefoot"><button data-action="collapse"><span class="icon">☰</span><span>${t('close')}</span></button><button data-action="help"><span class="icon">?</span><span>${t('help')}</span></button></div></aside><div class="main"><header class="topbar"><div class="row"><button class="btn quiet mobile-menu" data-action="mobileMenu" aria-label="Menu">☰</button><div class="top-title"><span class="eyebrow">${esc(db.business)}</span><h1>${esc(t(screen))}</h1></div></div><div class="toptools"><button class="btn compact hide-mobile" data-action="add:clients">+ ${t('client')}</button><select id="headerLang" class="hide-mobile" aria-label="${t('language')}">${Object.entries(langs).map(([k,v])=>`<option value="${k}" ${k===db.lang?'selected':''}>${v}</option>`).join('')}</select><select id="headerCurrency" class="hide-mobile" aria-label="${t('currency')}">${currencyCodes.map(c=>`<option ${c===db.currency?'selected':''}>${c}</option>`).join('')}</select><button class="btn compact" data-action="toggleTheme" aria-label="${t('theme')}">${db.theme==='light'?'☾':'☀'}</button><button class="btn compact hide-mobile" data-action="backup">↧</button></div></header><main class="content">${body}</main></div></div>${drawerHTML()}`;let s=$('#serviceFilter');if(s)s.value=selectedService;let tm=$('#teamFilter');if(tm)tm.value=selectedTeam;if(db.density==='compact')document.querySelectorAll('td,th').forEach(x=>x.style.padding='7px 10px')}
function commitRecord(form){let kind=form.dataset.kind,prev=form.dataset.id?db[kind].find(x=>x.id===form.dataset.id):null,x={...(prev||{}),id:prev?.id||id()},f=new FormData(form);for(let [k,v] of f)x[k]=v.trim();let numeric=kind==='team'?['weeklyHours','nonBillablePct']:kind==='services'?['hours']:kind==='clients'?['multiplier']:kind==='commitments'?['week','hours']:kind==='leave'?['week','hours']:[];numeric.forEach(k=>x[k]=Number(x[k]));['costRate','fee','revenue'].forEach(k=>{if(k in x&&f.has(k))x[k]=E.money(f.get(k))});if('active'in x)x.active=x.active==='active';if(['clients','commitments','leave'].includes(kind)&&(!x.teamId||kind==='clients'&&!x.serviceId)){toast(t('invalidAmount'));return}if(x.start&&x.end&&x.end<x.start){toast(t('invalidAmount'));return}if(['team','services','clients'].includes(kind)&&x.active===false&&prev?.active!==false&&kind==='team'&&db.clients.some(c=>c.active&&!c.archived&&c.teamId===x.id)){if(!confirm(t('unassignedWork')))return}let clone={...db,[kind]:prev?db[kind].map(y=>y.id===x.id?x:y):[...db[kind],x]};if(!E.validate(clone)){toast(t('invalidAmount'));return}db=clone;log(`${kind}: ${x.name}`);save();drawer=null;render();toast(t('saved'))}
function csvEscape(v){return `"${String(v??'').replaceAll('"','""')}"`};function csvExport(){let sheets=['team','services','clients','commitments','leave','waitlist'];let files=sheets.map(k=>{let rows=db[k],cols={team:['id','name','weeklyHours','nonBillablePct','costRate','active','archived'],services:['id','name','hours','fee','frequency','active','archived'],clients:['id','name','serviceId','teamId','start','end','multiplier','active','archived'],commitments:['id','name','teamId','month','week','hours','revenue','archived'],leave:['id','name','teamId','month','week','hours','archived'],waitlist:['id','name','month','serviceId','teamId','priority','status','notes','archived']}[k];return `# ${k}\n${cols.join(',')}\n${rows.map(r=>cols.map(c=>csvEscape(r[c])).join(',')).join('\n')}`});download(`Nexaly-capacity-${db.month}.csv`,files.join('\n\n'),'text/csv')}
function parseCSVLine(line){let out=[],cur='',quote=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'&&quote&&line[i+1]==='"'){cur+='"';i++}else if(c==='"')quote=!quote;else if(c===','&&!quote){out.push(cur);cur=''}else cur+=c}out.push(cur);return out}
async function importCSV(){let file=await pick('.csv,text/csv');if(!file)return;let content=await file.text(),block=content.trim().split(/\n\s*\n/),typesAllowed=['team','services','clients','commitments','leave','waitlist'],candidate={...db};let total=0;for(let section of block){let lines=section.trim().split(/\r?\n/);let kind=lines[0]?.match(/^# (team|services|clients|commitments|leave|waitlist)$/)?.[1];if(!kind||!typesAllowed.includes(kind))continue;let cols=parseCSVLine(lines[1]||'');if(!cols.includes('id')||!cols.includes('name'))continue;let rows=[];for(let line of lines.slice(2)){if(!line.trim())continue;let vals=parseCSVLine(line),x=Object.fromEntries(cols.map((c,i)=>[c,vals[i]??'']));if(!x.id||!x.name)continue;['weeklyHours','nonBillablePct','hours','week','multiplier'].forEach(c=>{if(c in x)x[c]=Number(x[c])});['costRate','fee','revenue'].forEach(c=>{if(c in x)x[c]=Number(x[c])});['active','archived'].forEach(c=>{if(c in x)x[c]=x[c]==='true'});rows.push(x)}candidate[kind]=[...candidate[kind].filter(x=>!rows.some(y=>y.id===x.id)),...rows];total+=rows.length}if(!total||!E.validate(candidate)){toast(t('invalidCSV'));return}if(!confirm(`${t('confirmImport')} ${total}`))return;db=candidate;log(`CSV import: ${total}`);save();render();toast(t('saved'))}
async function restore(){let file=await pick('.json,application/json');if(!file)return;try{let x=JSON.parse(await file.text());if(!E.validate(x))throw Error('schema');if(!confirm(t('restoreWarning')))return;db={...fresh(),...x,setup:true};log('Backup restored');save();render();toast(t('saved'))}catch{toast(t('invalidBackup'))}}
function reportDownload(){let s=E.summary(db,db.month,selectedService),lines=[`${db.business} — ${t('reportTitle')}`,`NexalyPlanner | ${db.month} | ${db.currency}`,`${t('availableHours')}: ${fmt(s.available)} h`,`${t('billableCapacity')}: ${fmt(s.billable)} h`,`${t('committedHours')}: ${fmt(s.committed)} h`,`${t('utilization')}: ${fmt(s.utilization||0,0)}%`,`${t('capacityRemaining')}: ${fmt(s.remaining)} h`,`${t('committedRevenue')}: ${cash(s.committedRevenue)}`,`${t('revenueCapacity')}: ${cash(s.revenueCapacity)}`,`${t('revenueGap')}: ${cash(s.revenueGap)}`,reportNotes,t('ratioNote'),t('revenueNote')];download(`Nexaly-capacity-report-${db.month}.txt`,lines.join('\n'))}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;if(a.startsWith('nav:')){screen=a.slice(4);sidebarOpen=false;search='';archived=false;render();return}if(a.startsWith('add:')){let kind=a.slice(4);if(['clients','commitments','leave','waitlist'].includes(kind)&&!db.team.some(x=>x.active&&!x.archived)){screen='team';render();toast(t('noTeam'));return}if(['clients','waitlist'].includes(kind)&&!db.services.some(x=>x.active&&!x.archived)){screen='services';render();toast(t('noServices'));return}drawer={kind};render();return}if(a==='edit'){drawer={kind:b.dataset.kind,id:b.dataset.id};render();return}if(a==='close'){drawer=null;render();return}if(a==='archive'){let arr=db[b.dataset.kind],x=arr.find(x=>x.id===b.dataset.id);if(!x)return;if(!x.archived&&!confirm(t('archiveWarning')))return;x.archived=!x.archived;log(`${b.dataset.kind}: ${x.name} ${x.archived?'archived':'restored'}`);save();render();return}if(a==='duplicate'){let kind=b.dataset.kind,x=db[kind].find(x=>x.id===b.dataset.id);if(x){db[kind].push({...x,id:id(),name:x.name+' copy',archived:false});log(`${kind}: duplicate`);save();render()}return}if(a==='wizardNext'){if(wizardStep===1)db.lang=$('#wizardLang').value;if(wizardStep===2)db.currency=$('#wizardCurrency').value;if(wizardStep===3)db.business=$('#wizardBusiness').value.trim()||'My Studio';if(wizardStep===4){let p=Number($('#wizardTarget').value);if(!Number.isFinite(p)||p<0||p>100){toast(t('invalidAmount'));return}db.targetPct=p}wizardStep++;save();render();return}if(a==='wizardDemo'){demo();return}if(a==='wizardEmpty'){db.setup=true;save();render();return}if(a==='toggleTheme'||a.startsWith('theme:')){db.theme=a==='toggleTheme'?(db.theme==='light'?'dark':'light'):a.slice(6);save();render();return}if(a==='collapse'){collapsed=!collapsed;render();return}if(a==='mobileMenu'){sidebarOpen=!sidebarOpen;render();return}if(a==='help'){screen='help';render();return}if(a==='backup'){db.lastBackup=new Date().toISOString().slice(0,16).replace('T',' ');log('Backup downloaded');save();download(`Nexaly-capacity-backup-${db.month}.json`,JSON.stringify(db,null,2),'application/json');render();return}if(a==='restore'){restore();return}if(a==='demo'){if(confirm(t('demoWarning')))demo();return}if(a==='reset'){if(confirm(t('resetWarning'))){db=fresh();db.setup=true;save();screen='capacityHome';render()}return}if(a==='exportCSV'){csvExport();return}if(a==='importCSV'){importCSV();return}if(a==='scan'){render();toast(t('dataQuality'));return}if(a==='saveSettings'){let p=Number($('#targetPct').value);if(!Number.isFinite(p)||p<0||p>100){toast(t('invalidAmount'));return}db.targetPct=p;db.business=$('#business').value.trim()||'My Studio';log('Settings updated');save();render();toast(t('saved'));return}if(a==='saveScenario'){let serviceId=selectedService||db.services.find(x=>x.active&&!x.archived)?.id;if(!serviceId){toast(t('noServices'));return}let si=E.scenario(db,db.month,{...scenarioForm,serviceId,teamId:selectedTeam});let name=prompt(t('scenarioName'),`${t('scenarioLab')} ${db.month}`);if(!name)return;db.scenarios.unshift({id:id(),name:name.slice(0,80),month:db.month,serviceId,teamId:selectedTeam,inputs:{...scenarioForm},incrementalRevenue:si.incrementalRevenue,netIncrement:si.netIncrement,remaining:si.remaining});log(t('scenarioSaved'));save();render();return}if(a==='deleteScenario'){if(confirm(t('archiveWarning'))){db.scenarios=db.scenarios.filter(x=>x.id!==b.dataset.id);save();render()}return}if(a==='print'){toast('Printing is available in the offline planner.');return}if(a==='downloadReport'){reportDownload();return}});
document.addEventListener('submit',e=>{if(e.target.id==='recordForm'){e.preventDefault();commitRecord(e.target)}});
document.addEventListener('change',e=>{let x=e.target;if(x.id==='period'){if(E.validMonth(x.value)){db.month=x.value;save();render()}return}if(['headerLang','settingsLang'].includes(x.id)){db.lang=x.value;save();render();return}if(['headerCurrency','settingsCurrency'].includes(x.id)){if(x.value!==db.currency&&!confirm(t('currencyNote'))){render();return}db.currency=x.value;save();render();return}if(x.id==='density'){db.density=x.value;save();render();return}if(x.id==='archive-filter'){archived=x.checked;render();return}if(x.id==='serviceFilter'){selectedService=x.value;render();return}if(x.id==='teamFilter'){selectedTeam=x.value;render();return}if(['f_newClients','f_hireHours','f_hireCost','f_pricePct'].includes(x.id)){let key=x.id.slice(2),val=Number(x.value);if(Number.isFinite(val)&&val>=(key==='pricePct'?-100:0)&&val<=100000){scenarioForm[key]=key==='hireCost'?Math.round(val*100):val;render()}return}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;search=e.target.value;render();let el=$('#search');el?.focus();el?.setSelectionRange(pos,pos)}if(e.target.id==='reportNotes')reportNotes=e.target.value});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drawer){drawer=null;render()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search')?.focus()}});demo();
})();
</script></body></html>
