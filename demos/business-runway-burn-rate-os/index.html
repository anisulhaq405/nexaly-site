</script><script>(()=>{'use strict';const E=window.RunwayEngine,KEY='nexaly_runway_v1',LANGS={en:'English',ar:'العربية',pt:'Português',es:'Español',it:'Italiano',nl:'Nederlands',fr:'Français'},LOC={en:'en-US',ar:'ar-SA',pt:'pt-PT',es:'es-ES',it:'it-IT',nl:'nl-NL',fr:'fr-FR'},CURRENCIES=['USD','GBP','EUR','CAD','AUD','NZD','CHF','NOK','SEK','DKK','PLN','AED','SAR','QAR','JPY','CNY','HKD','SGD','INR','PKR','ZAR','MXN','BRL','TRY','KRW','THB','MYR','IDR','PHP','EGP'],CATEGORIES=['Payroll','Contractors','Software','Marketing','Rent','Operations','Sales','Services','Other'];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>crypto.randomUUID?.()||Math.random().toString(36).slice(2),today=()=>new Date().toISOString().slice(0,10),thisMonth=()=>today().slice(0,7),amount=v=>{let n=E.money(v);return n!==null&&['JPY','KRW'].includes(db.currency)&&n%100!==0?null:n};const fresh=()=>({schema:1,setup:false,business:'My Business',lang:'en',theme:'light',currency:'USD',minSafe:5000000,accounts:[],revenue:[],expenses:[],history:[],milestones:[],scenarios:[],activity:[],lastBackup:null,reportNote:''});let db;try{let x=JSON.parse(localStorage.getItem(KEY));db=E.validate(x)&&CURRENCIES.includes(x.currency)?{...fresh(),...x}:fresh()}catch{db=fresh()}let page='cockpit',month=thisMonth(),drawer=null,modal=db.setup?null:{type:'setup',step:0},mobile=false,collapsed=false,search='',showArchived=false,scenario={growthPct:0,growthStart:1,cutPct:0,cutStart:1,hireMonthly:0,hireOnce:0,hireStart:1,funding:0,fundingMonth:1};const tr=k=>T[db.lang]?.[k]||T.en[k]||k,fmt=n=>new Intl.NumberFormat(LOC[db.lang],{style:'currency',currency:db.currency,maximumFractionDigits:['JPY','KRW'].includes(db.currency)?0:2}).format((n||0)/100),num=n=>new Intl.NumberFormat(LOC[db.lang],{maximumFractionDigits:1}).format(n||0),cash=n=>['JPY','KRW'].includes(db.currency)?(n/100).toFixed(0):(n/100).toFixed(2),date=s=>s?new Intl.DateTimeFormat(LOC[db.lang],{year:'numeric',month:'short',day:'numeric',timeZone:'UTC'}).format(new Date(s+'T00:00:00Z')):'—',monthLabel=m=>new Intl.DateTimeFormat(LOC[db.lang],{year:'numeric',month:'short',timeZone:'UTC'}).format(new Date(m+'-01T00:00:00Z'));function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{toast(tr('backupNote'))}}function toast(s){$('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.role='status';e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),3800)}function log(s){db.activity.unshift({date:today(),text:s});db.activity=db.activity.slice(0,70);save();render()}const btn=(a,label,c='')=>`<button type="button" data-act="${esc(a)}" class="btn ${c}">${label}</button>`,opts=(arr,v)=>arr.map(([a,b])=>`<option value="${esc(a)}"${String(a)===String(v)?' selected':''}>${esc(b)}</option>`).join(''),field=(k,n,v='',type='text',extra='')=>`<div class="inputrow"><label for="f-${n}">${tr(k)}</label><input class="field" id="f-${n}" name="${n}" type="${type}" value="${esc(v)}" ${extra}></div>`,select=(k,n,arr,v)=>`<div class="inputrow"><label for="f-${n}">${tr(k)}</label><select class="field" id="f-${n}" name="${n}">${opts(arr,v)}</select></div>`,head=(k,desc='',actions='')=>`<div class="heading"><div><div class="eyebrow">NEXALYPLANNER / BUSINESS RUNWAY OS</div><h1>${tr(k)}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`,card=(k,content,meta='')=>`<section class="card"><div class="cardhead"><h2>${tr(k)}</h2><small class="muted">${meta}</small></div><div class="body">${content}</div></section>`,kpi=(k,v,sub='',tone='')=>`<div class="card kpi"><small>${tr(k)}</small><strong class="${tone}">${v}</strong><span>${sub}</span></div>`,table=(ks,rows)=>`<div class="tablebox"><table class="table"><thead><tr>${ks.map(k=>`<th>${tr(k)}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${ks.length}">${tr('noData')}</td></tr>`}</tbody></table></div>`,empty=(kind='revenue')=>`<div class="empty"><h3>${tr('noData')}</h3><p>${tr('runwayHelp')}</p>${btn(kind,'＋ '+tr(kind==='account'?'addAccount':kind==='expense'?'addExpense':kind==='milestone'?'addMilestone':kind==='history'?'recordHistory':'addRevenue'),'primary')} ${btn('demo',tr('loadDemo'))}</div>`;const nav=[['cockpit','◈'],['cash','◉'],['revenue','↗'],['expenses','↘'],['burnAnalysis','▥'],['scenarios','◇'],['milestones','◆'],['hiringSimulator','▦'],['fundingSimulator','＋'],['alerts','!'],['reports','▧'],['dataCenter','◫'],['settings','⚙']];const metrics=()=>E.metrics(db,month),base=()=>E.forecast(db,month,{},36),preview=()=>E.forecast(db,month,scenario,36),list=(k)=>db[k].filter(x=>showArchived||!x.archived),active=(k)=>db[k].filter(x=>x.active&&!x.archived),filter=(k)=>list(k).filter(x=>!search||(x.name+' '+(x.category||'')+' '+(x.owner||'')).toLowerCase().includes(search.toLowerCase()));function bar(label,v,max,extra=''){return `<div class="barrow"><span>${esc(label)}</span><div class="track" role="img" aria-label="${esc(label)}: ${fmt(v)}"><i style="width:${max?Math.max(2,Math.min(100,v/max*100)):0}%"></i></div><b>${extra||fmt(v)}</b></div>`}function chart(basePoints,scenarioPoints=null){let b=basePoints.slice(0,37),sc=scenarioPoints?.slice(0,37),all=[...b,...(sc||[])].map(x=>x.cash),hi=Math.max(db.minSafe,E.cash(db),...all,1),lo=Math.min(0,...all),X=i=>56+i/36*790,Y=v=>255-(v-lo)/(hi-lo)*205,path=a=>a.map((x,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(x.cash).toFixed(1)).join(' '),safeY=Y(db.minSafe);return `<div class="chart-wrap"><svg viewBox="0 0 890 300" role="img" aria-label="${tr('cashCurve')}: ${tr('forecastLimit')}"><defs><linearGradient id="fillCurve" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9a83d2" stop-opacity=".42"/><stop offset="1" stop-color="#9a83d2" stop-opacity="0"/></linearGradient></defs>${[0,.25,.5,.75,1].map(t=>`<line x1="56" x2="846" y1="${(50+t*205).toFixed(1)}" y2="${(50+t*205).toFixed(1)}" stroke="currentColor" opacity=".12"/>`).join('')}<line x1="56" x2="846" y1="${safeY}" y2="${safeY}" stroke="#c7915d" stroke-dasharray="5 6" opacity=".9"/><text x="60" y="${Math.max(18,safeY-7)}" fill="#bb8758" font-size="11">${esc(tr('minSafeCash'))}</text><path d="${path(b)} L846,255 L56,255 Z" fill="url(#fillCurve)"/><path d="${path(b)}" fill="none" stroke="#a391d8" stroke-width="3" vector-effect="non-scaling-stroke"/>${sc?`<path d="${path(sc)}" fill="none" stroke="#dcaa78" stroke-width="3" stroke-dasharray="7 5" vector-effect="non-scaling-stroke"/>`:''}${[0,6,12,18,24,30,36].map(i=>`<text x="${X(i)}" y="280" text-anchor="middle" fill="currentColor" opacity=".6" font-size="11">${i}</text>`).join('')}${b.filter((x,i)=>i%3===0).map((x,j)=>`<circle cx="${X(j*3)}" cy="${Y(x.cash)}" r="4" fill="#aa94db"><title>${esc(monthLabel(x.month))}: ${esc(fmt(x.cash))}</title></circle>`).join('')}</svg></div><div class="chart-key"><span><i style="background:#a391d8"></i>${tr('baseline')}</span>${sc?`<span><i style="background:#dcaa78"></i>${tr('whatIf')}</span>`:''}<span><i style="background:#c7915d"></i>${tr('minSafeCash')}</span></div><p class="chart-tip">${tr('chartNote')}</p>`}function expenseMix(){let a={};for(let x of active('expenses').filter(x=>x.frequency!=='oneTime'))a[x.category]=(a[x.category]||0)+E.normalize(x);return Object.entries(a).sort((x,y)=>y[1]-x[1])}function alertsList(){let m=metrics(),f=base(),a=[];if(!db.accounts.length)a.push(['staleCash',null,'critical']);else for(let x of db.accounts.filter(x=>!x.archived))if((Date.parse(today())-Date.parse(x.asOf))/86400000>45)a.push(['staleCash',x.name,'warning']);if(m.cash<db.minSafe)a.push(['safeThreshold',fmt(db.minSafe-m.cash),'critical']);if(f.safe!==null)a.push(['safeCashCross',E.monthOffset(month,f.safe),'warning']);if(f.zero!==null)a.push(['zeroCash',E.monthOffset(month,f.zero),'critical']);if(!active('revenue').some(x=>x.frequency!=='oneTime'))a.push(['missingRevenue',null,'warning']);if(!active('expenses').some(x=>x.frequency!=='oneTime'))a.push(['missingExpense',n function confirmAction(message,run){modal={type:'confirm',message,run};render()}function modalHTML(){if(!modal)return '';if(modal.type==='confirm')return `<div class="shade"></div><div class="modal card" role="dialog" aria-modal="true"><h2>${tr('confirm')}</h2><p>${esc(modal.message)}</p><div class="row">${btn('yes',tr('confirm'),'primary')}${btn('no',tr('close'))}</div></div>`;if(modal.type==='help')return `<div class="shade" data-act="no"></div><div class="modal card" role="dialog" aria-modal="true"><img src="${window.NEXALY_LOGO}" alt="NexalyPlanner" class="report-logo"><h2>${tr('help')}</h2><p>${tr('runRateNote')}</p><p>${tr('chartNote')}</p><p>${tr('scenarioNote')}</p><p>${tr('backupNote')}</p>${btn('no',tr('close'),'primary')}</div>`;let step=modal.step;return `<div class="shade"></div><div class="modal card" role="dialog" aria-modal="true"><img src="${window.NEXALY_LOGO}" alt="NexalyPlanner" class="report-logo"><div class="eyebrow">${tr('setup')} ${step+1}/6</div><h2>${tr(['welcome','chooseLanguage','chooseCurrency','businessProfile','cashSetup','loadSample'][step])}</h2><p>${tr('runwayHelp')}</p><form id="setupForm">${step===0?`<p>${tr('runRateNote')}</p>`:step===1?select('language','lang',Object.entries(LANGS),db.lang):step===2?select('currency','currency',CURRENCIES.map(x=>[x,x]),db.currency):step===3?field('businessName','business',db.business,'text','required'):step===4?`${field('cashBalance','openingCash','250000','number','min="0" step="0.01" required')}${field('minSafeCash','minSafe',cash(db.minSafe),'number','min="0" step="0.01" required')}`:`<label><input type="checkbox" name="demo" checked> ${tr('loadDemo')}</label><p>${tr('startEmpty')}</p>`}<button class="btn primary" type="submit">${tr(step===5?'finish':'next')}</button></form></div>`}
function render(){document.documentElement.lang=db.lang;document.documentElement.dir=db.lang==='ar'?'rtl':'ltr';document.body.dataset.theme=db.theme;document.body.classList.toggle('print-report',page==='reports');let views={cockpit,cash:accountPage,revenue:()=>ledgerPage('revenue'),expenses:()=>ledgerPage('expenses'),burnAnalysis:burnPage,scenarios:()=>scenarioPage(),milestones:milestonesPage,hiringSimulator:()=>scenarioPage('hiring'),fundingSimulator:()=>scenarioPage('funding'),alerts:alertsPage,reports:reportPage,dataCenter:dataPage,settings:settingsPage};$('#app').innerHTML=`<div class="shell ${collapsed?'collapsed':''}"><aside class="rail ${mobile?'mobileopen':''}"><div class="brand"><img src="${window.NEXALY_LOGO}" alt="NexalyPlanner"><div><b>NEXALYPLANNER</b><small>BUSINESS RUNWAY OS</small></div></div><nav class="railnav">${nav.map(([k,ic])=>`<button data-page="${k}" class="${page===k?'active':''}" title="${tr(k)}"><span class="icon">${ic}</span><span>${tr(k)}</span></button>`).join('')}</nav><div class="railfoot">${tr('offlineNote')}<b>${esc(db.business)}</b></div></aside><div class="work"><header class="topbar"><div class="row">${btn('menu','☰','small')}<span class="breadcrumb">${tr(page)}</span></div><div class="controls"><input class="field global-search" data-global-search placeholder="${tr('search')}" value="${esc(search)}" aria-label="${tr('search')}"><span class="pill">${monthLabel(month)}</span><select class="field" data-change="lang" aria-label="${tr('language')}">${opts(Object.entries(LANGS),db.lang)}</select><select class="field" data-change="currency" aria-label="${tr('currency')}">${opts(CURRENCIES.map(x=>[x,x]),db.currency)}</select>${btn('theme',db.theme==='light'?'☾':'☀','small')}${btn('help','?','small')}${btn('revenue','＋','small primary')}</div></header><main class="main">${(views[page]||cockpit)()}</main><div class="workfoot">NEXALYPLANNER · ${tr('offlineNote')} · ${tr('noAutoAlerts')}</div></div></div>${drawerHTML()}${modalHTML()}<input id="backup-file" type="file" accept=".json,application/json" hidden><input id="csv-file" type="file" accept=".csv,text/csv" hidden>`}
function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}const csvKeys=['kind','name','category','amount','frequency','start','end','date','type','active'];function csvEscape(v){let s=String(v??'');return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}function exportCSV(){let rows=[...db.revenue.filter(x=>!x.archived).map(x=>['revenue',x]),...db.expenses.filter(x=>!x.archived).map(x=>['expense',x])].map(([kind,x])=>[kind,x.name,x.category,cash(x.amount),x.frequency,x.start,x.end,x.date,x.kind||'',x.active?'yes':'no']);download('Nexaly_Runway_Flows.csv','\uFEFF'+[csvKeys,...rows].map(r=>r.map(csvEscape).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function parseCSV(s){let rows=[],row=[],v='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(q){if(c==='"'&&s[i+1]==='"'){v+='"';i++}else if(c==='"')q=false;else v+=c}else if(c==='"')q=true;else if(c===','){row.push(v);v=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&s[i+1]==='\n')i++;row.push(v);if(row.some(z=>z.trim()))rows.push(row);row=[];v=''}else v+=c}if(q)throw Error(tr('invalidCSV'));row.push(v);if(row.some(z=>z.trim()))rows.push(row);return rows}function importCSV(s){let rows=parseCSV(s.replace(/^\uFEFF/,'')),h=rows.shift()?.map(x=>x.trim().toLowerCase());if(!h||csvKeys.some(k=>!h.includes(k)))throw Error(tr('invalidCSV'));let get=(r,k)=>r[h.indexOf(k)]?.trim()||'',good=[],bad=0;for(let r of rows){let kind=get(r,'kind'),name=get(r,'name'),frequency=get(r,'frequency'),val=amount(get(r,'amount')),start=get(r,'start'),end=get(r,'end'),dt=get(r,'date'),active=get(r,'active'),type=get(r,'type');if(!['revenue','expense'].includes(kind)||!name||val===null||!['monthly','quarterly','annual','weekly','oneTime'].includes(frequency)||start&&!E.validMonth(start)||end&&!E.validMonth(end)||start&&end&&end<start||frequency==='oneTime'&&!E.validDate(dt)||!['yes','no'].includes(active)||kind==='expense'&&type&&!['fixed','variable'].includes(type)){bad++;continue}good.push({kind,record:{id:id(),name,category:get(r,'category'),amount:val,frequency,start,end,date:dt||today(),kind:kind==='expense'?type||'fixed':'',active:active==='yes',owner:'',notes:''}})}if(!good.length)throw Error(tr('invalidCSV')+' '+bad);confirmAction(`${tr('confirmImport')} ${good.length}/${rows.length} · ${tr('issue')}: ${bad}`,()=>{for(let x of good)db[x.kind==='revenue'?'revenue':'expenses'].push(x.record);log(tr('importCSV'))})}
function demo(){let bank={id:id(),name:'Operating account',balance:28500000,asOf:today()},reserve={id:id(),name:'Reserve account',balance:6500000,asOf:today()};db.accounts=[bank,reserve];let mk=(name,amount,frequency,category,kind='fixed',extra={})=>({id:id(),name,amount,frequency,category,kind,active:true,start:E.monthOffset(month,-5),end:'',date:today(),owner:'',notes:'',...extra});db.revenue=[mk('Subscription revenue',3100000,'monthly','Sales'),mk('Signed services milestone',1800000,'oneTime','Services','',{date:E.monthOffset(month,2)+'-15'})];db.expenses=[mk('Team payroll',5200000,'monthly','Payroll'),mk('Cloud infrastructure',650000,'monthly','Software'),mk('Growth marketing',400000,'monthly','Marketing','variable'),mk('Contractors',800000,'monthly','Contractors','variable'),mk('Product launch',1200000,'oneTime','Operations','fixed',{date:E.monthOffset(month,3)+'-10'})];db.history=[{id:id(),month:E.monthOffset(month,-3),revenue:2700000,expense:6500000},{id:id(),month:E.monthOffset(month,-2),revenue:2850000,expense:6800000},{id:id(),month:E.monthOffset(month,-1),revenue:3000000,expense:7000000}];db.milestones=[{id:id(),name:'Product launch',month:E.monthOffset(month,3),requiredCash:18000000,owner:'Founder',notes:''},{id:id(),name:'Series seed decision',month:E.monthOffset(month,7),requiredCash:7500000,owner:'CEO',notes:''}];db.scenarios=[];db.business='Juniper Labs (sample)';db.minSafe=7500000;db.activity=[{date:today(),text:'Fictional USA startup demo loaded'}]}
function readScenario(form){let f=new FormData(form),next={...scenario};for(let k of ['growthPct','cutPct'])if(f.has(k)){let n=Number(f.get(k));if(!Number.isFinite(n)||n<0||n>(k==='growthPct'?20:100))return null;next[k]=n}for(let k of ['growthStart','cutStart','hireStart','fundingMonth'])if(f.has(k)){let n=Number(f.get(k));if(!Number.isSafeInteger(n)||n<1||n>36)return null;next[k]=n}for(let k of ['hireMonthly','hireOnce','funding'])if(f.has(k)){let v=amount(f.get(k));if(v===null)return null;next[k]=v}return next}
function handleForm(f){let d=new FormData(f),v=k=>String(d.get(k)||'').trim();if(f.id==='setupForm'){let step=modal.step;if(step===1)db.lang=v('lang');if(step===2)db.currency=v('currency');if(step===3)db.business=v('business');if(step===4){let opening=amount(v('openingCash')),safe=amount(v('minSafe'));if(opening===null||safe===null)return toast(tr('invalidAmount'));db.minSafe=safe;db.accounts=[{id:id(),name:tr('cashAccount'),balance:opening,asOf:today()}]}if(step<5){modal.step++;save();render()}else{if(d.has('demo'))demo();db.setup=true;modal=null;log(tr('setup'))}return}if(f.id==='scenarioForm'){let x=readScenario(f);if(!x)return toast(tr('invalidAmount'));scenario=x;render();return}if(f.id==='settingsForm'){let safe=amount(v('minSafe'));if(!v('business')||safe===null)return toast(tr('invalidAmount'));let apply=()=>{Object.assign(db,{business:v('business'),minSafe:safe,lang:v('lang'),currency:v('currency'),theme:v('theme'),reportNote:v('reportNote')});log(tr('saved'))};if(v('currency')!==db.currency)confirmAction(tr('currencyNote'),apply);else apply();return}if(f.id!=='drawerForm')return;let {type,record}=drawer,x=record||{id:id()},data={};if(type==='account'){let balance=amount(v('balance'));if(!v('name')||balance===null||!E.validDate(v('asOf')))return toast(tr('invalidAmount'));data={name:v('name'),balance,asOf:v('asOf')}}if(type==='revenue'||type==='expense'){let amt=amount(v('amount')),frequency=v('frequency'),start=v('start'),end=v('end'),dt=v('date');if(!v('name')||amt===null||!['monthly','quarterly','annual','weekly','oneTime'].includes(frequency)||start&&!E.validMonth(start)||end&&!E.validMonth(end)||start&&end&&end<start||frequency==='oneTime'&&!E.validDate(dt))return toast(tr('invalidAmount'));data={name:v('name'),category:v('category'),owner:v('owner'),amount:amt,frequency,start,end,date:dt||today(),kind:type==='expense'?v('kind'):'',active:v('active')==='yes',notes:v('notes')}}if(type==='milestone'){let req=amount(v('requiredCash'));if(!v('name')||!E.validMonth(v('month'))||req===null)return toast(tr('invalidAmount'));data={name:v('name'),month:v('month'),requiredCash:req,owner:v('owner'),notes:v('notes')}}if(type==='history'){let rev=amount(v('revenue')),exp=amount(v('expense'));if(!E.validMonth(v('month'))||rev===null||exp===null)return toast(tr('invalidAmount'));if(!record&&db.history.some(z=>z.month===v('month')))return toast(tr('historyMonth')+' · '+tr('duplicate'));data={month:v('month'),revenue:rev,expense:exp}}Object.assign(x,data);if(!record)db[{account:'accounts',revenue:'revenue',expense:'expenses',milestone:'milestones',history:'history'}[type]].push(x);drawer=null;log(tr('saved'))}
document.addEventListener('submit',e=>{if(['setupForm','settingsForm','drawerForm','scenarioForm'].includes(e.target.id)){e.preventDefault();handleForm(e.target)}});document.addEventListener('change',async e=>{let k=e.target.dataset.change;if(k==='lang'){db.lang=e.target.value;save();render()}if(k==='currency'){let c=e.target.value;if(c!==db.currency)confirmAction(tr('currencyNote'),()=>{db.currency=c;log(tr('saved'))})}if(k==='archived'){showArchived=e.target.checked;render()}if(e.target.id==='backup-file'&&e.target.files[0]){try{let x=JSON.parse(await e.target.files[0].text());if(!E.validate(x)||!CURRENCIES.includes(x.currency))throw Error(tr('invalidBackup'));confirmAction(tr('restoreWarning'),()=>{db={...fresh(),...x};month=thisMonth();scenario={growthPct:0,growthStart:1,cutPct:0,cutStart:1,hireMonthly:0,hireOnce:0,hireStart:1,funding:0,fundingMonth:1};page='cockpit';log(tr('restoreBackup'))})}catch(err){toast(err.message||tr('invalidBackup'))}e.target.value=''}if(e.target.id==='csv-file'&&e.target.files[0]){try{importCSV(await e.target.files[0].text())}catch(err){toast(err.message||tr('invalidCSV'))}e.target.value=''}});document.addEventListener('input',e=>{if(e.target.dataset.globalSearch!==undefined){search=e.target.value;page='revenue';let pos=e.target.selectionStart;render();let x=$('[data-global-search]');x?.focus();x?.setSelectionRange(pos,pos);return}if(e.target.dataset.search!==undefined){search=e.target.value;let pos=e.target.selectionStart;render();let x=$('[data-search]');x?.focus();x?.setSelectionRange(pos,pos)}});document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){page=p.dataset.page;mobile=false;search='';render();return}let a=e.target.closest('[data-act]')?.dataset.act;if(!a)return;if(a==='close'){drawer=null;render();return}if(a==='no'){modal=null;render();return}if(a==='yes'){let fn=modal.run;modal=null;fn();render();return}if(a==='menu'){if(innerWidth<900)mobile=!mobile;else collapsed=!collapsed;render();return}if(a==='theme'){db.theme=db.theme==='light'?'dark':'light';save();render();return}if(a==='help'){modal={type:'help'};render();return}if(['account','revenue','expense','milestone','history'].includes(a)){drawer={type:a};render();return}if(a==='backup'){db.lastBackup=today();save();download('Nexaly_Runway_Backup_'+today()+'.json',JSON.stringify(db,null,2),'application/json');render();return}if(a==='restoreFile'){$('#backup-file')?.click();return}if(a==='import'){$('#csv-file')?.click();return}if(a==='export'){exportCSV();return}if(a==='print'){window.print();return}if(a==='downloadReport'){let css=document.querySelector('style')?.textContent||'';download('Nexaly_Runway_Report_'+today()+'.html','<!doctype html><html lang="'+db.lang+'" dir="'+(db.lang==='ar'?'rtl':'ltr')+'"><meta charset="utf-8"><title>NexalyPlanner Runway Report</title><style>'+css+'.actions{display:none}</style><body data-theme="'+db.theme+'"><main class="main">'+$('.reportpage').outerHTML+'</main></body></html>','text/html;charset=utf-8');return}if(a==='demo'){confirmAction(tr('demoWarning'),()=>{demo();log(tr('loadDemo'))});return}if(a==='reset'){confirmAction(tr('resetWarning'),()=>{db=fresh();page='cockpit';month=thisMonth();modal={type:'setup',step:0};save();render()});return}if(a==='saveScenario'){let form=$('#scenarioForm');if(form){let x=readScenario(form);if(!x)return toast(tr('invalidAmount'));scenario=x}let f=preview();db.scenarios.unshift({id:id(),name:form?.elements?.scenarioName?.value?.trim()||tr('scenarioName')+' '+date(today()),date:today(),baseMonth:month,assumptions:{...scenario},zero:f.zero,safe:f.safe});db.scenarios=db.scenarios.slice(0,25);log(tr('scenarioSnapshot'));return}let [cmd,kind,key]=a.split(':');if(cmd==='loadScenario'){let x=db.scenarios.find(z=>z.id===kind);if(x){scenario={...scenario,...x.assumptions};page='scenarios';render()}return}if(cmd==='edit'){let x=db[{account:'accounts',revenue:'revenue',expenses:'expenses',milestone:'milestones',history:'history'}[kind]]?.find(z=>z.id===key);if(x){drawer={type:kind==='expenses'?'expense':kind,record:x};render()}return}if(cmd==='duplicate'){let x=db[{revenue:'revenue',expenses:'expenses'}[kind]]?.find(z=>z.id===key);if(x){db[kind].push({...x,id:id(),name:x.name+' (copy)',archived:false});log(tr('duplicate'))}return}if(cmd==='archive'||cmd==='unarchive'){let arr=db[{account:'accounts',revenue:'revenue',expenses:'expenses',milestone:'milestones',history:'history'}[kind]],x=arr?.find(z=>z.id===key);if(!x)return;if(cmd==='archive')confirmAction(tr('archiveWarning'),()=>{x.archived=true;log(tr('archive'))});else{x.archived=false;log(tr('restore'))}return}});render()})();
