formulaNote|Protected cash = buffer + tax reserve + obligations + additional reserve targets + planned payments. Ceiling = max(0, cash − protected cash) × safety factor, rounded down. Suggested draw = min(request, ceiling). Cash after = cash − request. Runway = max(0, cash after) ÷ monthly burn. YTD includes completed payments since fiscal year start.|النقد المحمي = الحد الأدنى + احتياطي الضرائب + الالتزامات + أهداف الاحتياطيات + المدفوعات المخططة. الحد = الحد الأقصى (0، النقد − المحمي) × عامل الأمان، مقربًا للأسفل. المقترح = الحد الأدنى (الطلب، الحد). النقد بعد = النقد − الطلب. مدة التغطية = الحد الأقصى (0، النقد بعد) ÷ المصروفات الشهرية. الإجمالي السنوي يشمل المدفوعات المكتملة منذ بداية السنة المالية.|Caixa protegido = reserva mínima + impostos + obrigações + metas de reservas + pagamentos planejados. Limite = máximo(0, caixa − protegido) × segurança, arredondado para baixo. Sugestão = mínimo(solicitação, limite). Caixa após = caixa − solicitação. Fôlego = máximo(0, caixa após) ÷ despesas mensais. Total anual inclui pagamentos concluídos desde o início fiscal.|Efectivo protegido = colchón + reserva fiscal + obligaciones + objetivos de reservas + pagos planificados. Límite = máximo(0, efectivo − protegido) × seguridad, redondeado hacia abajo. Sugerencia = mínimo(solicitud, límite). Efectivo después = efectivo − solicitud. Cobertura = máximo(0, efectivo después) ÷ gasto mensual. Total anual incluye pagos completados desde el inicio fiscal.|Liquidità protetta = cuscinetto + imposte + obblighi + obiettivi riserve + pagamenti pianificati. Limite = massimo(0, liquidità − protetta) × sicurezza, arrotondato per difetto. Suggerimento = minimo(richiesta, limite). Liquidità dopo = liquidità − richiesta. Autonomia = massimo(0, liquidità dopo) ÷ costi mensili. Totale annuo include pagamenti completati dall’inizio fiscale.|Beschermd geld = buffer + belastingen + verplichtingen + reservedoelen + geplande betalingen. Limiet = max(0, geld − beschermd) × veiligheid, naar beneden af const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits=c=>new Intl.NumberFormat('en',{style:'currency',currency:c}).resolvedOptions().maximumFractionDigits;
const unit=()=>10**digits(db.currency),money=n=>new Intl.NumberFormat(db.lang,{style:'currency',currency:db.currency,maximumFractionDigits:digits(db.currency)}).format(n/unit()),inputMoney=n=>(n/unit()).toFixed(digits(db.currency));
const fmtDate=d=>E.validDate(d)?new Intl.DateTimeFormat(db.lang,{year:'numeric',month:'short',day:'numeric',timeZone:'UTC'}).format(new Date(d+'T00:00:00Z')):'—';
const labelEntity={balances:'balance',obligations:'obligation',forecasts:'forecast',owners:'owner',draws:'payment',reserves:'reserve',scenarios:'scenario'};
const nav=[['home','◈'],['cash','▣'],['obligations','▤'],['tax','◒'],['owners','♧'],['planner','↗'],['scenarios','◇'],['history','↺'],['reports','▧'],['data','⬡'],['settings','⚙']];
function validImport(d){try{let volume=ENTITIES.filter(e=>e!=='scenarios').reduce((sum,e)=>sum+(Array.isArray(d[e])?d[e]:[]).reduce((n,x)=>n+(x.amount||0)+(x.target||0)+(x.current||0),0),0);return Number.isSafeInteger(volume)&&volume<=1e12&&E.validate(d)&&ENTITIES.every(e=>d[e].every(x=>(!x.updatedAt||typeof x.updatedAt==='string')&&(!x.createdAt||typeof x.createdAt==='string')&&(!x.notes||typeof x.notes==='string')&&(!x.archived||typeof x.archived==='boolean')))&&CURRENCIES.includes(d.currency)&&['light','dark'].includes(d.theme)&&['sole','llc','corp','other'].includes(d.businessType)&&typeof d.setup==='boolean'&&d.activity.every(x=>typeof x.name==='string')&&d.draws.every(x=>d.owners.some(o=>o.id===x.ownerId)&&d.balances.some(b=>b.account===x.account))&&d.scenarios.every(x=>typeof x.name==='string'&&E.validDate(x.date)&&Number.isSafeInteger(x.proposed)&&x.proposed>=0&&x.proposed<=1e12&&x.currency===d.currency&&x.assumptions&&Number.isFinite(x.assumptions.safetyPct)&&x.result&&['cash','protectedCash','maxSafe','safeDraw','postCash'].every(k=>Number.isFinite(x.result[k])))}catch(e){return false}}
function persist(){try{let previous=previewStorage.getItem(KEY);if(previous&&previous!==JSON.stringify(db))previewStorage.setItem(KEY+'_recovery',previous);previewStorage.setItem(KEY,JSON.stringify(db));saveProblem=false;return true}catch(e){saveProblem=true;toast(t('failed'));return false}}
function commit(name){dirty=false;db.activity.unshift({id:uid(),date:new Date().toISOString(),name});db.activity=db.activity.slice(0,150);persist();render();toast(t('saved'))}
function toast(msg){document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),5500)}
const btn=(a,label,extra='',cls='')=>`<button class="btn ${cls}" data-action="${a}" ${extra}>${esc(label)}</button>`;
const card=(title,body,cls='')=>`<section class="card ${cls}"><h3>${esc(title)}</h3>${body}</section>`;
const notice=(text,risk=false)=>`<div class="notice ${risk?'risk':''}">${esc(text)}</div>`;
const metric=(key,value,note='')=>`<div class="card metric"><label>${esc(t(key))}</label><strong class="amount">${esc(value)}</strong><small>${esc(note)}</small></div>`;
const options=(values,value,translated=true)=>values.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(translated?t(x):x)}</option>`).join('');
function currencyOptions(v){return CURRENCIES.map(c=>`<option ${c===v?'selected':''}>${c}</option>`).join('')}
function field(key,value='',type='text',extra='',full=false){return `<label class="field ${full?'full':''}">${esc(t(key))}<input name="${key}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function select(key,values,value,translated=true){return `<label class="field">${esc(t(key))}<select name="${key}">${options(values,value,translated)}</select></label>`}
function amountField(key,val=0){return field(key,inputMoney(val),'text','inputmode="decimal" required pattern="[0-9]+(\\.[0-9]{1,'+Math.max(1,digits(db.currency))+'})?"')}
function rows(entity){let a=db[entity].filter(x=>showArchived?!!x.archived:!x.archived);if(search)a=a.filter(x=>JSON.stringify(x).toLowerCase().includes(search.toLowerCase())||(entity==='draws'&&ownerName(x.ownerId).toLowerCase().includes(search.toLowerCase())));if(entity==='draws'&&ownerFilter!=='all')a=a.filter(x=>x.ownerId===ownerFilter);return a.sort((a,b)=>sort==='amount'?(b.amount??b.target??0)-(a.amount??a.target??0):sort==='name'?String(a.name||a.account||'').localeCompare(b.name||b.account||''):String(b.date||'').localeCompare(a.date||''))}
const ownerName=id=>db.owners.find(o=>o.id===id)?.name||'—';
function rowActions(e,r){return r.archived?btn('unarchive',t('restore'),`data-entity="${e}" data-id="${esc(r.id)}"`,'compact'):btn('edit',t('edit'),`data-entity="${e}" data-id="${esc(r.id)}"`,'compact')+btn('duplicate',t('duplicate'),`data-entity="${e}" data-id="${esc(r.id)}"`,'compact quiet')+btn('archive',t('archive'),`data-entity="${e}" data-id="${esc(r.id)}"`,'compact quiet')}
function tools(e){return `<div class="toolbar no-print"><div class="row">${btn('new',t('add')+' · '+t(labelEntity[e]),`data-entity="${e}"`,'primary')}<input id="search" aria-label="${esc(t('search'))}" placeholder="${esc(t('search'))}" value="${esc(search)}"><select id="sort" aria-label="${esc(t('date'))}">${options(['date','amount','name'],sort)}</select></div><label class="check"><input id="density" type="checkbox" ${compact?'checked':''}>${esc(t('compact'))}</label><label class="check"><input id="archived" type="checkbox" ${showArchived?'checked':''}>${esc(t('archived'))}</label></div>`}
function table(headers,body){let matches=(body||'').match(/<tr>[\s\S]*?<\/tr>/g)||[],count=matches.length;if(count>40&&page!=='reports')body=matches.slice(Math.min(offset,Math.floor((count-1)/40)*40),offset+40).join('');body=(body||'').replace(/<tr>([\s\S]*?)<\/tr>/g,(tr,inner)=>{let i=0;return '<tr>'+inner.replace(/<td([^>]*)>/g,(tag,attrs)=>'<td'+attrs+(hiddenColumns.has(headers[i++])?' hidden':'')+'>')+'</tr>'});return `${page!=='reports'?`<details class="no-print column-picker"><summary>${esc(t('columns'))}</summary><div class="row">${headers.map(k=>`<label class="check"><input type="checkbox" data-column="${k}" ${hiddenColumns.has(k)?'':'checked'}>${esc(t(k))}</label>`).join('')}</div></details>`:''}<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th scope="col" ${hiddenColumns.has(x)?'hidden':''}>${esc(t(x))}</th>`).join('')}</tr></thead><tbody>${body||`<tr><td colspan="${headers.length}">${esc(t('empty'))}</td></tr>`}</tbody></table></div>${count>40&&page!=='reports'?`<div class="row no-print" style="margin-top:12px">${btn('prevPage',t('previous'),'','compact')}${Math.min(offset+1,count)}–${Math.min(offset+40,count)} / ${count}${btn('nextPage',t('next'),offset+40>=count?'disabled':'','compact')}</div>`:''}`}
function protection(r){let vals=[['buffer',db.buffer],['tax',r.taxReserve],['obligations',r.obligations],['reserves',r.reserves],['planned',r.planned],['maxSafe',r.maxSafe]],max=Math.max(r.cash,r.protectedCash,1);return `<div class="flow">${vals.map(([k,v])=>`<div class="flowrow"><span>${esc(t(k))}</span><div class="track"><div class="fill ${k==='maxSafe'?'gold':''}" style="width:${Math.min(100,v/max*100)}%"></div></div><strong>${esc(money(v))}</strong></div>`).join('')}</div>${r.shortfall?notice(t('shortfall')+': '+money(r.shortfall),true):''}`}
function beforeAfter(r){let max=Math.max(r.cash,1);return `<div class="flow">${[['currentCash',r.cash],['proposed',r.proposed],['postCash',r.postCash]].map(([k,v])=>`<div class="flowrow"><span>${esc(t(k))}</span><div class="track"><div class="fill ${k==='proposed'?'gold':v<r.protectedCash?'red':''}" style="width:${Math.max(0,Math.min(100,v/max*100))}%"></div></div><strong>${esc(money(v))}</strong></div>`).join('')}</div><p class="sub">${esc(t('runway'))}: ${r.runway===null?'—':r.runway.toFixed(1)}</p>`}
function calendar(r){let events=[...r.events.map(x=>({date:x.eventDate,name:x.name,amount:x.amount,status:x.overdue?'!':''})),...db.draws.filter(x=>!x.archived&&x.status==='planned'&&x.date<=r.end).map(x=>({date:x.date,name:ownerName(x.ownerId),amount:x.amount,status:t('planned')}))].sort((a,b)=>a.date.localeCompare(b.date));return events.slice(0,16).map(x=>`<div class="list-row"><div><b>${esc(x.name)}</b><small>${esc(fmtDate(x.date))} ${esc(x.status)}</small></div><b class="amount">${esc(money(x.amount))}</b></div>`).join('')||`<p class="sub">${esc(t('empty'))}</p>`}
function drawGauge(r){let pct=r.maxSafe?Math.min(100,r.proposed/r.maxSafe*100):r.proposed?100:0;return `<div class="gauge"><svg viewBox="0 0 120 120" role="img" aria-label="${esc(t('proposed'))}: ${esc(money(r.proposed))} / ${esc(t('maxSafe'))}: ${esc(money(r.maxSafe))}"><circle cx="60" cy="60" r="49" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="60" cy="60" r="49" fill="none" stroke="var(--${r.overLimit?'red':'green'})" stroke-width="10" stroke-dasharray="${pct*3.07876} 307.876" transform="rotate(-90 60 60)"/><text x="60" y="65" text-anchor="middle" fill="var(--ink)" font-size="20" font-weight="700">${r.maxSafe?Math.round(r.proposed/r.maxSafe*100):r.proposed?'!':0}${r.maxSafe||!r.proposed?'%':''}</text></svg><span class="sub">${esc(t('proposed'))} / ${esc(t('maxSafe'))}</span></div>`}
function planner(r){let alloc=E.allocate(r.safeDraw,db.owners);return `<div class="grid two">${card(t('planner'),`<form id="evaluateForm"><div class="form-grid">${amountField('proposed',proposed)}<label class="field">${esc(t('asOf'))}<input type="date" name="asOf" value="${db.asOf}" required></label></div><p>${btn('evaluate',t('evaluate'),'type="submit"','primary')}</p></form>${notice(t(r.overLimit?'limitWarning':'withinLimit'),r.overLimit)}<div class="grid two">${metric('safe',money(r.safeDraw))}${metric('maxSafe',money(r.maxSafe))}</div>${drawGauge(r)}<p class="row">${btn('scenario',t('saveScenario'))}${btn('resetScenario',t('resetScenario'))}${btn('new',t('payment'),'data-entity="draws"')}</p>`)}${card(t('beforeAfter'),beforeAfter(r))}${card(t('allocation'),alloc?alloc.map(x=>`<div class="list-row"><span>${esc(x.owner.name)} · ${x.owner.share}%</span><strong>${esc(money(x.amount))}</strong></div>`).join(''):notice(t('shareNote')))}${card(t('protection'),protection(r))}</div>${notice(t('forecastNote'))}${card(t('forecasts'),`<div class="grid two">${metric('forecast',money(r.forecast))}${metric('forecastCapacity',money(r.forecastCapacity),t('snapshot'))}</div>`)}${notice(t('taxNote'))}`}
function cashPage(r){return `${notice(t('snapshotNote'))}<div class="grid three">${r.accts.map(x=>card(x.account,`<span class="stat amount">${esc(money(x.cash))}</span><p class="sub">${esc(t('balance'))}: ${esc(money(x.snapshot.amount))}<br>${esc(fmtDate(x.snapshot.date))}<br>${esc(t('completed'))}: −${esc(money(x.drawsAfter))}</p>`)).join('')}</div><p></p>${tools('balances')}${card(t('cash'),table(['account','date','amount','notes','actions'],rows('balances').map(x=>`<tr><td>${esc(x.account)}</td><td>${esc(fmtDate(x.date))}</td><td>${esc(money(x.amount))}</td><td>${esc(x.notes)}</td><td>${rowActions('balances',x)}</td></tr>`).join('')))}<p></p>${notice(t('forecastNote'))}${tools('forecasts')}${card(t('forecasts'),table(['name','date','amount','confidence','source','actions'],rows('forecasts').map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(fmtDate(x.date))}</td><td>${esc(money(x.amount))}</td><td>${x.confidence}%</td><td>${esc(x.source)}</td><td>${rowActions('forecasts',x)}</td></tr>`).join('')))}`}
function obligationPage(r){return `${tools('obligations')}<div class="grid two">${metric('obligations',money(r.obligations),fmtDate(db.asOf)+' → '+fmtDate(r.end))}${card(t('upcoming'),calendar(r))}</div><p></p>${card(t('obligations'),table(['name','date','amount','recurring','paidThrough','status','priority','actions'],rows('obligations').map(x=>`<tr><td>${esc(x.name)}<small class="sub"> ${esc(x.category)}</small></td><td>${esc(fmtDate(x.date))}</td><td>${esc(money(x.amount))}</td><td>${esc(t(x.recurring))}</td><td>${esc(fmtDate(x.paidThrough))}</td><td>${esc(t(x.status))}</td><td>${esc(t(x.priority||'normal'))}</td><td>${rowActions('obligations',x)}</td></tr>`).join('')))}`}
function taxPage(r){return `${notice(t('taxNote'))}<div class="grid two">${card(t('tax'),`<form id="taxForm"><div class="form-grid">${select('taxMethod',['fixed','manualRate'],db.taxMethod)}${amountField('taxAmount',db.taxAmount)}${amountField('taxBasis',db.taxBasis)}${field('taxRate',db.taxRate,'number','min="0" max="100" step="0.01" required')}</div><p>${btn('saveTax',t('save'),'type="submit"','primary')}</p></form>`)}${card(t('tax'),`<span class="stat amount">${esc(money(r.taxReserve))}</span><p class="sub">${esc(t(db.taxMethod))}</p>${notice(t('reserveNote'))}`)}</div><p></p>${tools('reserves')}<div class="grid three">${rows('reserves').map(x=>card(x.name,`<span class="stat amount">${esc(money(x.target))}</span><p class="sub">${esc(t('current'))}: ${esc(money(x.current))}</p><div class="progress"><span style="width:${Math.min(100,x.target?x.current/x.target*100:0)}%"></span></div><p><span class="chip">${esc(t(x.protected?'protected':'available'))}</span><span class="chip">${esc(t(x.priority||'normal'))}</span></p>${rowActions('reserves',x)}`)).join('')||notice(t('empty'))}</div>`}
function ownerPage(r){let active=db.owners.filter(x=>!x.archived&&x.active),sum=active.reduce((a,x)=>a+x.share,0);return `${notice(t('shareNote'))}<p><span class="chip">${esc(t('share'))}: ${sum}%</span></p>${tools('owners')}${card(t('owners'),table(['name','share','active','ytd','actions'],rows('owners').map(x=>`<tr><td>${esc(x.name)}</td><td>${x.share}%</td><td>${esc(t(x.active?'active':'archived'))}</td><td>${esc(money(db.draws.filter(y=>!y.archived&&y.ownerId===x.id&&y.status==='completed'&&y.date>=r.fyStart&&y.date<=db.asOf).reduce((a,y)=>a+y.amount,0)))}</td><td>${rowActions('owners',x)}</td></tr>`).join('')))}<p></p>${tools('draws')}${card(t('planned'),payments(rows('draws').filter(x=>x.status==='planned')))}<p></p>${card(t('upcoming'),calendar(r))}`}
function payments(list){return table(['owner','date','account','amount','type','status','actions'],list.map(x=>`<tr><td>${esc(ownerName(x.ownerId))}</td><td>${esc(fmtDate(x.date))}</td><td>${esc(x.account)}</td><td>${esc(money(x.amount))}</td><td>${esc(t(x.type))}</td><td>${esc(t(x.status))}</td><td>${rowActions('draws',x)}</td></tr>`).join(''))}
function scenariosPage(){let a=rows('scenarios');return `${notice(t('snapshot')+' · '+t('taxNote'))}<div class="toolbar">${btn('scenario',t('saveScenario'),'','primary')}<span class="sub">${esc(t('compare'))}</span></div><div class="grid three">${a.map(x=>card(x.name,`<p class="sub">${esc(fmtDate(x.date))} · ${esc(x.currency)}</p><span class="stat amount">${esc(money(x.proposed))}</span><div class="list-row"><span>${esc(t('safe'))}</span><b>${esc(money(x.result.safeDraw))}</b></div><div class="list-row"><span>${esc(t('postCash'))}</span><b>${esc(money(x.result.postCash))}</b></div><div class="list-row"><span>${esc(t('protected'))}</span><b>${esc(money(x.result.protectedCash))}</b></div><div class="list-row"><span>${esc(t('safety'))}</span><b>${x.assumptions.safetyPct}%</b></div>${notice(t(x.result.overLimit?'limitWarning':'withinLimit'),x.result.overLimit)}${btn('scenarioDelete',t('archive'),`data-id="${esc(x.id)}"`,'compact')}`,'sc-card')).join('')||notice(t('empty'))}</div><p></p>${card(t('compare'),table(['name','proposed','maxSafe','postCash','protected'],a.map(x=>`<tr><td>${esc(x.name)}</td>${['proposed','maxSafe','postCash','protectedCash'].map(k=>`<td>${esc(money(k==='proposed'?x.proposed:x.result[k]))}</td>`).join('')}</tr>`).join('')))}`}
function historyPage(r){let completed=db.draws.filter(x=>!x.archived&&x.status==='completed'&&x.date>=r.fyStart&&x.date<=db.asOf),months=Array.from({length:12},(_,i)=>E.addMonths(r.fyStart,i).slice(0,7)),totals=months.map(m=>completed.filter(x=>x.date.startsWith(m)).reduce((n,x)=>n+x.amount,0)),max=Math.max(...totals,1);return `<div class="grid two">${metric('ytd',money(r.ytd),fmtDate(r.fyStart)+' → '+fmtDate(db.asOf))}${card(t('history'),`<div class="bar-chart" aria-label="${esc(t('ytd'))}">${totals.map((v,i)=>`<div class="bar" style="height:${Math.max(2,v/max*100)}%" title="${months[i]}: ${esc(money(v))}"><span>${months[i].slice(5)}</span></div>`).join('')}</div><p class="sub" style="margin-top:30px">${esc(t('completed'))}</p>`)}</div><p></p>${tools('draws')}<div class="row"><label>${esc(t('owner'))} <select id="ownerFilter"><option value="all">${esc(t('all'))}</option>${db.owners.map(x=>`<option value="${esc(x.id)}" ${x.id===ownerFilter?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label></div><p></p>${card(t('history'),payments(rows('draws')))}`}
function reportPage(r){return `<div class="toolbar no-print">${btn('print',t('print'),'','primary')}${btn('reportTXT',t('report'))}${btn('backup',t('backup'))}</div><div class="reporthead"><img src="${LOGO}" alt="NexalyPlanner"><div><div class="eyebrow">NEXALYPLANNER</div><h2>${esc(t('report'))}</h2><p>${esc(db.business)} · ${esc(db.currency)} · ${esc(fmtDate(db.asOf))}</p></div></div><p></p>${notice(t('attention')+' · '+(r.shortfall?t('shortfall')+': '+money(r.shortfall):t('withinLimit'))+(db.lastBackup?'':' · '+t('never')),!!r.shortfall)}<div class="grid metrics">${metric('currentCash',money(r.cash))}${metric('protected',money(r.protectedCash))}${metric('maxSafe',money(r.maxSafe))}${metric('ytd',money(r.ytd))}${metric('buffer',money(db.buffer))}${metric('tax',money(r.taxReserve))}${metric('retained',money(r.retained))}${metric('runway',r.runway===null?'—':r.runway.toFixed(1))}</div><div class="grid two">${card(t('protection'),protection(r))}${card(t('upcoming'),calendar(r))}</div><p></p>${card(t('history'),payments(db.draws.filter(x=>!x.archived&&x.status==='completed'&&x.date>=r.fyStart&&x.date<=db.asOf)))}<p></p>${card(t('obligations'),table(['name','date','amount','recurring'],r.events.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(fmtDate(x.eventDate))}</td><td>${esc(money(x.amount))}</td><td>${esc(t(x.recurring))}</td></tr>`).join('')))}<p></p>${card(t('allocation'),table(['name','share'],db.owners.filter(x=>!x.archived).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.share}%</td></tr>`).join('')))}${notice(t('snapshotNote'))}${notice(t('formulaNote'))}${notice(t('taxNote'))}`}
function archiveBrowser(){let items=ENTITIES.flatMap(e=>db[e].filter(x=>x.archived).map(x=>({e,x})));return card(t('archiveBrowser'),table(['type','name','actions'],items.map(({e,x})=>`<tr><td>${esc(t(labelEntity[e]))}</td><td>${esc(x.name||x.account||ownerName(x.ownerId))}</td><td>${btn('unarchive',t('restore'),`data-entity="${e}" data-id="${esc(x.id)}"`,'compact')}</td></tr>`).join('')))}
function dataPage(){return `${notice(t('backupNote'))}<div class="grid two">${card(t('backup'),`<p class="sub">JSON · ${esc(db.business)} · ${esc(db.currency)}<br>${esc(t('lastBackup'))}: ${db.lastBackup?esc(db.lastBackup):esc(t('never'))}</p><div class="row">${btn('backup',t('backup'),'','primary')}${btn('importBackup',t('importBackup'))}</div>`)}${card('CSV',`<p class="sub">${esc(t('exportCSV'))} / ${esc(t('importCSV'))} · schema 1</p><div class="row">${btn('exportCSV',t('exportCSV'))}${btn('importCSV',t('importCSV'))}</div>`)}${card(t('scan'),`<div class="row">${btn('scan',t('scan'))}${btn('recovery',t('recovery'))}${btn('demo',t('demo'))}${btn('reset',t('reset'),'','danger')}</div>`)}${card(t('data'),ENTITIES.map(e=>`<div class="list-row"><span>${esc(t(labelEntity[e]))}</span><b>${db[e].length}</b></div>`).join(''))}</div><p></p>${archiveBrowser()}<p></p>${card(t('history'),db.activity.slice(0,20).map(x=>`<div class="list-row"><span>${esc(x.name)}</span><small>${esc(x.date.slice(0,16).replace('T',' '))}</small></div>`).join('')||`<p class="sub">${esc(t('empty'))}</p>`)}`}

function render(){document.documentElement.dataset.theme=db.theme;document.documentElement.lang=db.lang;document.body.dir=db.lang==='ar'?'rtl':'ltr';if(!db.setup){app.innerHTML=setupPage();return}let r=E.evaluate(db,{proposed});let content=({home:homePage,cash:cashPage,obligations:obligationPage,tax:taxPage,owners:ownerPage,planner,scenarios:scenariosPage,history:historyPage,reports:reportPage,data:dataPage,settings:settingsPage}[page]||homePage)(r);app.innerHTML=`<div class="shell ${collapsed?'collapsed':''}"><aside class="sidebar"><div class="brand"><img src="${LOGO}" alt="NexalyPlanner"><div class="brand-text"><b>Owner Pay</b><br><small>NEXALYPLANNER</small></div></div><nav class="nav" aria-label="${esc(t('home'))}">${nav.map(([k,i])=>`<button data-action="navigate" data-page="${k}" class="${page===k?'selected':''}" title="${esc(t(k))}" ${page===k?'aria-current="page"':''}><span class="icon" aria-hidden="true">${i}</span><span class="nav-label">${esc(t(k))}</span></button>`).join('')}</nav><div class="sidefoot">${btn('collapse','☰')}<button data-action="help"><span>${esc(t('help'))}</span></button><small class="nav-label">${esc(t('local'))}<br>v1.0.1<br>${esc(t('lastBackup'))}: ${db.lastBackup?esc(db.lastBackup.slice(0,10)):esc(t('never'))}</small></div></aside><main class="main"><header class="topbar"><div class="row">${btn('menu','☰','aria-label="Menu"','mobile-menu')}<div class="top-title"><div class="eyebrow">${esc(db.business)}</div><h1>${esc(t(page))}</h1></div></div><div class="toptools"><input id="asOf" type="date" value="${db.asOf}" aria-label="${esc(t('asOf'))}"><span class="chip hide-mobile">${db.currency}</span><select id="lang" aria-label="${esc(t('language'))}">${Object.entries(LANGS).map(([l,n])=>`<option value="${l}" ${l===db.lang?'selected':''}>${n}</option>`).join('')}</select>${btn('theme',db.theme==='light'?'◐':'☀',`aria-label="${esc(t('theme'))}"`)}${btn('formula','?',`title="${esc(t('calculated'))}" aria-label="${esc(t('calculated'))}"`)}${b function openForm(entity,id=null){if(!closeModal())return;dirty=false;let r=id?db[entity].find(x=>x.id===id):null;if(entity==='draws'&&(!db.balances.some(x=>!x.archived)||!db.owners.some(x=>!x.archived))){toast(t('noAccount'));return}drawerState={entity,id};r=r||{date:db.asOf,amount:entity==='draws'?proposed:0,status:entity==='draws'?'planned':'open',recurring:'none',share:0,confidence:100,active:true,protected:true,priority:'normal',type:'draw',target:0,current:0};let fields='';if(entity==='balances')fields=field('account',r.account||'','text','required maxlength="100"')+field('date',r.date,'date','required')+amountField('amount',r.amount);if(entity==='obligations')fields=field('name',r.name,'text','required maxlength="120"')+field('date',r.date,'date','required')+amountField('amount',r.amount)+field('category',r.category)+select('recurring',['none','monthly','quarterly','yearly'],r.recurring)+field('paidThrough',r.paidThrough||'','date')+select('status',['open','paid'],r.status)+select('priority',['high','normal','low'],r.priority||'normal');if(entity==='forecasts')fields=field('name',r.name,'text','required maxlength="120"')+field('date',r.date,'date','required')+amountField('amount',r.amount)+field('confidence',r.confidence,'number','min="0" max="100" step="0.01" required')+field('source',r.source);if(entity==='owners')fields=field('name',r.name,'text','required maxlength="120"')+field('share',r.share,'number','min="0" max="100" step="0.01" required')+`<label class="check"><input name="active" type="checkbox" ${r.active?'checked':''}>${esc(t('active'))}</label>`;if(entity==='reserves')fields=field('name',r.name,'text','required maxlength="120"')+amountField('target',r.target)+amountField('current',r.current)+select('priority',['high','normal','low'],r.priority||'normal')+`<label class="check"><input name="protected" type="checkbox" ${r.protected?'checked':''}>${esc(t('protected'))}</label>`;if(entity==='draws'){let os=db.owners.filter(x=>!x.archived||x.id===r.ownerId),ac=[...new Set(db.balances.filter(x=>!x.archived||x.account===r.account).map(x=>x.account))];fields=`<label class="field">${esc(t('owner'))}<select name="ownerId">${os.map(x=>`<option value="${esc(x.id)}" ${r.ownerId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label class="field">${esc(t('account'))}<select name="account">${ac.map(x=>`<option ${r.account===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`+field('date',r.date,'date','required')+amountField('amount',r.amount)+select('type',['draw','distribution','salary'],r.type)+select('status',['planned','completed','cancelled'],r.status)}if(entity==='draws'&&!id)fields+=field('months',1,'number','min="1" max="12" step="1" required');fields+=`<label class="field full">${esc(t('notes'))}<textarea name="notes" maxlength="2000" rows="3">${esc(r.notes||'')}</textarea></label>`;modal.innerHTML=`<div class="drawer-wrap"><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="dialogtitle"><header><h2 id="dialogtitle">${esc(t(labelEntity[entity]))}</h2>${btn('close','×','aria-label="'+esc(t('cancel'))+'"')}</header>${entity==='balances'?notice(t('snapshotNote')):entity==='reserves'?notice(t('reserveNote')):entity==='draws'?notice(t('taxNote'))+notice(t('repeatNote')):''}<form id="recordForm"><div class="form-grid">${fields}</div><p class="row">${btn('saveRecord',t('save'),'type="submit"','primary')}${btn('close',t('cancel'),'type="button"')}</p></form></section></div>`;modal.querySelector('input,select')?.focus()}
function closeModal(force=false){if(dirty&&!force&&!confirm(t('unsaved')))return false;modal.innerHTML='';drawerState=null;dirty=false;return true}
function formRecord(f){let {entity,id}=drawerState;let old=id?db[entity].find(x=>x.id===id):{},r={...old,id:id||uid(),createdAt:old.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};for(let [k,v]of f.entries()){if(['active','protected','months'].includes(k))continue;if(['amount','target','current'].includes(k))r[k]=E.parseMoney(v,digits(db.currency));else if(['share','confidence'].includes(k))r[k]=Number(v);else r[k]=String(v).trim()}if(entity==='owners')r.active=f.has('active');if(entity==='reserves')r.protected=f.has('protected');if(entity==='balances'){let match=db.balances.find(x=>x.id!==id&&x.account.toLowerCase()===r.account.toLowerCase());if(match)r.account=match.account;let duplicate=db.balances.find(x=>!x.archived&&x.id!==id&&x.account===r.account&&x.date===r.date);if(duplicate){toast(t('invalid'));return false}if(id&&old.account!==r.account&&db.draws.some(x=>x.account===old.account)){toast(t('invalid'));return false}}
let next=structuredClone(db);if(id)next[entity]=next[entity].map(x=>x.id===id?r:x);else {next[entity].push(r);let count=Number(f.get('months')||1);if(entity==='draws'&&count>1){if(count>12||!Number.isInteger(count)||r.status!=='planned'){toast(t('invalid'));return false}for(let i=1;i<count;i++)next.draws.push({...r,id:uid(),date:E.addMonths(r.date,i)})}}if(!validImport(next)){toast(t('invalid'));return false}if(entity==='draws'&&r.status==='completed'){let baseline=structuredClone(next);baseline.draws=baseline.draws.filter(x=>x.id!==r.id);let cap=E.evaluate(baseline,{asOf:r.date,proposed:r.amount});let acc=cap.accts.find(x=>x.account===r.account);if(!acc){toast(t('noAccount'));return false}if((cap.overLimit||r.amount>acc.cash)&&!confirm(t('confirmPayment')))return false}db=next;closeModal(true);commit(t(labelEntity[entity])+' · '+(id?t('edit'):t('add')));return true}
function download(name,data,type){let url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}

function encodeCSV(d){let out=[['nexaly_ownerpay_csv','1',d.currency],['entity','id','data_json'],['settings','',JSON.stringify(Object.fromEntries(Object.entries(d).filter(([k])=>!ENTITIES.includes(k)&&k!=='activity')))]];for(let e of [...ENTITIES,'activity'])for(let x of d[e])out.push([e,x.id,JSON.stringify(x)]);return out.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function parseCSV(s){let rows=[],row=[],v='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&s[i+1]==='\n')i++;row.push(v);if(row.some(x=>x!==''))rows.push(row);row=[];v=''}else v+=c}if(quoted)throw Error('quote');if(v||row.length){row.push(v);rows.push(row)}return rows}
function decodeCSV(s){let rows=parseCSV(s.replace(/^\uFEFF/,''));if(rows[0]?.[0]!=='nexaly_ownerpay_csv'||rows[0][1]!=='1'||rows[1]?.join(',')!=='entity,id,data_json')throw Error('schema');let setting=rows.filter(x=>x[0]==='settings');if(setting.length!==1)throw Error('settings');let d=JSON.parse(setting[0][2]);for(let e of [...ENTITIES,'activity'])d[e]=[];for(let row of rows.slice(2)){if(row[0]==='settings')continue;if(![...ENTITIES,'activity'].includes(row[0])||row.length!==3)throw Error('entity');let item=JSON.parse(row[2]);if(item.id!==row[1])throw Error('id');d[row[0]].push(item)}if(d.currency!==rows[0][2]||!validImport(d))throw Error('data');return d}
function importFile(csv){let input=document.createElement('input');input.type='file';input.accept=csv?'.csv':'.json';input.onchange=async()=>{try{let file=input.files[0];if(file.size>10*1024*1024)throw Error('size');let text=await file.text(),next=csv?decodeCSV(text):JSON.parse(text);if(!validImport(next))throw Error('schema');if(!confirm(t('confirmReplace')))return;db=next;page='home';proposed=0;search='';closeModal(true);commit(t(csv?'importCSV':'importBackup'))}catch(e){toast(t('invalidFile'))}};input.click()}

document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(el){if(el.getAttribute('type')==='submit')return;e.preventDefault();action(el.dataset.action,el)}});
document.addEventListener('submit',e=>{e.preventDefault();let form=e.target;if(!form.checkValidity()){form.reportValidity();return}let f=new FormData(form);if(form.id==='recordForm')formRecord(f);else if(form.id==='scenarioForm')saveScenario(f);else if(form.id==='evaluateForm'){let p=E.parseMoney(f.get('proposed'),digits(db.currency)),date=f.get('asOf');if(p===null||!E.validDate(date)){toast(t('invalid'));return}proposed=p;db.asOf=date;persist();render()}else if(form.id==='taxForm'){let next={...db,taxMethod:f.get('taxMethod'),taxAmount:E.parseMoney(f.get('taxAmount'),digits(db.currency)),taxBasis:E.parseMoney(f.get('taxBasis'),digits(db.currency)),taxRate:Number(f.get('taxRate'))};if(!validImport(next)){toast(t('invalid'));return}db=next;commit(t('tax'))}else if(form.id==='settingsForm'){let next={...db,business:String(f.get('business')).trim(),businessType:f.get('businessType'),currency:f.get('currency')||db.currency,asOf:f.get('asOf'),buffer:E.parseMoney(f.get('buffer'),digits(db.currency)),monthlyBurn:E.parseMoney(f.get('monthlyBurn'),digits(db.currency)),horizonDays:Number(f.get('horizon')),safetyPct:Number(f.get('safety')),fiscalMonth:Number(f.get('fiscalMonth'))};if(!next.business||!validImport(next)){toast(t('invalid'));return}db=next;commit(t('settings'))}else if(form.id==='setupForm'){db.business=String(f.get('business')).trim();db.currency=f.get('currency');db.setup=true;dirty=false;persist();render()}});
document.addEventListener('change',e=>{let x=e.target;if(x.id==='density'){compact=x.checked;render()}if(x.dataset.column){if(x.checked)hiddenColumns.delete(x.dataset.column);else hiddenColumns.add(x.dataset.column);render()}if(x.id==='lang'){if(!closeModal()){x.value=db.lang;return}db.lang=x.value;persist();render()}if(x.id==='asOf'){if(!closeModal()){x.value=db.asOf;return}if(E.validDate(x.value)){db.asOf=x.value;persist();render()}}if(x.id==='archived'){offset=0;showArchived=x.checked;render()}if(x.id==='sort'){offset=0;sort=x.value;render()}if(x.id==='ownerFilter'){ownerFilter=x.value;render()}});
document.addEventListener('input',e=>{if((modal.contains(e.target)&&e.target.id!=='commandSearch')||e.target.closest('#settingsForm,#taxForm,#setupForm'))dirty=true;if(e.target.name==='proposed'&&e.target.closest('#evaluateForm')){let value=e.target.value,pos=e.target.selectionStart,parsed=E.parseMoney(value,digits(db.currency));if(parsed!==null){clearTimeout(liveTimer);liveTimer=setTimeout(()=>{proposed=parsed;render();let input=document.querySelector('#evaluateForm [name=proposed]');if(input){input.value=value;input.focus();input.setSelectionRange(pos,pos)}},300)}}if(e.target.id==='search'){let pos=e.target.selectionStart;search=e.target.value;offset=0;render();let x=document.getElementById('search');x?.focus();x?.setSelectionRange(pos,pos)}if(e.target.id==='commandSearch'){let s=e.target.value.toLowerCase();modal.querySelectorAll('.command-list button').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(s))}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();command()}if(e.key==='Tab'&&modal.querySelector('[role=dialog]')){let items=[...modal.querySelectorAll('button,input,select,textarea')].filter(x=>!x.disabled&&!x.hidden),first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
window.addEventListener('beforeunload',e=>{if(dirty||saveProblem){e.preventDefault();e.returnValue=''}});
render();if(loadError)toast(t('failed'));
</script></body></html>
