<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ConsignClear OS — NexalyPlanner</title>
<style>
:root{font:15px/1.5 Inter,system-ui,sans-serif;color:#e8f2f5;background:#0b1720}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{padding:20px 26px;background:#102632;border-bottom:1px solid #31505c;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}header b{font-size:1.2rem}header small{display:block;color:#a7c9cf}nav{display:flex;gap:6px;flex-wrap:wrap;padding:12px 25px;background:#11232d;position:sticky;top:0;z-index:3}nav button,.tool button{background:transparent;color:inherit;border:1px solid #46616b;border-radius:9px;padding:8px 12px}nav button.active,button.primary{background:#12b5bb;border-color:#12b5bb;color:#08242a;font-weight:700}main{max-width:1360px;margin:auto;padding:24px}section[hidden],dialog[hidden]{display:none}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar h1{margin:0;font-size:1.6rem}.tool{display:flex;gap:8px;flex-wrap:wrap}.card,.panel{border:1px solid #2d4d58;border-radius:14px;background:#122934;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:13px}.kpi strong{font-size:1.7rem;display:block;color:#7ee3dd}.kpi small{color:#a4bdc3}.panel{margin:18px 0;overflow:auto}.panel h2{margin-top:0;font-size:1.2rem}table{border-collapse:collapse;width:100%;min-width:700px}th,td{text-align:left;padding:10px;border-bottom:1px solid #31505c;vertical-align:top}th{color:#9fc5ce}td button{background:#27414c;color:#fff;border:0;border-radius:6px;padding:6px 8px;margin:2px}.muted{color:#abc1c7}.warn{color:#ffc178}.good{color:#8de8b4}label{display:block;margin:10px 0 4px;font-weight:600}input,select,textarea{width:100%;padding:10px;border:1px solid #45616a;border-radius:8px;background:#0b1b24;color:inherit}textarea{min-height:70px}input[type=file]{max-width:330px}form{max-width:560px}form .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}form button{padding:11px 16px;border:0;border-radius:8px;margin:12px 6px 0 0}.secondary{background:#31505b;color:#fff}.danger{background:#ad5348;color:#fff}.hint{font-size:.88rem;color:#aec5c9}footer{padding:20px;text-align:center;color:#aec5c9}body.light{background:#f5f8f7;color:#18313a}body.light header,body.light nav,body.light .panel,body.light .card{background:#fff;color:#18313a}body.light input,body.light select,body.light textarea{background:#fff;color:#18313a}body.light nav button,body.light .tool button{color:#18313a}body.light .muted,body.light .hint{color:#526a70}body.light th,body.light .kpi small{color:#526a70}body.light td button{color:#fff}dialog{background:#122934;color:#fff;border:1px solid #4d727c;border-radius:14px;width:min(610px,95vw);max-height:90vh;overflow:auto;padding:24px}dialog::backdrop{background:#000a}@media(max-width:600px){main{padding:12px}nav{padding:10px}form .row{grid-template-columns:1fr}}
</style></head><body><header><div><b>NexalyPlanner · ConsignClear OS</b><small>Offline consignment inventory and settlement workspace · v1.0</small></div><div id="businessName">Austin Sample Resale Boutique</div></header><nav id="nav"></nav><main id="app"></main><footer>Local browser storage · Export a JSON backup regularly · Financial decisions require owner review.</footer><dialog id="editor"><h2 id="dialogTitle"></h2><form id="editorForm"></form></dialog>
<script>
(()=>{'use strict';
const KEY='nexaly.consignclear.v1', DEMO=new URLSearchParams(location.search).has('demo');
const empty=()=>({version:1,settings:{business:'My Consignment Shop',currency:'USD',theme:'dark'},consignors:[],agreements:[],items:[],sales:[],adjustments:[],payouts:[],returns:[]});
let db=empty(),tab='Dashboard';
try{if(!DEMO){let saved=localStorage.getItem(KEY);if(saved)db=JSON.parse(saved)}}catch(e){alert('Saved records could not be read. Import a valid backup to restore them.')}
const tabs=['Dashboard','Consignors','Agreements','Inventory','Sales','Adjustments','Payouts','Returns','Reports','Settings'];
const schemas={
consignors:[['name','Consignor name','text',true],['email','Email','email'],['phone','Phone','tel'],['notes','Notes','textarea']],
agreements:[['consignorId','Consignor','consignors',true],['title','Agreement name','text',true],['ownerRate','Consignor share (%)','number',true],['discount','Discount authority / terms','textarea'],['start','Effective date','date'],['notes','Notes','textarea']],
items:[['sku','SKU / item code','text',true],['name','Item description','text',true],['consignorId','Owner','consignors',true],['agreementId','Agreement','agreements',true],['intake','Intake date','date'],['condition','Condition','text'],['asking','Asking price','number'],['returnBy','Return-by date','date'],['status','Status','status'],['notes','Notes','textarea']],
sales:[['itemId','Available item','availableItems',true],['date','Sale date','date',true],['amount','Sale price','number',true],['channelFee','Channel fee','number'],['processingFee','Processing fee','number'],['notes','Sale notes','textarea']],
adjustments:[['saleId','Sale','sales',true],['date','Adjustment date','date',true],['amount','Deduct from consignor share','number',true],['reason','Refund / adjustment reason','textarea',true]],
payouts:[['consignorId','Consignor','consignors',true],['date','Paid date','date',true],['amount','Amount paid','number',true],['reference','Payment reference','text',true],['notes','Approval / payout notes','textarea']],
returns:[['itemId','Unsold item','returnableItems',true],['date','Return date','date',true],['reference','Custody / receipt reference','text',true],['notes','Notes','textarea']]
};
const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=x=>Number(x)||0, money=x=>new Intl.NumberFormat('en-US',{style:'currency',currency:db.settings.currency||'USD'}).format(num(x));
const by=(key,id)=>db[key].find(x=>x.id===id), name=(key,id)=>by(key,id)?.name||by(key,id)?.title||by(key,id)?.sku||'—';
const ownerOfSale=s=>by('items',s.itemId)?.consignorId;
const split=s=>{let item=by('items',s.itemId),a=by('agreements',item?.agreementId),rate=num(a?.ownerRate)/100;let net=Math.max(0,num(s.amount)-num(s.channelFee)-num(s.processingFee));return {owner:Math.round(net*rate*100)/100,shop:Math.round(net*(1-rate)*100)/100,net}};
const balance=id=>db.sales.filter(s=>ownerOfSale(s)===id).reduce((v,s)=>v+split(s).owner,0)-db.adjustments.filter(a=>ownerOfSale(by('sales',a.saleId)||{})===id).reduce((v,a)=>v+num(a.amount),0)-db.payouts.filter(p=>p.consignorId===id).reduce((v,p)=>v+num(p.amount),0);
const save=()=>{if(DEMO)return;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Browser storage failed. Export a JSON backup before closing this page.')}};
const id=()=>crypto.randomUUID?.()||('id'+Date.now()+Math.random());
const today=()=>new Date().toISOString().slice(0,10);
const button=(title,fn)=>`<button type="button" data-action="${fn}">${esc(title)}</button>`;
const table=(heads,rows)=>`<table><thead><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${heads.length}" class="muted">No records yet.</td></tr>`}</tbody></table>`;
const act=(type,id)=>`<button type="button" data-edit="${type}:${id}">Edit</button><button type="button" data-delete="${type}:${id}">Delete</button>`;
const panel=(title,content)=>`<div class="panel"><h2>${title}</h2>${content}</div>`;
const view={
Dashboard(){let liability=db.consignors.reduce((x,c)=>x+balance(c.id),0), sold=db.sales.reduce((x,s)=>x+num(s.amount),0),paid=db.payouts.reduce((x,p)=>x+num(p.amount),0),aging=db.items.filter(i=>i.status==='available'&&i.returnBy&&i.returnBy<today());let cards=[['Consigned items',db.items.length],['Gross sales',money(sold)],['Unpaid owner balance',money(liability)],['Payouts recorded',money(paid)],['Past return-by date',aging.length]];return `<div class="grid">${cards.map(([k,v])=>`<div class="card kpi"><small>${k}</small><strong>${v}</strong></div>`).join('')}</div>${panel('Owner balances',table(['Consignor','Unpaid balance'],db.consignors.map(c=>[esc(c.name),money(balance(c.id))])))}${panel('Aging inventory',table(['SKU','Item','Return-by'],aging.map(i=>[esc(i.sku),esc(i.name),esc(i.returnBy)])))}<p class="hint">Balances are organizational estimates based on entered amounts. Confirm agreements, fees, refunds and available cash before approving a payout.</p>`},
Consignors(){return panel('Consignor directory',table(['Name','Contact','Unpaid balance','Actions'],db.consignors.map(c=>[esc(c.name),esc(c.email)+'<br>'+esc(c.phone),money(balance(c.id)),act('consignors',c.id)])))},
Agreements(){return panel('Commission agreements',table(['Agreement','Consignor','Owner share','Terms','Actions'],db.agreements.map(a=>[esc(a.title),esc(name('consignors',a.consignorId)),esc(a.ownerRate)+'%',esc(a.discount),act('agreements',a.id)])))},
Inventory(){return panel('Item register',table(['SKU','Item / owner','Condition','Asking','Return-by','Status','Actions'],db.items.map(i=>[esc(i.sku),esc(i.name)+'<br>'+esc(name('consignors',i.consignorId)),esc(i.condition),money(i.asking),esc(i.returnBy),esc(i.status),act('items',i.id)])))},
Sales(){return panel('Sales and commission split',table(['Date','Item','Gross','Fees','Owner share','Shop share','Actions'],db.sales.map(s=>[esc(s.date),esc(name('items',s.itemId)),money(s.amount),money(num(s.channelFee)+num(s.processingFee)),money(split(s).owner),money(split(s).shop),act('sales',s.id)])))},
Adjustments(){return panel('Refund and settlement adjustments',table(['Date','Sale','Owner deduction','Reason','Actions'],db.adjustments.map(a=>[esc(a.date),esc(name('items',by('sales',a.saleId)?.itemId)),money(a.amount),esc(a.reason),act('adjustments',a.id)])))},
Payouts(){return panel('Recorded payouts',`<p class="warn">Only record a payout after independent owner review and actual payment. This app does not send funds.</p>`+table(['Date','Consignor','Amount','Reference','Actions'],db.payouts.map(p=>[esc(p.date),esc(name('consignors',p.consignorId)),money(p.amount),esc(p.reference),act('payouts',p.id)])))},
Returns(){return panel('Unsold item custody',table(['Date','Item','Receipt / custody reference','Actions'],db.returns.map(r=>[esc(r.date),esc(name('items',r.itemId)),esc(r.reference),act('returns',r.id)])))},
Reports(){return panel('Financial position',table(['Consignor','Sales share','Adjustments','Paid','Remaining'],db.consignors.map(c=>[esc(c.name),money(db.sales.filter(s=>ownerOfSale(s)===c.id).reduce((x,s)=>x+split(s).owner,0)),money(db.adjustments.filter(a=>ownerOfSale(by('sales',a.saleId)||{})===c.id).reduce((x,a)=>x+num(a.amount),0)),money(db.payouts.filter(p=>p.consignorId===c.id).reduce((x,p)=>x+num(p.amount),0)),money(balance(c.id))])))+`<div class="tool">${button('Export CSV report','csv')}</div><p class="hint">Currency changes display only. No exchange-rate conversion, tax, legal or cash reconciliation is performed.</p>`},
Settings(){return `${panel('Business settings',`<form id="settingsForm"><label>Business name</label><input name="business" value="${esc(db.settings.business)}" required><label>Currency display</label><select name="currency">${['USD','GBP','EUR','CAD','AUD','AED','SAR','PKR'].map(c=>`<option ${db.settings.currency===c?'selected':''}>${c}</option>`).join('')}</select><label>Theme</label><select name="theme"><option value="dark">Dark</option><option value="light" ${db.settings.theme==='light'?'selected':''}>Light</option></select><button class="primary">Save settings</button></form>`)}${panel('Backup and restore',`<div class="tool">${button('Download JSON backup','backup')}<input id="restoreFile" type="file" accept=".json,application/json" aria-label="Import JSON backup">${button('Load sample workspace','sample')} ${button('Clear all records','clear')}</div><p class="hint">Backups contain contact and financial information. Keep copies securely. Import replaces all current records after confirmation.</p>`)}<p class="hint">Each browser and device keeps a separate local workspace. ${DEMO?'This public preview is session-only and does not save records.':'Use a modern browser; private browsing or clearing site data may erase records.'}</p>`}
};
const singular={consignors:'consignor',agreements:'agreement',items:'item',sales:'sale',adjustments:'adjustment',payouts:'payout',returns:'return'};
const tabType={Consignors:'consignors',Agreements:'agreements',Inventory:'items',Sales:'sales',Adjustments:'adjustments',Payouts:'payouts',Returns:'returns'};
function render(){document.body.classList.toggle('light',db.settings.theme==='light');$('#businessName').textContent=db.settings.business;$('#nav').innerHTML=tabs.map(t=>`<button type="button" data-tab="${t}" class="${t===tab?'active':''}">${t}</button>`).join('');let type=tabType[tab];$('#app').innerHTML=`<div class="toolbar"><h1>${tab}</h1>${type?`<button class="primary" data-new="${type}">+ Add ${singular[type]}</button>`:''}</div>`+view[tab]();}
function options(type,current){let choices=type==='availableItems'?db.items.filter(i=>i.status==='available'||i.id===current).map(i=>[i.id,i.sku+' — '+i.name]):type==='returnableItems'?db.items.filter(i=>['available','reserved'].includes(i.status)||i.id===current).map(i=>[i.id,i.sku+' — '+i.name]):db[type].map(x=>[x.id,x.name||x.title||x.sku||name('items',x.itemId)]);return `<option value="">Select…</option>${choices.map(([v,n])=>`<option value="${esc(v)}" ${current===v?'selected':''}>${esc(n)}</option>`).join('')}`}
function edit(type,record){let current=record||{},fields=schemas[type];$('#dialogTitle').textContent=(record?'Edit ':'Add ')+singular[type];$('#editorForm').innerHTML=fields.map(([key,label,kind,required])=>`<label for="f_${key}">${label}</label>${['consignors','agreements','availableItems','returnableItems','sales','status'].includes(kind)?`<select id="f_${key}" name="${key}" ${required?'required':''}>${kind==='status'?['available','reserved','sold','returned'].map(v=>`<option ${current[key]===v?'selected':''}>${v}</option>`).join(''):options(kind,current[key])}</select>`:kind==='textarea'?`<textarea id="f_${key}" name="${key}" ${required?'required':''}>${esc(current[key])}</textarea>`:`<input id="f_${key}" name="${key}" type="${kind}" ${kind==='number'?'step="0.01" min="0"':''} value="${esc(current[key]??(kind==='date'?today():''))}" ${required?'required':''}>`}`).join('')+`<button class="primary" type="submit">Save</button><button class="secondary" type="button" id="cancelEditor">Cancel</button>`;$('#editorForm').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));let error=validate(type,data,current);if(error){alert(error);return}let row={...current,...data,id:current.id||id()};if(record)Object.assign(record,row);else db[type].push(row);if(type==='sales')by('items',row.itemId).status='sold';if(type==='returns')by('items',row.itemId).status='returned';save();$('#editor').close();render()};$('#cancelEditor').onclick=()=>$('#editor').close();$('#editor').showModal()}
function validate(type,d,old){if(type==='agreements'&&num(d.ownerRate)>100)return 'Consignor share must be 0–100%.';if(type==='agreements'&&old.id&&db.sales.some(s=>by('items',s.itemId)?.agreementId===old.id)&&(d.ownerRate!==old.ownerRate||d.consignorId!==old.consignorId))return 'A sold item uses this agreement. Keep its owner and share unchanged.';if(type==='items'&&by('agreements',d.agreementId)?.consignorId!==d.consignorId)return 'Select an agreement belonging to this consignor.';if(type==='items'&&old.id&&db.sales.some(s=>s.itemId===old.id)&&(d.agreementId!==old.agreementId||d.consignorId!==old.consignorId||d.status!=='sold'))return 'Sold item ownership, agreement and status cannot be changed.';if(type==='items'&&db.items.some(i=>i.sku.toLowerCase()===d.sku.toLowerCase()&&i.id!==old.id))return 'SKU must be unique.';if(type==='sales'){let item=by('items',d.itemId);if(!item||(!old.id&&item.status!=='available'))return 'Select an available item.';if(old.id&&d.itemId!==old.itemId)return 'A recorded sale cannot be assigned to another item.';if(db.sales.some(s=>s.itemId===d.itemId&&s.id!==old.id))return 'This item already has a sale.'}if(type==='adjustments'){let s=by('sales',d.saleId);if(!s)return 'Select a sale.';let used=db.adjustments.filter(a=>a.saleId===d.saleId&&a.id!==old.id).reduce((n,a)=>n+num(a.amount),0);if(num(d.amount)+used>split(s).owner+0.001)return 'Deductions cannot exceed the consignor share of the sale.'}if(type==='payouts'){let remaining=balance(d.consignorId)+(!old.id?0:old.consignorId===d.consignorId?num(old.amount):0);if(num(d.amount)<=0||num(d.amount)>remaining+0.001)return 'Amount must be positive and cannot exceed the unpaid owner balance.'}if(type==='returns'&&db.returns.some(r=>r.itemId===d.itemId&&r.id!==old.id))return 'This item has already been returned.';return ''}
function remove(type,record){let refs={consignors:[['agreements','consignorId'],['items','consignorId'],['payouts','consignorId']],agreements:[['items','agreementId']],items:[['sales','itemId'],['returns','itemId']],sales:[['adjustments','saleId']]};if((refs[type]||[]).some(([t,k])=>db[t].some(x=>x[k]===record.id))){alert('This record is used elsewhere. Remove the linked records first.');return}if(!confirm('Delete this '+singular[type]+'?'))return;db[type]=db[type].filter(x=>x.id!==record.id);if(type==='sales'){let i=by('items',record.itemId);if(i)i.status='available'}if(type==='returns'){let i=by('items',record.itemId);if(i)i.status='available'}save();render()}
function download(filename,content,mime){let u=URL.createObjectURL(new Blob([content],{type:mime})),a=document.createElement('a');a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function backup(){download('ConsignClear-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json')}
function csv(){let rows=[['Consignor','Owner share','Refund adjustments','Paid','Remaining'],...db.consignors.map(c=>[c.name,db.sales.filter(s=>ownerOfSale(s)===c.id).reduce((n,s)=>n+split(s).owner,0),db.adjustments.filter(a=>ownerOfSale(by('sales',a.saleId)||{})===c.id).reduce((n,a)=>n+num(a.amount),0),db.payouts.filter(p=>p.consignorId===c.id).reduce((n,p)=>n+num(p.amount),0),balance(c.id)])];download('ConsignClear-report-'+today()+'.csv','\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')}
function sample(){if(!confirm('Replace the current workspace with fictional Austin sample data? Download a backup first.'))return;db=empty();db.settings.business='Austin Sample Resale Boutique';let c={id:id(),name:'Morgan Rivera',email:'morgan@example.com',phone:'512-555-0142'},a={id:id(),consignorId:c.id,title:'Standard 60/40',ownerRate:'60',discount:'Confirm markdowns with the owner'},i={id:id(),sku:'ATX-001',name:'Vintage oak side table',consignorId:c.id,agreementId:a.id,intake:today(),asking:'250',condition:'Good',returnBy:'2026-12-31',status:'sold'},j={id:id(),sku:'ATX-002',name:'Ceramic floor lamp',consignorId:c.id,agreementId:a.id,intake:today(),asking:'125',condition:'Excellent',returnBy:'2026-12-31',status:'available'};db.consignors.push(c);db.agreements.push(a);db.items.push(i,j);db.sales.push({id:id(),itemId:i.id,date:today(),amount:'230',channelFee:'10',processingFee:'5'});save();render()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.dataset.new)edit(b.dataset.new);else if(b.dataset.edit){let [t,i]=b.dataset.edit.split(':');edit(t,by(t,i))}else if(b.dataset.delete){let [t,i]=b.dataset.delete.split(':');remove(t,by(t,i))}else if(b.dataset.action==='backup')backup();else if(b.dataset.action==='csv')csv();else if(b.dataset.action==='sample')sample();else if(b.dataset.action==='clear'&&confirm('Clear every record in this workspace? Download a backup first.')){db=empty();save();render()}});
document.addEventListener('submit',e=>{if(e.target.id!=='settingsForm')return;e.preventDefault();db.settings={...db.settings,...Object.fromEntries(new FormData(e.target))};save();render()});
document.addEventListener('change',async e=>{if(e.target.id!=='restoreFile')return;try{let d=JSON.parse(await e.target.files[0].text());if(d.version!==1||!['consignors','agreements','items','sales','adjustments','payouts','returns'].every(k=>Array.isArray(d[k]))||!d.settings||typeof d.settings!=='object')throw Error('Invalid ConsignClear backup');if(confirm('Replace all current records with this backup?')){db=d;save();render()}}catch(err){alert('Import failed: '+err.message)}});
render();
})();
</script></body></html>
