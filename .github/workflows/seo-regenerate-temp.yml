name: One-off SEO regeneration (temporary)
on:
  push:
    branches:
      - seo/fix-modified-dates-25-20261024
    paths:
      - .github/workflows/seo-regenerate-temp.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild committed SEO output
        run: python3 scripts/seo-build.py
      - name: Commit regenerated site output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate static SEO output for October 24 content updates"
            git push
          fi
