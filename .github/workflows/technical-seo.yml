name: Maintain technical SEO
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: technical-seo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify committed SEO output
        run: python3 scripts/seo-build.py --check
      - name: Test publishing and protected storefront
        run: python3 scripts/test-seo.py
