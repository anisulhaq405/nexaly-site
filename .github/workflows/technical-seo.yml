name: Maintain technical SEO
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: technical-seo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Reject empty image assets
        run: python3 scripts/check-empty-images.py
      - name: Verify committed SEO output
        run: python3 scripts/seo-build.py --check
      - name: Test publishing and protected storefront
        run: python3 scripts/test-seo.py
      - name: Verify free tool calculations and backups
        run: |
          node scripts/test-craft-fair.cjs
          node scripts/test-small-tools.cjs
          node scripts/test-next-tools.cjs
          node scripts/test-keyword-workflows.cjs
          node scripts/test-oct16-planners.cjs
          node scripts/test-final-ten.cjs
          node scripts/test-business-forms.cjs
      - name: Verify new worksheet controls in a DOM environment
        run: |
          npm install --prefix "$RUNNER_TEMP/nexaly-ui-tests" jsdom@26.1.0 --no-audit --no-fund --ignore-scripts
          NEXALY_JSDOM_PATH="$RUNNER_TEMP/nexaly-ui-tests/node_modules/jsdom" node scripts/test-keyword-workflows-ui.cjs
          NEXALY_JSDOM_PATH="$RUNNER_TEMP/nexaly-ui-tests/node_modules/jsdom" node scripts/test-oct16-planners-ui.cjs
          NEXALY_JSDOM_PATH="$RUNNER_TEMP/nexaly-ui-tests/node_modules/jsdom" node scripts/test-final-ten-ui.cjs
          NEXALY_JSDOM_PATH="$RUNNER_TEMP/nexaly-ui-tests/node_modules/jsdom" node scripts/test-business-forms-ui.cjs
          NEXALY_JSDOM_PATH="$RUNNER_TEMP/nexaly-ui-tests/node_modules/jsdom" node scripts/test-business-summary-copy.cjs
          NEXALY_JSDOM_PATH="$RUNNER_TEMP/nexaly-ui-tests/node_modules/jsdom" node scripts/test-day1-tools.cjs
          NEXALY_JSDOM_PATH="$RUNNER_TEMP/nexaly-ui-tests/node_modules/jsdom" node scripts/test-day2-tools.cjs
          NEXALY_JSDOM_PATH="$RUNNER_TEMP/nexaly-ui-tests/node_modules/jsdom" node scripts/test-day3-tools.cjs
          NEXALY_JSDOM_PATH="$RUNNER_TEMP/nexaly-ui-tests/node_modules/jsdom" node scripts/test-day4-tools.cjs
      - name: Verify Day1 editorial arithmetic
        run: |
          python3 -m pip install pypdf==6.1.3
          python3 scripts/test-day1-examples.py
          python3 scripts/test-day2-examples.py
          python3 scripts/test-day3-examples.py
          python3 scripts/test-day4-examples.py
      - name: Verify contact drafts and optional analytics
        run: |
          node scripts/test-contact-flow.cjs
          node scripts/test-analytics-consent.cjs
      - name: Verify paid-product feedback routes and review privacy
        run: python3 scripts/test-review-products.py
      - name: Verify owner core freeze
        run: python3 scripts/check-core-lock.py
      - name: Install social media image dependency
        run: python3 -m pip install Pillow==11.3.0
      - name: Verify social delivery reservations and duplicate protection
        run: python3 scripts/test-social.py
