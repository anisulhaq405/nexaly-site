name: Maintain technical SEO
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: technical-seo-main
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Rebuild and validate SEO
        run: |
          python3 scripts/test-seo.py
          python3 scripts/seo-build.py
          python3 scripts/seo-build.py --check
      - name: Commit generated metadata and listings
        run: |
          git add -- '*.html' assets/js/main.js assets/seo-pages.json sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo 'SEO is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Automatically refresh technical SEO and crawlable listings'
          git push origin HEAD:main
