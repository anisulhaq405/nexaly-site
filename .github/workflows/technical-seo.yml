name: Maintain technical SEO
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: technical-seo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify committed SEO output
        run: python3 scripts/seo-build.py --check
      - name: Test publishing and protected storefront
        run: python3 scripts/test-seo.py
      - name: Verify free tool calculations and backups
        run: |
          node scripts/test-craft-fair.cjs
          node scripts/test-small-tools.cjs
          node scripts/test-next-tools.cjs
      - name: Verify owner core freeze
        run: python3 scripts/check-core-lock.py
      - name: Install social media image dependency
        run: python3 -m pip install Pillow==11.3.0
      - name: Verify social delivery reservations and duplicate protection
        run: python3 scripts/test-social.py
